   size, so making the credit smaller makes the mark smaller and there is
   no second number to keep in step. The pair is centred as a unit, which
   is why the word is measured before anything is drawn.

   NEVER IN THE HUD. This is an end of run screen only. A logo sitting on
   the road while somebody is driving is the exact opposite of section
   7's argument that the road edge owns the top of the value range.
   ------------------------------------------------------------------ */
/* ==================================================================
   THE SNAPHIT LOCKUPS, WHICH ARE DOM AND NOT CANVAS.

   The markup is inlined in the body, above the canvas, and the whole of
   the script's involvement is deciding where the credit sits and when
   each one is visible. Nothing here draws anything.

   THE ASPECT RATIO IS READ OFF THE MARKUP, not written down twice. Both
   viewBoxes are in the body and the browser has already parsed them, so
   asking the element is both shorter and impossible to get out of step
   with the artwork. It falls back to the measured crop ratio only if the
   element is missing entirely, which would mean the markup is gone.
   ================================================================== */
const bootEl = document.getElementById('boot');
// The lockup inside it, which fades in on its own while the field
// behind it stays opaque. See syncBoot.
const bootMark = bootEl ? bootEl.querySelector('svg') : null;
const creditEl = document.getElementById('credit');

function lockupAspect(el, fallback) {
  const svg = el && el.querySelector('svg');
  const vb = svg && svg.viewBox && svg.viewBox.baseVal;
  return (vb && vb.height > 0) ? vb.width / vb.height : fallback;
}
const LOCKUP_ASPECT = lockupAspect(creditEl, 1686.8 / 327.0);

/* Written only when something actually moved. The death screen and the
   completion screen put the credit at different heights and both are
   pure functions of the viewport, so in practice this writes on a resize
   and on a change of screen and never once per frame. */
let creditKey = '';
let creditWant = false;      // did this frame ask for it
/* Starts false because the markup starts `hidden`, and those two have to
   agree or the reconcile below sees no change and never writes. They
   disagreed on the first attempt and the credit sat on the title screen
   and over the whole of a run, which is precisely what section 4 of this
   session's brief forbids. */
let creditShown = false;     // and is it actually in the document

function placeCredit(cx, cy, width, height) {
  creditWant = true;
  const key = Math.round(cx) + ':' + Math.round(cy) + ':' + Math.round(width);
  if (key === creditKey) return;
  creditKey = key;
  creditEl.style.width = width + 'px';
  creditEl.style.opacity = FEEL.CREDIT_ALPHA;
  // transform rather than left and top, so this never triggers a layout.
  creditEl.style.transform = 'translate(' + (cx - width / 2) + 'px,'
                                          + (cy - height / 2) + 'px)';
}

/* ONE RECONCILE AT THE END OF THE FRAME, and it writes only on a change.

   A DOM overlay does not disappear because nothing drew it, so its
   absence has to be as deliberate as its presence. It is only ever on
   the death and completion screens, which is what creditWant carries.
   Everything else, including the title screen and the whole of a run,
   gets nothing: section 4 of this session's brief, and section 6 of the
   game's, which is strict about anything that makes this look like a
   portal rather than a single purpose site.

   The pause term is belt and braces rather than a live case. setPaused
   refuses to pause outside DRIVING, and DRIVING never asks for the
   credit, so the two cannot currently overlap. If that guard ever moves,
   this stops an opaque cover from having a lockup floating over it. */
function syncCredit() {
  const want = creditWant && !paused;
  creditWant = false;
  if (want === creditShown) return;
  creditShown = want;
  creditEl.hidden = !want;
}

/* The lockup is an HTML overlay and the plate under it is canvas, and
   that split is deliberate. The overlay stays sharp at any device pixel
   ratio for free and costs nothing per frame; the plate has to be in the
   canvas so it sits UNDER the lockup and OVER the road, and so it can be
   measured in the same pixels as the road it is dimming.

   THE PLATE IS THE CONTRAST ANSWER. The biome hue rotates at every gate,
   which puts the whole world through twelve palettes, and one of them is
   orange, which is the lockup's own colour. Measured across all twelve,
   the plate lifts the worst case contrast from unreadable to comfortable
   and the numbers are in the session report. It is a soft radial rather
   than a panel because a hard edged box on a death screen reads as a
   dialog asking a question. */
let creditPlate = null;
let creditPlateKey = '';

function drawCredit(w, s, cy) {
  const width = s * FEEL.CREDIT_WIDTH;
  const height = width / LOCKUP_ASPECT;
  const rx = width * FEEL.CREDIT_PLATE_WIDE;
  const ry = height * FEEL.CREDIT_PLATE_TALL;

  /* Built on demand and cached, like every other gradient in this file,
     because a radial rebuilt sixty times a second is pure waste on the
     hardware section 6 describes. The key is every number that shapes
     it, so nothing can go stale. */
  const key = Math.round(w) + ':' + Math.round(cy) + ':' + Math.round(rx) + ':' + Math.round(ry);
  if (key !== creditPlateKey) {
    const g2 = ctx.createRadialGradient(w / 2, cy, 0, w / 2, cy, 1);
    g2.addColorStop(0, 'rgba(6,3,2,' + FEEL.CREDIT_PLATE_ALPHA + ')');
    // Flat out to here, so the mark never sits half on a bright rim.
    g2.addColorStop(clamp(FEEL.CREDIT_PLATE_FLAT, 0, 0.99),
                    'rgba(6,3,2,' + FEEL.CREDIT_PLATE_ALPHA + ')');
    g2.addColorStop(1, 'rgba(6,3,2,0)');
    creditPlate = g2;
    creditPlateKey = key;
  }
  // The gradient is built in a unit circle and stretched by the
  // transform, which is how a canvas radial becomes an ellipse.
  ctx.save();
  ctx.translate(w / 2, cy);
  ctx.scale(rx, ry);
  ctx.translate(-w / 2, -cy);
  ctx.fillStyle = creditPlate;
  ctx.fillRect(w / 2 - 1, cy - 1, 2, 2);
  ctx.restore();

  // And the lockup itself, which is DOM. Nothing is written unless the
  // geometry actually moved.
  placeCredit(w / 2, cy, width, height);
}

/* The size that makes a string fill a share of the width and no more,
   so the game's own name cannot clip off the side of a narrow handset. */
function fittedSize(str, weight, want, maxWidth) {
  ctx.font = weight + ' ' + want + 'px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif';
  const width = ctx.measureText(str).width;
  return width <= maxWidth ? want : Math.floor(want * maxWidth / width);
}

/* The score and the multiplier, and no words anywhere near them. The
   number climbing while the trail runs hot is the whole explanation: one
   corner taken deep and near the edge should make the rule obvious, and
   if it does not then this display is what is wrong. */
/* ------------------------------------------------------------------
   THE READOUT. Three quantities, three treatments, one representation
   each, because five numbers in one typeface is five numbers nobody can
   tell apart at a glance.

   SCORE is an arcade score: heavy, gold, outlined, the biggest thing up
   there. It is the prize.
   TIME is a pit timer: tabular monospace on a dark plate, in minutes and
   seconds, so it cannot possibly be mistaken for points.
   MULTIPLIER is neither: it sits off to one side in the colour the tyre
   marks run through, so the line on the road and the number are one
   signal.

   What was there before, and why it was unreadable: the banked score and
   the pending score were the SAME quantity in two forms side by side, the
   clock and the seconds to the next gate were two more numbers in the
   same typeface, and the live payback rate was a fifth. All five were
   white or cyan sans digits at similar sizes. The pending score is gone,
   the payback rate is now an arrow rather than a number, and the gate is
   inside the time plate where it belongs.
   ------------------------------------------------------------------ */
const MONO = 'ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace';

/* Minutes and seconds, always the same width, so the digits do not
   jitter as they count. That stillness is most of what makes a readout
   look like a stopwatch rather than a score. */
function timeLabel(sec) {
  const t = Math.max(0, sec);
  const m = Math.floor(t / 60);
  const r = t - m * 60;
  return m + ':' + (r < 10 ? '0' : '') + r.toFixed(1);
}

/* The arcade treatment: an outline behind a heavy fill. Two draws, no
   shadow blur, exactly the discipline everything else lit in this game
   uses. */
function arcadeNumber(str, x, y, size, fill) {
  ctx.font = '900 ' + size + 'px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.lineJoin = 'round';
  ctx.lineWidth = Math.max(3, size * 0.14);
  ctx.strokeStyle = COLOUR.SCORE_EDGE;
  ctx.strokeText(str, x, y);
  ctx.fillStyle = fill;
  ctx.fillText(str, x, y);
}

function drawScore(w, h) {
  if (state !== DRIVING) return;
  const s = Math.min(w, h);
  const flash = gateFlash > 0 ? gateFlash / FEEL.CHECKPOINT_FLASH : 0;
  /* The multiplier, carried by the score rather than by a number of its
     own. Hotter and very slightly larger as it climbs, with a short kick
     on each whole one crossed, which is the moment worth noticing. */
  const heat = clamp((multiplier - 1) / (FEEL.MULT_MAX - 1), 0, 1);
  const pop = multPop > 0 ? multPop / FEEL.MULT_POP_TIME : 0;
  const size = Math.round(s * FEEL.SCORE_SIZE
    * (1 + 0.3 * flash + FEEL.SCORE_HEAT_GROWTH * heat + FEEL.SCORE_HEAT_POP * pop));
  scoreTop = safeTop + h * FEEL.SCORE_TOP;
  scoreSize = size;
  const label = String(banked + Math.floor(score));
  /* Once the stored best has been passed the score keeps a halo for the
     rest of the run. It is the same wide then normal glow everything lit
     in this game uses, and it is the one piece of this session that is
     allowed to persist, because the whole point of it is that the player
     is in new territory until the run ends. */
  if (beatBest) {
    ctx.font = '900 ' + size + 'px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.lineJoin = 'round';
    ctx.lineWidth = Math.max(4, size * FEEL.BEST_GLOW_SPREAD);
    ctx.globalAlpha = FEEL.BEST_GLOW_ALPHA;
    ctx.strokeStyle = 'rgb(' + COLOUR.SCORE_GLOW + ')';
    ctx.strokeText(label, w / 2, scoreTop);
    ctx.globalAlpha = 1;
  }
  arcadeNumber(label, w / 2, scoreTop,
               size, flash > 0 ? COLOUR.GATE : scoreHeatColour(heat));
  drawClock(w, h);
}

/* The resting gold running to the best score cream, and once the stored
   best has been passed, that cream running on to white. Both tables are
   built up with the rest of the ramps, beside the palette they come out
   of. */
function scoreHeatColour(t) {
  return rampAt(beatBest ? SCORE_RECORD_RAMP : SCORE_RAMP, t);
}

/* The pit timer. A plate, tabular digits, and the distance to the next
   gate as a second, quieter figure on the same plate, because that is
   also time and it belongs in the time element rather than being a fifth
   number somewhere else. */
function drawClock(w, h) {
  /* Drawn from the first frame, not from the end of the on ramp. It used
     to return early for the whole thirty seconds, so a run that ended
     inside the on ramp had no clock in it at all and a player never saw
     one until they had already survived twice. Not running is a state the
     readout can show; being absent is not. */
  const running = skipOnRamp || runTime >= FEEL.ONRAMP_SECONDS;
  const s = Math.min(w, h);
  const size = Math.round(s * FEEL.CLOCK_SIZE);
  const gateSecs = Math.max(0, nextGate - carSegIndex) * FEEL.SEGMENT_LENGTH / FEEL.SPEED;
  const low = running && clock < FEEL.CLOCK_LOW;
  const reachable = clock >= gateSecs;
  // Paused during the on ramp: present, legible, and visibly not counting.
  const dim = running ? 1 : 0.45;

  const main = timeLabel(clock);
  const gl = timeLabel(gateSecs);
  ctx.font = '700 ' + size + 'px ' + MONO;
  const mw = ctx.measureText(main).width;
  const gsize = Math.round(size * 0.62);
  ctx.font = '600 ' + gsize + 'px ' + MONO;
  const gw = ctx.measureText(gl).width;

  const padx = size * 0.42, pady = size * 0.30, gap = size * 0.5;
  const boxW = mw + gap + gw + padx * 2;
  const boxH = size + pady * 2;
  /* Hung off the score rather than off its own screen fraction, so it sits
     directly under it in both orientations and follows the score when the
     score swells with the multiplier or flashes at a gate. scoreTop is a
     middle baseline, so half the score size clears the digits. */
  const y = scoreTop + scoreSize * 0.5 + s * FEEL.CLOCK_GAP + boxH * 0.5;
  // The bottom of the whole HUD stack, so anything placed under it can
  // measure rather than assume. The callouts are the only reader.
  hudBottom = y + boxH * 0.5;
  const bx0 = w / 2 - boxW / 2, by0 = y - boxH / 2;

  ctx.globalAlpha = 0.72 * dim;
  ctx.fillStyle = COLOUR.BAR_TRACK;
  roundRect(bx0, by0, boxW, boxH, boxH * 0.28);
  ctx.fill();
  ctx.globalAlpha = 1;

  ctx.textBaseline = 'middle';
  ctx.textAlign = 'left';
  ctx.font = '700 ' + size + 'px ' + MONO;
  ctx.globalAlpha = (low ? 0.62 + 0.38 * Math.abs(Math.sin(runTime * 6)) : 1) * dim;
  ctx.fillStyle = low ? COLOUR.BAR_LOW : COLOUR.GATE;
  ctx.fillText(main, bx0 + padx, y + 1);
  ctx.globalAlpha = 1;

  // The gate, quieter, and cool once it is inside what is in hand.
  ctx.font = '600 ' + gsize + 'px ' + MONO;
  ctx.globalAlpha = (reachable ? 0.9 : 0.55) * dim;
  ctx.fillStyle = reachable ? COLOUR.GATE : COLOUR.TEXT;
  ctx.fillText(gl, bx0 + padx + mw + gap, y + 1);
  ctx.globalAlpha = 1;
  // A divider, so the two figures read as one instrument with two hands.
  ctx.globalAlpha = 0.3 * dim;
  ctx.fillStyle = COLOUR.TEXT;
  ctx.fillRect(bx0 + padx + mw + gap * 0.45, by0 + pady * 0.7, 1, boxH - pady * 1.4);
  ctx.globalAlpha = 1;

  /* Earning, as an arrow rather than a number. Flow has to be visible,
     but it does not have to be another figure to read. */
  if (running && slipPay() > 0.02) {
    const a = size * 0.3;
    const ax = bx0 - a * 1.5, ay = y;
    ctx.globalAlpha = 0.55 + 0.45 * Math.min(1, slipPay() * 1.6);
    ctx.fillStyle = COLOUR.GATE;
    ctx.beginPath();
    ctx.moveTo(ax, ay - a); ctx.lineTo(ax + a * 0.85, ay + a * 0.6);
    ctx.lineTo(ax - a * 0.85, ay + a * 0.6);
    ctx.closePath();
    ctx.fill();
    ctx.globalAlpha = 1;
  }

  if (clockPop > 0) {
    const t = clockPop / FEEL.CLOCK_POP_TIME;
    const psize = Math.round(size * (1.5 + 0.7 * (1 - t)));
    ctx.font = '700 ' + psize + 'px ' + MONO;
    ctx.textAlign = 'center';
    ctx.globalAlpha = Math.min(1, t * 2.2);
    const pl = '+' + FEEL.CLOCK_CHECKPOINT;
    ctx.fillStyle = COLOUR.TEXT_SHADOW;
    ctx.fillText(pl, w / 2, y - boxH * 0.9 - (1 - t) * s * 0.09 + 2);
    ctx.fillStyle = COLOUR.GATE;
    ctx.fillText(pl, w / 2, y - boxH * 0.9 - (1 - t) * s * 0.09);
    ctx.globalAlpha = 1;
  }
}

function roundRect(x, y, w2, h2, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w2 - r, y); ctx.quadraticCurveTo(x + w2, y, x + w2, y + r);
  ctx.lineTo(x + w2, y + h2 - r); ctx.quadraticCurveTo(x + w2, y + h2, x + w2 - r, y + h2);
  ctx.lineTo(x + r, y + h2); ctx.quadraticCurveTo(x, y + h2, x, y + h2 - r);
  ctx.lineTo(x, y + r); ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

/* The result. Not a notification: nobody needs telling they left the
   road, they watched it happen. This is the end of an arcade race, and
   the score is the hero of it.

   The count up is PURELY cosmetic and gates nothing. A tap or a key
   restarts the moment DEATH_INPUT_LOCK is up, mid animation or not,
   because section 5's one more go loop is worth more than any flourish.
   The impatient path is the fast one by construction: nothing here is
   ever waited on. */
/* The death screen.

   EVERYTHING LIVES IN THE TOP HALF OR HANGS OFF THE BOTTOM EDGE, and the
   middle band is left empty, because that is where the car is. The stats
   row used to be laid out at a fraction of the height that happened to be
   clear of the car in portrait and sat straight on top of it in
   landscape. Nothing here may drift back into that band.

   TWO RECORDS, because continues exist. BEST SCORE is what a clean run is
   worth and a continued run can never touch it; FURTHEST is how far the
   track has been seen and any run may set it. The continue count is shown
   whenever it is not zero, so it is never ambiguous which kind of run
   just ended. */
const restartRect = { x: 0, y: 0, w: 0, h: 0, live: false };

function drawResult(w, h) {
  const s = Math.min(w, h);
  const final = banked;
  const clean = continues === 0;
  const daily = mode === DAILY;
  /* On the daily the headline is TODAY's record, because that is the one
     the run was actually competing for. BEST SCORE and FURTHEST are still
     kept and still shown, they are just not what this run was about. */
  const beatToday = daily && clean && final > 0 && final >= dailyBest;
  const beat = !daily && clean && final > 0 && final >= bestScore;
  const far = !daily && runDistance > 0 && runDistance >= furthest;
  // Counts up over ROLL seconds and then sits still. Reading it early
  // costs nothing, because the run is over and the number is already
  // decided.
  const roll = clamp(deadFor / FEEL.RESULT_ROLL_TIME, 0, 1);
  const eased = 1 - Math.pow(1 - roll, 3);
  const shown = Math.round(final * eased);

  /* THE STACK IS MEASURED IN s, THE SMALLER SCREEN DIMENSION, and only
     its starting height comes from h. Every size on this screen is a
     fraction of s, so laying the positions out in fractions of h made a
     block that fitted in portrait and collided with the car in landscape,
     where h and s are the same number. The top is pushed down the taller
     screen and clamped so the block can never reach the middle band,
     which is where the car is and which stays empty. */
  const y0 = Math.min(Math.max(s * 0.085, h * 0.125), Math.max(0, h * 0.5 - s * 0.34));
  if (beatToday) {
    ctx.globalAlpha = 0.72 + 0.28 * Math.abs(Math.sin(deadFor * 5));
    text("TODAY'S BEST", w / 2, y0, Math.round(s * 0.05), '900', 'center', COLOUR.GATE);
    ctx.globalAlpha = 1;
  } else if (beat) {
    // Unmistakable, because this is the moment somebody plays again for.
    ctx.globalAlpha = 0.72 + 0.28 * Math.abs(Math.sin(deadFor * 5));
    text('NEW BEST', w / 2, y0, Math.round(s * 0.055), '900');
    ctx.globalAlpha = 1;
  } else if (far) {
    ctx.globalAlpha = 0.72 + 0.28 * Math.abs(Math.sin(deadFor * 5));
    text('FURTHEST YET', w / 2, y0, Math.round(s * 0.05), '900', 'center', COLOUR.GATE);
    ctx.globalAlpha = 1;
  } else {
    text(!clean ? 'CONTINUED RUN'
         : daily ? "TODAY  " + dailyBest
         : 'BEST  ' + bestScore,
         w / 2, y0, Math.round(s * 0.042), '700');
  }

  arcadeNumber(String(shown), w / 2, y0 + s * 0.095, Math.round(s * 0.145),
               (beat || beatToday) ? COLOUR.SCORE_BEST : COLOUR.SCORE);

  /* The publisher, small and quiet, in the air between the score and the
     run figures. Low alpha and a third of the size of anything around it,
     because the score, the records and the continue button are what this
     screen is for and none of them may be crowded by it. */
  /* MEASURED, NOT PICKED. The clear band between the score block and
     the stats row was scanned off the rendered frame at three screen
     sizes and came out 0.105 of the smaller dimension tall, centred
     here, at every one of them. The credit was at 0.169, which sat it
     nearer the score than the stats row for no reason. */
  drawCredit(w, s, y0 + s * 0.1625);

  /* The run in figures on one line. Cheap, and it turns a number into a
     story: how far, how sideways, how many gates, and on a continued run
     how many continues, which goes here rather than on a line of its own
     so that saying it costs no height at all. */
  const rowY = y0 + s * 0.205;
  const cols = [
    ['DIST', runDistance + 'm'],
    ['BEST \u00d7', runBestMult.toFixed(1)],
    ['GATES', String(gatesPassed)]
  ];
  if (continues > 0) cols.push(['CONT', String(continues)]);
  const span = Math.min(w * 0.9, s * 1.15);
  const step = span / cols.length;
  for (let i = 0; i < cols.length; i++) {
    const cx = w / 2 + (i - (cols.length - 1) / 2) * step;
    ctx.globalAlpha = 0.6;
    text(cols[i][0], cx, rowY, Math.round(s * 0.028), '700');
    ctx.globalAlpha = 1;
    ctx.font = '700 ' + Math.round(s * 0.046) + 'px ' + MONO;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = COLOUR.TEXT_SHADOW;
    ctx.fillText(cols[i][1], cx, rowY + s * 0.046 + 2);
    ctx.fillStyle = continues > 0 && i === cols.length - 1 ? COLOUR.SCORE : COLOUR.GATE;
    ctx.fillText(cols[i][1], cx, rowY + s * 0.046);
  }

  /* WHICH TRACK THAT WAS, first, because it is what the rest of the line
     is about and it is what a shared score has to name. A random road
     says so, which is the same information: there is nothing to compare
     it against. */
  const which = daily ? 'TRACK #' + trackNumber(todayStamp) : 'RANDOM TRACK';
  /* The two records on one line, always both, so the split between them
     is obvious without a word of explanation. */
  const rec = which + '     ' + (daily ? 'TODAY  ' + dailyBest + '     ' : '')
            + 'BEST  ' + bestScore + '     FURTHEST  ' + furthest + 'm';
  ctx.globalAlpha = 0.72;
  text(rec, w / 2, y0 + s * 0.30,
       fittedSize(rec, '700', Math.round(s * 0.032), w * 0.9), '700');
  ctx.globalAlpha = 1;

  /* The prompt and the buttons, anchored to the bottom edge rather than
     to a fraction of the height, so they clear the car in both
     orientations by construction and sit above the corner pads. */
  restartRect.live = false;
  dailyRect.live = false;
  shareRect.live = false;
  if (deadFor < FEEL.DEATH_INPUT_LOCK) return;
  // See the title screen: the calibration owns this band while it is up.
  if (tiltCalOnScreen()) return;
  const resume = canContinue();
  const btnY = h - safeBottom - FEEL.DEATH_BOTTOM;
  const size = Math.round(s * 0.038);
  const rowH = size * 2.2 * 1.35;
  drawShareButton(w, h, s, btnY, size);

  /* THE DAILY, OFFERED AT THE MOMENT THE PLAYER IS DECIDING WHETHER TO
     GO AGAIN. That is the honest place to say there is something else,
     and it is only offered after a RANDOM TRACK run: on a daily death
     the player is already there and a button saying so would be noise.

     IT DOES NOT TOUCH THE REFLEX TAP. The tap anywhere still continues
     or restarts the run that just ended, exactly as section 5 requires;
     this is a separate deliberate target, stacked ABOVE the restart
     button so the position restart has always occupied does not move. */
  /* RESTART DOES NOT MOVE, AND SHARE ARRIVING BESIDE IT DID NOT MOVE IT.
     It has been at btnY and centred since it was added and that position
     is muscle memory, so the daily offer stacks ABOVE it and share sits
     OFF TO THE SIDE of it. The centre of the bottom row is left free
     whenever restart is not drawn, because the centre of the bottom row
     is where a reflex tap lands hardest and nothing that changes mode or
     opens a share sheet belongs there.

     Restart is a separate, deliberate action because the reflex tap now
     continues. It is only here when continuing is possible: with no gate
     behind you the reflex tap already restarts and a second way to do
     the same thing would be clutter. */
  if (resume) canvasButton(restartRect, 'RESTART', w / 2, btnY, size, COLOUR.SCORE, w);

  let stack = btnY - rowH;
  if (mode === ENDLESS) {
    canvasButton(dailyRect, "TODAY'S TRACK", w / 2, stack, size, COLOUR.GATE, w);
    ctx.globalAlpha = 0.55;
    const sub = 'track #' + trackNumber(todayStamp) + ', '
              + dailyGateCountFor(todayStamp) + ' gates, one road for everyone'
              + (ghost.live ? ', your ghost is waiting' : '')
              + (hasKeyboard ? '     press T' : '');
    text(sub, w / 2, stack - size * 1.5,
         fittedSize(sub, '700', Math.round(s * 0.026), w * 0.92), '700');
    ctx.globalAlpha = 1;
    stack -= rowH;
  }

  const promptText = resume ? 'tap to continue from the last gate'
                            : 'tap or press any key';
  ctx.globalAlpha = 0.55 + 0.45 * Math.abs(Math.sin(deadFor * 3));
  text(promptText, w / 2, stack - s * FEEL.DEATH_PROMPT_GAP,
       fittedSize(promptText, '600', Math.round(s * 0.040), w * 0.88), '600');
  ctx.globalAlpha = 1;
}

/* ==================================================================
   THE COMPLETION SCREEN.

   Not the death screen with a different word on it. A crash screen leads
   with what you scored before it ended; this leads with the fact that
   you got to the end, because that is the achievement and everything
   else is detail about how.

   CLEAN IS THE HEADLINE. It is the binary most worth knowing, it is the
   only thing that separates a run that counts from a run that was
   ground out on continues, and it is therefore the largest thing on the
   screen. The score is next, because this game is about drifting. The
   time is third and is what the ghost is raced against.
   ================================================================== */
function timeLabel(t) {
  const m = Math.floor(t / 60), sec = t - m * 60;
  return m + ':' + (sec < 10 ? '0' : '') + sec.toFixed(1);
}

function drawFinish(w, h) {
  const s = Math.min(w, h);
  const roll = clamp(deadFor / FEEL.RESULT_ROLL_TIME, 0, 1);
  const eased = 1 - Math.pow(1 - roll, 3);
  const shown = Math.round(banked * eased);

  // The same measured-in-s stack the death screen uses, for the same
  // reason: laid out in fractions of h it collides with the car in
  // landscape, where h and s are the same number.
  /* The gaps are set from the TYPE SIZES rather than picked, because the
     first pass was picked and the headline, the number and the credit
     all ran into each other: a 0.085 headline centred 0.09 above a 0.125
     number overlaps by construction whatever it looks like at one
     screen size. Every step below is at least half the sum of the two
     heights it separates. */
  const y0 = Math.min(Math.max(s * 0.06, h * 0.10), Math.max(0, h * 0.5 - s * 0.44));

  ctx.globalAlpha = 0.8;
  text('TRACK COMPLETE', w / 2, y0, Math.round(s * 0.034), '700', 'center', COLOUR.GATE);
  ctx.globalAlpha = 1;

  /* The binary, and it is the loudest thing here. A clean run pulses in
     the score's own gold; a continued one says so plainly and does not,
     because it is not the same achievement and the screen must not
     pretend otherwise. */
  if (finishClean) {
    ctx.globalAlpha = 0.74 + 0.26 * Math.abs(Math.sin(deadFor * 4.5));
    const label = 'CLEAN RUN';
    text(label, w / 2, y0 + s * 0.066,
         fittedSize(label, '900', Math.round(s * 0.072), w * 0.9), '900',
         'center', COLOUR.SCORE_BEST);
    ctx.globalAlpha = 1;
  } else {
    const label = continues === 1 ? 'ONE CONTINUE' : continues + ' CONTINUES';
    ctx.globalAlpha = 0.85;
    text(label, w / 2, y0 + s * 0.066,
         fittedSize(label, '800', Math.round(s * 0.056), w * 0.9), '800',
         'center', COLOUR.SCORE);
    ctx.globalAlpha = 1;
  }

  arcadeNumber(String(shown), w / 2, y0 + s * 0.168, Math.round(s * 0.108),
               finishRecord ? COLOUR.SCORE_BEST : COLOUR.SCORE);

  // The same scan on the completion screen. See drawResult.
  drawCredit(w, s, y0 + s * 0.2349);

  /* The run in figures. TIME is what the ghost is raced against, so the
     margin against it sits directly under the time rather than in a
     line of its own. */
  const rowY = y0 + s * 0.272;
  const cols = [['TIME', timeLabel(finishTime)],
                ['SCORE', String(banked)],
                ['GATES', String(dailyGates)]];
  const span = Math.min(w * 0.9, s * 1.15);
  const step = span / cols.length;
  for (let i = 0; i < cols.length; i++) {
    const cx = w / 2 + (i - (cols.length - 1) / 2) * step;
    ctx.globalAlpha = 0.6;
    text(cols[i][0], cx, rowY, Math.round(s * 0.028), '700');
    ctx.globalAlpha = 1;
    ctx.font = '700 ' + Math.round(s * 0.044) + 'px ' + MONO;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = COLOUR.TEXT_SHADOW;
    ctx.fillText(cols[i][1], cx, rowY + s * 0.044 + 2);
    ctx.fillStyle = COLOUR.GATE;
    ctx.fillText(cols[i][1], cx, rowY + s * 0.044);
  }

  /* THE MARGIN, which is what having a ghost is for. Faster than the
     line you were racing is the whole point of racing it, so it gets the
     record colour and a sign that reads at a glance. */
  let line, colour = COLOUR.TEXT;
  if (finishMargin !== null) {
    const faster = finishMargin < 0;
    line = (faster ? 'BEAT YOUR GHOST BY  ' : 'BEHIND YOUR GHOST BY  ')
         + Math.abs(finishMargin).toFixed(1) + 's';
    colour = faster ? COLOUR.SCORE_BEST : COLOUR.TEXT;
  } else if (finishClean && !dailyDone) {
    line = 'FIRST CLEAN FINISH TODAY';
    colour = COLOUR.SCORE_BEST;
  } else if (!finishClean) {
    line = 'A CLEAN RUN IS THE ONE THAT COUNTS';
  } else {
    line = 'THIS RUN IS YOUR NEW GHOST';
    colour = COLOUR.GATE;
  }
  ctx.globalAlpha = 0.82;
  text(line, w / 2, y0 + s * 0.360,
       fittedSize(line, '700', Math.round(s * 0.031), w * 0.9), '700', 'center', colour);
  ctx.globalAlpha = 1;

  const rec = 'TRACK #' + trackNumber(todayStamp) + '     TODAY  ' + dailyBest
            + (dailyTime > 0 ? '     ' + timeLabel(dailyTime) : '');
  ctx.globalAlpha = 0.66;
  text(rec, w / 2, y0 + s * 0.405,
       fittedSize(rec, '700', Math.round(s * 0.028), w * 0.9), '700');
  ctx.globalAlpha = 1;

  /* One action, and there is nothing to continue from: the track is
     over. No restart button either, because with no continue on offer
     the reflex tap already restarts and a second way to do the same
     thing is clutter. That is the death screen's own rule. */
  restartRect.live = false;
  shareRect.live = false;
  if (deadFor < FEEL.DEATH_INPUT_LOCK) return;
  if (tiltCalOnScreen()) return;
  const btnY = h - safeBottom - FEEL.DEATH_BOTTOM;
  /* The completion screen gets the same button in the same place. This
     is the screen somebody most wants to send to a friend, and having it
     on the crash screen and not on the win would be an odd thing to
     explain. */
  drawShareButton(w, h, s, btnY, Math.round(s * 0.038));
  /* THE PROMPT MOVED UP A ROW, because it used to sit centred on btnY
     and the share button now occupies that row. It goes above the row
     rather than beside it, which is where the death screen has always
     put its own prompt and for the same reason: the row is for targets
     and the line above it is for words. */
  ctx.globalAlpha = 0.55 + 0.45 * Math.abs(Math.sin(deadFor * 3));
  const prompt = 'tap or press any key to run it again';
  text(prompt, w / 2, btnY - s * FEEL.DEATH_PROMPT_GAP,
       fittedSize(prompt, '600', Math.round(s * 0.040), w * 0.88), '600');
  ctx.globalAlpha = 1;
}

/* Did that tap land on the restart button? Canvas rather than a DOM
   button on purpose: #chrome and #pads already carry the pointer-events
   discipline the Beakdown incident bought, and a fourth overlay is a
   fourth chance to get it wrong. A rect the drawing code publishes cannot
   eat a tap it is not under. */
function hitRestart(e) {
  if (!restartRect.live || state !== DEAD) return false;
  const r = canvas.getBoundingClientRect();
  const x = e.clientX - r.left, y = e.clientY - r.top;
  return x >= restartRect.x && x <= restartRect.x + restartRect.w
      && y >= restartRect.y && y <= restartRect.y + restartRect.h;
}

/* THE DATE LABEL IS GONE. The TRACK NUMBER replaced it everywhere: it is
   shorter, it is the thing two players can quote at each other, and it
   is a history rather than a calendar. Nothing needs a formatted date,
   so nothing formats one. */

/* ==================================================================
   ENTRY, AND THERE IS STILL NO MENU. Section 12 forbids one.

   THE DAILY IS THE FRONT DOOR FOR EVERYBODY, first visit included.

   The previous session made it depend on whether the browser had played
   before: a first timer got endless, a returning player got the daily.
   That is gone, and it is a simplification rather than a retreat. Two
   front doors is two things to keep right, the split rested on a
   localStorage key that this audience's locked down profiles frequently
   refuse to keep, and a first timer being handed today's track loses
   them nothing at all: it is a road with a finish line on it.

   STILL ONE TAP TO PLAY, which is what section 5 actually asks for. Tap
   anywhere, press any key, or press the primary button, and all three
   start today's track. The random road is one clearly marked button and
   nothing has to be read to ignore it.

   IT IS A TITLE SCREEN AND NOT A MENU. Section 12 forbids menus,
   settings screens and difficulty selection. There is none of that here:
   one headline, one primary action, one alternative, and nothing the
   player has to answer before driving.

   WHY NOT "REMEMBER THE LAST MODE". Remembering would send a player who
   tried the random road once straight back to it every visit after,
   which is the loop that had to be broken in the first place. Coming
   back means being offered the thing that is worth coming back for.

   And after death there is still no choice: the reflex tap continues or
   restarts the run you were in, one action, nothing to hunt for.
   ================================================================== */
const dailyRect = { x: 0, y: 0, w: 0, h: 0, live: false };
const altRect = { x: 0, y: 0, w: 0, h: 0, live: false, to: 0 };

/* Fine pointer means a trackpad or a mouse, which on this audience's
   hardware means a Chromebook, which means a keyboard. The same media
   query the tilt button already uses, read the other way round. */
const hasKeyboard = !(window.matchMedia
                      && window.matchMedia('(any-pointer: coarse)').matches);

/* One canvas button, drawn and published for the hit test. Canvas rather
   than a DOM node for the same reason the restart button is: #chrome and
   #pads already carry the pointer-events discipline the Beakdown incident
   bought, and a fourth overlay is a fourth chance to get it wrong. */
function canvasButton(rect, label, cx, cy, size, colour, w) {
  ctx.font = '800 ' + size + 'px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif';
  const bw = Math.min(w * 0.92, ctx.measureText(label).width + size * 2.4);
  const bh = size * 2.2;
  rect.x = cx - bw / 2;
  rect.y = cy - bh / 2;
  rect.w = bw;
  rect.h = bh;
  rect.live = true;
  ctx.globalAlpha = 0.9;
  ctx.fillStyle = COLOUR.BAR_TRACK;
  roundRect(rect.x, rect.y, bw, bh, bh * 0.3);
  ctx.fill();
  ctx.lineWidth = 2;
  ctx.strokeStyle = colour;
  ctx.stroke();
  ctx.globalAlpha = 1;
  text(label, cx, cy, size, '800', 'center', colour);
  return bh;
}

function hitRect(rect, e) {
  const r = canvas.getBoundingClientRect();
  const x = e.clientX - r.left, y = e.clientY - r.top;
  return x >= rect.x && x <= rect.x + rect.w && y >= rect.y && y <= rect.y + rect.h;
}

/* ==================================================================
   SHARING A RUN.

   WHICH TRACK IT WAS is the whole reason this can exist at all. A score
   off a random road is a number nobody can check; a score off track 47
   is a claim two people can settle, because they drove the same corners.
   That is what the daily bought and this is what spends it.

   NOT ONE EXTERNAL REQUEST, and there was never a risk of one. The Web
   Share API hands a string to the operating system's own sheet and the
   clipboard fallback does not leave the page at all. Nothing is fetched,
   nothing is posted, and the game works identically with both missing:
   the text goes to the on screen note and can be read off it.

   The URL is the page the player is actually on, so it stays right
   through any move of the game, and it is left out entirely off http
   and https, where it would be somebody's local file path.
   ================================================================== */
function shareRun() {
  const daily = mode === DAILY;
  const head = 'DRIFT FEVER   '
             + (daily ? 'TRACK #' + trackNumber(todayStamp) : 'RANDOM TRACK');
  let body;
  if (state === FINISHED) {
    body = banked + ' points, finished in ' + timeLabel(finishTime)
         + (finishClean ? ', clean'
            : ', on ' + continues + (continues === 1 ? ' continue' : ' continues'));
  } else {
    body = banked + ' points, ' + gatesPassed
         + (gatesPassed === 1 ? ' gate' : ' gates') + ', ' + runDistance + 'm';
  }
  let url = '';
  const proto = window.location.protocol;
  if (proto === 'http:' || proto === 'https:') {
    url = window.location.origin + window.location.pathname;
  }
  const text = head + '\n' + body + (url ? '\n' + url : '');

  /* Every one of these can throw or be absent, and a share button that
     breaks the death screen would be far worse than one that quietly
     shows the text instead. */
  try {
    if (navigator.share) {
      const p2 = navigator.share({ text: text });
      if (p2 && p2.then) p2.then(function () {}, function () {});
      return;
    }
  } catch (e) {}
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(
        function () { showNote('Copied. Paste it anywhere.', 3); },
        function () { showNote(text, 7); });
      return;
    }
  } catch (e) {}
  showNote(text, 8);
}

const shareRect = { x: 0, y: 0, w: 0, h: 0, live: false };
function hitShare(e) {
  if (!shareRect.live) return false;
  if (state !== DEAD && state !== FINISHED) return false;
  return hitRect(shareRect, e);
}

/* Beside RESTART rather than in place of it, and RESTART DOES NOT MOVE:
   it stays centred on btnY where it has always been, because that
   position is muscle memory and the reflex tap is the loop the whole
   game hangs off. Share is offset into the right hand side, far enough
   out to clear the restart button at every screen width and close enough
   in to clear the corner pads. It sits in the same place whether restart
   is drawn or not, so it never migrates under a thumb heading for the
   centre. */
function drawShareButton(w, h, s, btnY, size) {
  const dx = Math.min(w * 0.30, s * 0.28);
  /* AND IT IS THE ONE THING IN THIS ROW THAT SITS OVER THE PADS, so it
     is the one thing that has to clear them. btnY is a fixed pixel drop
     from the bottom while this button's height is a fraction of s, and
     on a tablet those two disagree by enough to put the corner of the
     button inside the fullscreen pad, where the tap would go to the pad
     and the share would appear to be broken. Lifted just far enough,
     which on every phone is not at all. */
  const y = Math.min(btnY, padsTop - size * 1.1 - 6);
  canvasButton(shareRect, 'SHARE', w / 2 + dx, y, size, COLOUR.GATE, w);
}

/* THE TWO LINES OF FACT UNDER THE PROMPT, and there are two rather than
   six because six was the problem.

   ONLY WHAT EXISTS IS SHOWN. An empty slot is left out rather than drawn
   as a dash or a zero: a first visit should read as a clean start and
   not as a form with nothing filled in. On a cold profile the first line
   is the track number alone, which is exactly right.

   TIME IS NOT HERE ANY MORE. It is on the completion screen and on the
   death screen, which are where a time means something, and a fourth
   figure on a title screen is a figure nobody reads. */
function titleFactLine() {
  const bits = ['TRACK #' + trackNumber(todayStamp)];
  if (bestScore > 0) bits.push('BEST ' + bestScore);
  if (dailyBest > 0) bits.push('TODAY ' + dailyBest);
  if (ghost.live) bits.push('GHOST READY');
  return bits.join('  \u00b7  ');
}

/* The rhythm of the thing, in one line, and it carries the whole pitch
   that used to take a sentence. A numbered track plus a countdown to a
   NEW one says daily without the word, and the three words in front of
   it say the only other thing that matters about it. */
function titleClockLine() {
  return 'SAME ROAD FOR EVERYONE  \u00b7  NEW TRACK IN ' + countdownLabel();
}

/* THE BLINK. Hard on, hard off, in the arcade tradition, which is the
   single change that makes this read as a splash rather than a page. A
   sine fade was the obvious alternative and it is wrong: a fade reads as
   a web page breathing at you. */
function titleBlinkLit() {
  const period = Math.max(0.05, FEEL.TITLE_BLINK_PERIOD);
  const phase = (titleTime % period) / period;
  return phase < FEEL.TITLE_BLINK_ON;
}

/* ==================================================================
   THE TITLE SCREEN. AN ARCADE SPLASH, NOT A MENU AND NOT A PAGE.

   IT WAS SIX BLOCKS OF TEXT ON A LIT SCENE AND IT IS NOW THREE ON A
   DARK ONE. What went, and why:

     THE PLAY TODAY'S TRACK BUTTON. Tapping anywhere already started
     today's track, so a button saying so was a second way to do the
     thing the whole screen already does, and it was the biggest object
     competing with the wordmark. A blinking prompt says the same thing,
     takes a fifth of the room and is the oldest convention in the
     genre.
     THE PITCH SENTENCE. "One road for everyone today, a new one
     tomorrow, compare with anyone" was a paragraph on a splash screen.
     Three words of it survive on the countdown line, where they belong.
     THE STEERING LINE. Section 5: the first ten seconds of the game are
     the tutorial, and one gentle corner teaches hold to turn without a
     word. A line of instructions on the title screen is the thing that
     rule exists to prevent.
     THE PRESS T HINT. Any key starts today's track, and on a keyboard
     the prompt itself now says so.
     THE TIME FIGURE AND THE LONG RANDOM TRACK CAPTION. Both shortened
     into the lines that were already there.

   AND THE SCRIM UNDER ALL OF IT, which is the change the rest depends
   on. The game keeps running behind, because an attract loop is worth
   having, but it runs behind a dark wash rather than in front of the
   type. See TITLE_SCRIM_ALPHA.

   ONE WARM FAMILY. Cream for the prompt, amber for the two fact lines,
   and the wordmark's own orange untouched. Nothing on this screen is
   drawn in a colour that the biome rotates, which is why the mint went:
   it was a different colour at every hue and it fought the wordmark at
   all of them.

   THE EMPTY SPACE IS THE DESIGN. Nothing goes between the countdown and
   the bottom button. It is not a gap waiting to be filled.

   ONE LAYOUT, BOTH ORIENTATIONS. The wordmark takes whatever height is
   left once the three lines, the air and the bottom button have taken
   theirs, so landscape is the same arrangement with the mark smaller
   rather than a second set of rules to keep in step.
   ================================================================== */
function drawOverlay(w, h) {
  /* The credit is asked for by drawResult and drawFinish and by nothing
     else. Every other screen simply does not ask, and syncCredit takes
     it off the document at the end of the frame. */
  if (state === TITLE) {
    const s = Math.min(w, h);

    /* THE SCRIM, FIRST, over everything the world has drawn and under
       everything this screen will. Sized past the edges like every other
       full screen wash here, because the shake transform is not the
       identity on the frame a run ends. */
    ctx.globalAlpha = clamp(FEEL.TITLE_SCRIM_ALPHA, 0, 1);
    ctx.fillStyle = 'rgb(' + COLOUR.TITLE_SCRIM + ')';
    ctx.fillRect(-40, -40, w + 80, h + 80);
    ctx.globalAlpha = 1;

    /* The stack under the mark, measured rather than assumed, so the
       wordmark can be handed the rest. */
    const promptSize = Math.round(s * FEEL.TITLE_PROMPT_SIZE);
    const factSize = Math.round(s * FEEL.TITLE_FACT_SIZE);
    const clockSize = Math.round(s * FEEL.TITLE_CLOCK_SIZE);
    const below = s * FEEL.TITLE_GAP_PROMPT + promptSize / 2
                + s * FEEL.TITLE_GAP_FACTS + s * FEEL.TITLE_GAP_CLOCK
                + clockSize;
    const top = Math.max(safeTop + s * 0.030, h * FEEL.TITLE_TOP);
    // The top of the RANDOM TRACK button, which the stack must clear.
    const bottomTop = h - safeBottom - FEEL.DEATH_BOTTOM - s * 0.092;
    const wmMaxH = Math.min(h * FEEL.TITLE_WM_TALL,
                            Math.max(s * FEEL.TITLE_WM_MIN,
                                     bottomTop - top - below - s * FEEL.TITLE_AIR));
    const aspect = brandInkAspect(BRAND.wordmark);
    const wmW = Math.min(w * FEEL.TITLE_WM_WIDTH, wmMaxH * aspect);

    let y;
    if (brandReady()) {
      y = top + drawBrandInk(BRAND.wordmark, w / 2, top + (wmW / aspect) / 2, wmW);
    } else {
      // Path2D missing, which should never happen. Type, so the screen
      // still has a heading rather than a hole where one was.
      const title = 'DRIFT FEVER';
      const cy = top + s * 0.06;
      text(title, w / 2, cy,
           fittedSize(title, '800', Math.round(s * 0.115), w * 0.88), '800');
      y = cy + s * 0.06;
    }

    /* THE PROMPT. Blinking, centred, no border and no box, which is the
       whole of the arcade convention. It names the action the player
       actually has: a tap on a phone, a key on a Chromebook. */
    y += s * FEEL.TITLE_GAP_PROMPT + promptSize / 2;
    if (titleBlinkLit()) {
      const go = hasKeyboard ? 'PRESS ANY KEY' : 'TAP TO START';
      text(go, w / 2, y, fittedSize(go, '800', promptSize, w * 0.9), '800');
    }

    y += promptSize / 2 + s * FEEL.TITLE_GAP_FACTS;
    ctx.globalAlpha = FEEL.TITLE_FACT_ALPHA;
    const facts = titleFactLine();
    text(facts, w / 2, y, fittedSize(facts, '700', factSize, w * 0.92), '700',
         'center', COLOUR.TITLE_DIM);
    ctx.globalAlpha = 1;

    y += s * FEEL.TITLE_GAP_CLOCK;
    ctx.globalAlpha = FEEL.TITLE_CLOCK_ALPHA;
    const clock2 = titleClockLine();
    text(clock2, w / 2, y, fittedSize(clock2, '700', clockSize, w * 0.92), '700',
         'center', COLOUR.TITLE_DIM);
    ctx.globalAlpha = 1;

    /* AND THEN NOTHING, ALL THE WAY DOWN TO THE BOTTOM BUTTON. That
       emptiness is the design and not an oversight. */
    dailyRect.live = false;
    altRect.live = false;
    /* THE CALIBRATION OWNS THIS BAND WHILE IT IS UP, and it is the only
       thing in the game that ever takes a row off another screen. It is
       a few seconds, it is asked for deliberately, and the alternative
       is a prompt drawn straight through a button. */
    if (tiltCalOnScreen()) return;

    /* THE SECOND CHOICE, anchored to the bottom edge where RESTART sits
       on the death screen and the mode switch sits on the pause overlay.
       Its one line of explanation goes UNDERNEATH it, because a caption
       above a button reads as belonging to whatever is above THAT. */
    const by0 = h - safeBottom - FEEL.DEATH_BOTTOM;
    altRect.to = ENDLESS;
    canvasButton(altRect, 'RANDOM TRACK', w / 2, by0 - s * 0.050,
                 Math.round(s * 0.038), COLOUR.TEXT, w);
    ctx.globalAlpha = FEEL.TITLE_SUB_ALPHA;
    const sub = 'not scored against the world'
              + (hasKeyboard ? '     press R' : '');
    text(sub, w / 2, by0 + s * 0.012,
         fittedSize(sub, '700', Math.round(s * 0.027), w * 0.92), '700',
         'center', COLOUR.TITLE_DIM);
    ctx.globalAlpha = 1;
  } else if (state === DEAD) {
    dailyRect.live = false;
    altRect.live = false;
    drawResult(w, h);
  } else if (state === FINISHED) {
    dailyRect.live = false;
    altRect.live = false;
    drawFinish(w, h);
  } else {
    dailyRect.live = false;
    altRect.live = false;
  }
}

function hitDaily(e) {
  if (!dailyRect.live) return false;
  if (state !== TITLE && state !== DEAD) return false;
  return hitRect(dailyRect, e);
}

function hitAlt(e) {
  if (!altRect.live || state !== TITLE) return false;
  return hitRect(altRect, e);
}

function startDaily() {
  mode = DAILY;
  startRun();
}

function startEndless() {
  mode = ENDLESS;
  startRun();
}

function startMode(m) {
  mode = m;
  startRun();
}

/* The scrape budget, drawn low and central. It shows what is left rather
   than what is spent, so a full bar means safe, and it fades out entirely
   when there is nothing to say. */
/* The run's score and the live multiplier. Read by the display and by
   nothing else, and reset by startRun with everything else. */
let score = 0;
let multiplier = 1;
let multPop = 0;          // seconds left on the kick when it passes a whole number
/* Banked is what a crash lets you keep. score is what is pending on top
   of it, which a crash does not. */
let banked = 0;
let clock = 0;
let nextGate = 0;         // segment index of the gate not yet crossed
let gateFlash = 0;        // seconds left on the crossing response
let clockPop = 0;         // seconds left on the big time payout
/* Where the score was drawn this frame, so the timer can hang off it
   rather than guessing at a fraction of the screen. */
let scoreTop = 0, scoreSize = 0, hudBottom = 0;
let runBestMult = 1;      // the best multiplier this run reached
let gatesPassed = 0;
let runDistance = 0;      // metres, for the summary
let bestScore = (function () {
  const raw = storeGet('best');
  const n = raw === null ? 0 : parseInt(raw, 10);
  return isFinite(n) && n > 0 ? n : 0;
})();
/* The second record, and the reason continues can exist without hollowing
   out the first one. Distance is what a continued run is actually good
   at, so it gets a scoreboard of its own and BEST SCORE is left alone. */
let furthest = (function () {
  const raw = storeGet('far');
  const n = raw === null ? 0 : parseInt(raw, 10);
  return isFinite(n) && n > 0 ? n : 0;
})();

/* Section 4.4. Two terms, multiplied, both zero at their easy end.

   slipTerm  is how far past MULT_MIN_SLIP the car is sideways, bent by
             MULT_SLIP_POWER so a shallow slide is worth far less than
             half of a deep one.
   edgeTerm  is how close to the edge it is, zero in the middle of the
             road and full inside the scrape band.

   Multiplied, so neither alone pays. Sideways in the middle earns
   nothing. Parked on the edge pointing straight earns nothing. */
function multiplierEarn() {
  const slipTerm = Math.pow(
    clamp((drift.slipNorm - FEEL.MULT_MIN_SLIP) / (1 - FEEL.MULT_MIN_SLIP), 0, 1),
    FEEL.MULT_SLIP_POWER);
  if (slipTerm <= 0) return 0;
  const edgeTerm = clamp(
    (Math.abs(carFrac) - FEEL.MULT_EDGE_START)
    / Math.max(0.01, FEEL.MULT_EDGE_PEAK - FEEL.MULT_EDGE_START), 0, 1);
  return slipTerm * edgeTerm;
}

/* Just the slip half of the multiplier's two terms. The clock is paid by
   DRIFTING, wherever on the road you are doing it, where the multiplier
   also wants you near the edge. Courting the edge is what the score is
   for; keeping the car sideways is what the clock is for. */
function slipPay() {
  return Math.pow(
    clamp((drift.slipNorm - FEEL.CLOCK_MIN_SLIP) / (1 - FEEL.CLOCK_MIN_SLIP), 0, 1),
    FEEL.MULT_SLIP_POWER);
}

function updateClock(dt) {
  if (state !== DRIVING) return;
  if (gateFlash > 0) gateFlash -= dt;
  if (clockPop > 0) clockPop -= dt;
  // Nothing to survive during the on ramp. A new player has enough to
  // think about without a number counting down at them.
  if (!skipOnRamp && runTime < FEEL.ONRAMP_SECONDS) { clock = FEEL.CLOCK_START; return; }
  clock += (FEEL.CLOCK_DRIFT_RATE * slipPay() - 1) * dt;
  if (clock > FEEL.CLOCK_MAX) clock = FEEL.CLOCK_MAX;
  if (clock <= 0) { clock = 0; crash(); }
}

/* Crossing a gate. Everything a gate does happens here, once, on the
   frame the car passes it. */
function crossGate() {
  const at = nextGate;
  const took = Math.floor(score);
  banked += took;
  score = 0;
  gatesPassed++;

  /* THE LAST GATE IS THE LINE. On the daily, crossing gate N ends the
     run and there is no lap two. A player with clock left will feel cut
     short and that is the correct feeling: the moment survival past the
     line contributes to a score, two runs stop being comparable and the
     daily is endless with extra steps. Finishing is the achievement. */
  if (mode === DAILY && gatesPassed >= dailyGates) { finishRun(); return; }

  clock = Math.min(FEEL.CLOCK_MAX, clock + FEEL.CLOCK_CHECKPOINT);
  gateFlash = FEEL.CHECKPOINT_FLASH;
  clockPop = FEEL.CLOCK_POP_TIME;
  nextGate += FEEL.CHECKPOINT_EVERY;
  /* The peak of the stage, and it lands as a moment rather than as a
     fade: the wash and the shake fire on this frame and the new biome
     arrives underneath them, so the turnover is something that happened
     rather than something that was noticed later. */
  gateFlash2 = FEEL.CHECKPOINT_FLASH;
  addShake(FEEL.GATE_SHAKE_PX);
  audioSting(STING_GATE);
  /* THE GATE COUNTS DOWN, and it is delivered here rather than as a
     standing readout because this is the exact moment it means
     something and it costs nothing on screen for the rest of the run.
     The second to last says what the next one is, so the closing stretch
     is driven in the knowledge that it IS the closing stretch, which is
     where the tension of a finite track lives. */
  let said = 'BANKED  +' + took;
  if (mode === DAILY) {
    const left = dailyGates - gatesPassed;
    said += left === 1 ? '   FINAL STRETCH'
          : '   ' + left + ' TO GO';
  }
  sayCallout(said, CALL_GATE, COLOUR.GATE);
  /* NOT the next one round the wheel. Marching through the hues in order
     means every gate is a small step and the change stops being an
     event; the bag guarantees a big step and still shows every hue once
     before any of them comes back. */
  applyBiome(nextBiome());
  // Everything a continue needs, taken after the gate has done its work
  // so a resume arrives in exactly the state the crossing left.
  saveCheckpoint(at);
}

/* ==================================================================
   THE FINISH.

   Deliberately not a crash with a different word on it. Nothing
   explodes, nothing falls, the car keeps its shape and the screen says
   the run was completed. It is the one outcome in this game that is a
   win and it has to read as one.

   THREE THINGS ARE RECORDED, in the order they matter:

     SCORE, which is primary, because this game is about drifting and a
       finish that was crawled round is not the same achievement as a
       finish that was thrown round.
     TIME, which is what the ghost is raced against.
     CLEAN, meaning zero continues, which is the binary most worth
       knowing and is therefore the loudest thing on the screen.
   ================================================================== */
let finishTime = 0;         // this run's time to the line
let finishMargin = null;    // against the ghost's, seconds, null if none
let finishClean = false;
let finishRecord = false;   // did this run set today's record

function finishRun() {
  finishTime = runTime;
  finishClean = continues === 0;
  runDistance = Math.round(position / 100);
  banked += Math.floor(score);
  score = 0;
  /* The margin against the line the ghost was recorded on, which is only
     meaningful if that run reached the line too. */
  finishMargin = (finishClean && dailyTime > 0) ? finishTime - dailyTime : null;
  finishRecord = bankScore(true);
  // The margin above is read off the record's time, so the line is kept
  // after it, not before, or a run would be measured against itself.
  ghostBank();
  stopTiltHint(true);
  onRunEnded();
  state = FINISHED;
  deadFor = 0;
  scraping = false;
  calloutLife = 0;
  driftLife = 0;
  breakChain();
  gateFlash = FEEL.CHECKPOINT_FLASH;
  gateFlash2 = FEEL.CHECKPOINT_FLASH;
  clockPop = 0;
  addShake(FEEL.GATE_SHAKE_PX);
  audioSting(STING_BEST);
  coastSpeed = FEEL.SPEED;
}

function updateScore(dt) {
  if (multPop > 0) multPop -= dt;
  if (state !== DRIVING) return;
  if (carSegIndex >= nextGate) crossGate();
  const earn = multiplierEarn();
  const was = Math.floor(multiplier);
  /* THE AIR HOLDS. There is no grip in flight, so there is no slip to
     earn from, and a decaying multiplier would make every jump a
     punishment for taking it. It neither climbs nor falls until the
     wheels are back on the road. */
  if (airborne) { /* held */ }
  else if (earn > 0) multiplier += FEEL.MULT_CLIMB_RATE * earn * dt;
  else multiplier -= FEEL.MULT_DECAY_RATE * dt;
  multiplier = clamp(multiplier, 1, FEEL.MULT_MAX);
  // A kick on every whole number crossed upward, which is the only thing
  // that has to be noticed for the rule to be worked out.
  if (multiplier > runBestMult) runBestMult = multiplier;
  if (Math.floor(multiplier) > was) multPop = FEEL.MULT_POP_TIME;
  score += (FEEL.SCORE_SURVIVE_RATE
            + FEEL.SCORE_RISK_RATE * (multiplier - 1)) * dt;
}

/* ==================================================================
   TODAY'S RECORD, AND THE LINE THAT WENT WITH IT.

   Its own record, separate from BEST SCORE and FURTHEST, because it is
   answering a different question: those two are "how good are you", this
   is "how good are you at TODAY'S road". It resets when the local date
   changes and it takes the ghost with it, because a line recorded on
   yesterday's generation is a line through a road that no longer exists.

   Continues are allowed on the daily and unlimited attempts are the
   point, but the RECORD is closed to a continued run, which is the same
   rule BEST SCORE already lives under and for the same reason.

   Every read and write goes through storeGet and storeSet, which are
   already try/catch wrapped. With storage unavailable dailyBest simply
   stays at zero for the session and the ghost never appears: the daily
   is still fully playable and remembers nothing, which is the required
   behaviour rather than a degradation.
   ================================================================== */
let dailyBest = 0;         // best score on a clean run
let dailyTime = 0;         // and its time to the line, zero if it never got there
let dailyDone = false;     // has today's track been finished clean at all
let dailyGhostBytes = 0;

function clearDailyRecords() {
  dailyBest = 0;
  dailyTime = 0;
  dailyDone = false;
  dailyGhostBytes = 0;
  storeSet('daily.day', String(todayStamp));
  storeSet('daily.best', '0');
  storeSet('daily.time', '0');
  storeSet('daily.ghost', '');
}

(function loadDaily() {
  const day = parseInt(storeGet('daily.day'), 10);
  if (day !== todayStamp) {
    // A different day, or nothing stored. Either way there is nothing
    // here that belongs to today's road.
    clearDailyRecords();
    return;
  }
  const b = parseInt(storeGet('daily.best'), 10);
  if (isFinite(b) && b > 0) dailyBest = b;
  const t = parseFloat(storeGet('daily.time'));
  if (isFinite(t) && t > 0) { dailyTime = t; dailyDone = true; }
  const g = storeGet('daily.ghost');
  if (g) { dailyGhostBytes = g.length; ghostDecode(g); }
})();

/* Which of two clean runs is the better one.

   A FINISH BEATS AN UNFINISHED RUN WHATEVER THE SCORES. Score stays
   primary between two runs of the same kind, and that is the right way
   round: this game is about drifting, so the higher score wins. But a
   run that reached the line and one that died at gate four are not
   comparable at all, and letting a big score on a dead run hold the
   record would keep a ghost that runs out halfway and a time that does
   not exist. */
function dailyBeatsRecord(finished, score) {
  if (finished !== dailyDone) return finished;   // a finish always wins
  return score > dailyBest;
}

/* Called at the end of a run, before anything is reset. Returns whether
   this run took the record, which is what the completion screen says. */
function bankDaily(finished) {
  if (mode !== DAILY) return false;
  if (continues > 0) return false;              // not a lap
  if (!dailyBeatsRecord(!!finished, banked)) return false;
  dailyBest = banked;
  dailyDone = !!finished;
  dailyTime = finished ? finishTime : 0;
  storeSet('daily.day', String(todayStamp));
  storeSet('daily.best', String(dailyBest));
  storeSet('daily.time', dailyTime ? dailyTime.toFixed(2) : '0');
  /* THE LINE NO LONGER GOES WITH THE RECORD. It used to be written here,
     which tied the ghost to the best clean run; it is written by
     ghostBank at the end of every run instead. The record and the ghost
     are answering different questions and want opposite rules, and this
     line moving out of this function is that separation. */
  return true;
}

function bankScore(finished) {
  const tookDaily = bankDaily(finished);
  /* FURTHEST is open to every run, continued or not, because seeing more
     of the track is exactly what a continue is for and it deserves to be
     worth something. */
  if (runDistance > furthest) {
    furthest = runDistance;
    storeSet('far', String(furthest));
  }
  /* BEST SCORE IS CLOSED TO A CONTINUED RUN, and this line is the whole
     of score integrity. Without it the live best score break, which is
     the strongest moment in the game, becomes reachable by pressing
     continue enough times and stops meaning anything at all. */
  if (continues > 0) return tookDaily;
  // Only what was banked survives. The pending run is what a gate is for.
  const final = banked;
  if (final > bestScore) {
    bestScore = final;
    // In memory even if the write failed, so the NEXT run has something
    // real to chase whether or not this profile allows storage.
    bestKnown = true;
    storeSet('best', String(bestScore));
  }
  return tookDaily;
}


/* ==================================================================
   SPECTACLE

   Everything here is a RESPONSE. Nothing in this section fires on a wall
   clock or on a random roll: the heat is the multiplier, the callouts are
   things the player just did, the close call is measured geometry, and
   the gate is a place on the road. That is the whole design rule and it
   is what stops this being decoration.

   PRECEDENCE, decided explicitly rather than left to emerge, because a
   hard corner beside a hazard on a run that is beating its best can put
   four of these in the same frame:

       best score break  >  checkpoint  >  close call  >  drift callout

   Higher suppresses lower for CALLOUT_LOCK seconds. Shake is separate and
   is combined by addShake, which takes the loudest rather than the sum.
   ================================================================== */

/* Shake, from every source in the game, through one door.

   Section 7 says overdoing shake tips into disorientation and that the
   threshold is lower on a phone held close to the face. Two sources were
   already here and this session adds three, so they combine by MAXIMUM
   rather than by sum and the result is clamped. Simultaneous events are
   therefore exactly as violent as the loudest one of them, and nothing in
   the game can shake harder than a crash. */
function addShake(px) {
  if (px > shake) shake = px;
  if (shake > FEEL.SHAKE_MAX_PX) shake = FEEL.SHAKE_MAX_PX;
}

/* The world's reaction to the multiplier, as one analogue number from 0
   to 1. Continuous, lagged so it swells rather than flickers, and bent by
   HEAT_CURVE so a small multiplier is a hint and a big one is
   unmistakable. Everything the world does reads this and nothing reads
   the multiplier directly. */
let worldHeat = 0;
let heatPulse = 1;        // the travelling pulse, 1 at rest, and exactly 1 at zero heat

/* How much of the city is awake, 0 to 1. Its own value rather than a
   second reader of worldHeat, because the two answer different questions:
   worldHeat is the multiplier, which decays and which needs the edge, and
   this is how well the car is being driven RIGHT NOW.

   NOTHING HERE ACCUMULATES. cityGlow is recomputed toward a live target
   every frame and can fall as freely as it rises, and there is no list of
   lit windows anywhere: a window is lit when the glow is past the fixed
   threshold it was born with and dark when it is not, which is why they
   go out in the same order they came on. */
let cityGlow = 0;
let cityPulse = 1;        // the throb, 1 at rest and never above 1
let cityPhase = 0;

/* AN ENVELOPE, RECOMPUTED EVERY FRAME FROM LIVE DRIFT. Fast attack, slower
   release, and a target that is genuinely zero on a straight.

   THE BUG THIS REPLACES, because it is worth writing down. The target used
   to be chainTerm * (base + rest * slipTerm), which reads as "the chain
   decides how far it goes and slip decides how hard". It latches, and
   badly: chainLinks only ever grows, the chain survives
   CALLOUT_CHAIN_GRACE of not drifting, and slip was an ADDITIVE term, so
   at zero slip the target was still base times chainTerm. Measured on a
   dead straight with no slip at all: the whole city, all 360 windows,
   stayed lit for two full seconds, was still half lit at three, and did
   not reach zero until eight. That is a latch wearing a linger's clothes.

   SLIP IS NOW A GATE, NOT A TERM. It multiplies the whole thing, so
   however long the chain is, the moment the car stops sliding the target
   is zero and the release takes it down. The chain still decides how far
   a slide can go, which is the "longer" half of the brief, but it can no
   longer hold the lights on by itself.

   The two time constants ARE the feel of this, which is why both are
   named and both are on the cycler: the ratio between them is what makes
   it breathe rather than flicker or smear. */
function updateCity(dt) {
  const driving = state === DRIVING;
  const slipTerm = Math.pow(
    clamp((drift.slipNorm - FEEL.CHAIN_MIN_SLIP) / (1 - FEEL.CHAIN_MIN_SLIP), 0, 1),
    FEEL.CITY_SLIP_POWER);
  const chainTerm = clamp(chainLinks / Math.max(1, FEEL.CITY_CHAIN_FULL), 0, 1);
  const target = driving
    ? slipTerm * (FEEL.CITY_BASE + (1 - FEEL.CITY_BASE) * chainTerm)
    : 0;
  const tau = target > cityGlow ? FEEL.CITY_ATTACK : FEEL.CITY_RELEASE;
  cityGlow += (target - cityGlow) * (1 - Math.exp(-dt / tau));
  /* An exponential never actually arrives. Without this the city sits at
     a thousandth of a window for the rest of the run, which is the same
     class of mistake as the latch it replaces. */
  if (target <= 0 && cityGlow < FEEL.CITY_SILENT) cityGlow = 0;

  /* The throb. Depth and rate both scale with the envelope, so at rest
     there is no pulse at all and only a hard sustained slide makes the
     city breathe. It rides the ALPHA and never the thresholds: modulating
     which windows are lit would read as flicker rather than as a pulse,
     and section 7 is specific about overdoing motion on a phone. Default
     low, and CITY_PULSE_DEPTH takes it to nothing. */
  cityPhase += dt * (FEEL.CITY_PULSE_HZ + FEEL.CITY_PULSE_HZ_GAIN * cityGlow)
                  * Math.PI * 2;
  if (cityPhase > Math.PI * 2) cityPhase -= Math.PI * 2;
  cityPulse = 1 - FEEL.CITY_PULSE_DEPTH * cityGlow * (0.5 - 0.5 * Math.cos(cityPhase));
}

/* TWO LANES.

   The EVENT lane carries the things that happen to a run: a checkpoint, a
   close call, a best score break. They are rare, so they need no rate
   limit, and they keep their own precedence, best over gate over close.

   The DRIFT lane carries the thing the player is doing, which is the
   entire game, so it is not queued behind events and it cannot be
   outbid by one. It has its own row on the screen, its own slot and its
   own rate floor. The only thing that may take it away is a best score
   break, which is the one moment loud enough to deserve the whole screen.

   Each lane holds one callout, newest wins. Neither ever stacks. */
const CALL_CLOSE = 2, CALL_CHAIN = 3, CALL_GATE = 4, CALL_BEST = 5;
let calloutText = '';
let calloutColour = '';
let calloutPri = 0;
let calloutLife = 0;
let calloutSide = 1;
let calloutLock = 0;      // a louder event holding the event lane

let driftText = '';
let driftColour = '';
let driftSize = 1;        // multiples of the base size, so a tier reads bigger
let driftLife = 0;
let driftSide = 1;
let driftLock = 0;        // only a best score break sets this
let driftGap = 0;         // the rate floor on this lane

// Away from the car, so a callout can never sit over the car or over the
// line the player is actually reading.
function calloutAwaySide() { return carFrac >= 0 ? -1 : 1; }

function sayCallout(str, pri, colour) {
  // Deferred, not queued: a callout that lost its moment has nothing left
  // to say by the time the channel is free.
  if (calloutLock > 0 && pri < calloutPri) return;
  calloutText = str;
  calloutColour = colour;
  calloutPri = pri;
  calloutLife = FEEL.CALLOUT_TIME;
  calloutLock = FEEL.CALLOUT_LOCK;
  calloutSide = calloutAwaySide();
  /* The one crossing between the lanes. A best score break is the whole
     screen's business for a moment, so it clears the drift lane and holds
     it; nothing else in the event lane touches it at all. */
  if (pri >= CALL_BEST) { driftLife = 0; driftLock = FEEL.CALLOUT_LOCK; }
}

/* urgent skips the rate floor. A TIER RISE is urgent by definition: the
   ladder widens, so tiers are self limiting and cannot become a stream,
   and holding one back means the player never sees a rung. Measured, the
   floor was swallowing tier two entirely, which is exactly the rung that
   says a chain is going somewhere. Tier one and a perfect entry are the
   repeatable ones and they wait their turn. */
function sayDrift(str, colour, size, urgent) {
  if (driftLock > 0) return;
  if (!urgent && driftGap > 0) return;
  driftText = str;
  driftColour = colour;
  driftSize = size;
  driftLife = FEEL.CALLOUT_TIME;
  driftGap = FEEL.CALLOUT_GAP;
  driftSide = calloutAwaySide();
}

/* The best score break. bestKnown is the whole of the fresh install and
   no storage handling: with nothing stored there is nothing to beat, so
   the effect simply does not exist for that run. */
let bestKnown = bestScore > 0;
let beatBest = false;
let beatFlash = 0;

/* The chain: unbroken DRIFTING, which is slip and not the multiplier's
   two term test, so a tidy drift down the middle of a wide on ramp road
   still counts. It survives CALLOUT_CHAIN_GRACE of not drifting, which is
   long enough to cross the straight between two corners, and every
   CALLOUT_CHAIN_STEP of drifting is one link.

   The ladder escalates on TIERS, not on links: the pitch in the audio
   moves on every single link, which is the continuous reward and costs no
   screen space at all, and the text only changes when a tier is reached,
   which is what keeps the praise loud without becoming clutter. */
/* Alternates per rung, so the same word is not read back twice running.
   The variant is picked off a counter rather than off rng(), which is the
   road generator's seeded stream: consuming from it here would change the
   road a pinned seed produces and quietly break every A/B comparison in
   the project. */
const DRIFT_TIERS = [
  ['DRIFT', 'SIDEWAYS', 'HOLD IT'],
  ['NICE', 'CLEAN', 'TIDY'],
  ['GREAT', 'LOVELY', 'SWEET'],
  ['SUPERB', 'SUBLIME', 'MASTERFUL'],
  ['BLISTERING', 'SCORCHING', 'ON FIRE'],
  ['UNREAL', 'MONSTROUS', 'RIDICULOUS']
];
let chainTime = 0;
let chainLapse = 0;
let chainLinks = 0;
let chainTier = 0;
let chainSaidAt = 0;      // links at the last thing said, for the repeats past the top
let chainBestSaid = false;   // this chain has already claimed the run best
let driftWordN = 0;       // which alternate, so a rung never repeats its own word
let runBestChain = 0;     // the longest chain this run, for the louder event

function driftWord(tier) {
  const words = DRIFT_TIERS[Math.min(tier, DRIFT_TIERS.length) - 1];
  return words[driftWordN++ % words.length];
}

let gateFlash2 = 0;       // the crossing wash, separate from the score's own flash
let wasScraping = false;
let edgeClear = 0;        // seconds since the car was last in the scrape band

function resetSpectacle() {
  worldHeat = 0;
  heatPulse = 1;
  cityGlow = 0;
  cityPulse = 1;
  cityPhase = 0;
  calloutText = '';
  calloutLife = 0;
  calloutPri = 0;
  calloutLock = 0;
  driftText = '';
  driftLife = 0;
  driftLock = 0;
  driftGap = 0;
  beatBest = false;
  beatFlash = 0;
  breakChain();
  runBestChain = 0;
  gateFlash2 = 0;
  wasScraping = false;
  edgeClear = 0;
}

/* Called when the chain LAPSES, not when the run ends, so every new chain
   earns its praise from scratch: a tier four chain at four minutes is
   worth exactly what a tier four chain at twenty seconds is worth,
   because it is harder. runBestChain is deliberately NOT reset here, and
   it is deliberately not a gate on anything: it only decides whether the
   separate louder event fires. */
function breakChain() {
  chainTime = 0;
  chainLapse = 0;
  chainLinks = 0;
  chainTier = 0;
  chainSaidAt = 0;
  chainBestSaid = false;
}

/* Which tier a link count has reached, 0 for none. The thresholds widen,
   so the ladder does not run out inside ten seconds. */
function chainTierFor(links) {
  const at = FEEL.DRIFT_TIER_LINKS;
  let t = 0;
  for (let i = 0; i < at.length; i++) if (links >= at[i]) t = i + 1;
  return t;
}

function updateSpectacle(dt) {
  if (calloutLife > 0) calloutLife -= dt;
  if (calloutLock > 0) calloutLock -= dt;
  if (driftLife > 0) driftLife -= dt;
  if (driftLock > 0) driftLock -= dt;
  if (driftGap > 0) driftGap -= dt;
  if (beatFlash > 0) beatFlash -= dt;
  if (gateFlash2 > 0) gateFlash2 -= dt;
  if (resumeFlash > 0) resumeFlash -= dt;
  if (explodeFlash > 0) explodeFlash -= dt;
  updateDebris(dt);

  const driving = state === DRIVING;
  const want = driving
    ? Math.pow(clamp((multiplier - 1) / (FEEL.MULT_MAX - 1), 0, 1), FEEL.HEAT_CURVE)
    : 0;
  worldHeat += (want - worldHeat) * (1 - Math.exp(-dt / FEEL.HEAT_TIME));
  /* Phase off distance travelled rather than off a clock, so it is the
     world going past. Depth is multiplied by heat, so at a multiplier of
     one this is exactly 1 and there is no pulse at all. */
  const wave = 0.5 + 0.5 * Math.sin(position * (Math.PI * 2 / FEEL.HEAT_PULSE_LENGTH));
  heatPulse = 1 - FEEL.HEAT_PULSE_DEPTH * worldHeat * (1 - wave);
  // After the chain has been updated it would lag a frame, and before the
  // early return so the city still cools down over a death screen.
  updateCity(dt);

  if (!driving) { wasScraping = false; edgeClear = 0; return; }

  /* The strongest moment available, and one comparison to find it. It
     only arms on a CLEAN run: a continued run cannot reach the best
     score, so it must not be told that it has. */
  if (bestKnown && continues === 0 && !beatBest
      && banked + Math.floor(score) > bestScore) {
    beatBest = true;
    beatFlash = FEEL.BEST_FLASH_TIME;
    addShake(FEEL.BEST_SHAKE_PX);
    audioSting(STING_BEST);
    sayCallout('NEW BEST', CALL_BEST, COLOUR.SCORE_BEST);
  }

  /* A perfect entry: arriving in the scrape band already committed,
     rather than sliding wide into it. The edge itself only, because
     clipping a hazard is not an entry, it is a mistake, and only after
     genuinely leaving the band, because a re touch is not an arrival. */
  const onEdge = scraping && Math.abs(carFrac) > FEEL.SCRAPE_START;
  if (onEdge) {
    if (!wasScraping && edgeClear >= FEEL.CALLOUT_ENTRY_CLEAR
        && drift.slipNorm >= FEEL.CALLOUT_ENTRY_SLIP) {
      sayDrift('PERFECT ENTRY', COLOUR.HAZARD_WARN, 1);
    }
    edgeClear = 0;
  } else {
    edgeClear += dt;
  }
  wasScraping = onEdge;

  /* The chain. Every link steps the pitch of the audio blip, which is the
     continuous reward and costs nothing on screen; the text only speaks
     when a whole tier is reached. */
  /* THE AIR IS NOT A LAPSE. A jump taken straight would otherwise read as
     letting go of the wheel and cost the chain, which would teach the
     player to avoid the ramps. Frozen rather than fed: the chain neither
     grows nor breaks in flight, and picks up exactly where it left off. */
  if (airborne) { resolveCloseCalls(); return; }

  if (drift.slipNorm >= FEEL.CHAIN_MIN_SLIP) {
    chainLapse = 0;
    chainTime += dt;
    const links = Math.floor(chainTime / FEEL.CALLOUT_CHAIN_STEP) + 1;
    if (links > chainLinks) {
      chainLinks = links;
      audioChain(links);
      const tier = chainTierFor(links);
      const top = DRIFT_TIERS.length;
      /* Two reasons to speak, and the second is what stops the silence.
         A NEW RUNG, or, once the ladder has run out, every further
         DRIFT_TOP_REPEAT links of a chain that is still going. */
      const rung = tier > chainTier;
      const past = tier >= FEEL.DRIFT_TIER_LINKS.length
                   && links >= chainSaidAt + FEEL.DRIFT_TOP_REPEAT;
      if (rung || past) {
        chainTier = tier;
        chainSaidAt = links;
        const shown = Math.min(tier, top);
        // Past the top the word stops growing and the count takes over,
        // so a chain that keeps going keeps reading as bigger.
        const label = tier <= top ? driftWord(shown)
                                  : driftWord(shown) + '  ×' + links;
        sayDrift(label, scoreHeatColour((shown - 1) / Math.max(1, top - 1)),
                 1 + FEEL.DRIFT_TIER_GROWTH * (shown - 1), tier > 1);
      }
      /* The run's longest chain, once per chain, in the EVENT lane so it
         is louder and so it is beside the ordinary praise rather than in
         front of it. */
      if (!chainBestSaid && links > runBestChain && links >= FEEL.DRIFT_BEST_MIN) {
        chainBestSaid = true;
        sayCallout('LONGEST CHAIN  ×' + links, CALL_CHAIN, COLOUR.SCORE_BEST);
        audioSting(STING_CHAIN);
      }
      if (links > runBestChain) runBestChain = links;
    }
  } else {
    chainLapse += dt;
    if (chainLapse > FEEL.CALLOUT_CHAIN_GRACE) breakChain();
  }

  resolveCloseCalls();
}

/* ==================================================================
   THE EXPLOSION

   Hitting a solid object now looks like hitting a solid object. Debris,
   a flash, a hard shake and a few frames of the world standing still.

   IT MUST NEVER DELAY GETTING BACK IN, which is section 5 and is the one
   constraint that overrides everything here. So it is purely cosmetic:
   nothing waits on it, the death screen comes up underneath it on exactly
   the schedule it always did, and a tap or a key at any point during it
   goes straight through to continue or restart. The only input gate is
   DEATH_INPUT_LOCK, the accidental input guard that was already there,
   and the hit stop does not extend it, because deadFor advances on real
   time while the world is frozen.

   The pieces are held in SCREEN space rather than world space. They live
   for about a second over a car that is not moving any more, so there is
   nothing for world space to buy, and screen space means the whole effect
   is a handful of numbers and one batched path.
   ================================================================== */
const debris = [];
let debrisCount = 0;
let hitStop = 0;
let explodeFlash = 0;
(function () {
  for (let i = 0; i < 64; i++) {
    debris.push({ x: 0, y: 0, vx: 0, vy: 0, r: 0, life: 0, spin: 0, rot: 0, hot: 0 });
  }
})();

function clearDebris() {
  for (let i = 0; i < debris.length; i++) debris[i].life = 0;
  debrisCount = 0;
  hitStop = 0;
  explodeFlash = 0;
}

function explode() {
  addShake(FEEL.EXPLODE_SHAKE_PX);
  hitStop = FEEL.HIT_STOP_TIME;
  explodeFlash = FEEL.EXPLODE_FLASH_TIME;
  const s = Math.min(view.w, view.h);
