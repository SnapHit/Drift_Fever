   near face, the top face and a lit leading edge. Four fills for the whole
   screen however many are in view, which is the same discipline the road
   itself is drawn under.

   Heights use the horizontal scale, the same way the car and the road
   thickness do, so a hazard keeps its proportions rather than being
   stretched by the vertical anisotropy. */
function hazardQuads(first, last, baseIndex, spread, top, parity) {
  let any = false;
  ctx.beginPath();
  for (let k = 0; k < hazards.length; k++) {
    const h = hazards[k];
    const x = hazardX(h);
    for (let i = h.from; i <= h.to; i++) {
      const n = i - baseIndex;
      if (n < first || n > last || !bvis[n]) continue;
      if (parity !== undefined && (i & 1) !== parity) continue;
      const seg = segAt(i);
      if (!seg) continue;
      any = true;
      const half = (h.half + spread) / seg.hw;
      const rise = top ? bh[n] * FEEL.HAZARD_HEIGHT : 0;
      const riseN = top ? bh[n + 1] * FEEL.HAZARD_HEIGHT : 0;
      const y1 = by[n] - rise, y2 = by[n + 1] - 1 - riseN;
      const l1 = bx[n] + bw[n] * (x - half), r1 = bx[n] + bw[n] * (x + half);
      const l2 = bx[n + 1] + bw[n + 1] * (x - half), r2 = bx[n + 1] + bw[n + 1] * (x + half);
      if (top) {
        // The near face, from the road up to the top of the box.
        ctx.moveTo(l1, by[n]); ctx.lineTo(r1, by[n]);
        ctx.lineTo(r1, y1); ctx.lineTo(l1, y1);
      } else {
        ctx.moveTo(l1, y1); ctx.lineTo(r1, y1); ctx.lineTo(r2, y2); ctx.lineTo(l2, y2);
      }
      ctx.closePath();
    }
  }
  return any;
}

/* The face that actually points at the player, drawn once per hazard
   with diagonal hazard striping across it. This is the whole "do not hit
   me" signal: a tall dark wall leaning bands across itself, which is what
   a crash barrier looks like everywhere in the world.

   Clipped rather than clamped, because a leaning band across a trapezoid
   has no closed form worth writing, and there are only ever a handful of
   hazards inside the draw distance. */
function drawHazardFronts(first, last, baseIndex) {
  for (let k = 0; k < hazards.length; k++) {
    const h = hazards[k];
    const n = h.from - baseIndex;
    if (n < first || n > last || !bvis[n]) continue;
    const seg = segAt(h.from);
    if (!seg) continue;
    const x = hazardX(h);
    const half = h.half / seg.hw;
    const l = bx[n] + bw[n] * (x - half), r = bx[n] + bw[n] * (x + half);
    const top = by[n] - bh[n] * FEEL.HAZARD_HEIGHT, bot = by[n];
    const wpx = r - l, hpx = bot - top;
    if (wpx < 3 || hpx < 3) continue;          // too small to read, skip the work
    ctx.save();
    ctx.beginPath();
    ctx.rect(l, top, wpx, hpx);
    ctx.clip();
    ctx.fillStyle = COLOUR.HAZARD_SIDE;
    ctx.fillRect(l, top, wpx, hpx);
    const slant = hpx * FEEL.HAZARD_STRIPE_SLANT;
    const step = (wpx + slant) / FEEL.HAZARD_STRIPE_COUNT;
    ctx.beginPath();
    for (let i = -1; i < FEEL.HAZARD_STRIPE_COUNT + 1; i += 2) {
      const b0 = l + i * step;
      ctx.moveTo(b0, bot); ctx.lineTo(b0 + step, bot);
      ctx.lineTo(b0 + step + slant, top); ctx.lineTo(b0 + slant, top);
      ctx.closePath();
    }
    ctx.fillStyle = COLOUR.HAZARD_TOP;
    ctx.fill();
    ctx.restore();
  }
}

const HAZARD_GLOW_FILL = 'rgb(' + COLOUR.HAZARD_GLOW + ')';
const GATE_GLOW_FILL = 'rgb(' + COLOUR.GATE_GLOW + ')';
function drawHazards(first, last, baseIndex) {
  if (!hazards.length) return;
  // Wide and faint first, the same two pass glow the road edges use, and
  // still no shadowBlur anywhere.
  if (hazardQuads(first, last, baseIndex, FEEL.HAZARD_CLIP * 2.2, false)) {
    ctx.globalAlpha = 0.28;
    ctx.fillStyle = HAZARD_GLOW_FILL;
    ctx.fill();
    ctx.globalAlpha = 1;
  }
  // The clip shoulder, which is a real band and is drawn as one.
  if (hazardQuads(first, last, baseIndex, FEEL.HAZARD_CLIP, false)) {
    ctx.fillStyle = COLOUR.HAZARD_SIDE;
    ctx.fill();
  }
  // The near face of the core, then its top.
  if (hazardQuads(first, last, baseIndex, 0, true)) {
    ctx.fillStyle = COLOUR.HAZARD_SIDE;
    ctx.fill();
  }
  /* The top, in alternating bands along its length. Two fills rather
     than one, and between them they say "marked object" rather than
     "coloured surface". */
  if (hazardQuads(first, last, baseIndex, 0, false, 0)) {
    ctx.fillStyle = COLOUR.HAZARD_TOP;
    ctx.fill();
  }
  if (hazardQuads(first, last, baseIndex, 0, false, 1)) {
    ctx.fillStyle = COLOUR.HAZARD_DARK;
    ctx.fill();
  }
  drawHazardFronts(first, last, baseIndex);
  // The lit top edge, so the object resolves as a solid at draw distance
  // rather than as a smear, exactly as the road lip does.
  let any = false;
  ctx.beginPath();
  for (let k = 0; k < hazards.length; k++) {
    const h = hazards[k];
    const x = hazardX(h);
    for (let i = h.from; i <= h.to; i++) {
      const n = i - baseIndex;
      if (n < first || n > last || !bvis[n]) continue;
      const seg = segAt(i);
      if (!seg) continue;
      any = true;
      const half = h.half / seg.hw;
      const rise = bh[n] * FEEL.HAZARD_HEIGHT;
      const y = by[n] - rise;
      const t = Math.max(1.2, bh[n] * 90);
      const l1 = bx[n] + bw[n] * (x - half), r1 = bx[n] + bw[n] * (x + half);
      ctx.moveTo(l1, y - t); ctx.lineTo(r1, y - t);
      ctx.lineTo(r1, y + t); ctx.lineTo(l1, y + t);
      ctx.closePath();
    }
  }
  if (any) { ctx.fillStyle = COLOUR.HAZARD_LIP; ctx.fill(); }
}

/* One colour, both sides of the road, every segment on the given stripe.
   from and to are fractions of the half width, measured outward from the
   centre line. */
function bandPass(first, last, wantLight, from, to, colour) {
  ctx.beginPath();
  let any = false;
  for (let n = first; n <= last; n++) {
    if (!bvis[n] || blight[n] !== wantLight) continue;
    any = true;
    const y1 = by[n], y2 = by[n + 1] - 1;
    const a1 = bw[n] * from, a2 = bw[n + 1] * from;
    const c1 = bw[n] * to, c2 = bw[n + 1] * to;
    ctx.moveTo(bx[n] - c1, y1); ctx.lineTo(bx[n] - a1, y1);
    ctx.lineTo(bx[n + 1] - a2, y2); ctx.lineTo(bx[n + 1] - c2, y2);
    ctx.closePath();
    ctx.moveTo(bx[n] + c1, y1); ctx.lineTo(bx[n] + a1, y1);
    ctx.lineTo(bx[n + 1] + a2, y2); ctx.lineTo(bx[n + 1] + c2, y2);
    ctx.closePath();
  }
  if (!any) return;
  ctx.fillStyle = colour;
  ctx.fill();
}

function surfacePass(first, last, wantLight, colour) {
  ctx.beginPath();
  let any = false;
  for (let n = first; n <= last; n++) {
    if (!bvis[n] || blight[n] !== wantLight) continue;
    any = true;
    const y1 = by[n], y2 = by[n + 1] - 1;
    ctx.moveTo(bx[n] - bw[n], y1); ctx.lineTo(bx[n] + bw[n], y1);
    ctx.lineTo(bx[n + 1] + bw[n + 1], y2); ctx.lineTo(bx[n + 1] - bw[n + 1], y2);
    ctx.closePath();
  }
  if (!any) return;
  ctx.fillStyle = colour;
  ctx.fill();
}

function lanePass(first, last) {
  const f = FEEL.LANE_DASH_FRACTION;
  ctx.beginPath();
  let any = false;
  for (let n = first; n <= last; n++) {
    if (!bvis[n] || !blight[n]) continue;
    any = true;
    const y1 = by[n], y2 = by[n + 1] - 1;
    const l1 = bw[n] * f, l2 = bw[n + 1] * f;
    ctx.moveTo(bx[n] - l1, y1); ctx.lineTo(bx[n] + l1, y1);
    ctx.lineTo(bx[n + 1] + l2, y2); ctx.lineTo(bx[n + 1] - l2, y2);
    ctx.closePath();
  }
  if (!any) return;
  ctx.fillStyle = COLOUR.LANE;
  ctx.fill();
}

/* The wide faint half of the glow, over the road and the void alike so it
   spills both ways. One fill for both edges and the whole draw distance. */
function edgeGlowPass(first, last) {
  const spread = FEEL.EDGE_GLOW_SPREAD;
  const inner = EDGE_OUT - FEEL.EDGE_LIP_FRACTION - spread;
  const outer = EDGE_OUT + spread;
  ctx.beginPath();
  for (let n = first; n <= last; n++) {
    if (!bvis[n]) continue;
    // The band is under a pixel from here on, so it costs fill rate and
    // shows nothing. Widths shrink with distance, so this can break.
    if (bw[n] < GLOW_CULL_PX) break;
    const y1 = by[n], y2 = by[n + 1] - 1;
    const a1 = bw[n] * inner, a2 = bw[n + 1] * inner;
    const c1 = bw[n] * outer, c2 = bw[n + 1] * outer;
    ctx.moveTo(bx[n] - c1, y1); ctx.lineTo(bx[n] - a1, y1);
    ctx.lineTo(bx[n + 1] - a2, y2); ctx.lineTo(bx[n + 1] - c2, y2);
    ctx.closePath();
    ctx.moveTo(bx[n] + c1, y1); ctx.lineTo(bx[n] + a1, y1);
    ctx.lineTo(bx[n + 1] + a2, y2); ctx.lineTo(bx[n + 1] + c2, y2);
    ctx.closePath();
  }
  ctx.globalAlpha = FEEL.EDGE_GLOW_ALPHA;
  ctx.fillStyle = EDGE_GLOW_FILL;
  ctx.fill();
  ctx.globalAlpha = 1;
}

/* A second glowing line, along the bottom of the slab. Two lit lines with
   darkness between them state the thickness outright, where one line and
   an occluded silhouette only implied it. */
function drawSlabUnderline(first, last) {
  const scaleW = FEEL.SLAB_BOTTOM_WIDTH / FEEL.ROAD_HALF_WIDTH_BASE;
  const scaleG = FEEL.SLAB_BOTTOM_GLOW / FEEL.ROAD_HALF_WIDTH_BASE;
  underlinePath(first, last, scaleG);
  ctx.globalAlpha = FEEL.EDGE_GLOW_ALPHA;
  ctx.fillStyle = SLAB_BOTTOM_GLOW_FILL;
  ctx.fill();
  ctx.globalAlpha = 1;
  underlinePath(first, last, scaleW);
  ctx.fillStyle = COLOUR.SLAB_BOTTOM;
  ctx.fill();
}

function underlinePath(first, last, thick) {
  ctx.beginPath();
  for (let n = first; n <= last; n++) {
    if (!bvis[n]) continue;
    if (bw[n] < GLOW_CULL_PX) break;
    const o1 = bw[n] * EDGE_OUT + bf[n], o2 = bw[n + 1] * EDGE_OUT + bf[n + 1];
    const y1 = by[n] + bt[n], y2 = by[n + 1] + bt[n + 1];
    const t1 = bw[n] * thick, t2 = bw[n + 1] * thick;
    ctx.moveTo(bx[n] - o1, y1 - t1); ctx.lineTo(bx[n] - o1, y1 + t1);
    ctx.lineTo(bx[n + 1] - o2, y2 + t2); ctx.lineTo(bx[n + 1] - o2, y2 - t2);
    ctx.closePath();
    ctx.moveTo(bx[n] + o1, y1 - t1); ctx.lineTo(bx[n] + o1, y1 + t1);
    ctx.lineTo(bx[n + 1] + o2, y2 + t2); ctx.lineTo(bx[n + 1] + o2, y2 - t2);
    ctx.closePath();
  }
}

/* Posts down both edges. Three batched fills for the lot: the faint glow,
   the ordinary posts and the taller marker posts. */
function drawPylons(first, last, baseIndex, w) {
  const spacing = FEEL.PYLON_SPACING;
  const scaleH = 1 / FEEL.ROAD_HALF_WIDTH_BASE;
  pylonPath(first, last, baseIndex, spacing, FEEL.PYLON_GLOW_SPREAD, scaleH, 2);
  ctx.globalAlpha = FEEL.PYLON_GLOW_ALPHA;
  ctx.fillStyle = PYLON_GLOW_FILL;
  ctx.fill();
  ctx.globalAlpha = 1;
  pylonPath(first, last, baseIndex, spacing, 1, scaleH, 0);
  ctx.fillStyle = COLOUR.PYLON;
  ctx.fill();
  pylonPath(first, last, baseIndex, spacing, 1, scaleH, 1);
  ctx.fillStyle = COLOUR.PYLON_MAJOR;
  ctx.fill();
}

/* which: 0 ordinary posts, 1 marker posts, 2 both. */
function pylonPath(first, last, baseIndex, spacing, widen, scaleH, which) {
  ctx.beginPath();
  for (let n = first; n <= last; n++) {
    if (!bvis[n]) continue;
    const idx = baseIndex + n;
    if (idx % spacing !== 0) continue;
    const major = ((idx / spacing) % FEEL.PYLON_MAJOR_EVERY) === 0;
    if (which !== 2 && (which === 1) !== major) continue;

    const hWorld = major ? FEEL.PYLON_MAJOR_HEIGHT : FEEL.PYLON_HEIGHT;
    const wWorld = (major ? FEEL.PYLON_MAJOR_WIDTH : FEEL.PYLON_WIDTH) * widen;
    // Heights use the horizontal scale, as everything standing up does.
    const rise = bw[n] * hWorld * scaleH;
    if (rise < FEEL.PYLON_MIN_PX) continue;
    const half = bw[n] * wWorld * scaleH * 0.5;
    const out = bw[n] * (EDGE_OUT + FEEL.PYLON_OUT);
    const base = by[n];
    const top = base - rise;

    ctx.moveTo(bx[n] - out - half, top); ctx.lineTo(bx[n] - out + half, top);
    ctx.lineTo(bx[n] - out + half, base); ctx.lineTo(bx[n] - out - half, base);
    ctx.closePath();
    ctx.moveTo(bx[n] + out - half, top); ctx.lineTo(bx[n] + out + half, top);
    ctx.lineTo(bx[n] + out + half, base); ctx.lineTo(bx[n] + out - half, base);
    ctx.closePath();
  }
}

/* The sides of the slab, every visible one batched into a single path so
   the whole cliff costs one fill rather than one per segment.

   These are drawn on both sides regardless of which way the road turns.
   Strictly the outside wall of a corner faces away from the camera and
   should not be there, and on a dead straight road neither wall is
   visible at all, because a vertical plane seen from directly behind and
   above is exactly edge on. Drawing only the true ones would mean the
   road has no thickness on any straight, which is the flat decal the
   whole change is meant to avoid. So this is a stylisation and the one
   place here where the look wins over the geometry. */
function drawWalls(count) {
  ctx.beginPath();
  for (let n = 0; n < count; n++) {
    if (bz[n] <= CAMERA_DEPTH) continue;
    if (by[n + 1] >= by[n]) continue;
    if (bw[n] < WALL_CULL_PX) break;
    const o1 = bw[n] * EDGE_OUT, o2 = bw[n + 1] * EDGE_OUT;
    const l1 = bx[n] - o1, l2 = bx[n + 1] - o2;
    const r1 = bx[n] + o1, r2 = bx[n + 1] + o2;
    const y1 = by[n], y2 = by[n + 1];
    const d1 = y1 + bt[n], d2 = y2 + bt[n + 1];
    const f1 = bf[n], f2 = bf[n + 1];
    ctx.moveTo(l1, y1); ctx.lineTo(l2, y2);
    ctx.lineTo(l2 - f2, d2); ctx.lineTo(l1 - f1, d1);
    ctx.closePath();
    ctx.moveTo(r1, y1); ctx.lineTo(r2, y2);
    ctx.lineTo(r2 + f2, d2); ctx.lineTo(r1 + f1, d1);
    ctx.closePath();
  }
  ctx.fillStyle = COLOUR.WALL;
  ctx.fill();
}

/* The trail. Two lines from the rear wheel contact points, so they still
   scissor apart under drift, but they now fade out behind the car and run
   from cool to hot with the slip that laid them. A run driven on the
   limit leaves a brighter line than a tidy one, which is the whole point:
   the prettiest thing on screen is the thing risk buys. */
const TRAIL_RAMP = [];
(function () {
  /* Deep blue, through cyan, to a hot white. Precomputed, because this
     is read once per marked segment.

     It went through magenta while the road was blue, and magenta was the
     wrong choice the moment the road turned warm: it is close enough in
     hue to the asphalt that the mark stopped separating from it. Blue to
     cyan to white is the far side of the wheel from every road colour,
     and it also puts the intensity in value, which survives a palette
     change far better than a hue does. */
  const stops = [[36, 74, 235], [0, 158, 255], [86, 224, 255], [190, 246, 255], [255, 255, 255]];
  for (let i = 0; i < 24; i++) {
    const t = i / 23 * (stops.length - 1);
    const a = stops[Math.floor(t)], b = stops[Math.min(stops.length - 1, Math.floor(t) + 1)];
    const f = t - Math.floor(t);
    TRAIL_RAMP.push('rgb(' + Math.round(a[0] + (b[0] - a[0]) * f) + ','
      + Math.round(a[1] + (b[1] - a[1]) * f) + ','
      + Math.round(a[2] + (b[2] - a[2]) * f) + ')');
  }
})();

function trailColour(intensity) {
  let i = Math.round(intensity * (TRAIL_RAMP.length - 1));
  if (i < 0) i = 0; else if (i >= TRAIL_RAMP.length) i = TRAIL_RAMP.length - 1;
  return TRAIL_RAMP[i];
}

function drawTrail(first, last, baseIndex) {
  const base = FEEL.ROAD_HALF_WIDTH_BASE;
  for (let n = first; n <= last; n++) {
    if (!bvis[n]) continue;
    const s = segAt(baseIndex + n);
    if (!s || s.ma <= 0) continue;
    // Age behind the car, which is what fades it.
    const age = carSegIndex - s.index;
    if (age < 0) continue;
    const fade = 1 - age / FEEL.TRAIL_FADE_SEGMENTS;
    if (fade <= 0) continue;

    const mw = FEEL.TYRE_MARK_WIDTH * base / s.hw;
    const colour = trailColour(s.ma);
    const y1 = by[n], y2 = by[n + 1] - 1;
    const w1 = bw[n], w2 = bw[n + 1];

    ctx.fillStyle = colour;
    ctx.globalAlpha = s.ma * FEEL.TYRE_MARK_MAX_ALPHA * FEEL.TRAIL_GLOW_ALPHA * fade;
    trailQuads(s, mw * FEEL.TRAIL_GLOW_SPREAD, bx[n], bx[n + 1], w1, w2, y1, y2);
    ctx.globalAlpha = s.ma * FEEL.TYRE_MARK_MAX_ALPHA * fade;
    trailQuads(s, mw, bx[n], bx[n + 1], w1, w2, y1, y2);
  }
  ctx.globalAlpha = 1;
}

function trailQuads(s, mw, x1, x2, w1, w2, y1, y2) {
  ctx.beginPath();
  ctx.moveTo(x1 + (s.ml0 - mw) * w1, y1); ctx.lineTo(x1 + (s.ml0 + mw) * w1, y1);
  ctx.lineTo(x2 + (s.ml1 + mw) * w2, y2); ctx.lineTo(x2 + (s.ml1 - mw) * w2, y2);
  ctx.closePath();
  ctx.moveTo(x1 + (s.mr0 - mw) * w1, y1); ctx.lineTo(x1 + (s.mr0 + mw) * w1, y1);
  ctx.lineTo(x2 + (s.mr1 + mw) * w2, y2); ctx.lineTo(x2 + (s.mr1 - mw) * w2, y2);
  ctx.closePath();
  ctx.fill();
}

/* ==================================================================
   THE CAR

   A real box in the world, not a sprite. Its corners are defined in car
   local space, rolled, yawed, moved out to where the car is, and then
   projected one at a time through the same projection the road uses. The
   front corners are further from the camera than the rear ones, so they
   come back smaller and the two ends move differently on screen without
   anything animating them. That is the entire illusion.

   Faces are filled flat, one tone each, and culled by their own normal
   rather than by any winding convention. The box is convex, so culling
   alone gives the right answer and nothing needs sorting.
   ================================================================== */

// Car local space: x right, y up from the road surface, z forward.
const carT = { worldX: 0, worldY: 0, worldZ: 0, cosY: 1, sinY: 0, cosR: 1, sinR: 0, cosP: 1, sinP: 0 };

const boxPts = [];
for (let i = 0; i < 8; i++) boxPts.push({ wx: 0, wy: 0, wz: 0, sx: 0, sy: 0 });

const BOX_FACES = [
  { idx: [0, 1, 2, 3], nx: 0, ny: 0, nz: -1 },   // rear, the one facing the camera
  { idx: [5, 4, 7, 6], nx: 0, ny: 0, nz: 1 },    // front
  { idx: [4, 0, 3, 7], nx: -1, ny: 0, nz: 0 },   // left
  { idx: [1, 5, 6, 2], nx: 1, ny: 0, nz: 0 },    // right
  { idx: [3, 2, 6, 7], nx: 0, ny: 1, nz: 0 },    // top
  { idx: [4, 5, 1, 0], nx: 0, ny: -1, nz: 0 }    // bottom
];

/* Local to world. roll is applied about the forward axis first, so the
   body leans while the wheels stay flat on the road, then yaw, then the
   car's position. */
function carToWorld(out, lx, ly, lz, rolled) {
  let rx = lx, ry = ly;
  if (rolled) {
    const py = ly - FEEL.CAR_ROLL_PIVOT;
    rx = lx * carT.cosR - py * carT.sinR;
    ry = py * carT.cosR + lx * carT.sinR + FEEL.CAR_ROLL_PIVOT;
  }
  // Pitch about the car's own lateral axis. Flat while driving, and the
  // tumble once it has gone over the edge.
  const pz = lz * carT.cosP - ry * carT.sinP;
  const py2 = ry * carT.cosP + lz * carT.sinP;
  out.wx = carT.worldX + rx * carT.cosY + pz * carT.sinY;
  out.wy = carT.worldY + py2;
  out.wz = carT.worldZ + pz * carT.cosY - rx * carT.sinY;
  return out;
}

const dirOut = { wx: 0, wy: 0, wz: 0 };
function carDirToWorld(lx, ly, lz, rolled) {
  let rx = lx, ry = ly;
  if (rolled) {
    rx = lx * carT.cosR - ly * carT.sinR;
    ry = ly * carT.cosR + lx * carT.sinR;
  }
  const pz = lz * carT.cosP - ry * carT.sinP;
  const py2 = ry * carT.cosP + lz * carT.sinP;
  dirOut.wx = rx * carT.cosY + pz * carT.sinY;
  dirOut.wy = py2;
  dirOut.wz = pz * carT.cosY - rx * carT.sinY;
  return dirOut;
}

/* Build, transform, project and fill one box. Offsets are in car local
   space; yaw is an extra rotation about the box's own centre, which is
   what turns the front wheels against the body. */
function drawBox(ox, oy, oz, hw, hh, hl, extraYaw, rolled, faceColours, stroked, camX, w, h) {
  const cy = Math.cos(extraYaw), sy = Math.sin(extraYaw);
  for (let i = 0; i < 8; i++) {
    const sx = (i === 0 || i === 3 || i === 4 || i === 7) ? -hw : hw;
    const sh = (i === 2 || i === 3 || i === 6 || i === 7) ? hh : -hh;
    const sl = (i >= 4) ? hl : -hl;
    // Spin the box about its own vertical axis before it is placed.
    const lx = ox + sx * cy + sl * sy;
    const lz = oz + sl * cy - sx * sy;
    carToWorld(boxPts[i], lx, oy + sh, lz, rolled);
    projectPoint(boxPts[i], boxPts[i].wx, boxPts[i].wy, boxPts[i].wz, camX, w, h);
  }

  for (let f = 0; f < 6; f++) {
    const face = BOX_FACES[f];
    const colour = faceColours[f];
    if (!colour) continue;
    // The face normal, spun with the box and then transformed like any
    // other direction. No winding convention to get wrong.
    const nlx = face.nx * cy + face.nz * sy;
    const nlz = face.nz * cy - face.nx * sy;
    const n = carDirToWorld(nlx, face.ny, nlz, rolled);
    const a = boxPts[face.idx[0]], b = boxPts[face.idx[1]];
    const c = boxPts[face.idx[2]], d = boxPts[face.idx[3]];
    // Centre of the face, against the camera at (camX, CAMERA_HEIGHT, 0).
    const vx = (a.wx + b.wx + c.wx + d.wx) * 0.25 - camX;
    const vy = (a.wy + b.wy + c.wy + d.wy) * 0.25 - camHeight;
    const vz = (a.wz + b.wz + c.wz + d.wz) * 0.25;
    if (n.wx * vx + n.wy * vy + n.wz * vz >= 0) continue;   // facing away
    if (f === 0) drawBox.drewRear = true;
    ctx.fillStyle = colour;
    polygon(a.sx, a.sy, b.sx, b.sy, c.sx, c.sy, d.sx, d.sy);
    // The fold lines. At fifty pixels across, flat tones alone do not
    // separate the roof from the boot from the side, and the car reads as
    // one yellow blob. The edges are what make it read as folded paper.
    if (stroked) ctx.stroke();
  }
}
drawBox.drewRear = false;

/* A sub rectangle of a face that has already been projected, by bilinear
   interpolation of its four screen corners. Cheaper and exactly right for
   putting lights on the flat back panel. */
function faceInset(quad, u0, u1, v0, v1) {
  const p = faceInset.buf;
  const bl = quad[0], br = quad[1], tr = quad[2], tl = quad[3];
  for (let i = 0; i < 4; i++) {
    const u = (i === 0 || i === 3) ? u0 : u1;
    const v = (i < 2) ? v0 : v1;
    const bx = bl.sx + (br.sx - bl.sx) * u, by = bl.sy + (br.sy - bl.sy) * u;
    const tx = tl.sx + (tr.sx - tl.sx) * u, tyy = tl.sy + (tr.sy - tl.sy) * u;
    p[i].x = bx + (tx - bx) * v;
    p[i].y = by + (tyy - by) * v;
  }
  return p;
}
faceInset.buf = [{ x: 0, y: 0 }, { x: 0, y: 0 }, { x: 0, y: 0 }, { x: 0, y: 0 }];

const rearFaceQuad = [{ sx: 0, sy: 0 }, { sx: 0, sy: 0 }, { sx: 0, sy: 0 }, { sx: 0, sy: 0 }];
const CAR_LIGHT_GLOW_FILL = 'rgb(' + COLOUR.CAR_LIGHT_GLOW + ')';

/* Copy the rear face of whichever box was drawn last, so an inset can be
   painted on it without projecting anything again. */
function captureRearFace() {
  for (let i = 0; i < 4; i++) {
    rearFaceQuad[i].sx = boxPts[BOX_FACES[0].idx[i]].sx;
    rearFaceQuad[i].sy = boxPts[BOX_FACES[0].idx[i]].sy;
  }
}

/* A lit strip on that captured face, given a centre and half sizes in
   face coordinates, where u runs across it and v up it. */
function lightStrip(u, du, v, dv) {
  const q = faceInset(rearFaceQuad, u - du, u + du, v - dv, v + dv);
  polygon(q[0].x, q[0].y, q[1].x, q[1].y, q[2].x, q[2].y, q[3].x, q[3].y);
}

/* Screen positions the smoke spawns from, filled in here and read on the
   next frame. One frame of lag on a puff's starting point is invisible. */
const carParts = { rlx: 0, rly: 0, rrx: 0, rry: 0, scale: 20 };
const poolPt = { wx: 0, wy: 0, wz: 0, sx: 0, sy: 0 };

/* The car's own glow, running the same way the trail does, from amber
   when it is gripping to a hot white when it is fully sideways. It stays
   warm at both ends, because one warm object in a cool world is how the
   eye finds it instantly, and that discipline is not up for negotiation.
   Slip drives the trail and the car from one variable. */
const CAR_GLOW_RAMP = [];
const CAR_SEAM_RAMP = [];
(function () {
  const stops = [[255, 176, 46], [255, 214, 110], [255, 246, 214], [255, 255, 255]];
  for (let i = 0; i < 16; i++) {
    const t = i / 15 * (stops.length - 1);
    const a = stops[Math.floor(t)], b = stops[Math.min(stops.length - 1, Math.floor(t) + 1)];
    const f = t - Math.floor(t);
    const r = Math.round(a[0] + (b[0] - a[0]) * f);
    const g = Math.round(a[1] + (b[1] - a[1]) * f);
    const bl = Math.round(a[2] + (b[2] - a[2]) * f);
    CAR_GLOW_RAMP.push('rgb(' + r + ',' + g + ',' + bl + ')');
    CAR_SEAM_RAMP.push('rgba(' + r + ',' + g + ',' + bl + ',0.55)');
  }
})();
function carGlowIndex() {
  let i = Math.round(drift.slipNorm * (CAR_GLOW_RAMP.length - 1));
  if (i < 0) i = 0; else if (i >= CAR_GLOW_RAMP.length) i = CAR_GLOW_RAMP.length - 1;
  return i;
}

const BODY_COLOURS = [COLOUR.CAR_END, COLOUR.CAR_END, COLOUR.CAR_SIDE, COLOUR.CAR_SIDE, COLOUR.CAR_TOP, null];
/* Only the back of the cabin is glass. The sides are pillars and painted
   metal, and colouring them dark made the roof read as a hole. */
const CABIN_COLOURS = [COLOUR.CAR_GLASS, COLOUR.CAR_GLASS, COLOUR.CAR_SIDE, COLOUR.CAR_SIDE, COLOUR.CAR_CABIN_TOP, null];
const WHEEL_COLOURS = [COLOUR.CAR_TYRE, COLOUR.CAR_TYRE, COLOUR.CAR_TYRE, COLOUR.CAR_TYRE, COLOUR.CAR_TYRE_TOP, null];
const SHADOW_COLOURS = [null, null, null, null, COLOUR.CAR_SHADOW, null];

/* The light pool, as a falloff rather than as flat steps. Nested flat
   quads read as nested rectangles, which is worse than no pool at all.
   One radial gradient per ramp step, built once and then filled through a
   scaled transform, so it costs a single fill and no allocation. */
const CAR_POOL_GRADS = [];
(function () {
  const stops = [[255, 176, 46], [255, 214, 110], [255, 246, 214], [255, 255, 255]];
  for (let i = 0; i < 16; i++) {
    const t = i / 15 * (stops.length - 1);
    const a = stops[Math.floor(t)], b = stops[Math.min(stops.length - 1, Math.floor(t) + 1)];
    const f = t - Math.floor(t);
    const r = Math.round(a[0] + (b[0] - a[0]) * f);
    const g = Math.round(a[1] + (b[1] - a[1]) * f);
    const bl = Math.round(a[2] + (b[2] - a[2]) * f);
    const grad = ctx.createRadialGradient(0, 0, 0, 0, 0, 1);
    grad.addColorStop(0, 'rgba(' + r + ',' + g + ',' + bl + ',1)');
    grad.addColorStop(0.45, 'rgba(' + r + ',' + g + ',' + bl + ',0.45)');
    grad.addColorStop(1, 'rgba(' + r + ',' + g + ',' + bl + ',0)');
    CAR_POOL_GRADS.push(grad);
  }
})();

function drawCar(w, h) {
  /* Projected against the camera, positioned at the car. Those were the
     same thing until the camera started leaning into corners, and keeping
     them apart is what slides the car off centre while it does. */
  const camX = cameraX;
  const yaw = carYaw();
  const roll = clamp(drift.lateralAccel / FEEL.CAR_ROLL_REFERENCE, -1, 1)
             * FEEL.CAR_ROLL_DEG * Math.PI / 180;

  carT.worldX = carX + carCurveX;      // the car rides the road, curve and all
  carT.worldY = carY;
  carT.worldZ = FEEL.CAMERA_DISTANCE;
  carT.cosY = Math.cos(yaw);
  carT.sinY = Math.sin(yaw);
  carT.cosR = Math.cos(roll);
  carT.sinR = Math.sin(roll);
  carT.cosP = Math.cos(carPitch);
  carT.sinP = Math.sin(carPitch);

  const halfW = FEEL.CAR_BODY_WIDTH / 2;
  const halfL = FEEL.CAR_BODY_LENGTH / 2;
  const wheelR = FEEL.CAR_WHEEL_DIAMETER / 2;
  const trackHalf = FEEL.CAR_TRACK / 2;
  const baseHalf = FEEL.CAR_WHEELBASE / 2;
  const steer = steering.value * FEEL.CAR_FRONT_STEER_DEG * Math.PI / 180;

  // The shadow is the yawed footprint of the box rather than a fixed
  // ellipse. With a solid body a shape that did not turn read as a sticker
  // underneath a car; the lane dashes, the shoulder and the tyre marks are
  // the fixed reference, and they are far more legible than an ellipse.
  const glowIdx = carGlowIndex();

  // A pool of the car's own light on the road, so it sits in the world
  // rather than on it, with the contact shadow still under it. Gone once
  // it has left the road, because there is nothing there to light.
  if (carY === 0) {
    carToWorld(poolPt, 0, 0, 0, false);
    projectPoint(poolPt, poolPt.wx, poolPt.wy, poolPt.wz, camX, w, h);
    const scale = CAMERA_DEPTH / FEEL.CAMERA_DISTANCE;
    const rx = scale * halfW * FEEL.CAR_POOL_SIZE * w / 2;
    ctx.save();
    ctx.translate(poolPt.sx, poolPt.sy);
    ctx.scale(rx, rx * FEEL.CAR_POOL_SQUASH);
    ctx.globalAlpha = FEEL.CAR_POOL_ALPHA;
    ctx.fillStyle = CAR_POOL_GRADS[glowIdx];
    ctx.beginPath();
    ctx.arc(0, 0, 1, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
    ctx.globalAlpha = 1;
    drawBox(0, 1, 0, halfW * 0.96, 1, halfL * 0.96, 0, false, SHADOW_COLOURS, false, camX, w, h);
  }

  // Panel seams, lit rather than drawn in shadow.
  ctx.strokeStyle = CAR_SEAM_RAMP[glowIdx];
  ctx.lineWidth = 1;
  ctx.lineJoin = 'round';

  // Far to near: front wheels, body, rear wheels.
  drawBox(-trackHalf, wheelR, baseHalf, FEEL.CAR_WHEEL_WIDTH / 2, wheelR, wheelR * 1.02, steer, false, WHEEL_COLOURS, false, camX, w, h);
  drawBox(trackHalf, wheelR, baseHalf, FEEL.CAR_WHEEL_WIDTH / 2, wheelR, wheelR * 1.02, steer, false, WHEEL_COLOURS, false, camX, w, h);

  const bodyMid = FEEL.CAR_RIDE_HEIGHT + FEEL.CAR_BODY_HEIGHT / 2;
  drawBox.drewRear = false;
  drawBox(0, bodyMid, 0, halfW, FEEL.CAR_BODY_HEIGHT / 2, halfL, 0, true, BODY_COLOURS, true, camX, w, h);
  // The rear face was just projected, so the lights are an inset of it.
  captureRearFace();
  if (drawBox.drewRear) {
    // The light strips, glowed the same way the road edges are: once wide
    // and faint, once normal. Two extra fills and no shadowBlur.
    const s = FEEL.CAR_LIGHT_GLOW_SPREAD;
    ctx.globalAlpha = FEEL.CAR_LIGHT_GLOW_ALPHA;
    ctx.fillStyle = CAR_LIGHT_GLOW_FILL;
    lightStrip(0.20, 0.12 * s, 0.46, 0.16 * s);
    lightStrip(0.80, 0.12 * s, 0.46, 0.16 * s);
    ctx.globalAlpha = 1;
    ctx.fillStyle = COLOUR.CAR_LIGHT;
    lightStrip(0.20, 0.12, 0.46, 0.16);
    lightStrip(0.80, 0.12, 0.46, 0.16);
  }

  const cabinMid = FEEL.CAR_RIDE_HEIGHT + FEEL.CAR_BODY_HEIGHT + FEEL.CAR_CABIN_HEIGHT / 2;
  drawBox(0, cabinMid, FEEL.CAR_CABIN_OFFSET, FEEL.CAR_CABIN_WIDTH / 2,
          FEEL.CAR_CABIN_HEIGHT / 2, FEEL.CAR_CABIN_LENGTH / 2, 0, true, CABIN_COLOURS, true, camX, w, h);

  drawBox.drewRear = false;
  drawBox(-trackHalf, wheelR, -baseHalf, FEEL.CAR_WHEEL_WIDTH / 2, wheelR, wheelR * 1.02, 0, false, WHEEL_COLOURS, false, camX, w, h);
  carParts.rlx = (boxPts[0].sx + boxPts[1].sx) * 0.5;
  carParts.rly = (boxPts[0].sy + boxPts[1].sy) * 0.5;
  if (drawBox.drewRear) { captureRearFace(); ctx.fillStyle = COLOUR.CAR_RIM; lightStrip(0.5, 0.30, 0.5, 0.09); }
  drawBox.drewRear = false;
  drawBox(trackHalf, wheelR, -baseHalf, FEEL.CAR_WHEEL_WIDTH / 2, wheelR, wheelR * 1.02, 0, false, WHEEL_COLOURS, false, camX, w, h);
  if (drawBox.drewRear) { captureRearFace(); ctx.fillStyle = COLOUR.CAR_RIM; lightStrip(0.5, 0.30, 0.5, 0.09); }
  carParts.rrx = (boxPts[0].sx + boxPts[1].sx) * 0.5;
  carParts.rry = (boxPts[0].sy + boxPts[1].sy) * 0.5;
  carParts.scale = Math.max(8, Math.abs(carParts.rrx - carParts.rlx));
}

function drawScrapeFlash(w, h) {
  if (!scraping) return;
  ctx.save();
  // The band brightens and turns as the scrape timer runs down, so the
  // player can feel the clock without a meter on the screen.
  ctx.globalAlpha = FEEL.SCRAPE_FLASH_ALPHA * (0.55 + 0.45 * scrapeRisk);
  if (scrapeSide < 0) {
    ctx.fillStyle = scrapeGradientLeft;
    ctx.fillRect(0, 0, scrapeBandWidth, h);
  } else {
    ctx.fillStyle = scrapeGradientRight;
    ctx.fillRect(w - scrapeBandWidth, 0, scrapeBandWidth, h);
  }
  if (scrapeRisk > 0.4) {
    ctx.globalAlpha = (scrapeRisk - 0.4) / 0.6 * FEEL.SCRAPE_FLASH_ALPHA;
    ctx.fillStyle = scrapeSide < 0 ? scrapeOutGradientLeft : scrapeOutGradientRight;
    if (scrapeSide < 0) ctx.fillRect(0, 0, scrapeBandWidth, h);
    else ctx.fillRect(w - scrapeBandWidth, 0, scrapeBandWidth, h);
  }
  ctx.restore();
}

function text(str, x, y, size, weight, align) {
  ctx.font = weight + ' ' + size + 'px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif';
  ctx.textAlign = align || 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = COLOUR.TEXT_SHADOW;
  ctx.fillText(str, x, y + Math.max(1, size * 0.06));
  ctx.fillStyle = COLOUR.TEXT;
  ctx.fillText(str, x, y);
}

/* The size that makes a string fill a share of the width and no more,
   so the game's own name cannot clip off the side of a narrow handset. */
function fittedSize(str, weight, want, maxWidth) {
  ctx.font = weight + ' ' + want + 'px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif';
  const width = ctx.measureText(str).width;
  return width <= maxWidth ? want : Math.floor(want * maxWidth / width);
}

/* The score and the multiplier, and no words anywhere near them. The
   number climbing while the trail runs hot is the whole explanation: one
   corner taken deep and near the edge should make the rule obvious, and
   if it does not then this display is what is wrong. */
function drawScore(w, h) {
  if (state !== DRIVING) return;
  const s = Math.min(w, h);
  /* The banked total is the number, and what is pending sits beside it in
     smaller type. Crossing a gate visibly rolls one into the other, which
     is the whole explanation of banking and needs no words. */
  const flash = gateFlash > 0 ? gateFlash / FEEL.CHECKPOINT_FLASH : 0;
  const bankSize = Math.round(s * FEEL.SCORE_SIZE * (1 + 0.35 * flash));
  text(String(banked), w / 2, h * FEEL.SCORE_TOP, bankSize, '800');
  const pend = Math.floor(score);
  if (pend > 0) {
    ctx.font = '700 ' + Math.round(s * FEEL.SCORE_SIZE * 0.52)
             + 'px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = COLOUR.TEXT_SHADOW;
    ctx.fillText('+' + pend, w / 2 + bankSize * 0.9, h * FEEL.SCORE_TOP + 2);
    ctx.fillStyle = COLOUR.GATE;
    ctx.fillText('+' + pend, w / 2 + bankSize * 0.9, h * FEEL.SCORE_TOP);
  }
  drawClock(w, h);

  // Nothing to say until it is above 1, and then it says it loudly.
  if (multiplier <= 1.005) return;
  const t = clamp((multiplier - 1) / (FEEL.MULT_MAX - 1), 0, 1);
  const pop = multPop > 0 ? multPop / FEEL.MULT_POP_TIME : 0;
  const size = Math.round(s * FEEL.MULT_SIZE * (1 + FEEL.MULT_GROWTH * t + 0.18 * pop));
  // The same ramp the tyre marks run through, so the line on the road and
  // the number on the screen are visibly one signal rather than two.
  ctx.font = '800 ' + size + 'px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  const label = '\u00d7' + multiplier.toFixed(1);
  const y = h * FEEL.MULT_TOP + size * 0.3;
  ctx.fillStyle = COLOUR.TEXT_SHADOW;
  ctx.fillText(label, w / 2, y + Math.max(1, size * 0.06));
  ctx.fillStyle = trailColour(t);
  ctx.fillText(label, w / 2, y);
}

/* The clock. Same discipline as the scrape bar: it must be readable at a
   glance and must never pull the eye off the road, so it is a short bar
   with the seconds on it, and it only raises its voice when it is
   genuinely running out. Silent during the on ramp, because it is not
   running then. */
/* The clock, and next to it the only question that makes a clock mean
   anything: can I reach the next gate on what I have.

   A bare countdown is abstract. A countdown beside the time to the gate
   is a comparison the player can answer at a glance, and the colour makes
   the answer for them: cool while the clock is bigger than the distance,
   warm the moment it is not.

   Same discipline as the scrape bar. It sits high and small, it never
   competes with the road, and it only raises its voice when the answer
   is actually no. */
function drawClock(w, h) {
  if (runTime < FEEL.ONRAMP_SECONDS) return;
  const s = Math.min(w, h);
  const size = Math.round(s * FEEL.CLOCK_SIZE);
  const gateSecs = Math.max(0, (nextGate - carSegIndex))
                 * FEEL.SEGMENT_LENGTH / FEEL.SPEED;
  /* Two signals, each saying one thing. The number goes warm only when
     the clock is genuinely short. Whether the next gate is reachable is
     the gate readout's job, below, because for the first half of every
     cycle the honest answer is "not on what you are holding, but you will
     earn more on the way", and a warning colour that is on for half the
     game is not a warning. */
  const low = clock < FEEL.CLOCK_LOW;
  const reachable = clock >= gateSecs;
  const y = h * FEEL.CLOCK_TOP;

  ctx.textBaseline = 'middle';
  ctx.textAlign = 'center';
  const label = clock.toFixed(1);
  ctx.font = '800 ' + size + 'px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif';
  const half = ctx.measureText(label).width / 2;
  ctx.fillStyle = COLOUR.TEXT_SHADOW;
  ctx.fillText(label, w / 2, y + Math.max(1, size * 0.06));
  ctx.globalAlpha = low ? 0.6 + 0.4 * Math.abs(Math.sin(runTime * 6)) : 1;
  ctx.fillStyle = low ? COLOUR.BAR_LOW : COLOUR.GATE;
  ctx.fillText(label, w / 2, y);
  ctx.globalAlpha = 1;

  // The gate, to the right of it. An arrow and the seconds to reach it.
  const gsize = Math.round(s * FEEL.CLOCK_GATE_SIZE);
  ctx.font = '700 ' + gsize + 'px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif';
  ctx.textAlign = 'left';
  const gl = '\u25b8 ' + gateSecs.toFixed(1);
  ctx.fillStyle = COLOUR.TEXT_SHADOW;
  ctx.fillText(gl, w / 2 + half + gsize * 0.5, y + 1 + gsize * 0.06);
  // Cool once the gate is inside what is in hand, which is the moment
  // the answer to "can I make it" turns from no to yes.
  ctx.fillStyle = reachable ? COLOUR.GATE : COLOUR.TEXT;
  ctx.globalAlpha = reachable ? 0.95 : 0.7;
  ctx.fillText(gl, w / 2 + half + gsize * 0.5, y + 1);
  ctx.globalAlpha = 1;

  /* The earning, live, to the left. If scarcity is not allowed to be the
     pressure then flow has to be, and flow has to be visible: this is the
     clock answering the driving, second by second. */
  const pay = FEEL.CLOCK_DRIFT_RATE * slipPay() - 1;
  if (pay > 0.02) {
    const psize = Math.round(s * FEEL.CLOCK_PAY_SIZE);
    ctx.font = '800 ' + psize + 'px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif';
    ctx.textAlign = 'right';
    const pl = '+' + pay.toFixed(1);
    ctx.fillStyle = COLOUR.TEXT_SHADOW;
    ctx.fillText(pl, w / 2 - half - psize * 0.5, y + 1 + psize * 0.06);
    ctx.fillStyle = COLOUR.GATE;
    ctx.fillText(pl, w / 2 - half - psize * 0.5, y + 1);
  } else if (pay < -0.02 && slipPay() > 0.01) {
    // Still paying something back, just not all of it. Worth showing,
    // because it is the difference between drifting and not.
    const psize = Math.round(s * FEEL.CLOCK_PAY_SIZE);
    ctx.font = '800 ' + psize + 'px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif';
    ctx.textAlign = 'right';
    const pl = '+' + (FEEL.CLOCK_DRIFT_RATE * slipPay()).toFixed(1);
    ctx.globalAlpha = 0.75;
    ctx.fillStyle = COLOUR.GATE;
    ctx.fillText(pl, w / 2 - half - psize * 0.5, y + 1);
    ctx.globalAlpha = 1;
  }

  /* The payout, big and loud and rising, and deliberately nothing like
     the score bonus beside it: one is time and green, the other is points
     and rolls into a total. Two rewards that look alike teach nothing. */
  if (clockPop > 0) {
    const t = clockPop / FEEL.CLOCK_POP_TIME;
    const psize = Math.round(s * FEEL.CLOCK_SIZE * (1.5 + 0.7 * (1 - t)));
    ctx.font = '800 ' + psize + 'px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif';
    ctx.textAlign = 'center';
    ctx.globalAlpha = Math.min(1, t * 2.2);
    const pl = '+' + FEEL.CLOCK_CHECKPOINT + 's';
    ctx.fillStyle = COLOUR.TEXT_SHADOW;
    ctx.fillText(pl, w / 2, y - size * 1.25 - (1 - t) * s * 0.09 + 2);
    ctx.fillStyle = COLOUR.GATE;
    ctx.fillText(pl, w / 2, y - size * 1.25 - (1 - t) * s * 0.09);
    ctx.globalAlpha = 1;
  }
}

function drawOverlay(w, h) {
  if (state === TITLE) {
    const s = Math.min(w, h);
    const title = 'DRIFT FEVER';
    text(title, w / 2, h * 0.34,
         fittedSize(title, '800', Math.round(s * 0.13), w * 0.88), '800');
    text('hold left or right to steer', w / 2, h * 0.45, Math.round(s * 0.045), '600');
    text('tap or press any key to start', w / 2, h * 0.52, Math.round(s * 0.045), '600');
  } else if (state === DEAD) {
    const s = Math.min(w, h);
    text('OFF THE ROAD', w / 2, h * 0.38, Math.round(s * 0.095), '800');
    // The two numbers, and a crown on the score when it is the new best.
    const final = banked;
    const beat = final >= bestScore && final > 0;
    text((beat ? '\u2605 ' : '') + final, w / 2, h * 0.48, Math.round(s * 0.11), '800');
    text('best ' + bestScore, w / 2, h * 0.55, Math.round(s * 0.042), '600');
    if (deadFor >= FEEL.DEATH_INPUT_LOCK) {
      text('tap or press any key', w / 2, h * 0.63, Math.round(s * 0.045), '600');
    }
  }
}

/* The scrape budget, drawn low and central. It shows what is left rather
   than what is spent, so a full bar means safe, and it fades out entirely
   when there is nothing to say. */
/* The run's score and the live multiplier. Read by the display and by
   nothing else, and reset by startRun with everything else. */
let score = 0;
let multiplier = 1;
let multPop = 0;          // seconds left on the kick when it passes a whole number
/* Banked is what a crash lets you keep. score is what is pending on top
   of it, which a crash does not. */
let banked = 0;
let clock = 0;
let nextGate = 0;         // segment index of the gate not yet crossed
let gateFlash = 0;        // seconds left on the crossing response
let clockPop = 0;         // seconds left on the big time payout
let bestScore = (function () {
  const raw = storeGet('best');
  const n = raw === null ? 0 : parseInt(raw, 10);
  return isFinite(n) && n > 0 ? n : 0;
})();

/* Section 4.4. Two terms, multiplied, both zero at their easy end.

   slipTerm  is how far past MULT_MIN_SLIP the car is sideways, bent by
             MULT_SLIP_POWER so a shallow slide is worth far less than
             half of a deep one.
   edgeTerm  is how close to the edge it is, zero in the middle of the
             road and full inside the scrape band.

   Multiplied, so neither alone pays. Sideways in the middle earns
   nothing. Parked on the edge pointing straight earns nothing. */
function multiplierEarn() {
  const slipTerm = Math.pow(
    clamp((drift.slipNorm - FEEL.MULT_MIN_SLIP) / (1 - FEEL.MULT_MIN_SLIP), 0, 1),
    FEEL.MULT_SLIP_POWER);
  if (slipTerm <= 0) return 0;
  const edgeTerm = clamp(
    (Math.abs(carFrac) - FEEL.MULT_EDGE_START)
    / Math.max(0.01, FEEL.MULT_EDGE_PEAK - FEEL.MULT_EDGE_START), 0, 1);
  return slipTerm * edgeTerm;
}

/* Just the slip half of the multiplier's two terms. The clock is paid by
   DRIFTING, wherever on the road you are doing it, where the multiplier
   also wants you near the edge. Courting the edge is what the score is
   for; keeping the car sideways is what the clock is for. */
function slipPay() {
  return Math.pow(
    clamp((drift.slipNorm - FEEL.CLOCK_MIN_SLIP) / (1 - FEEL.CLOCK_MIN_SLIP), 0, 1),
    FEEL.MULT_SLIP_POWER);
}

function updateClock(dt) {
  if (state !== DRIVING) return;
  if (gateFlash > 0) gateFlash -= dt;
  if (clockPop > 0) clockPop -= dt;
  // Nothing to survive during the on ramp. A new player has enough to
  // think about without a number counting down at them.
  if (runTime < FEEL.ONRAMP_SECONDS) { clock = FEEL.CLOCK_START; return; }
  clock += (FEEL.CLOCK_DRIFT_RATE * slipPay() - 1) * dt;
  if (clock > FEEL.CLOCK_MAX) clock = FEEL.CLOCK_MAX;
  if (clock <= 0) { clock = 0; crash(); }
}

/* Crossing a gate. Everything a gate does happens here, once, on the
   frame the car passes it. */
function crossGate() {
  banked += Math.floor(score);
  score = 0;
  clock = Math.min(FEEL.CLOCK_MAX, clock + FEEL.CLOCK_CHECKPOINT);
  gateFlash = FEEL.CHECKPOINT_FLASH;
  clockPop = FEEL.CLOCK_POP_TIME;
  nextGate += FEEL.CHECKPOINT_EVERY;
  applyBiome(biome + 1);
}

function updateScore(dt) {
  if (multPop > 0) multPop -= dt;
  if (state !== DRIVING) return;
  if (carSegIndex >= nextGate) crossGate();
  const earn = multiplierEarn();
  const was = Math.floor(multiplier);
  if (earn > 0) multiplier += FEEL.MULT_CLIMB_RATE * earn * dt;
  else multiplier -= FEEL.MULT_DECAY_RATE * dt;
  multiplier = clamp(multiplier, 1, FEEL.MULT_MAX);
  // A kick on every whole number crossed upward, which is the only thing
  // that has to be noticed for the rule to be worked out.
  if (Math.floor(multiplier) > was) multPop = FEEL.MULT_POP_TIME;
  score += (FEEL.SCORE_SURVIVE_RATE
            + FEEL.SCORE_RISK_RATE * (multiplier - 1)) * dt;
}

function bankScore() {
  // Only what was banked survives. The pending run is what a gate is for.
  const final = banked;
  if (final > bestScore) {
    bestScore = final;
    storeSet('best', String(bestScore));
  }
}

let barShow = 0;
function updateBar(dt) {
  const wanted = state === DRIVING && scrapeRisk > 0.01 ? 1 : 0;
  if (wanted) barShow = 1;
  else barShow = Math.max(0, barShow - dt / FEEL.BAR_FADE_TIME);
}

function drawBar(w, h) {
  if (barShow <= 0) return;
  const left = 1 - scrapeRisk;
  const bw2 = w * FEEL.BAR_WIDTH;
  const bh2 = FEEL.BAR_HEIGHT;
  const x = (w - bw2) / 2;
  const y = h - safeBottom - FEEL.BAR_BOTTOM - bh2;

  ctx.globalAlpha = barShow * FEEL.BAR_ALPHA;
  ctx.fillStyle = COLOUR.BAR_TRACK;
  ctx.fillRect(x, y, bw2, bh2);
  // Cool while there is room, warm as it runs out, which is the same thing
  // the edge flash is saying at the same moment.
  ctx.fillStyle = left < 0.35 ? COLOUR.BAR_LOW : COLOUR.BAR_FILL;
  ctx.fillRect(x, y, bw2 * left, bh2);
  ctx.globalAlpha = 1;
}

/* The debug readout. Everything needed to report a camera back sits on
   one line, so a screenshot is a complete answer. */
function drawHud(w, h) {
  if (!showDebug) return;
  const pad = 10;
  const lines = [
    fpsShown.toFixed(0) + ' fps   worst ' + fpsWorstShown.toFixed(1) + ' ms'
      + (tunerDirty() ? '   TUNED' : ''),
    tunerLine(0),
    tunerLine(1),
    tunerLine(2),
    tunerLine(3),
    tunerLine(4),
    tunerLine(5),
    tunerLine(6),
    tunerLine(7),
    tunerLine(8),
    tunerLine(9),
    tunerLine(10),
    tunerLine(11),
    tunerLine(12),
    'slip ' + drift.slipDeg.toFixed(0) + '°  edge ' + (scrapeRisk * 100).toFixed(0)
      + '%  ' + (seedPinned ? 'seed ' + lastSeed : 'seed free'),
    't ' + runTime.toFixed(0) + 's  live curve ' + curveScale.toFixed(2)
      + '  width ' + widthScale.toFixed(2) + '  int ' + maxIntensity()
      + '  ease ' + ease.toFixed(2)
  ];
  /* Sized to fit rather than fixed, because the readout gains a value
     most sessions and a line that runs off the side of a phone is a line
     that cannot be read at the moment it is needed. */
  const pad2 = pad * 2 + 10;
  let size = 13;
  ctx.font = '600 ' + size + 'px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif';
  let widest = 0;
  for (let i = 0; i < lines.length; i++) {
    const tw = ctx.measureText(lines[i]).width;
    if (tw > widest) widest = tw;
  }
  if (widest > w - pad2) {
    size = Math.max(8, Math.floor(size * (w - pad2) / widest));
    ctx.font = '600 ' + size + 'px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif';
    widest = 0;
    for (let i = 0; i < lines.length; i++) {
      const tw = ctx.measureText(lines[i]).width;
      if (tw > widest) widest = tw;
    }
  }
  const lineH = Math.round(size * 1.38);
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  const top = hudTop;
  ctx.fillStyle = 'rgba(26,10,4,0.66)';
  ctx.fillRect(pad - 5, top - 4, widest + 10, lines.length * lineH + 8);
  ctx.fillStyle = '#ffffff';
  for (let i = 0; i < lines.length; i++) {
    ctx.fillText(lines[i], pad, top + i * lineH);
  }
}

function render() {
  const w = view.w, h = view.h;
  ctx.setTransform(view.dpr, 0, 0, view.dpr, 0, 0);

  ctx.save();
  ctx.translate(shakeX, shakeY);

  /* Everything shakes together. There is no ground any more, so the void
     is the whole background and the road is an object floating in it. */
  ctx.fillStyle = COLOUR.VOID;
  ctx.fillRect(-40, -40, w + 80, h + 80);

  const glow = h * FEEL.HORIZON_GLOW_FRACTION;
  ctx.fillStyle = horizonGradient;
  ctx.fillRect(-40, horizonY - glow, w + 80, glow * 2);

  drawSkyline(w, h);
  drawGrid(w, h);
  drawRoad(w, h);
  ctx.fillStyle = hazeGradient;
  ctx.fillRect(-40, horizonY - 1, w + 80, h * FEEL.HORIZON_FADE_FRACTION + 2);
  drawSmoke();
  drawCar(w, h);
  ctx.restore();

  drawScrapeFlash(w, h);
  drawBar(w, h);
  drawScore(w, h);
  drawOverlay(w, h);
  drawPauseCover(w, h);
  drawHud(w, h);
}

/* The cover. Opaque, over everything except the debug readout, because
   leaving the road visible turns the pause into a free look at the corner
   ahead. */
function drawPauseCover(w, h) {
  if (!paused) return;
  ctx.fillStyle = COLOUR.PAUSE_COVER;
  ctx.fillRect(0, 0, w, h);
  const s = Math.min(w, h);
  text('PAUSED', w / 2, h * 0.44, Math.round(s * 0.11), '800');
  text('tap to resume', w / 2, h * 0.53, Math.round(s * 0.045), '600');
}


/* ==================================================================
   AUDIO

   Synthesised in full: three oscillators, one generated noise buffer,
   and a fixed graph of filters and gains. No fetch, no decodeAudioData,
   no sample data anywhere in this file. Section 6 again: one blocked
   request is a broken game for this audience.

   The graph is built once, on the gesture that picks a station, and then
   never grows. Nothing is created or destroyed per note, per skid or per
   crash: notes are a frequency step and an envelope on a voice that is
   already running, and the skid is a single looping noise source whose
   filter is steered. That is what keeps the per frame cost flat, and it
   is also what makes the skid sound like a tyre rather than like a sound
   effect being retriggered.

   ON by default, which overrules sections 5 and 6. That was a deliberate
   call and not an oversight, and it comes with the mitigations that make
   it survivable for a classroom:

     nothing is built or heard until the first gesture, which is what the
     browser enforces anyway, so the graph is created inside that gesture
     and starts unlocked rather than fighting the policy;

     the first start fades from silence over AUDIO_FIRST_FADE rather than
     arriving at level;

     the mute pad is on screen and one tap away from the very first frame,
     not behind a start screen or a menu;

     and the choice is stored, so anyone who mutes once is never surprised
     again on any later visit.

   The dial still exists, but it now picks between tracks rather than
   between silence and sound.
   ================================================================== */

/* Three states, cycled by one button, in this order. The dial that used
   to sit on the splash screen is gone: it was a menu on the way into a
   game whose whole pitch is that there is nothing between you and the
   road, and one button says the same thing in less space.

   TYRES rather than NEON is the default, and that is the classroom
   argument from section 6 taken seriously. The skid is quiet, textural
   and is most of what makes the drift read; music is unmistakably a game
   from across a room and is what gets somebody caught. Anyone who wants
   music is one tap away and their choice is remembered. */
const TRACKS = [
  { id: 'neon',
    // A natural minor run, and a saw.
    wave: 'sawtooth', root: 55, tempo: 1,
    arp: [0, 3, 7, 10, 12, 10, 7, 3], bass: [0, 0, 7, 0, 10, 0, 7, 5] }
];
let track = 0;            // only one for now, and the list is here so that
                          // adding a second is a data change and not a
                          // rewrite. Nothing selects between them yet.

/* Two switches rather than one cycle, because they are two decisions and
   they default differently.

   SOUND is the tyres, the scrape and the crash, and it is on. The skid is
   quiet, textural and is most of what makes the drift read at all.

   MUSIC is off, and that is section 6 taken seriously rather than a taste
   judgement: the skid could be a video playing in the next tab, but an
   arpeggio at 148bpm is unmistakably a game from across a classroom and
   it is what gets somebody caught. Anyone who wants it is one tap away
   and the choice is remembered.

   A stored value always wins over the default, in both directions. */
let sfxOn = storeGet('sfx') !== '0';
let musicOn = storeGet('music') === '1';
function anySound() { return sfxOn || musicOn; }

let audio = null;         // the graph, once there is one, and never before one

/* Equal temperament from a root, so the note tables above are semitone
   offsets and a station is a scale plus a waveform rather than a tune. */
function semis(root, n) { return root * Math.pow(2, n / 12); }

function buildAudio() {
  const Ctx = window.AudioContext || window.webkitAudioContext;
  if (!Ctx) return null;
  let ac;
  try { ac = new Ctx(); } catch (e) { return null; }

  /* Two seconds of white noise, generated here. It is the source for the
     skid, the scrape and the crash, and two seconds is long enough that
     the loop point is not a rhythm. */
  const frames = Math.floor(ac.sampleRate * 2);
  const noise = ac.createBuffer(1, frames, ac.sampleRate);
  const data = noise.getChannelData(0);
  for (let i = 0; i < frames; i++) data[i] = Math.random() * 2 - 1;

  function node(type) { return ac['create' + type](); }
  function loopNoise() {
    const src = node('BufferSource');
    src.buffer = noise;
    src.loop = true;
    return src;
  }
  function filter(kind, freq, q) {
    const f = node('BiquadFilter');
    f.type = kind;
    f.frequency.value = freq;
    if (q !== undefined) f.Q.value = q;
    return f;
  }
  function gain(v) { const g = node('Gain'); g.gain.value = v; return g; }

  // Master. Everything lands on the pause filter first, so the pause can
  // close a lowpass over the lot rather than muting it.
  const pauseFilter = filter('lowpass', FEEL.AUDIO_OPEN_CUTOFF, 0.7);
  const master = gain(0);
  pauseFilter.connect(master);
  master.connect(ac.destination);
  const bus = gain(1);
  bus.connect(pauseFilter);

  // --- The skid. One voice, started once, never retriggered. ---
  const skidSrc = loopNoise();
  const skidBand = filter('bandpass', FEEL.SKID_FREQ_LOW, FEEL.SKID_Q_LOW);
  const skidTop = filter('lowpass', FEEL.SKID_TOP_CUTOFF, 0.6);
  const skidGain = gain(0);
  skidSrc.connect(skidBand); skidBand.connect(skidTop);
  skidTop.connect(skidGain); skidGain.connect(bus);
  /* A small, slow breath on the band, at audio rate, so a held slip angle
     still moves instead of settling into a static tone. It costs nothing
     per frame because nothing schedules it. */
  const wobble = node('Oscillator');
  wobble.frequency.value = FEEL.SKID_WOBBLE_HZ;
  const wobbleDepth = gain(FEEL.SKID_WOBBLE_FREQ);
  wobble.connect(wobbleDepth); wobbleDepth.connect(skidBand.frequency);

  // --- The scrape. Two high Q bands, off any harmonic of each other. ---
  const scrapeSrc = loopNoise();
  const scrapeA = filter('bandpass', FEEL.SCRAPE_FREQ, FEEL.SCRAPE_Q);
  const scrapeB = filter('bandpass', FEEL.SCRAPE_FREQ * FEEL.SCRAPE_FREQ_RATIO, FEEL.SCRAPE_Q);
  const scrapeGain = gain(0);
  scrapeSrc.connect(scrapeA); scrapeA.connect(scrapeB);
  scrapeB.connect(scrapeGain); scrapeGain.connect(bus);

  // --- The crash. Idle until something hits it. ---
  const crashSrc = loopNoise();
  const crashLow = filter('lowpass', FEEL.CRASH_FREQ_FROM, 1.4);
  const crashGain = gain(0);
  crashSrc.connect(crashLow); crashLow.connect(crashGain); crashGain.connect(bus);

  // --- Music. Four mono voices, each one persistent. ---
  const musicGain = gain(0);
  musicGain.connect(bus);

  const bassOsc = node('Oscillator');
  bassOsc.type = 'square';
  const bassLow = filter('lowpass', 260, 0.8);
  const bassGain = gain(0);
  bassOsc.connect(bassLow); bassLow.connect(bassGain); bassGain.connect(musicGain);

  const arpOsc = node('Oscillator');
  const arpLow = filter('lowpass', FEEL.MUSIC_ARP_CUTOFF_LOW, 3.5);
  const arpGain = gain(0);
  arpOsc.connect(arpLow); arpLow.connect(arpGain); arpGain.connect(musicGain);

  const octOsc = node('Oscillator');
  octOsc.type = 'triangle';
  const octGain = gain(0);
  const octLevel = gain(0);        // the layer's own level, driven by heat
  octOsc.connect(octGain); octGain.connect(octLevel); octLevel.connect(musicGain);

  const hatSrc = loopNoise();
  const hatHigh = filter('highpass', 7000, 0.9);
  const hatGain = gain(0);
  const hatLevel = gain(0);
  hatSrc.connect(hatHigh); hatHigh.connect(hatGain);
  hatGain.connect(hatLevel); hatLevel.connect(musicGain);

  const t0 = ac.currentTime;
  skidSrc.start(t0); scrapeSrc.start(t0); crashSrc.start(t0); hatSrc.start(t0);
  wobble.start(t0); bassOsc.start(t0);
  arpOsc.start(t0); octOsc.start(t0);

  return {
    ac: ac, master: master, pauseFilter: pauseFilter,
    skidBand: skidBand, skidGain: skidGain,
    scrapeA: scrapeA, scrapeGain: scrapeGain,
    crashLow: crashLow, crashGain: crashGain,
    musicGain: musicGain,
    bassOsc: bassOsc, bassGain: bassGain,
    arpOsc: arpOsc, arpLow: arpLow, arpGain: arpGain,
    octOsc: octOsc, octGain: octGain, octLevel: octLevel,
    hatGain: hatGain, hatLevel: hatLevel,
    step: 0, nextNote: 0, heat: 0, crashUntil: 0
  };
}

/* Every live level goes through this rather than through a bare
   assignment: an AudioParam set outright jumps at the render quantum
   boundary and that is audible as a zip on anything moving at 60Hz. */
function ramp(param, value, tau) {
  param.setTargetAtTime(value, audio.ac.currentTime, tau);
}

/* --------------------------------------------------------------
   The sound pad. One button, three states, and the icon is the label.
   -------------------------------------------------------------- */
/* Inline SVG rather than glyphs or words: a font may not have the glyph,
   and text at this size reads as a debug control. Nothing is fetched,
   these are paths in the file. */
const ICON = {

  noteOn:

    + ' stroke-linecap="round" stroke-linejoin="round">'
    + '<path d="M10 18V7.2l8-1.8V16"/>'
    + '<circle cx="7.6" cy="18" r="2.6" fill="currentColor"/>'
    + '<circle cx="15.6" cy="16" r="2.6" fill="currentColor"/></svg>',
  expand:
    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"'
    + ' stroke-linecap="round" stroke-linejoin="round">'
    + '<path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>',
  shrink:
    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"'
    + ' stroke-linecap="round" stroke-linejoin="round">'
    + '<path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg>',
  pause:
    '<svg viewBox="0 0 24 24" fill="currentColor">'
    + '<rect x="6.5" y="5" width="4" height="14" rx="1.2"/>'
    + '<rect x="13.5" y="5" width="4" height="14" rx="1.2"/></svg>',
  play:
    '<svg viewBox="0 0 24 24" fill="currentColor">'
    + '<path d="M7.5 5.2l11.2 6.4a0.45 0.45 0 010 0.8L7.5 18.8A0.45 0.45 0 016.8 18.4V5.6a0.45 0.45 0 01 0.7-0.4z"/></svg>',
  /* A handset leaning over, with the screen drawn in so it reads as a
     phone rather than as a shape, and a tick either side for the rocking.
     The ticks sit clear of the body at every rotation. */
  tilt:
    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"'
    + ' stroke-linecap="round" stroke-linejoin="round">'
    + '<g transform="rotate(-24 12 12)">'
    + '<rect x="8.4" y="3.4" width="7.2" height="17.2" rx="1.9"/>'
    + '<path d="M10.8 5.6h2.4" stroke-width="1.5"/>'
    + '<path d="M8.4 17.6h7.2" stroke-width="1.5"/>'
    + '</g>'
    + '<path d="M2.6 8.6l1.7 1.5M21.4 13.4l-1.7-1.5" stroke-width="1.7"/></svg>',
  // Two ways through one handset, which is what the reverse does.
  tiltEnd: 0
};

/* The icons are the whole readout. There is no third state to show now
   that the two switches are separate, so each is simply on or off. */
function paintSound() {
  soundBtn.innerHTML = sfxOn ? ICON.speakerOn : ICON.speakerOff;
  soundBtn.classList.toggle('on', sfxOn);
  musicBtn.innerHTML = musicOn ? ICON.noteOn : ICON.noteOff;
  musicBtn.classList.toggle('on', musicOn);
}

/* fade is the time to reach level, which is longer for the first start
   than for a switch. Building the graph is deferred until a gesture has
   happened: called before then this only moves the setting and paints it,
   and firstGesture picks it up. */
function applyAudio(fade) {
  paintSound();
  storeSet('sfx', sfxOn ? '1' : '0');
  storeSet('music', musicOn ? '1' : '0');
  if (!anySound()) {
    if (audio) {
      ramp(audio.master.gain, 0, FEEL.AUDIO_FADE_TIME);
      // Suspending frees the audio thread entirely rather than leaving a
      // silent graph running, which matters on the Chromebooks in
      // section 6 far more than it does here.
      setTimeout(function () {
        if (audio && !anySound()) { try { audio.ac.suspend(); } catch (e) {} }
      }, 400);
    }
    return;
  }
  if (!audio) {
    if (!gestureUsed) return;      // no gesture yet, so nothing may sound
    audio = buildAudio();
  }
  if (!audio) return;
  resumeAudio();
  audio.step = 0;
  audio.nextNote = audio.ac.currentTime + 0.06;
  const t = TRACKS[track];
  audio.arpOsc.type = t.wave;
  audio.octOsc.type = t.wave === 'square' ? 'square' : 'triangle';
  ramp(audio.master.gain, FEEL.AUDIO_MASTER, fade || FEEL.AUDIO_START_TIME);
}

/* Called once, from the first gesture. Until this runs there is no
   AudioContext at all, which is both what the browser wants and what the
   room wants. */
function startAudio() {
  if (audio || !anySound()) return;
  applyAudio(FEEL.AUDIO_FIRST_FADE);
}

/* The other two pads never change except through their own handlers, so
   they are painted once here, where ICON exists. */
pauseBtn.innerHTML = ICON.pause;
tiltBtn.innerHTML = ICON.tilt;


/* ----------------------------------------------------------------
   Fullscreen. Two paths, because neither one covers every handset.

   The API path works on Android Chrome, on desktop and on iPadOS. On an
   iPhone it simply is not there, which the feature test below picks up,
   and the meta tags in the head cover that case through Add to Home
   Screen instead. The button is hidden wherever the API is genuinely
   unavailable, exactly as the tilt button is, because shipping a control
   that does nothing is worse than shipping no control.

   The request has to be made synchronously inside the tap, same
   discipline as the tilt permission: anything asynchronous before it and
   the browser refuses without saying so. */
var fullReady = false;
const fullBtn = document.getElementById('fullBtn');
const fullRoot = document.documentElement;
function standalone() {
  if (window.navigator && window.navigator.standalone === true) return true;
  try { return window.matchMedia('(display-mode: standalone)').matches; }
  catch (e) { return false; }
}
const canFullscreen = !standalone()
  && !!(fullRoot.requestFullscreen || fullRoot.webkitRequestFullscreen)
  && document.fullscreenEnabled !== false;

function isFullscreen() {
  return !!(document.fullscreenElement || document.webkitFullscreenElement);
}
function paintFull() {
  fullBtn.innerHTML = isFullscreen() ? ICON.shrink : ICON.expand;
  fullBtn.classList.toggle('on', isFullscreen());
}
function toggleFullscreen() {
  if (isFullscreen()) {
    if (document.exitFullscreen) { document.exitFullscreen().catch(function () {}); }
    else if (document.webkitExitFullscreen) { document.webkitExitFullscreen(); }
    return;
  }
  if (fullRoot.requestFullscreen) {
    const r = fullRoot.requestFullscreen();
    if (r && r.catch) r.catch(function () {});
  } else if (fullRoot.webkitRequestFullscreen) {
    fullRoot.webkitRequestFullscreen();
  }
}
fullBtn.addEventListener('pointerdown', function (e) { e.stopPropagation(); });
fullBtn.addEventListener('click', function (e) {
  e.stopPropagation();
  fullBtn.blur();
  firstGesture();
  toggleFullscreen();          // synchronous, inside the gesture
});
/* Entering or leaving changes the viewport, and on a phone it also
   changes the safe area insets, because the insets the browser reports
   depend on whether its own chrome is there. resize reads both. */
function onFullscreenChange() {
  paintFull();
  resize();
  // The viewport settles a frame or two after the event on some browsers.
  window.requestAnimationFrame(resize);
  setTimeout(resize, 250);
}
document.addEventListener('fullscreenchange', onFullscreenChange);
document.addEventListener('webkitfullscreenchange', onFullscreenChange);

/* Five buttons do not fit across a narrow phone held upright without
   dropping them under the size a thumb reliably hits, and the reason this
   exists at all is landscape, where there is room to spare. So on a
   narrow portrait screen it stands down. Re evaluated on every resize,
   so rotating the handset brings it back. */
function syncFullButton() {
  /* 420 rather than 380: at 390 the fifth button left only sixteen
     pixels of canvas between the two groups, and that band has to stay
     tappable for steering. Landscape always has room. */
  const roomy = view.w >= 420 || view.w > view.h;
  fullBtn.hidden = !(canFullscreen && roomy);
}
paintFull();
fullReady = true;
syncFullButton();

const soundBtn = document.getElementById('soundBtn');
const musicBtn = document.getElementById('musicBtn');
function padSwitch(btn, set) {
  btn.addEventListener('pointerdown', function (e) { e.stopPropagation(); });
  btn.addEventListener('click', function (e) {
    e.stopPropagation();
    btn.blur();
    firstGesture();
    set();
    applyAudio();
  });
}
padSwitch(soundBtn, function () { sfxOn = !sfxOn; });
padSwitch(musicBtn, function () { musicOn = !musicOn; });
paintSound();

/* Resumed from every gesture path there is, not just from the dial. A
   context can be suspended again by the tab going away, by an incoming
   call, or by the browser deciding the page was idle, and a game whose
   sound never comes back reads as broken. */
function resumeAudio() {
  if (!audio) return;
  if (audio.ac.state === 'suspended') { try { audio.ac.resume(); } catch (e) {} }
}

function audioOn() { return audio !== null && sfxOn; }

/* One envelope on a voice that is already running. cancel then hold the
   current value first, or retriggering mid decay steps and clicks. */
function pluck(g, peak, decay, when) {
  const p = g.gain;
  p.cancelScheduledValues(when);
  p.setValueAtTime(p.value, when);
  p.linearRampToValueAtTime(peak, when + FEEL.MUSIC_ATTACK);
  p.exponentialRampToValueAtTime(0.0001, when + FEEL.MUSIC_ATTACK + decay);
}

/* The sequencer. Notes are scheduled a short way in front of the clock
   rather than on the frame they fall, so a long frame cannot make the
   music stumble. Nothing here allocates. */
function updateMusic() {
  const s = TRACKS[track];
  const a = audio;
  if (!musicOn) { ramp(a.musicGain.gain, 0, FEEL.AUDIO_FADE_TIME); return; }

  const duck = a.ac.currentTime < a.crashUntil ? FEEL.MUSIC_DUCK : 1;
  ramp(a.musicGain.gain, FEEL.MUSIC_GAIN * duck, FEEL.AUDIO_FADE_TIME);
  // The layers that arrive under pressure. Levels, not switches.
  ramp(a.octLevel.gain, FEEL.MUSIC_OCTAVE_GAIN * a.heat, FEEL.AUDIO_FADE_TIME);
  ramp(a.hatLevel.gain, FEEL.MUSIC_HAT_GAIN * (0.35 + 0.65 * a.heat), FEEL.AUDIO_FADE_TIME);
  ramp(a.arpLow.frequency,
       FEEL.MUSIC_ARP_CUTOFF_LOW
       + (FEEL.MUSIC_ARP_CUTOFF_HIGH - FEEL.MUSIC_ARP_CUTOFF_LOW) * a.heat,
       FEEL.AUDIO_FADE_TIME);

  const stepTime = 60 / (FEEL.MUSIC_BPM * s.tempo) / (FEEL.MUSIC_STEPS / 4);
  const until = a.ac.currentTime + FEEL.MUSIC_LOOKAHEAD;
  // A long stall must not leave the scheduler pouring out a backlog.
  if (a.nextNote < a.ac.currentTime) a.nextNote = a.ac.currentTime;
  while (a.nextNote < until) {
    const t = a.nextNote;
    const n = a.step;
    // Bass on every other sixteenth, which is the eighth note pulse.
    if ((n & 1) === 0) {
      const b = s.bass[(n >> 1) % s.bass.length];
      a.bassOsc.frequency.setValueAtTime(semis(s.root, b), t);
      pluck(a.bassGain, FEEL.MUSIC_BASS_GAIN, FEEL.MUSIC_BASS_DECAY, t);
    }
    // The arp runs the whole sixteenth grid. That is the drive.
    const note = s.arp[n % s.arp.length];
    a.arpOsc.frequency.setValueAtTime(semis(s.root * 4, note), t);
    pluck(a.arpGain, FEEL.MUSIC_ARP_GAIN, FEEL.MUSIC_NOTE_DECAY, t);
    a.octOsc.frequency.setValueAtTime(semis(s.root * 8, note), t);
    pluck(a.octGain, 1, FEEL.MUSIC_NOTE_DECAY, t);
    // Offbeat hats, so the grid has something on the back of it.
    if ((n & 1) === 1) pluck(a.hatGain, 1, FEEL.MUSIC_HAT_DECAY, t);
    a.step = (n + 1) % 64;
    a.nextNote += stepTime;
  }
}

/* Called once a frame from the main loop, whatever the state, so the
   pause sweep and the wind down still run when nothing else does. */
function updateAudio(dt) {
  if (!audio) return;
  const a = audio;
  if (a.ac.state === 'suspended') return;
  const fade = FEEL.AUDIO_FADE_TIME;

  ramp(a.pauseFilter.frequency,
       paused ? FEEL.AUDIO_PAUSE_CUTOFF : FEEL.AUDIO_OPEN_CUTOFF,
       FEEL.AUDIO_PAUSE_TIME);

  const driving = state === DRIVING && !paused;
  const slip = driving ? drift.slipNorm : 0;

  // The heat the music reads. Slip and the spent budget both count, and
  // it lags hard, so the arrangement swells rather than flickering.
  const want = Math.max(slip, driving ? scrapeRisk : 0);
  a.heat += (want - a.heat) * (1 - Math.exp(-dt / FEEL.MUSIC_HEAT_TIME));

  // The skid. Level, band and Q, all off the one slip value.
  const bite = clamp((slip - FEEL.SKID_MIN_SLIP) / (1 - FEEL.SKID_MIN_SLIP), 0, 1);
  ramp(a.skidGain.gain, FEEL.SKID_GAIN_MAX * bite, fade);
  ramp(a.skidBand.frequency,
       FEEL.SKID_FREQ_LOW + (FEEL.SKID_FREQ_HIGH - FEEL.SKID_FREQ_LOW) * bite, fade);
  ramp(a.skidBand.Q, FEEL.SKID_Q_LOW + (FEEL.SKID_Q_HIGH - FEEL.SKID_Q_LOW) * bite, fade);

  // The scrape, which is a state and so is its sound.
  const rasp = driving && scraping ? 1 : 0;
  ramp(a.scrapeGain.gain,
       FEEL.SCRAPE_GAIN_MAX * rasp * (1 - FEEL.SCRAPE_RISK_LIFT * (1 - scrapeRisk)), fade);
  ramp(a.scrapeA.frequency, FEEL.SCRAPE_FREQ * (1 + 0.25 * scrapeRisk), fade);

  updateMusic();
}

/* The crash, and then a clean wind down. One envelope and one sweep on
   voices that already exist, so nothing is built at the worst possible
   moment for the frame budget. */
function audioCrash() {
  if (!audioOn()) return;
  const a = audio, t = a.ac.currentTime;
  a.crashUntil = t + FEEL.CRASH_TIME;
  const g = a.crashGain.gain;
  g.cancelScheduledValues(t);
  g.setValueAtTime(0.0001, t);
  g.linearRampToValueAtTime(FEEL.CRASH_GAIN, t + 0.01);
  g.exponentialRampToValueAtTime(0.0001, t + FEEL.CRASH_TIME);
  const f = a.crashLow.frequency;
  f.cancelScheduledValues(t);
  f.setValueAtTime(FEEL.CRASH_FREQ_FROM, t);
  f.exponentialRampToValueAtTime(FEEL.CRASH_FREQ_TO, t + FEEL.CRASH_TIME);
  // Nothing survives the car. The skid especially must not outlive it.
  ramp(a.skidGain.gain, 0, 0.05);
  ramp(a.scrapeGain.gain, 0, 0.05);
}


/* ==================================================================
   MAIN LOOP
   ================================================================== */
let lastTime = 0;

function frame(now) {
  window.requestAnimationFrame(frame);

  const rawDt = lastTime ? (now - lastTime) / 1000 : 0;
  lastTime = now;
  const dt = Math.min(rawDt, FEEL.MAX_FRAME_DELTA);

  if (noteTimer > 0) {
    noteTimer -= dt;
    if (noteTimer <= 0) noteEl.hidden = true;
  }

  updateRepeat(dt);
  updateTiltHint(dt);
  // Before the early return, so the pause sweep and the crash wind down
  // both keep running while nothing else does.
  updateAudio(dt);
  if (paused) {
    // Nothing moves and nothing is read, but the frame still runs so the
    // cover is drawn and the buttons stay live.
    clearHeldInput();
    render();
    sampleFps(rawDt);
    return;
  }
  updateTilt(dt);
  updateSteering(dt);
  update(dt);
  updateScore(dt);
  updateClock(dt);
  updateBar(dt);
  render();
  sampleFps(rawDt);
}

recomputeCamera();
if (debugAllowed) setDebug(true);
// Before the first road is built, or the title screen is generated at
// deep game difficulty and the first thing anybody sees is a lie.
updateDifficulty();
resetRoad(nextSeed());
resize();
window.requestAnimationFrame(frame);
</script>
