<meta name="theme-color" content="#e2521c">
<!-- Add to Home Screen. On an iPhone this is the only thing that reliably
     removes the browser chrome: the Fullscreen API has been flag gated and
     unreliable there for years, and Chrome on iOS is WebKit underneath so
     it inherits the same gap. These two tags are the whole of it. There is
     deliberately NO manifest: iOS does not read one for this, and it would
     be a second file and a second request for no benefit. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Drift Fever">
<!-- The Android equivalent, also manifest free. -->
<meta name="mobile-web-app-capable" content="yes">

     requests. It used to be an empty data URI, which stopped the browser
     going and asking for one; this stops it asking AND puts the mark in
     the tab. Same three draws as everywhere else, in the same order,
     with the same fill-rule, so the tab and the title screen cannot
     disagree.

     FULLY URL ENCODED. An SVG data URI carries angle brackets, quotes
     and a hash in every colour, and a raw hash truncates the href at the
     fragment. Encoding the lot removes the whole class of argument. It
     is generated from the same path data as the game by the brand

<!-- The one file iOS will not take as a data URI. Never fetched by the
     game's own code, so loading and playing is still request free; this
     is only read when somebody adds the page to their home screen. -->
<link rel="apple-touch-icon" href="apple-touch-icon-180.png">

<!-- Share previews. Social scrapers do not execute the page and will not
     render a data URI, so the card has to be a real file, and og:image
     has to be ABSOLUTE because most scrapers do not resolve a relative
     one. og-card.png is generated from the same path data as everything
     above by the brand tooling.

     SITE_URL, in effect, is the four absolute URLs below. It is the
     GitHub Pages address the game is served from today. If the game ever
     moves to its own domain, these are the lines to change and they are
     deliberately together so it is one edit. -->
<meta property="og:type" content="website">
<meta property="og:url" content="https://snaphit.github.io/Drift_Fever/">
<meta property="og:title" content="Drift Fever">
<meta property="og:description" content="A drift game in one file. Everybody drives the same road today, a new one tomorrow. No downloads, nothing to install.">
<meta property="og:image" content="https://snaphit.github.io/Drift_Fever/og-card.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Drift Fever">
<meta name="twitter:description" content="A drift game in one file. Everybody drives the same road today, a new one tomorrow. No downloads, nothing to install.">

<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    background: #e2521c;
  }
  body {
    touch-action: none;
    overscroll-behavior: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  #game {
    display: block;
    width: 100%;
    height: 100%;
  }
  /* Chrome sits above the canvas so a tap on a button is never read as
     steering. It spans the full width, so it MUST NOT swallow pointers
     itself: pointer-events is none on the container and auto on the
     buttons, so everything between and around them falls through to the
     canvas and still steers.

     This is not a precaution, it is a repeat. Beakdown shipped with an
     in-play button row in a full width container without this, and the
     invisible strip between the buttons ate every tap across that band of
     the screen. The game was unplayable and the cause took a long time to
     find, because nothing is visible and nothing throws. Drift Fever steers
     on the left and right halves of the screen, so any container laid over
     it is exposed to exactly the same failure. Every new overlay goes in
     here, under these rules, or it gets its own pointer-events none. */
  #chrome {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 2;
    pointer-events: none;
    padding: calc(env(safe-area-inset-top, 0px) + 8px) calc(env(safe-area-inset-right, 0px) + 8px) 0 calc(env(safe-area-inset-left, 0px) + 8px);
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 6px;
  }
  #buttons {
    display: flex;
    flex-wrap: wrap;
    justify-content: flex-end;
    gap: 6px;
    width: 100%;
  }
  #tuner {
    display: flex;
    gap: 6px;
    margin-right: auto;
  }
  #tuner[hidden] {
    display: none;
  }
  #chrome button, #note {
    pointer-events: auto;
  }
  #chrome button {
    font: 600 12px/1 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: #3a1405;
    background: rgba(255, 236, 214, 0.78);
    border: 0;
    border-radius: 7px;
    padding: 9px 11px;
    cursor: pointer;
    touch-action: manipulation;
  }
  #chrome button[hidden] {
    display: none;
  }
  #chrome button.on {
    background: #ffb03a;
    color: #2a0d02;
  }
  #note {
    max-width: 62vw;
    font: 500 12px/1.35 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: #3a1405;
    background: rgba(255, 238, 218, 0.86);
    border-radius: 7px;
    padding: 8px 10px;
    text-align: right;
  }
  #note[hidden] {
    display: none;
  }
  /* The corner pads: mute, pause and the two tilt controls. Round, barely
     there until touched, and low enough in the frame that they are out of
     the way of the road.

     POINTER EVENTS. This container spans the full width of the screen and
     sits over a game that steers on the left and right halves, which is
     precisely the Beakdown failure described at the top of this
     stylesheet: an invisible full width strip over the play area ate every
     tap along its band and the game was unplayable. So pointer-events is
     none on #pads and on .padGroup, and auto only on the buttons
     themselves. Everything between and around the four circles falls
     through to the canvas and still steers. Do not put a background, a
     hit target or a pointer-events:auto on either container.

     SAFE AREA. The bottom inset is where iOS puts the home indicator and
     Android puts its gesture bar, so the whole row is pushed above it and
     the side insets are respected too. */
  #pads {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 2;
    pointer-events: none;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    padding: 0 calc(env(safe-area-inset-right, 0px) + 12px)
             calc(env(safe-area-inset-bottom, 0px) + 12px)
             calc(env(safe-area-inset-left, 0px) + 12px);
  }
  .padGroup {
    pointer-events: none;
    display: flex;
    gap: 10px;
  }
  /* 64 across, comfortably over the 56 point minimum a thumb needs, with
     a lit body rather than a hairline so they read as objects. The inner
     shadows are what give them a rim and a bevel; there is no image and no
     filter, so four of them cost nothing. */
  #pads button {
    pointer-events: auto;
    position: relative;
    width: 64px;
    height: 64px;
    border-radius: 50%;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: rgba(255, 234, 210, 0.92);
    background:
      radial-gradient(circle at 50% 32%, rgba(255, 168, 92, 0.34), rgba(52, 18, 8, 0.66) 70%),
      rgba(26, 10, 4, 0.5);
    border: 2px solid rgba(255, 150, 80, 0.5);
    box-shadow: inset 0 1px 0 rgba(255, 212, 170, 0.4),
                inset 0 -7px 16px rgba(0, 0, 0, 0.45),
                0 3px 10px rgba(0, 0, 0, 0.4);
    cursor: pointer;
    touch-action: manipulation;
    -webkit-backdrop-filter: blur(3px);
    backdrop-filter: blur(3px);
    transition: transform 90ms ease-out, background 140ms ease-out;
  }
  #pads button[hidden] {
    display: none;
  }
  #pads button svg {
    width: 30px;
    height: 30px;
    display: block;
    pointer-events: none;
  }
  #pads button:active {
    transform: scale(0.92);
    background:
      radial-gradient(circle at 50% 32%, rgba(255, 208, 140, 0.6), rgba(190, 74, 20, 0.75) 70%),
      rgba(120, 44, 12, 0.7);
  }
  /* The active state, the same amber the tilt button already used. */
  #pads button.on {
    color: #2e0e02;
    background: radial-gradient(circle at 50% 30%, #ffd68a, #ffab34 72%);
    border-color: #fff6dc;
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.55),
                inset 0 -7px 16px rgba(150, 60, 0, 0.35),
                0 3px 14px rgba(255, 140, 40, 0.4);
  }
  /* The tilt hint from section 5's one exception to no onboarding: a ring
     that breathes out of the button and nothing else. No overlay, no words
     and nothing to dismiss. It is added only where a sensor exists and it
     is taken away for good on the first tap, on the first completed run,
     or on a timer, whichever comes first. */
  #pads button.hint::after {
    content: '';
    position: absolute;
    inset: -3px;
    border-radius: 50%;
    border: 2px solid rgba(255, 176, 58, 0.9);
    animation: padPulse 1.7s ease-out infinite;
  }
  @keyframes padPulse {
    0%   { transform: scale(1); opacity: 0.9; }
    70%  { transform: scale(1.5); opacity: 0; }
    100% { transform: scale(1.5); opacity: 0; }
  }
  @media (prefers-reduced-motion: reduce) {
    #pads button.hint::after { animation: none; opacity: 0.9; }
  }
  /* On the narrowest handsets, four 64s and their gaps leave barely a
     finger of canvas between the two groups, and that band is where a tap
     has to be able to reach the road. 58 is still clear of the 56 point
     minimum a thumb needs. */
  /* Five buttons across a phone held upright is tight, and the steering
     band between the two groups has to stay tappable, so they step down
     twice on the way to the narrowest handsets. 56 is the floor: below
     that a thumb stops hitting them reliably. */
  @media (max-width: 429px) {
    #pads button { width: 60px; height: 60px; }
    #pads button svg { width: 28px; height: 28px; }
    .padGroup { gap: 8px; }
  }
  @media (max-width: 379px) {
    #pads button { width: 56px; height: 56px; }
    #pads button svg { width: 26px; height: 26px; }
    .padGroup { gap: 6px; }
  }
  /* SIX PADS, which only ever happens while tilt is on, because the flip
     button is not there otherwise. Six at the sizes above run off the
     right hand edge of every phone this game is played on: measured, the
     pause button ended 14 pixels past the edge at 390 wide and 52 past
     it at 320.

     The whole row shrinks rather than wrapping to a second one. A second
     row would put a button up where the driver's thumb is steering, and
     the pointer-events discipline in the stylesheet at the top of this
     file exists precisely because a strip of screen that eats taps is
     the worst bug this project has shipped. Shrinking keeps the row
     where it has always been.

     44 is the floor and it is Apple's own minimum target, reached only
     on the narrowest handsets. */
  #pads.six button { width: 54px; height: 54px; }
  #pads.six button svg { width: 25px; height: 25px; }
  #pads.six .padGroup { gap: 7px; }
  @media (max-width: 429px) {
    #pads.six button { width: 50px; height: 50px; }
    #pads.six button svg { width: 23px; height: 23px; }
    #pads.six .padGroup { gap: 6px; }
  }
  @media (max-width: 379px) {
    #pads.six button { width: 44px; height: 44px; }
    #pads.six button svg { width: 21px; height: 21px; }
    #pads.six .padGroup { gap: 5px; }
  }
  /* The boot credit owns the whole screen for its half second, so the
     game's own chrome is out of the way while it is up. It comes back the
     instant the credit clears, and the credit can only ever happen once
     per page load, so nothing in play is ever hidden by this. */
  html.booting #chrome, html.booting #pads { display: none; }

  /* ----------------------------------------------------------------
     THE BOOT SPLASH. The publisher lockup on the near black field the
     brand is drawn for, over everything, for well under a second.

     COLD LOAD ONLY, and that guarantee lives in the script rather than
     here: bootFlash is set once where it is declared and is never
     assigned anything but zero anywhere else. This element is removed
     from the flow entirely when it ends, so there is nothing left for a
     restart to reveal.

     SIZED BY BOTH DIMENSIONS. The lockup is 1780 by 1263, which is
     landscape itself, so a width alone gives a mark that fits in
     portrait and runs off the top and bottom of a 844 by 390 screen.
     max-width in vh, times the aspect ratio, is what caps the height,
     and it is written as a calc rather than a min() so it works on
     anything that can run the game at all. */
  #boot {
    position: fixed;
    top: 0;
    right: 0;
    bottom: 0;
    left: 0;
    z-index: 4;
    pointer-events: none;
    display: flex;
    align-items: center;
    justify-content: center;
    /* The game's own void, written out rather than read from COLOUR,
       because COLOUR is what a biome rotates and a publisher lockup that
       changed field colour with the scenery would not be a brand. */
    background: #0b0503;
    /* THE FIELD IS OPAQUE FROM THE FIRST PAINT AND STAYS THAT WAY UNTIL
       THE SPLASH LEAVES. It is in the markup, so the browser paints this
       near black before the script has even been parsed, which is what
       covers the load. Measured, that gap is about 180ms of script parse
       and road build on a desktop and more on a phone, and it used to be
       covered by exactly this. Fading the CONTAINER in would have
       uncovered it and shown a flash of the orange page background and
       a half drawn road. Only the lockup fades in; the container fades
       out at the end, taking the field with it. */
    opacity: 1;
  }
  #boot[hidden] { display: none; }
  #boot svg {
    display: block;
    /* The lockup ARRIVES, so it starts absent and the frame loop brings
       it in. Until the first frame runs there is a plain dark field,
       which is the right thing to be looking at while a page loads. */
    opacity: 0;
    width: 82vw;
    height: auto;
    /* 1780 / 1263, so the height cap is expressed as a width. */
    max-width: calc(62vh * 1.40935);
  }

  /* ----------------------------------------------------------------
     THE CREDIT ON THE END SCREENS. Cropped to the SNAPHIT wordmark: the
     taglines are unreadable at any width this screen can spare, and the
     measurement is in the report. Positioned by the script from the same
     numbers the canvas lays the rest of that screen out with, and only
     when they change, so nothing here is touched per frame.

     It is drawn OVER the canvas, and the canvas draws a dimmed plate
     underneath it. That plate is what keeps an orange lockup legible on
     an orange biome, and it is on the canvas rather than in CSS here so
     it can be measured in the same pixels as everything else. */
  #credit {
    position: fixed;
    left: 0;
    top: 0;
    z-index: 3;
    pointer-events: none;
    transform-origin: 0 0;
    will-change: transform;
  }
  #credit[hidden] { display: none; }
  #credit svg { display: block; width: 100%; height: auto; }
  /* A probe for the safe area insets, so the canvas can keep the resource
     bar and the pause overlay clear of the home indicator and the gesture
     bar. Canvas cannot read env() itself. Zero sized and never hit
     testable. */
  #safe {
    position: fixed;
    left: 0;
    top: 0;
    width: 0;
    height: 0;
    pointer-events: none;
    padding-bottom: env(safe-area-inset-bottom, 0px);
    padding-top: env(safe-area-inset-top, 0px);
  }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="chrome">
  <div id="buttons">
    <div id="tuner" hidden>
      <button data-act="prev" type="button">&#9664;</button>
      <button data-act="dec" type="button">&minus;</button>
      <button data-act="inc" type="button">+</button>
      <button data-act="next" type="button">&#9654;</button>
      <button data-act="reset" type="button">reset</button>
      <button data-act="seed" type="button">seed</button>
    </div>
  </div>
  <div id="note" hidden></div>
</div>
<div id="pads">
  <div class="padGroup">
    <button id="soundBtn" type="button" aria-label="Sound"></button>
    <button id="musicBtn" type="button" aria-label="Music"></button>
  </div>
  <div class="padGroup">
    <button id="fullBtn" type="button" hidden aria-label="Fullscreen"></button>
    <button id="tiltBtn" type="button" hidden aria-label="Tilt steering"></button>
    <button id="flipBtn" type="button" hidden aria-label="Reverse tilt direction"></button>
    <button id="pauseBtn" type="button" aria-label="Pause"></button>
  </div>
</div>
<!-- ==================================================================
     THE SNAPHIT LOCKUPS, INLINE, AS SVG MARKUP.

     WHY MARKUP AND NOT Path2D, which is what the Drift Fever wordmark
     uses twenty lines further down the script. These are LAYERED: three
     stroked copies of the same outline at 0.070, 0.140 and 0.300
     opacity under a filled copy, which is how the neon bloom is built
     without a filter. Reproducing that on canvas would be four passes
     with alpha bookkeeping per lockup for a mark that never animates and
     never has to sit in the world. Inline SVG does it for nothing and
     stays sharp at any device pixel ratio with no work at all.

     STILL ZERO REQUESTS AND STILL ONE FILE. There is no <image>, no
     <use>, no @font-face and no <text>: every letter arrived as an
     outline, so nothing here can fall back to a system font and nothing
     here can be blocked. The only http in either one is the SVG
     namespace, which is an identifier and not an address.

     POINTER EVENTS NONE ON BOTH, AND THAT IS NOT A PRECAUTION. It is
     the same rule #chrome and #pads carry, for the reason recorded in
     the stylesheet: a full width overlay that eats taps is the worst bug
     this project has shipped. The boot splash covers the whole viewport
     and it MUST let the tap through, because the tap is how it is
     skipped.

     The source SVGs live in brand/ and are reference only. These are the
     shipped copies. Editing one without the other is how they part.
     ================================================================== -->

<script>
'use strict';

/* ==================================================================
   DRIFT FEVER

   One self-contained file. No requests, no dependencies, no build.
   Session one: the road, one steering axis, the scrape band, death.
   ================================================================== */


/* ------------------------------------------------------------------
   FEEL CONSTANTS. NOT TO BE CASUALLY CHANGED.

   Every number that decides how the game feels lives in this block,
   including every multiplier used inside the update loop. If a value
   affects feel and it is not here, that is a bug.

   Change one at a time, play it on a phone, and keep the ones that
   survive. Do not retune this block while changing anything else.
   ------------------------------------------------------------------ */
const FEEL = {

  /* Camera and projection.
     The four marked LIVE are adjustable while driving behind the FPS
     toggle, because they can only be judged by playing. Whatever is on
     screen in the debug readout is what the game is actually using.

     CAMERA_HEIGHT only means anything relative to the road width: those
     two are one ratio, and raising the camera makes the road and the car
     smaller on screen. HORIZON_FRACTION buys that space back by moving
     the horizon up and giving the road more of the screen.
     DRAW_DISTANCE_SEGMENTS times SEGMENT_LENGTH is both the planning
     horizon and the frame budget, so it is the first thing to lower if
     a weak machine drops frames. FIELD_OF_VIEW_DEG is a sense of speed
     lever, not a rendering detail: wider reads as faster and distorts
     more, and narrower zooms everything in. */
  /* These four were found by playing on a phone and are settled. Treat
     them the way the build order treats the rest of this block. */
  FIELD_OF_VIEW_DEG:         92,     // LIVE
  /* ----------------------------------------------------------------
     WHERE THE ROAD LEAVES THE SCREEN, written down so it is not worked
     out again from scratch.

     Curves are faked by sliding segments sideways, so a constant curve c
     after the scale S accumulates a lateral offset of c*S*n(n-1)/2 world
     units over n segments, while the distance to those segments is only
     n*L. The projection divides by that distance, so the SCREEN offset of
     the road centre grows LINEARLY in n, and the road centre crosses the
     screen edge at

         n = 2*L / (CAMERA_DEPTH * c * S) + 1     segments from the camera

     where CAMERA_DEPTH is 1/tan(FOV/2). Three consequences, all measured
     as well as derived:

     CAMERA_HEIGHT DOES NOTHING HERE. It appears only in by[], never in
     bx[]. Raising it from 1800 to 6000 moved the mean visible road by
     0.02 seconds. A higher camera holding a bend in frame is true of a
     real 3D camera and false of this projection. It is raised anyway,
     because the more top down look was wanted for its own sake.

     FOV IS THE ONLY CAMERA LEVER. n scales with tan(FOV/2).

     CURVE SCALE IS THE OTHER, and it is the honest one, which is why
     CURVE_SCALE_DEEP is now equal to CURVE_SCALE: the deep game escalates
     through road width, phrase intensity and rest frequency instead.

     At the values below, and at the hardest corner the generator makes
     (CURVE_HARD 5.0, so a post scale curvature of 12.5), the road centre
     leaves the frame 34 segments out, which is 0.30 seconds past the car.
     Staying in frame a full second past the car needs the post scale
     curvature under about 6.4, which is a raw curve of 2.6: between
     CURVE_GENTLE and CURVE_MEDIUM. Every medium and hard corner in the
     game is therefore partly off screen at its apex, and the only fixes
     left are a wider FOV, a weaker CURVE_HARD, or yawing the camera into
     the corner rather than sliding the road. */
  CAMERA_HEIGHT:           2200,     // LIVE
  CAMERA_DISTANCE:         4100,     // LIVE, how far the camera sits behind the car
  /* CAMERA_LOOK slides the camera sideways toward the way the road is
     bending, so the far road stays in frame for longer. It is zero, and
     zero means the camera is locked to the car: the car sits centred and
     stays centred, and nothing slides the world sideways underneath the
     player.

     It was 125 and it was wrong. The offset itself was the complaint, not
     how fast it arrived, and no amount of smoothing or anticipation fixes
     an offset. Two sessions were spent making the lean gentler when the
     answer was not to lean. Corner preview is given up with it, and the
     pylons and the camera height already do that job.

     The machinery below stays so it can be dialled back up from zero on
     the cycler, and it is worth understanding before doing so: curves are
     faked by sliding segments sideways, so lateral offset grows as the
     square of distance while this is a constant. Measured, it buys about
     2% more visible road per 500 world units of camera offset. It is not
     a lever, which is the other reason it is zero.

     CAMERA_LOOK_AHEAD is where the curvature is read from when it is not
     zero: an average over a stretch ahead, weighted toward the near end
     and clipped to road still on screen, so the lean leads the corner
     rather than being shoved by it. */
  /* How much of the car's own sideways position the camera copies.

     1.0 is the camera sitting exactly on the car: the car is pinned to
     the centre of the screen and the road sweeps across it. Because the
     road fills most of the frame, that reads as the SCREEN moving rather
     than the road, which a cold player reported as disorienting.

     0 is the camera sitting on the road centreline: the road is pinned
     and the car visibly moves across it.

     Only the two extremes have ever been tried and both are wrong. This
     is the middle, and it is not CAMERA_LOOK coming back. CAMERA_LOOK
     offset the camera by CURVATURE, a derivative, so it lurched whenever
     the curvature changed and it moved the camera off the car for reasons
     the player had not caused. This copies a POSITION the player is
     already driving, so it is continuous by construction and it can only
     move when the car moves.

     LIVE, on a fine step, and 1.0 so nothing changes until it is tuned. */
  CAMERA_FOLLOW:            1.0,     // LIVE
  CAMERA_LOOK:                0,     // LIVE, world units per unit of curvature
  CAMERA_LOOK_AHEAD:      11000,     // LIVE, world units up the road it reads from
  CAMERA_LOOK_TIME:        0.70,     // seconds of lag on it
  HORIZON_FRACTION:        0.32,     // LIVE, where the horizon sits down the screen
  DRAW_DISTANCE_SEGMENTS:   200,
  SEGMENT_LENGTH:           200,

  /* The road's width now lives on the segment, so phrases can squeeze and
     open it. This is the reference width: everything expressed in road
     half widths means half widths of this, and the live width only scales
     what is drawn and how much margin there actually is. Narrowing makes
     a corner harder without touching its strength, which is the whole
     point, because the corner strengths are already at their ceiling. */
  ROAD_HALF_WIDTH_BASE:    2300,
  ROAD_WIDTH_NARROW:       0.74,     // tightest a phrase may squeeze to
  ROAD_WIDTH_WIDE:         1.12,     // widest a phrase may open to

  /* The road is a slab in space, not a ribbon painted on ground. LIVE,
     because how thick it reads is the difference between a solid object
     and a decal, and that can only be judged by driving.

     The grid below it is what stops the void being nothing to fall into.
     GRID_DEPTH is how far under the road it sits, GRID_SPACING how far
     apart its lines are along the road, and GRID_LINES how many of each
     kind get drawn before it is too far away to matter. */
  /* Thickness and flare trade against each other rather than adding up.
     The wall is occluded by the nearer road, so a taller wall reaches down
     across more segments and more of it disappears, taking the underline
     with it. Width of the visible band is set by the flare, not the drop.
     Deep is sold by the grid and the skyline, not by this number. */
  ROAD_THICKNESS:           640,     // LIVE
  /* The slab is battered: wider at the bottom than at the top. A truly
     vertical side is invisible here, and not by a small margin. A slab
     seen from a camera directly above and behind it occludes its own
     sides completely, and each segment's wall is hidden by the next
     nearer segment's surface. The flare has to beat that: it only shows
     from a distance where it exceeds 1.65 times the width one segment
     gains by being closer, which works out at about 660000 over the
     distance. Below roughly 350 the cliff simply is not there.
     LIVE, because it and the thickness are one shape. */
  ROAD_FLARE:               880,     // LIVE
  EDGE_LIP_FRACTION:       0.13,     // of the half width, the bright lip itself

  /* Glow, done by drawing a bright thing twice: once wide and faint, once
     normal. That is two fills and no shadowBlur, which stays banned. It is
     used on the road edges, the car lights and the tyre marks, and nowhere
     else, because it is what separates neon from coloured lines and it
     stops meaning anything if everything has it. */
  EDGE_GLOW_SPREAD:        0.22,     // of the half width, each side of the lip
  EDGE_GLOW_ALPHA:         0.46,

  /* LIGHT BLEEDING DOWN ONTO THE DARK, just below and outside the edges.
     Light spilling onto nothing is what sells altitude: the slab reads as
     radiating rather than as pasted on.

     THE VOID STAYS EMPTY AND THAT IS THE POINT. The road only reads as a
     slab at altitude because there is nothing out there to measure it
     against, and that vertigo is the distinctive thing here, more so than
     the neon. So this is a SHORT FALLOFF hugging the edge and not an
     ambient wash: the moment the void looks like a surface, the height is
     gone and the effect has cost more than it bought.

     Three stacked bands rather than a gradient, each further down and
     further out than the last, drawn faintest first. Stacking is what
     makes the falloff, so the innermost strip gets all three alphas and
     the outermost gets one, and it costs three batched fills for the
     whole road rather than a gradient per segment. Both LIVE and both
     defaulted low. */
  EDGE_BLEED_ALPHA:        0.11,     // LIVE, per band, so the innermost strip is three times this
  EDGE_BLEED_PX:          0.022,     // LIVE, of the smaller screen dimension, the widest band
  EDGE_BLEED_BANDS:           3,
  /* The floor under the road lifting with the drift, and it is a tenth of
     what the skyline does on purpose. The skyline is BEYOND the void and
     can be loud; the grid is behind the road and the empty space beside
     the road is load bearing. LIVE, and zero leaves the grid exactly as
     it was. */
  GRID_DRIFT_LIFT:         0.35,     // LIVE, of the way toward the near grid colour

  /* The underside line. Two glowing lines with dark between them read as a
     solid with thickness far better than one line and an occlusion. This
     one stays dimmer than the top lip, which owns brightest. */
  SLAB_BOTTOM_WIDTH:         80,     // world units, the line itself
  SLAB_BOTTOM_GLOW:         190,     // world units, the faint pass around it

  /* Pylons down both edges. The cheapest sense of speed there is, an edge
     cue in peripheral vision, and a corner readable before the surface is,
     which is section 4.3 done through art instead of camera. Every major
     one is taller and brighter so the line reads as rhythm. */
  PYLON_SPACING:             14,     // segments between pylons
  PYLON_MAJOR_EVERY:          4,     // every nth pylon is a marker post
  PYLON_HEIGHT:             640,     // world units
  PYLON_MAJOR_HEIGHT:       760,
  PYLON_WIDTH:               85,
  PYLON_MAJOR_WIDTH:        110,
  PYLON_OUT:               0.06,     // of the half width, how far outboard they stand
  PYLON_MIN_PX:             1.4,     // culled once shorter than this on screen
  PYLON_GLOW_SPREAD:        1.9,     // multiple of the pylon width
  PYLON_GLOW_ALPHA:        0.22,

  /* The horizon. Section 7.3 calls it the emotional anchor and it was a
     colour ramp. Distant towers seen across the void, well below the road,
     which is the altitude reading rather than the neon one. It parallaxes
     slowly and it is nowhere near the edges in brightness. */
  SKYLINE_COUNT:             40,
  SKYLINE_PERIOD:          1100,     // pixels the pattern repeats over
  SKYLINE_MIN_HEIGHT:     0.008,     // of screen height
  SKYLINE_MAX_HEIGHT:      0.05,
  SKYLINE_DROP:           0.008,     // how far below the horizon its base sits
  SKYLINE_PARALLAX:       0.018,     // against the car's sideways position
  SKYLINE_DRIFT:         0.0016,     // against distance travelled
  /* The floor sits a long way down, which is the point: the distinctive
     thing here is a narrow slab at altitude, not the neon on it. Deep
     enough that the near rows fall off the bottom of the screen and only
     the distant ones are in shot, which is what real height looks like. */
  GRID_DEPTH:             15000,
  GRID_SPACING:            2400,
  GRID_ROWS:                 44,
  GRID_COLUMNS:              15,
  GRID_COLUMN_SPACING:     4200,
  HORIZON_GLOW_FRACTION:   0.09,     // of screen height
  RUMBLE_SEGMENTS:            4,     // stripe length, in segments
  RUMBLE_WIDTH_FRACTION:   0.65,     // of the road half width. This is the shoulder,
                                     // and it is drawn to match the scrape band below.
  LANE_DASH_FRACTION:      0.02,     // of the road half width
  HORIZON_FADE_FRACTION:   0.14,     // of screen height, the haze band
  MAX_PIXEL_RATIO:            2,     // capped for weak integrated graphics

  /* Motion. Speed is constant in this build: speed escalation is step 3
     of the build order and is deliberately not here yet. */
  SPEED:                   9000,     // world units per second
  /* LIVE. Base road half widths per second at full lock, once the tyres
     have caught up. It is a target, not a jump. Raising it tightens the
     turning circle and is safe against the centrifugal ceiling, because
     the curve term below is scaled by this same number and the ratio does
     not move. What it does change is how far the car overshoots when you
     reverse out of a slide, which is bounded by STEER_RATE times GRIP_TIME
     against the width of the scrape band. */
  STEER_RATE:               3.2,     // LIVE
  STEER_RAMP_TIME:         0.10,     // seconds for keyboard or touch to reach full lock

  /* The drift. GRIP_TIME is the whole mechanic: the car's actual sideways
     velocity chases what the steering is asking for, and lags it by this
     long. HEADING_SNAP_TIME is how fast the nose comes round, and it must
     stay well under GRIP_TIME or there is no gap between where the car
     points and where it is going, which is to say no drift. The angle
     between those two is the slip angle, and it is the number 4.4 will
     score. Raise GRIP_TIME for a looser, slidier car. LIVE, and meant to
     be balanced against STEER_RATE by playing: a tighter turn feeds more
     sideways speed into the same grip and slides further. */
  GRIP_TIME:               0.40,     // LIVE
  HEADING_SNAP_TIME:       0.06,
  SLIP_MAX_DEG:              30,     // slip angle that counts as fully sideways
  /* How far the car is drawn turned. LIVE, both of them.

     CAR_YAW_GAIN is the honest half: the nose points where the steering
     is asking, and only there.

     CAR_CURVE_YAW was the lie, added to stop the car looking detached as
     the road bent around it, and it is zero now. It read as the game
     steering for you, which is far worse than reading as detached: a
     driving game that appears to have aim assistance has lost the only
     thing it was selling. Nothing may now rotate the car that the driver
     did not ask for.

     It stays on the cycler so it can be dialled back up from zero, but
     note before doing so that it is not needed to avoid detachment.
     Holding a line through any real corner already costs most of full
     lock, because centrifugal is 0.124 and a medium corner after the
     curve scale is 8.0, so CAR_YAW_GAIN alone yaws the car hard into
     every bend. That is honest yaw, out of the driver's own input. */
  CAR_YAW_GAIN:             1.0,     // LIVE
  CAR_CURVE_YAW:              0,     // LIVE, radians per unit of road curvature

  /* CENTRIFUGAL is the fraction of full steering authority a curve of 1.0
     eats. LIVE, and the number that decides whether a corner is something
     you drive or something that happens around you.

     It is not free to raise. The generator's real ceiling is CURVE_HARD
     exactly: every phrase interpolates between two endpoints and none can
     overshoot them, so nothing on the road is ever stronger than 5. That
     times this is the share of full lock the hardest corner costs just to
     hold a line, and at 1.0 the corner is unsurvivable however well it is
     driven. The debug readout prints that product live, beside the largest
     curvature actually generated, so it can be walked up in full view. */
  CENTRIFUGAL:            0.124,     // LIVE

  /* The three bands from section 4.2, measured in road half widths, so
     1.0 is the painted edge of the road and the car is CAR_BODY_WIDTH
     across, which is 0.26 of a half width.
     The band is wide on purpose: 4.4 wants the player to live in it, so
     it is a destination and not a mercy window. SCRAPE_START puts the
     outside wheels on the shoulder, OFF_ROAD takes them off the far side
     of it, and RUMBLE_WIDTH_FRACTION is set so the shoulder you can see
     is exactly the band you are allowed to be in.

     What stops the band being a free ride is the timer, not its width.
     SCRAPE_TIME_LIMIT is how long you may hold the edge before it kills
     you, and it refills at SCRAPE_RECOVER_RATE of that while you are back
     on the road, so risk is spent and earned rather than held. Tune these
     two for how long a player should be able to sustain risk. */
  SCRAPE_START:            0.87,
  OFF_ROAD:                1.50,
  SCRAPE_SPEED_FACTOR:     0.62,     // forward speed multiplier while scraping
  SCRAPE_TIME_LIMIT:        1.6,     // seconds of edge before it kills you
  SCRAPE_RECOVER_RATE:      0.8,     // refill rate on the road, against the drain rate

  /* Feedback. Section 7 warns that shake is the fastest route to motion
     sickness on a phone held close to the face. Keep these low. */
  SCRAPE_SHAKE_PX:            4,
  CRASH_SHAKE_PX:            16,
  /* The budget bar. Section 7 wants the risk state legible without UI and
     it already is: the edge flash shifts colour as the timer runs down,
     and that stays the primary channel because in a reflex game the eyes
     never leave the road. This is the secondary channel, for learning the
     system and for reading between corners, so it sits low and central
     where the eyes already are rather than in a corner nobody will glance
     at, it disappears when the budget is full, and it never gets bright
     enough to argue with the road edges. */
  BAR_WIDTH:               0.42,     // of screen width
  BAR_HEIGHT:                 6,     // pixels
  /* Above the safe area AND above the corner pads, which are 48 across
     with a 12 margin, so the row is 76 tall. The bar is centred and the
     pads are in the corners so they never actually touch, but sitting
     them on the same line read as clutter. */
  BAR_BOTTOM:                92,     // pixels above the safe area
  BAR_FADE_TIME:           0.45,     // seconds to fade away once full again
  BAR_ALPHA:               0.70,

  /* Leaving the road is a fall now rather than a freeze. The car keeps
     the sideways speed that put it there, slides off the lip, and only
     then starts dropping, so it goes over the edge instead of sinking
     through the surface. The camera coasts rather than stopping dead. */
  /* ----------------------------------------------------------------
     Scoring, which is section 4.4: score the risk, not the distance.

     The failure this is built against is a permanent shallow drift. If
     time spent sideways is what pays, the whole game collapses into one
     move held for ever, so time alone must pay almost nothing and the
     multiplier has to be bought with depth and with proximity to the
     edge, both at once.

     That is why the two factors MULTIPLY rather than add, and why both
     go to zero at their easy end. Sitting sideways in the middle of the
     road earns a climb of exactly zero, not a small one, and a
     multiplier that is not climbing is decaying. Sitting on the edge
     without slip earns zero the same way. Only both together pay, and
     the scrape timer from 4.2 is what stops the paying state being
     somewhere you can live.

     MULT_SLIP_POWER above 1 bends the slip term against shallow angles
     specifically, so easing into a lazy slide barely registers while
     committing to one pays quickly. */
  /* Two rates, not one, and the split is the whole point.

     SCORE_SURVIVE_RATE is what mere time is worth, and it is deliberately
     small. SCORE_RISK_RATE is paid on the multiplier ABOVE one, so it is
     paid for risk taken and for nothing else.

     A single rate times the multiplier was the obvious shape and it does
     not work. Thirty seconds of coasting sideways in the middle is ten
     times the exposure of three seconds on the edge, so for the three
     seconds to win, the mean multiplier across them has to clear ten.
     With a cap of twelve that needs an instant climb to the cap and it
     only just gets there; with any realistic climb the cap would have to
     be past twenty, which is the runaway the cap exists to prevent. The
     arithmetic does not care how the constants are tuned.

     So time pays a trickle and risk pays the rest, which is a closer read
     of 4.4 than the single rate was anyway: score the risk, not the
     distance. Distance still pays something, because a run that survives
     ought to beat one that does not. */
  SCORE_SURVIVE_RATE:        10,     // points per second, just for still being on the road
  SCORE_RISK_RATE:          110,     // points per second per multiplier above one
  MULT_MIN_SLIP:           0.25,     // slipNorm under this is not drifting at all
  MULT_SLIP_POWER:          1.6,     // above 1 punishes shallow angles
  MULT_EDGE_START:         0.45,     // road half widths, where the edge term leaves zero
  MULT_EDGE_PEAK:          1.15,     // and where it reaches full, inside the scrape band
  MULT_CLIMB_RATE:          3.2,     // multiplier per second, at full slip on the edge
  MULT_DECAY_RATE:          1.1,     // per second whenever nothing is being earned
  MULT_MAX:                  12,
  /* The readout. It has to teach the rule inside one corner without a
     word, so the number is large and it sits where the eyes already are.
     It is the only number left in the run, so it carries the multiplier
     as well as the total. */
  SCORE_TOP:               0.05,     // of screen height
  SCORE_SIZE:             0.062,     // of the smaller screen dimension
  /* The multiplier has no readout of its own during a run any more, so
     the score carries its signal instead. One element saying both things
     rather than two elements or none.

     Restrained on purpose. The score must not start competing with the
     road edges for attention and section 7 warns specifically about
     overdoing motion, so the whole reaction is a warm colour shift, an
     eight percent swell at the very top of the range, and a short kick
     each time a whole multiplier is crossed. Set SCORE_HEAT_GROWTH to
     zero and the colour endpoints equal to switch it off entirely. */
  SCORE_HEAT_GROWTH:       0.08,     // how much the score swells at full multiplier
  SCORE_HEAT_POP:          0.10,     // the extra kick on crossing a whole number
  MULT_POP_TIME:           0.18,     // seconds of kick each time it crosses a whole number

  /* ----------------------------------------------------------------
     Checkpoints and the clock, which together are the progression layer.

     A gate every CHECKPOINT_EVERY segments banks the score, tops the
     clock up and moves the run to a new place to look at.

     BANKING settles the open question in section 14. The score you keep
     is the score you had at the last gate; what you have earned since is
     pending and a crash loses it. Every run ends in a crash, so that is
     not a punishment bolted on, it is what makes a gate an event: the
     number rolls over and is yours.

     THE CLOCK is meant to be honest and almost never the thing that
     kills you. It drains at one second per second and drifting pays it
     back, scaled by slip exactly as the multiplier is, so anyone taking
     the corners properly tops it up without thinking about it. The rates
     below are set so that a driver who never slides at all loses about a
     fifth of a second per second, which is a couple of minutes of
     deliberately passive driving before it bites, and a driver who
     actually drifts gains. It does not run at all during the on ramp. */
  /* A RESOURCE AT ITS CAP COMMUNICATES NOTHING. The first version paid
     drifting back faster than time was spent, so a competent driver
     pinned the clock at the ceiling and the number never moved. It was
     working perfectly and saying nothing, which is the same as not being
     there.

     So the balance is inverted: between gates even good driving runs a
     small deficit, and the gate is the income that clears it. That makes
     the clock swing by most of its range on every cycle, and a number
     that moves is the entire point. It is not harder: the gates span the
     road and cannot be missed, so a driver who is drifting still ends
     each cycle up on where they started. Drifting now buys a shallower
     drain rather than a surplus, which is still visible in real time and
     is what the readout shows. */
  CLOCK_START:               20,     // seconds in hand at the start of a run
  CLOCK_MAX:                 26,     // LIVE, the most that can be banked
  CLOCK_CHECKPOINT:          16,     // LIVE, seconds a gate is worth
  CLOCK_DRIFT_RATE:         1.1,     // LIVE, seconds paid back per second at full slip
  /* The clock's own slip threshold, and it is much higher than the
     multiplier's on purpose. Corners in this game generate slip whether
     you meant it or not: a driver deliberately holding the middle and not
     sliding still measures 0.58 mean slip, barely under a driver who is
     drifting properly. Paying from MULT_MIN_SLIP therefore paid everyone
     the same and made the clock a decoration. From here, only slip that
     was actually asked for pays. */
  CLOCK_MIN_SLIP:          0.55,
  /* The warning band has to be somewhere the clock actually goes. At 8
     against a clock that lived at 40 it was thirty two seconds below
     anywhere the player ever visited and never once fired. */
  CLOCK_LOW:                 14,     // LIVE, seconds under which the readout warns
  CHECKPOINT_EVERY:        1500,     // LIVE, segments between gates, about 33 seconds
  CHECKPOINT_HEIGHT:       1500,     // world units, the posts either side
  CHECKPOINT_POST:          260,     // world units, how thick they are
  CHECKPOINT_FLASH:         0.5,     // seconds of the crossing flash
  /* The timer hangs off the BOTTOM of the score rather than sitting at
     its own fraction of the screen height. The two elements are sized
     from the smaller screen dimension while a fraction of the height is
     the taller one, so an independent position that looks right in
     portrait opens a hole or collides in landscape. This is a gap below
     the score, in the same units the score is drawn in, so the stack
     holds together in both. */
  CLOCK_GAP:               0.022,     // of the smaller screen dimension
  CLOCK_SIZE:             0.055,     // of the smaller screen dimension
  CLOCK_GATE_SIZE:        0.036,     // the distance to the next gate, beside it
  CLOCK_PAY_SIZE:         0.030,     // the live payback readout
  CLOCK_POP_TIME:          1.30,     // seconds the gate payout stays up
  /* Purely cosmetic. Nothing waits on it and a tap during it restarts,
     so it can be as long as it likes without costing anything. */
  RESULT_ROLL_TIME:        0.85,     // seconds the result counts up over

  CRASH_GRAVITY:          26000,     // world units per second squared
  CRASH_TUMBLE:             2.4,     // radians per second, nose over
  CRASH_COAST_TIME:        0.55,     // seconds for the camera to run down
  SHAKE_DECAY_TIME:        0.22,     // seconds to fall to about a third
  SCRAPE_FLASH_ALPHA:      0.32,
  DEATH_INPUT_LOCK:        0.30,     // seconds before a restart is accepted

  /* ----------------------------------------------------------------
     SPECTACLE, and one rule governs the whole block:

     RAZZMATAZZ IS EARNED, NEVER DECORATIVE. Nothing here fires on a wall
     clock or on a random roll. Every value below is a response to
     something the driver did, so the game is louder when it is driven
     better and it is quiet when it is not. The pulse is the closest thing
     to an exception and it is not one: its phase runs off distance
     travelled rather than time, and its depth is zero unless the
     multiplier has bought it.

     TWO HARD LIMITS BIND EVERYTHING IN THIS BLOCK, and they beat any
     effect in it:

       1. The road edge stays the brightest, most readable thing on
          screen. That is what keeps the player alive.
       2. Nothing here may reduce the contrast of the drivable surface
          against the void.

     Both are satisfied by construction, and both had to be MADE true
     rather than assumed. Nothing here touches ROAD_LIGHT, ROAD_DARK,
     WALL or VOID, so the palette's own contrast is untouched, but two
     effects broke the limits anyway and both were caught by measuring
     the rendered frame rather than by reading the code:

       The edge glow band covers the lip, so raising its alpha dimmed the
       brightest thing on screen. The lip fell from 207 to 182 in
       luminance from a multiplier of one to the cap. Fixed by drawing
       the heat half of the glow inboard and outboard of the lip and
       never over it, in edgeGlowPass.

       The horizon band is centred on the horizon line, and the road
       converges to that line from BELOW, so deepening the whole band lit
       the void behind the far road without lighting the road. Contrast
       between 1.7 and 3.3 seconds out, which is the planning horizon,
       moved 4.4 luminance units the wrong way. Fixed by deepening only
       the half above the line, which is sky and only sky.

     Measured after both fixes: the lip sits at 207.3 at every multiplier
     from one to the cap, and it is the brightest thing in the world at
     every one of them. If a heat term is ever added, render it at both
     ends and measure the frame. Reasoning about it is not enough: this
     block got it wrong twice. */
  /* HEAT is the multiplier as an analogue value, lagged, and it is the
     only input the world reaction has. Continuous and smooth: nothing
     switches between states in steps.

     HEAT_CURVE above one is what makes a small multiplier a hint and a
     big one unmistakable, and it has to be set against where the
     multiplier actually lives rather than against its range. Measured
     over twelve runs of committed edge driving, it is 1.3 at the median,
     2.2 at the upper quartile, 4.8 at the ninetieth and 9.8 at the
     ninety ninth, so it spends most of its life near the bottom and only
     a good run takes it up. At 1.7 that made three quarters of all
     driving produce a heat under 0.02, which is not a hint, it is
     nothing. At this value a multiplier of 3 gives about a tenth of the
     reaction, 6 gives a bit over a third, and only the cap gives all of
     it. */
  HEAT_TIME:               0.55,     // LIVE, seconds of lag, so it swells
  HEAT_CURVE:              1.25,     // LIVE, above 1 ramps it in gently
  /* The heat half of the edge glow, drawn as its own pass INBOARD AND
     OUTBOARD OF THE LIP AND NEVER OVER IT. See edgeGlowPass: putting it
     over the lip dims the brightest thing on screen as the multiplier
     climbs, which breaks hard limit one. */
  HEAT_EDGE_GLOW:          0.34,     // LIVE, alpha of the heat only glow pass
  HEAT_EDGE_SPREAD:        0.50,     // extra glow width, as a multiple of the base
  HEAT_EDGE_LIFT:          0.60,     // how far the dim half of the lip runs toward the light one
  HEAT_PYLON_GLOW:         0.34,     // LIVE, extra alpha on the pylon glow
  HEAT_PYLON_SPREAD:       0.90,     // extra glow width, as a multiple of the base
  /* The pulse. Phase comes from DISTANCE TRAVELLED, not from a clock, so
     it is the world going past rather than a timer running, and its depth
     is multiplied by heat so at a multiplier of one there is no pulse at
     all. */
  HEAT_PULSE_LENGTH:       5200,     // world units per pulse cycle
  HEAT_PULSE_DEPTH:        0.35,     // LIVE, how much of the glow the trough takes
  HEAT_SKYLINE_LIFT:       0.70,     // LIVE, how far the roof lights run toward the biome's own hot hue
  HEAT_SKYLINE_THICK:       2.6,     // extra pixels on the lit roof line

  /* ----------------------------------------------------------------
     THE CITY LIGHTS UP AS YOU DRIFT.

     The roof line already came up with the multiplier. This takes it down
     into the buildings: windows, lit in the track's own colour, more of
     them as the drift goes deeper and longer.

     WHY THIS IS THE ONE PLACE IT CAN BE LOUD. The far background is the
     only part of the screen with no readability cost. The road edge, the
     surface, the void and the hazards all carry meaning the player needs;
     the skyline sits below the horizon, behind everything, and carries
     none. So it can take the whole reaction that the road itself must
     not. The hard rule still binds absolutely: the edge stays the
     brightest and most readable thing on screen, and if a lit window ever
     approaches it the alpha comes down, not the edge up.

     DRIVEN BY WHAT THE PLAYER IS DOING NOW, not by the multiplier. The
     multiplier is a decaying number with an edge term in it, so a tidy
     drift down the middle moves it not at all and a lapse takes seconds
     to show. Slip depth says how tight the drift is and the chain says
     how long it has been going, and those two are exactly the question
     "how well am I drifting right now".

     PROGRESSIVE, NOT UNIFORM. Every window carries a fixed threshold and
     lights when the glow passes it, so raising the glow turns more
     windows ON rather than turning every window UP. The thresholds are
     clustered per building, so the city wakes up block by block rather
     than as a uniform speckle, which is the whole reason this reads as a
     city rather than as a brightness slider. */
  CITY_ALPHA:              0.62,     // LIVE, the lit window at full glow
  /* THE CHAIN IS THE LONG TERM AND SLIP IS THE TIGHT TERM, in that order,
     and the order matters. The chain only accrues while the car is above
     CHAIN_MIN_SLIP, so a non zero chain already means "this player is
     drifting" and the chain length already means "and has been for a
     while". Slip depth then decides how hard it burns on top of that.

     Both numbers come off measurement rather than taste. Over 3595 frames
     of drifting: slip sits at 0.70 at the lower quartile, 0.74 at the
     median and 1.00 from the upper quartile up, so it is high whenever it
     is anything at all and a power above 1 on it just throws the low end
     away. Chain length sits at 5 links at the median, 10 at the ninetieth
     and 15 at the ninety ninth, so a full mark of 26 was far past
     anywhere real play ever reaches: the first version peaked at a glow of
     0.20 in play, which is forty windows out of three hundred and sixty.

     Measured at these values over 9056 frames of play: the median frame
     lights 80 windows of 360, the upper quartile 227, and the top tenth
     the whole city. Ordinary drifting wakes a corner of it, a strong
     chain wakes all of it, and the difference is visible. */
  CITY_SLIP_POWER:          1.0,     // LIVE, how sharply depth counts
  CITY_BASE:               0.40,     // LIVE, the share a deep slide lights with no chain behind it
  CITY_CHAIN_FULL:           12,     // LIVE, links at which the chain term is full
  /* THE ENVELOPE, and the ratio between these two is the whole feel of
     it. Attack short enough that the surge lands on the frame the driver
     commits, release long enough that straightening up is a fade rather
     than a switch, and short enough that a straight genuinely goes dark.
     Both LIVE, because this is a ratio that can only be judged by
     driving. */
  CITY_ATTACK:             0.10,     // LIVE, seconds
  CITY_RELEASE:            0.60,     // LIVE, seconds
  CITY_SILENT:            0.004,     // below this on a zero target it is snapped to nothing
  /* The throb on top. Restrained by default and section 7 is the reason:
     the skyline is in peripheral vision for the whole run, which is
     exactly where overdone motion does its damage. Depth is LIVE and zero
     switches it off entirely. */
  CITY_PULSE_DEPTH:        0.16,     // LIVE, how deep the trough goes at full intensity
  CITY_PULSE_HZ:           0.80,     // LIVE, cycles a second at rest
  CITY_PULSE_HZ_GAIN:      1.30,     // LIVE, extra cycles a second at full intensity
  CITY_WINDOW_FILL:        0.46,     // of the cell, so windows are small and regular
  CITY_MIN_BUILDING_PX:       9,     // shorter than this and a window is not worth drawing
  HEAT_HORIZON:            0.55,     // LIVE, a second pass of the horizon band at this alpha
  HEAT_MUSIC:              0.85,     // LIVE, how much of the music's heat the multiplier may drive

  /* Breaking the stored best, live, mid run. One comparison a frame and
     it is the strongest moment this game has: it makes the previous run
     present inside this one.

     It fires on the number on the screen, which is banked plus pending,
     because that is the number the player is reading and the moment they
     mean. The pending half is still at risk until the next gate, which is
     the tension rather than a bug, and the death screen still only calls
     a new best when the banked figure actually cleared it.

     It CANNOT fire when there is no stored best to beat. bestKnown is
     false on a fresh install and false when localStorage is unavailable,
     which section 6 says is common on school profiles, and in both cases
     the whole effect stays switched off for the run. */
  BEST_FLASH_TIME:         0.55,     // LIVE, seconds of the screen wash
  BEST_FLASH_ALPHA:        0.30,     // and how strong it is allowed to get
  BEST_SHAKE_PX:              9,     // under the crash, and capped with everything else
  BEST_GLOW_ALPHA:         0.34,     // the permanent halo the score keeps for the run
  BEST_GLOW_SPREAD:        0.34,     // of the score size

  /* Drift callouts. Transient text that flies in, reads and dies.

     THE DISCIPLINE IS THE FEATURE. Three sessions were spent stripping
     the HUD back and this must not put it back, so: nothing persists,
     nothing is ever drawn over the driving line, only one is on screen at
     a time and the newest wins, and the chatty kind is rate limited so a
     long chain cannot produce a stream of text.

     TWO LANES, NOT ONE PRIORITY LIST. The first version put drift
     feedback at the bottom of a single queue behind checkpoints and close
     calls, which put the core loop of the game last and meant that in
     practice it never spoke. Drifting is what this game IS, so it gets a
     channel of its own, at its own height, with its own slot and its own
     timing, and it never competes with an event for the screen. Only a
     best score break may interrupt it.

     Placement is derived rather than fixed. Both lanes sit in the band of
     sky between the bottom of the HUD stack and the horizon, which is
     empty in both orientations and is never road, on separate rows so
     they can both be up at once without stacking, and offset to whichever
     side of the screen the car is NOT on. */
  CALLOUT_TIME:            1.05,     // LIVE, seconds on screen, in and out included
  CALLOUT_IN:              0.14,     // of that, the fly in
  CALLOUT_OUT:             0.38,     // of that, the fade
  CALLOUT_SLIDE:           0.05,     // of screen width, how far it flies. Kept tiny: section 7.
  CALLOUT_SIZE:           0.042,     // of the smaller screen dimension
  CALLOUT_SIDE:            0.24,     // of screen width, offset from centre
  CALLOUT_MAX_WIDTH:       0.52,     // of screen width, the widest a callout may be
  CALLOUT_RISE:            0.06,     // of the smaller dimension, how far above the horizon it sits
  CALLOUT_GAP_TOP:         0.05,     // and the least it may sit below the HUD stack
  /* The two rows, as a share of the sky band between the HUD and the
     horizon. Events sit high in it and drift feedback low, nearer the
     road, because that is the one the eyes should catch while driving. */
  CALLOUT_ROW_EVENT:       0.10,
  CALLOUT_ROW_DRIFT:       0.78,
  /* The rate floor on the DRIFT lane, which is the only lane that can be
     chatty. Events are rare by their nature and are not limited.
     Dropped from 3.20, which was tuned when drift feedback shared a lane
     with everything else and had to be held back to protect it. It has
     its own lane now, so praise can come often. */
  CALLOUT_GAP:             1.60,     // LIVE, seconds between repeatable drift callouts
  CALLOUT_LOCK:            0.70,     // LIVE, seconds a louder callout suppresses quieter ones for
  /* An ENTRY has to be an entry. Slip alone is not enough: a driver
     living on the edge re touches it every second or two, and calling
     each of those a perfect entry measured nine in eighty seconds, which
     is exactly the clutter three sessions were spent removing. So the car
     must have been clear of the band for CALLOUT_ENTRY_CLEAR first, and
     then arrive at it already committed. */
  CALLOUT_ENTRY_SLIP:      0.72,     // slip needed on touching the edge for a perfect entry
  CALLOUT_ENTRY_CLEAR:     1.60,     // LIVE, seconds clear of the band before one counts

  /* THE CHAIN, which is the reward for drifting and therefore the reward
     for playing the game at all. Both numbers below were measured off the
     phrase library rather than guessed, because they are a property of
     the road and not a matter of taste. Over 166 seconds of driving, with
     a beginner holding the middle of the on ramp and a committed driver
     riding the edge:

       a continuous stretch of drifting is 0.50s at the median, 1.10 at
       the upper quartile and 2.52 at the ninetieth
       a gap between two of them is 0.20s at the median, 0.63 at the
       upper quartile, 1.80 at the ninetieth and 2.45 at the ninety fifth

     The old values were a step of 2.20 and a grace of 0.30. Almost no
     corner in this game gives 2.2 seconds of continuous slip, and three
     gaps in four are longer than 0.3 seconds, so LINKING CORNERS, which
     is the best driving available here, broke the chain every time and
     link one was never reached. A player finished a run of 7322m at a
     best multiplier of 6.2 and the game never once said anything.

     So: a step at the median stretch, which means one ordinary corner is
     worth a link, and a grace above the upper quartile gap, which means
     A CHAIN SURVIVES THE STRAIGHT BETWEEN TWO CORNERS and only breaks
     when the driving actually stops. About one gap in eight is longer
     than the grace, so a chain runs several corners and then ends,
     which is what makes ending it mean something.

     CHAIN_MIN_SLIP is what counts as drifting for this purpose and it is
     deliberately NOT the multiplier's test. The multiplier wants slip AND
     the edge, so a tidy drift down the middle earns nothing from it. That
     is right for scoring and wrong for praise: the first acknowledgement
     has to reach a new player in their first twenty seconds, on a modest
     drift, in the middle of a wide on ramp road. */
  CHAIN_MIN_SLIP:          0.45,     // LIVE, what counts as drifting for the chain
  CALLOUT_CHAIN_STEP:      0.50,     // LIVE, seconds of drifting per chain link
  CALLOUT_CHAIN_GRACE:     2.20,     // LIVE, seconds it may lapse without breaking
  /* Links at which the praise escalates a tier. Widening on purpose: a
     chain accrues about one link a second of wall time, so evenly spaced
     tiers would run off the end of the ladder inside ten seconds. These
     put the first two within a corner or two of starting and then make
     each further tier cost more than the last, which is what makes a long
     chain visibly worth more than a short one. */
  DRIFT_TIER_LINKS:  [1, 2, 4, 7, 11, 16, 22],
  DRIFT_TIER_GROWTH:       0.12,     // LIVE, size added per tier, of the base size
  /* PAST THE TOP OF THE LADDER THE PRAISE MUST NOT STOP, and this is the
     constant that stops it stopping.

     Measured over a forty second run: the chain never broke once, reached
     56 links, hit the top tier at 18 seconds, and after that the only
     drift callout left was the occasional perfect entry. Thirteen
     callouts in the first thirty seconds and two in the next ten. The
     better the driving, the quieter it went, which is exactly backwards
     and is the same failure the Beakdown spec records for escalation
     freezing at wave 32: anything gated on a new maximum goes silent as
     soon as the player is good.

     A tier IS a maximum, per chain. The tier reset on a chain break was
     already correct and was not the cause. The cause was that a good
     driver's chain does not break, so the ladder ran out underneath a
     chain that was still going. Past the last threshold the top rung
     therefore repeats every this many further links, carrying the count,
     so a chain that keeps going keeps being acknowledged. */
  DRIFT_TOP_REPEAT:           8,     // LIVE, links between repeats past the top rung
  /* A chain that beats anything else this run is a separate, louder
     event in the OTHER lane. It is not allowed to be the gate on ordinary
     praise, which is what created the silence in the first place: it sits
     beside the normal ladder rather than in front of it, and it fires at
     most once per chain. */
  DRIFT_BEST_MIN:            12,     // LIVE, links before a run best is worth announcing
  /* The blip itself. Quiet: it fires about once a second through a good
     stretch of driving, so it has to sit under the tyres rather than over
     them, and a short decay keeps it a tick rather than a tone. */
  CHAIN_GAIN:              0.10,     // LIVE
  CHAIN_DECAY:             0.13,     // seconds

  /* Close calls. Section 4.4's philosophy applied to obstacles rather
     than to the road edge: the risky line is the rewarding one. The
     geometry is known exactly, so this is measured rather than guessed.
     The margin is the clear air in WORLD UNITS between the side of the
     car and the outside of the hazard's clip shoulder, at its closest
     over the whole pass, and clipping the hazard at any point disqualifies
     it. The car is 600 wide, so this is two thirds of a car. Measured over
     28 hazards passed cleanly, it calls 39% of them close, at a median
     gap of 215. */
  HAZARD_CLOSE_MARGIN:      400,     // LIVE, world units of clear air that counts as close
  HAZARD_CLOSE_BONUS:       260,     // LIVE, points

  /* The checkpoint, which is the structural beat of the run. Light runs
     down the posts as the car closes on it, which is earned because the
     approach is the player's, and the crossing fires.

     GATE_FLASH_ALPHA is deliberately low. It has to land as a moment and
     also has to not blind anybody at the exact instant a new biome and a
     new stretch of road arrive. */
  GATE_SWEEP_SEGMENTS:      260,     // LIVE, how far out the light starts running down
  GATE_SWEEP_LENGTH:       0.16,     // of the post height, the lit band itself
  GATE_FLASH_ALPHA:        0.26,     // LIVE
  GATE_BAR_WIDTH:          0.05,     // of screen width, the posts sweeping past
  GATE_SHAKE_PX:              7,

  /* SHAKE FROM DIFFERENT SOURCES MUST NOT SUM WITHOUT A CAP. Section 7
     warns that overdoing shake tips into disorientation and that the
     threshold is lower on a phone held close to the face, and this
     session added three new sources to a system that had two.

     Everything goes through addShake, which takes the LOUDEST claim
     rather than adding them up, and then clamps. So a best score break
     landing on a gate crossing beside a hazard scrape is exactly as
     violent as the loudest one of those alone, and nothing in the game
     can ever shake harder than a crash. */
  SHAKE_MAX_PX:              16,     // LIVE, and equal to CRASH_SHAKE_PX on purpose

  /* ----------------------------------------------------------------
     HITTING SOMETHING, which is now a different death from leaving the
     road and looks like one. Going off the edge is a fall: the car slides
     over the lip and drops into the void, and that stays exactly as it
     was. Hitting a hazard is an impact: it stops dead, comes apart, and
     throws debris.

     THE ONE HARD CONSTRAINT IS THAT IT MUST NOT DELAY GETTING BACK IN.
     Section 5 says restart is instant and this cannot be the thing that
     breaks it. So the explosion is purely cosmetic: nothing waits on it,
     the death screen appears under it on the same schedule as before, and
     a tap or a key at any point during it goes straight through. The only
     input gate is DEATH_INPUT_LOCK, which is the accidental input guard
     that was already there and which the hit stop does NOT extend,
     because the death timer runs on real time while the world is frozen.

     Hit stop is a handful of frames of the world standing still, which is
     what sells an impact as an impact. Kept short: at a tenth of a second
     it reads as weight, and past about a fifth it reads as a stutter. */
  HIT_STOP_TIME:           0.11,     // seconds the world freezes on impact
  EXPLODE_TIME:            1.10,     // seconds the debris lives
  EXPLODE_PARTICLES:         26,     // LIVE
  EXPLODE_SPEED:            620,     // pixels per second, at the fastest
  EXPLODE_SPREAD:          0.45,     // how much slower the slowest piece is
  EXPLODE_GRAVITY:          900,     // pixels per second squared
  EXPLODE_DRAG:            0.55,     // seconds, how fast sideways speed bleeds off
  EXPLODE_SIZE:            0.026,    // of the smaller screen dimension, the biggest piece
  EXPLODE_SPIN:             7.0,     // radians per second
  EXPLODE_FLASH_TIME:      0.22,     // the white flash at the moment of impact
  EXPLODE_FLASH_ALPHA:     0.38,
  /* Hard, because this is the hardest thing that happens. It still goes
     through addShake, so it is clamped with everything else and cannot
     sum with a gate or a best score break landing on the same frame. */
  EXPLODE_SHAKE_PX:          16,     // LIVE

  /* ----------------------------------------------------------------
     CONTINUES, which settle section 14's open question about lives and
     recoveries: neither, and instead an unlimited resume from the last
     gate that costs a scoreboard rather than a life.

     The problem it solves is that a player who dies often replays the
     opening of the track over and over and rarely sees anything new. A
     continue puts them back at the last gate at that gate's difficulty,
     so continuing never hands out an easier stretch, and there is no on
     ramp on a continue because somebody on their fourth continue is not
     a new player.

     SCORE INTEGRITY IS THE PART THAT IS NOT OPTIONAL. The live best score
     break is the strongest moment in the game, and if continues carried
     the score forward it would be reachable by pressing continue enough
     times and would stop meaning anything. So the records are split:
     BEST SCORE only moves on a run with zero continues, FURTHEST is a
     distance record any run may set, and the live break only arms on a
     clean run. Exploring and scoring get their own scoreboards and both
     still mean something. */
  CONTINUE_CLOCK_GRACE:     1.0,     // extra seconds on the clock, so a resume is not instant pressure
  /* Section 4.3 asks for three and a half seconds of visible road to plan
     with. A resume that drops the car into a generated phrase after one
     and a half has taken that away at the exact moment the player is
     re orienting, so the arrival straight is the planning horizon and not
     a token. It is not a rest: it is what a fresh run's scripted opening
     already gives, without the beginner's gentle first curve. */
  RESUME_STRAIGHT:          160,     // segments, about three and a half seconds
  /* The prompt and the restart button hang off the BOTTOM edge rather
     than off a fraction of the height, which is what keeps them clear of
     the car in both orientations. Above the safe area and above the
     corner pads, which are 64 across with a 12 margin. */
  /* ----------------------------------------------------------------
     THE BOOT FLASH. The arcade convention of a manufacturer credit before
     the attract loop, and the right home for a publisher name: it is the
     one moment where branding is expected rather than intrusive.

     IT CAN ONLY EVER HAPPEN ON A COLD LOAD. bootFlash is a module level
     countdown set once where it is declared and never assigned anywhere
     else except to zero when it is skipped. startRun, continueRun and
     resetSpectacle do not mention it and must not: section 5 says restart
     is instant on the same input, and that is worth more than any
     flourish. A flourish between attempts is exactly the thing that
     breaks the one more go loop.

     Skippable on the first tap or key, which is SWALLOWED rather than
     also starting a run, so dismissing the credit cannot accidentally
     begin a game the player has not looked at yet.

     THREE PHASES, NOT ONE DURATION, and the middle one is the point. It
     was 0.55 seconds with a fade at the tail, which was too fast to read
     STUDIOS and INSTANT. PLAY. without effort: the eye had barely
     finished arriving before the thing began to leave. The hold is now
     long enough to read the whole lockup at a glance, and it is a HOLD,
     at full opacity, with nothing moving. A beat of stillness is what
     makes a splash feel deliberate rather than slow.

     THE FADES ARE SHORT ON PURPOSE. They exist so the lockup arrives and
     leaves rather than being cut in and out, and that is all. Together
     they add under half a second to the hold; making them long enough to
     be noticed as animation would turn a 1.5 second splash into a three
     second wait, which is a different and much worse thing.

     TOTAL IS THE SUM OF ALL THREE, and it is derived rather than written
     down a fourth time. bootTotal() is the one place it exists. */
  BOOT_FADE_IN:            0.18,     // LIVE, seconds, arriving
  BOOT_HOLD:               1.50,     // LIVE, seconds at full opacity
  BOOT_FADE_OUT:           0.28,     // LIVE, seconds, leaving
  /* Small and quiet on the death screen, under the score. It must not
     crowd the score, the records, the continue button or the share
     button, which are what that screen is for.

     THE LOCKUP IS CROPPED TO THE SNAPHIT WORDMARK, and the width below
     is why. Measured on a 390 wide handset, the full lockup needs to be
     180 pixels across, 46 per cent of the screen, before INSTANT. PLAY.
     reaches a 7 pixel cap height and becomes readable at arm's length.
     That is a billboard on the screen the score lives on. At the width
     that actually fits, the taglines measure 3 to 4 pixels, which is
     shipping text nobody can read. So they are not shipped. */
  CREDIT_WIDTH:           0.185,     // of the smaller dimension
  CREDIT_ALPHA:            0.72,     // the lockup is dimmer than the plate is dark
  /* THE PLATE BEHIND IT, and it exists because the biome hue rotates at
     every gate and the lockup's orange can land on an orange world. It
     is a soft radial rather than a box: a hard edged panel on the death
     screen reads as a dialog, and this has to read as a credit.

     RADIUS IS A MULTIPLE OF THE LOCKUP'S OWN WIDTH, so it cannot come
     adrift of it at any screen size. */
  /* MEASURED, AND THE FIRST TRY WAS NOWHERE NEAR ENOUGH. In landscape
     the death screen stack sits high and the credit lands INSIDE the
     horizon glow, which is the one part of the world that is bright and
     is orange at some hues. Without a plate the lockup's own orange
     measured 1.24 to 1 against it. That is invisible, and it is exactly
     the failure this constant exists to stop.

     The plate is FLAT ACROSS THE MARK and only falls off outside it, so
     the whole lockup sits on one even field rather than on a bright rim.
     The radii are multiples of the lockup's own size, so the shape
     cannot come adrift of it at any screen size, and both are wide
     enough that the box corners are still inside the flat part. */
  CREDIT_PLATE_ALPHA:      0.70,     // over the mark, then fading to nothing
  CREDIT_PLATE_FLAT:       0.62,     // of the radius, the evenly dark part
  CREDIT_PLATE_WIDE:       1.00,     // of the lockup width, the radius across
  CREDIT_PLATE_TALL:       2.60,     // of the lockup height, the radius down

  /* ----------------------------------------------------------------
     THE TITLE SCREEN, WHICH IS AN ARCADE SPLASH AND NOT A WEB PAGE.

     THE SCRIM IS THE ROOT OF IT AND EVERYTHING ELSE FOLLOWS. The game
     keeps running underneath, which is the attract mode and is worth
     keeping, but at full brightness the road, the pylons and the car
     compete with every word on top of them. A dark wash between the two
     lets the type sit on near black without stopping the road moving.

     IT IS ALSO THE PERMANENT CONTRAST ANSWER. The biome hue rotates
     through twelve palettes, so without a scrim the legibility of this
     screen is a different number at every hue and can only ever be
     checked, never fixed. With one, the backdrop is the scrim and the
     hue underneath stops mattering.

     THE SIZES AND GAPS ARE ALL SHARES OF s, THE SMALLER SCREEN
     DIMENSION, so the whole hierarchy scales as one thing. Only the top
     margin comes off h. The wordmark then takes whatever height is left
     once the three lines under it, the air above the bottom button and
     the bottom button itself have taken theirs, which is what makes
     landscape work without a second layout. */
  TITLE_SCRIM_ALPHA:       0.84,     // LIVE, the wash over the running game
  TITLE_TOP:              0.055,     // of h, the margin above the wordmark
  TITLE_WM_WIDTH:          0.88,     // of w, the wordmark's ink width
  /* AND A CAP ON ITS HEIGHT AS A SHARE OF h, which only ever bites in
     landscape. Cutting three rows of text off this screen handed the
     wordmark all of the room they used to take, and on a 844 by 390
     screen that made it two fifths of the height, which is a mark
     dominating a splash rather than heading one. Portrait is still
     governed by the width and this does not touch it. */
  TITLE_WM_TALL:           0.34,     // of h, the ceiling on its ink height
  TITLE_WM_MIN:            0.14,     // of s, the floor under its ink height
  TITLE_GAP_PROMPT:       0.075,     // of s, wordmark down to the prompt
  TITLE_PROMPT_SIZE:      0.058,     // of s
  TITLE_GAP_FACTS:        0.072,     // of s, prompt down to the track line
  TITLE_FACT_SIZE:        0.029,     // of s
  TITLE_GAP_CLOCK:        0.055,     // of s, track line down to the countdown
  TITLE_CLOCK_SIZE:       0.025,     // of s
  TITLE_AIR:               0.10,     // of s, the least air above the bottom button
  /* THE BLINK, and it is a blink and not a pulse. A sine fade reads as a
     web page breathing; a hard on and off reads as a cabinet asking for
