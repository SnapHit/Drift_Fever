  /* The banner across the top, in the score's own gold rather than the
     gate's cyan. Every checkpoint all day has been cyan; the one that
     ends the run is the colour of the number it is ending. */
  const bl = Math.min(lx, rx) - pw / 2, bwid = Math.abs(rx - lx) + pw;
  ctx.globalAlpha = 0.28;
  ctx.fillStyle = 'rgb(' + COLOUR.SCORE_GLOW + ')';
  ctx.fillRect(bl - pw, top - banner * 0.35, bwid + pw * 2, banner * 1.7);
  ctx.globalAlpha = 1;
  ctx.fillStyle = COLOUR.SCORE;
  ctx.fillRect(bl, top, bwid, banner);
  // A dark band through the middle of it, so the banner reads as a sign
  // with something on it rather than as a solid bar.
  ctx.fillStyle = COLOUR.SCORE_EDGE;
  ctx.fillRect(bl, top + banner * 0.36, bwid, banner * 0.28);

  /* Light bars running down both posts, evenly spaced, so the height is
     legible at distance. A single tall rectangle at this scale reads as
     a wall; a ladder reads as a structure. */
  const postH = by[n] - top;
  ctx.fillStyle = COLOUR.GATE;
  ctx.globalAlpha = 0.75;
  const bars = Math.max(1, Math.round(FEEL.FINISH_BARS));
  for (let i = 1; i <= bars; i++) {
    const y = top + postH * (i / (bars + 1));
    const bh2 = Math.max(1.5, postH * 0.016);
    ctx.fillRect(lx - pw * 0.9, y, pw * 1.8, bh2);
    ctx.fillRect(rx - pw * 0.9, y, pw * 1.8, bh2);
  }
  ctx.globalAlpha = 1;

  /* The road under it, painted across the full width. This is the only
     marking in the game that spans the driving line, and it is allowed
     to because there is nothing to avoid on it and nothing after it. */
  const nn = Math.min(last, n + 6);
  if (nn > n && bvis[n]) {
    const bars2 = 8;
    ctx.beginPath();
    for (let k = 0; k < bars2; k += 2) {
      const f0 = -1 + 2 * k / bars2, f1 = -1 + 2 * (k + 1) / bars2;
      ctx.moveTo(bx[n] + bw[n] * f0 * out, by[n]);
      ctx.lineTo(bx[n] + bw[n] * f1 * out, by[n]);
      ctx.lineTo(bx[nn] + bw[nn] * f1 * out, by[nn]);
      ctx.lineTo(bx[nn] + bw[nn] * f0 * out, by[nn]);
      ctx.closePath();
    }
    ctx.globalAlpha = 0.85;
    ctx.fillStyle = COLOUR.SCORE;
    ctx.fill();
    ctx.globalAlpha = 1;
  }

  // The same approach sweep a gate has, so the last one still counts the
  // car in the way every gate before it did.
  const away = nextGate - carSegIndex;
  if (away > 0 && away < FEEL.GATE_SWEEP_SEGMENTS && state === DRIVING) {
    const u = 1 - away / FEEL.GATE_SWEEP_SEGMENTS;
    const band = Math.max(2, postH * FEEL.GATE_SWEEP_LENGTH);
    const y = top + (postH - band) * u;
    ctx.fillStyle = COLOUR.SCORE_BEST;
    ctx.fillRect(lx - pw * 1.1, y, pw * 2.2, band);
    ctx.fillRect(rx - pw * 1.1, y, pw * 2.2, band);
  }
}

function drawGate(first, last, baseIndex) {
  if (atFinishGate()) { drawFinishGate(first, last, baseIndex); return; }
  const n = nextGate - baseIndex;
  if (n < first || n > last || !bvis[n]) return;
  const seg = segAt(nextGate);
  if (!seg) return;
  const out = 1 + FEEL.RUMBLE_WIDTH_FRACTION;
  const post = FEEL.CHECKPOINT_POST / seg.hw;
  const top = by[n] - bh[n] * FEEL.CHECKPOINT_HEIGHT;
  const beam = Math.max(2, bh[n] * FEEL.CHECKPOINT_POST * 0.8);
  const lx = bx[n] + bw[n] * (out + post * 0.5), rx = bx[n] - bw[n] * (out + post * 0.5);
  const pw = Math.max(2, bw[n] * post);

  // Wide and faint, then solid, the same two pass glow everything lit in
  // this game uses.
  for (let pass = 0; pass < 2; pass++) {
    const spread = pass === 0 ? pw * 1.9 : 0;
    ctx.globalAlpha = pass === 0 ? 0.3 : 1;
    ctx.fillStyle = pass === 0 ? GATE_GLOW_FILL : COLOUR.GATE_POST;
    ctx.beginPath();
    ctx.rect(lx - pw / 2 - spread / 2, top, pw + spread, by[n] - top);
    ctx.rect(rx - pw / 2 - spread / 2, top, pw + spread, by[n] - top);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
  // The beam across, in the bright colour, so the eye reads a doorway.
  ctx.fillStyle = COLOUR.GATE;
  ctx.fillRect(Math.min(lx, rx) - pw / 2, top - beam / 2,
               Math.abs(rx - lx) + pw, beam);

  /* Light running down the posts as the car closes. Driven by the
     distance still to run rather than by a clock, so it is the player's
     own approach that moves it and a gate that is never reached never
     finishes its sweep. Two rects. */
  const away = nextGate - carSegIndex;
  if (away > 0 && away < FEEL.GATE_SWEEP_SEGMENTS && state === DRIVING) {
    const u = 1 - away / FEEL.GATE_SWEEP_SEGMENTS;
    const postH = by[n] - top;
    const band = Math.max(2, postH * FEEL.GATE_SWEEP_LENGTH);
    const y = top + (postH - band) * u;
    ctx.fillStyle = COLOUR.GATE;
    ctx.fillRect(lx - pw * 0.85, y, pw * 1.7, band);
    ctx.fillRect(rx - pw * 0.85, y, pw * 1.7, band);
  }
}

/* The warning, painted on the road a full second before the hazard, and
   it points at the way THROUGH rather than at the obstruction.

   It used to be a bar across the blocked width, which said "something is
   coming" when what the player needs is "go this way". A cold player read
   it as a marker for a jump and drove at it. Now the road carries only
   the direction cue, arrowheads laid in the lane that is open, and the
   object carries the danger signal by itself. A splitter gets both of its
   lanes marked, because either one is a correct answer and choosing is
   the whole point of it.

   One batched fill for every warning in shot. */
function laneArrows(h, warn) {
  // Where the open lanes are, in fractions of the local half width, using
  // the same rule the placement check used to decide the hazard was fair.
  const seg = segAt(h.from);
  if (!seg) return null;
  const lim = FEEL.SCRAPE_START;
  const carHalf = (FEEL.CAR_BODY_WIDTH / 2) / seg.hw;
  const band = (h.half + FEEL.HAZARD_CLIP) / seg.hw;
  const x = hazardX(h);
  const lanes = [];
  if (x - band - carHalf >= -lim) lanes.push((-lim + (x - band - carHalf)) / 2);
  if (x + band + carHalf <= lim) lanes.push(((x + band + carHalf) + lim) / 2);
  /* A splitter keeps both, because either side is a correct answer and
     choosing between them is the entire mechanic. Everything else keeps
     only the roomier one: two arrows on a blocker is not a direction, it
     is a shrug, and the point of this marking is to say go THIS way. */
  if (h.kind !== HAZ_SPLITTER && lanes.length === 2) {
    const leftRoom = Math.abs((x - band) - (-lim));
    const rightRoom = Math.abs(lim - (x + band));
    return [leftRoom >= rightRoom ? lanes[0] : lanes[1]];
  }
  return lanes;
}

/* ==================================================================
   THE RAMP, AND THE CHEVRONS THAT LEAD UP TO IT.

   The ramp is a wedge: two flanks, a deck banded across its length so the
   rise is legible, and a lit lip at the top which is the edge the car
   leaves from. Built from the same boundary tables everything else is, so
   it sits in the world, and drawn one colour at a time like the road.

   THE CHEVRONS ARE THE HALF OF THIS THAT MATTERS. The hazard warning
   lies FLAT on the road, points ALONG it, is washed out to half alpha and
   is cyan. This STANDS UP off the road, points at the SKY, is opaque and
   is green. Four axes of difference at once, and at speed the standing
   one has a silhouette against the sky that the flat one physically
   cannot have. They are not confusable, and they were never meant to be
   told apart by hue alone.
   ================================================================== */
let JUMP_GLOW_FILL = 'rgb(' + COLOUR.JUMP_GLOW + ')';
let JUMP_DECK_RAMP = rampBetween(COLOUR.JUMP_DECK_DARK, COLOUR.JUMP_DECK);

function jumpHeightAt(j, i) {
  return FEEL.JUMP_RAMP_HEIGHT
       * clamp((i - j.from) / (j.to - j.from + 1), 0, 1);
}

function drawJumps(first, last, baseIndex) {
  if (!jumps.length) return;
  for (let k = 0; k < jumps.length; k++) drawRamp(jumps[k], first, last, baseIndex);
  /* Wide and faint, then solid. The same two pass glow the road edges
     use, and still no shadowBlur anywhere in this file. */
  if (jumpChevrons(first, last, baseIndex, 1.22)) {
    ctx.globalAlpha = 0.22;
    ctx.fillStyle = JUMP_GLOW_FILL;
    ctx.fill();
    ctx.globalAlpha = 1;
  }
  if (jumpChevrons(first, last, baseIndex, 1)) {
    ctx.globalAlpha = 0.9;
    ctx.fillStyle = COLOUR.JUMP_ARROW;
    ctx.fill();
    ctx.globalAlpha = 1;
  }
}

const rampL = [], rampR = [], rampY = [];
function drawRamp(j, first, last, baseIndex) {
  const RH = FEEL.JUMP_RAMP_HALF;
  const a = Math.max(j.from - baseIndex, first);
  const b = Math.min(j.to + 1 - baseIndex, last + 1);
  if (b - a < 1) return;
  for (let n = a; n < b; n++) if (!bvis[n]) return;
  rampL.length = 0; rampR.length = 0; rampY.length = 0;
  for (let n = a; n <= b; n++) {
    const rise = bh[n] * jumpHeightAt(j, n + baseIndex);
    rampL.push(bx[n] - bw[n] * RH);
    rampR.push(bx[n] + bw[n] * RH);
    rampY.push(by[n] - rise);
  }
  const top = rampY.length - 1;

  // The flanks, so the wedge is a solid rather than a decal.
  ctx.beginPath();
  for (const side of [rampL, rampR]) {
    ctx.moveTo(side[0], rampY[0]);
    for (let i = 1; i <= top; i++) ctx.lineTo(side[i], rampY[i]);
    for (let i = top; i >= 0; i--) ctx.lineTo(side[i], by[a + i]);
    ctx.closePath();
  }
  ctx.fillStyle = COLOUR.JUMP_SIDE;
  ctx.fill();

  /* The deck, one quad per segment, running from the road's own value at
     the bottom to nearly the lip's at the top.

     BANDS WERE TRIED FIRST AND FAILED. Alternating light and dark stripes
     across a rising surface read as a zebra crossing painted flat on the
     road, which is the exact opposite of the thing being built. A value
     that climbs with the deck reads as a surface turning up into the
     light, and that is what says ramp. */
  for (let i = 0; i < top; i++) {
    ctx.beginPath();
    ctx.moveTo(rampL[i], rampY[i]);
    ctx.lineTo(rampR[i], rampY[i]);
    ctx.lineTo(rampR[i + 1], rampY[i + 1]);
    ctx.lineTo(rampL[i + 1], rampY[i + 1]);
    ctx.closePath();
    ctx.fillStyle = rampAt(JUMP_DECK_RAMP,
                           jumpHeightAt(j, a + i + baseIndex + 1) / FEEL.JUMP_RAMP_HEIGHT);
    ctx.fill();
  }

  /* Rails up both sides. A line that visibly climbs away from the road is
     the single clearest statement that a surface rises, and it is what
     carries the ramp at draw distance once the deck is only a few pixels
     across. */
  ctx.lineWidth = Math.max(1.5, bh[a] * FEEL.JUMP_RAMP_HEIGHT * 0.06);
  ctx.strokeStyle = COLOUR.JUMP_LIP;
  ctx.globalAlpha = 0.55;
  for (const side of [rampL, rampR]) {
    ctx.beginPath();
    ctx.moveTo(side[0], rampY[0]);
    for (let i = 1; i <= top; i++) ctx.lineTo(side[i], rampY[i]);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;

  // The lip, only when the real lip is the boundary on screen.
  if (b !== j.to + 1 - baseIndex) return;
  const thick = Math.max(2, bh[b] * FEEL.JUMP_RAMP_HEIGHT * 0.12);
  ctx.globalAlpha = 0.3;
  ctx.fillStyle = JUMP_GLOW_FILL;
  ctx.fillRect(rampL[top] - thick, rampY[top] - thick * 1.6,
               rampR[top] - rampL[top] + thick * 2, thick * 3.2);
  ctx.globalAlpha = 1;
  ctx.fillStyle = COLOUR.JUMP_LIP;
  ctx.fillRect(rampL[top], rampY[top], rampR[top] - rampL[top], thick);
}

/* The run of standing chevrons. One path for every chevron in shot,
   whatever else is on the road, which is the same batching discipline the
   rest of the frame is drawn under. */
function jumpChevrons(first, last, baseIndex, grow) {
  let any = false;
  ctx.beginPath();
  for (let k = 0; k < jumps.length; k++) {
    const j = jumps[k];
    if (j.done) continue;                    // taken, and behind the player
    for (let m = 1; m <= FEEL.JUMP_ARROW_COUNT; m++) {
      const n = j.from - m * FEEL.JUMP_ARROW_SPACING - baseIndex;
      if (n < first || n > last || !bvis[n]) continue;
      any = true;
      // The run grows toward the ramp, so it reads as leading somewhere
      // rather than as a row of identical markers.
      const shrink = grow * (1 - (m - 1) * 0.12);
      const hy = bh[n] * FEEL.JUMP_ARROW_HEIGHT * shrink;
      const hx = bw[n] * FEEL.JUMP_ARROW_HALF * shrink;
      const tx = hx * FEEL.JUMP_ARROW_THICK, ty = hy * FEEL.JUMP_ARROW_THICK;
      const cx = bx[n], base = by[n];
      ctx.moveTo(cx, base - hy);
      ctx.lineTo(cx + hx, base);
      ctx.lineTo(cx + hx - tx, base);
      ctx.lineTo(cx, base - hy + ty);
      ctx.lineTo(cx - hx + tx, base);
      ctx.lineTo(cx - hx, base);
      ctx.closePath();
    }
  }
  return any;
}

/* ==================================================================
   THE GHOST. DAILY ONLY, AND THERE IS NO FALLBACK FOR ENDLESS.

   Section 4.5 asks for a recorded rival and gives the reason: a visible
   opponent turns an abstract number into a race, and it solves the cold
   start problem because the second player is always yourself. What it
   could not have on an endless road is a road to be recorded ON. A line
   replayed over a different generation drives through the hazards and off
   the edge inside seconds, so the ghost waited for the daily and arrives
   with it.

   THE RECORD. Sampled by DISTANCE rather than by time, which is what
   makes it both small and exact:

     - Sample i is at exactly i * GHOST_STEP world units. The ghost's
       position along the road therefore costs nothing to store and
       cannot accumulate drift over a long run, which a delta encoded
       z would.
     - What is stored is where it was ACROSS the road, how far round the
       car was, and how long it took to get there. The first two are the
       line the player is trying to learn. The third is the only thing
       that differs between two runs of the same road, and it is what
       makes the ghost passable rather than a rail.

   THE ENCODING is thirty bits a sample, written as five characters of a
   sixty four character alphabet:

       x    12 bits   world units across, two unit steps, plus or minus 4096
       yaw   9 bits   plus or minus 90 degrees, about a third of a degree
       dt    9 bits   zero to half a second, about a millisecond

   Five bytes a sample at nine samples a second is under fifty bytes a
   second of driving. A two minute run is about five and a half kilobytes.

   ------------------------------------------------------------------
   THE GHOST IS YOUR LAST RUN. EVERY RUN. THIS IS A CHANGED RULE.

   It used to be the best CLEAN run, borrowed from BEST SCORE, and that
   was wrong. A GHOST IS A LEARNING TOOL AND A RECORD IS A SCOREBOARD
   ENTRY, and those two want opposite rules:

     A RECORD has to be hard to take, or it means nothing. BEST SCORE,
     today's record and the completion time are therefore still closed to
     any run with a continue on it, and none of that is relaxed here.

     A GHOST has to be RECENT, or it teaches nothing. The line worth
     watching is the one you drove a minute ago on the corner you are
     about to arrive at, not a line from an hour ago that happened to
     score well. So every run records: continued runs, and runs that
     ended in a crash, both included, and the newest always wins.

   WHAT A CONTINUE DOES TO THE RECORDING. It rewinds it to the checkpoint
   and carries on writing from there, so the stored line is the path the
   attempt actually took through each section rather than a splice of the
   failed excursions. Which means that on a resume the ghost shows what
   was done on THAT section last time, which is the whole point of having
   one there.

   The one thing that will not overwrite a line is a run too short to be
   a line at all. Two samples is the floor, because one point cannot be
   interpolated between and storing it would only wipe what is there.
   ================================================================== */
const GHOST_ALPHABET = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_';
const GHOST_INDEX = (function () {
  const m = {};
  for (let i = 0; i < GHOST_ALPHABET.length; i++) m[GHOST_ALPHABET.charAt(i)] = i;
  return m;
})();

function ghostStep() { return FEEL.GHOST_STEP_SEGMENTS * FEEL.SEGMENT_LENGTH; }

/* What is being recorded this run, and what is being replayed. Two
   separate things on purpose: the run in progress is not the ghost, and
   only becomes one if it turns out to be the day's best. */
const ghostRec = { x: [], yaw: [], dt: [], n: 0, live: false, nextZ: 0, lastT: 0 };
const ghost = {
  x: [], yaw: [], t: [], n: 0,
  live: false,        // there is a line to replay
  shown: false,       // and it is on screen right now
  i: 0,               // replay cursor, monotonic
  pos: 0,             // where it is along the road, same space as `position`
  frac: 0, yawNow: 0,
  ahead: true,        // is it in front of the player
  said: 0             // seconds until another pass callout may fire
};

function ghostClear() {
  ghost.x.length = 0; ghost.yaw.length = 0; ghost.t.length = 0;
  ghost.n = 0; ghost.live = false; ghost.shown = false;
}

function ghostEncode() {
  const out = [];
  for (let i = 0; i < ghostRec.n; i++) {
    const x = clamp(Math.round(ghostRec.x[i] / 2) + 2048, 0, 4095);
    const y = clamp(Math.round(ghostRec.yaw[i] * 180 / Math.PI * 2.83) + 256, 0, 511);
    const d = clamp(Math.round(ghostRec.dt[i] * 1000), 0, 511);
    // Thirty bits, most significant first, five characters.
    let v = x * 262144 + y * 512 + d;
    const five = ['', '', '', '', ''];
    for (let k = 4; k >= 0; k--) { five[k] = GHOST_ALPHABET.charAt(v & 63); v = Math.floor(v / 64); }
    out.push(five.join(''));
  }
  return out.join('');
}

function ghostDecode(str) {
  ghostClear();
  if (!str || str.length < 5) return false;
  const n = Math.floor(str.length / 5);
  let t = 0;
  for (let i = 0; i < n; i++) {
    let v = 0;
    for (let k = 0; k < 5; k++) {
      const c = GHOST_INDEX[str.charAt(i * 5 + k)];
      if (c === undefined) { ghostClear(); return false; }   // not ours, or truncated
      v = v * 64 + c;
    }
    const d = v % 512; v = Math.floor(v / 512);
    const y = v % 512; v = Math.floor(v / 512);
    t += d / 1000;
    ghost.x.push((v - 2048) * 2);
    ghost.yaw.push((y - 256) / 2.83 * Math.PI / 180);
    ghost.t.push(t);
  }
  ghost.n = n;
  ghost.live = n > 1;
  return ghost.live;
}

/* Recording. Called once a frame while driving, after the car has moved.
   `prevPos` and `prevX` are what update already has to hand for the tyre
   marks, so nothing extra is tracked to get the crossing right, and `dt`
   is this frame's own delta.

   THE FRAME DELTA IS NOT OPTIONAL AND LEAVING IT OUT IS WHAT MADE THE
   GHOST JUDDER. This used to reconstruct the crossing time as

       at = runTime - (1 - f) * (runTime - ghostRec.lastT)

   where f is the fraction of THIS FRAME at which the step was crossed.
   The quantity it multiplied f by has to be the frame, and
   runTime - lastT is the gap since the previous SAMPLE, which is seven
   frames long. So every recorded interval came out as f times the true
   interval, with f effectively uniform over 0 to 1.

   Measured on shipped road, the recorded intervals ran 0.078, 0.052,
   0.204, 0.078, 0.052, 0.204 where the truth is a steady 0.111. The
   ghost's replay speed therefore changed by a factor of four nine times
   a second, which is exactly the bobbing that was reported. The total
   time was right, because the error telescopes, which is why nothing
   downstream ever noticed. */
function ghostRecord(prevPos, prevX, dt) {
  if (!ghostRec.live) return;
  const frameT0 = runTime - dt;              // runTime is the END of this frame
  while (position >= ghostRec.nextZ && ghostRec.n < FEEL.GHOST_MAX_SAMPLES) {
    /* Interpolated to the exact crossing rather than snapped to the
       frame. A frame covers about an eighth of a step at speed, and
       snapping would put an eighth of a step of jitter into the timing
       of every sample. */
    const span = Math.max(1e-6, position - prevPos);
    const f = clamp((ghostRec.nextZ - prevPos) / span, 0, 1);
    const at = frameT0 + f * dt;
    ghostRec.x.push(prevX + (carX - prevX) * f);
    ghostRec.yaw.push(carYaw());
    ghostRec.dt.push(Math.max(0, at - ghostRec.lastT));
    ghostRec.lastT = at;
    ghostRec.n++;
    ghostRec.nextZ += ghostStep();
  }
  if (ghostRec.n >= FEEL.GHOST_MAX_SAMPLES) ghostRec.live = false;
}

function ghostStartRecording() {
  ghostRec.x.length = 0; ghostRec.yaw.length = 0; ghostRec.dt.length = 0;
  ghostRec.n = 0;
  ghostRec.nextZ = 0;
  ghostRec.lastT = 0;
  /* Daily only, and there is no longer a second condition. Every run on
     today's road records, because the ghost is the last run and not the
     best one. See the block header. */
  ghostRec.live = mode === DAILY;
}

/* A CONTINUE REWINDS THE RECORDING TO THE CHECKPOINT rather than ending
   it, which is what makes the stored line the attempt's real path instead
   of a splice with a dead end in the middle of it.

   Sample i is at exactly i * step, so which samples are behind the resume
   point is arithmetic and not a search. The time axis follows: runTime is
   put back to the checkpoint's time by continueRun, and the cumulative
   time of the last kept sample is at or before that, so the next sample
   recorded spans the join correctly with nothing to reconcile. */
function ghostRewind() {
  if (mode !== DAILY) { ghostRec.live = false; return; }
  const step = ghostStep();
  const keep = clamp(Math.floor(position / step) + 1, 0, ghostRec.n);
  let t = 0;
  for (let i = 0; i < keep; i++) t += ghostRec.dt[i];
  ghostRec.x.length = keep;
  ghostRec.yaw.length = keep;
  ghostRec.dt.length = keep;
  ghostRec.n = keep;
  ghostRec.nextZ = keep * step;
  ghostRec.lastT = t;
  ghostRec.live = keep < FEEL.GHOST_MAX_SAMPLES;
}

/* Stored at the end of every daily run, which is the whole of the new
   rule, and decoded straight back so the very next attempt, restart or
   continue, is already racing it. */
function ghostBank() {
  if (mode !== DAILY) return false;
  if (ghostRec.n < 2) return false;          // too short to be a line
  const blob = ghostEncode();
  dailyGhostBytes = blob.length;
  storeSet('daily.ghost', blob);
  ghostDecode(blob);
  return true;
}

/* ------------------------------------------------------------------
   THE LINE BETWEEN SAMPLES, AND WHY IT IS A CURVE AND NOT A CHORD.

   The samples are evenly spaced in DISTANCE, so index space is the
   natural parameter for the line across the road and for the heading:
   both are functions of how far along the road the car was, and neither
   has anything to do with how long it took to get there. A uniform
   Catmull-Rom through four consecutive samples is therefore exactly the
   right shape, and it costs nothing at all in storage.

   WHAT IT FIXES. Joining the samples with straight lines puts a corner
   at every one of them, nine times a second. Measured on shipped road
   the sideways velocity stepped by 36 units at the median join and 810
   at the ninety fifth, on a car whose own sideways velocity is moved
   smoothly by GRIP_TIME and never steps at all. A rival that changes
   direction instantaneously does not read as a car being driven.

   It is not applied to the position along the road. That one has to stay
   MONOTONIC, because a ghost that goes backwards for a frame is a far
   worse artefact than the one being fixed, and a cubic through four
   points carries no such guarantee. It does not need it either: with the
   frame delta bug fixed its speed steps measure zero at the median.
   ------------------------------------------------------------------ */
function ghostSpline(arr, i, f) {
  const n = ghost.n;
  // The ends have no neighbour outside, so they lean on themselves,
  // which is the ordinary clamped end condition and keeps the curve
  // inside the data there.
  const p0 = arr[i > 0 ? i - 1 : 0];
  const p1 = arr[i];
  const p2 = arr[i + 1];
  const p3 = arr[i + 2 < n ? i + 2 : n - 1];
  const f2 = f * f, f3 = f2 * f;
  return 0.5 * (2 * p1
              + (p2 - p0) * f
              + (2 * p0 - 5 * p1 + 4 * p2 - p3) * f2
              + (3 * p1 - 3 * p2 + p3 - p0) * f3);
}

/* Replay. The cursor only ever goes forward, so this is a step and not a
   search however long the record is. */
function ghostUpdate(dt) {
  ghost.shown = false;
  if (ghost.said > 0) ghost.said -= dt;
  if (!ghost.live || mode !== DAILY || state !== DRIVING) return;
  const t = runTime;
  /* THE CURSOR HAS TO BE ABLE TO GO BACKWARDS, and this is a bug fix.

     A CONTINUE sets runTime back to the checkpoint's time, which is
     EARLIER than wherever the cursor had walked to on the run that just
     ended. A forward only walk cannot follow that: the cursor stayed
     ahead, the interpolation clamped, and the ghost froze thousands of
     units up the road where it was never drawn again. The ghost was
     therefore missing for the whole of every continued run, which is
     exactly half of what was reported.

     Reset and re walk rather than search: it costs one pass over at most
     four thousand entries on the single frame a resume happens, and it
     is right for any backwards jump rather than only for the one that
     was found. */
  if (t < ghost.t[ghost.i]) ghost.i = 0;
  while (ghost.i < ghost.n - 2 && ghost.t[ghost.i + 1] <= t) ghost.i++;
  if (t >= ghost.t[ghost.n - 1]) {
    /* The recorded run ended here. Nothing is invented past the end: the
       ghost simply is not there any more, which is exactly what having
       outlasted it means. */
    ghost.pos = (ghost.n - 1) * ghostStep();
    ghostPass();
    return;
  }
  const a = ghost.t[ghost.i], b = ghost.t[ghost.i + 1];
  const f = b > a ? clamp((t - a) / (b - a), 0, 1) : 0;
  ghost.pos = (ghost.i + f) * ghostStep();
  ghost.frac = ghostSpline(ghost.x, ghost.i, f);
  ghost.yawNow = ghostSpline(ghost.yaw, ghost.i, f);
  ghost.shown = true;
  ghostPass();
}

/* Passing, and being passed, in the DRIFT lane. It goes there rather than
   in the event lane because the event lane is the checkpoint and the best
   score break, and a ghost pass must not push either of those aside. The
   gap is hysteresis: without it a dead heat strobes the callout on every
   other frame, which is the failure this cost on the chain in session
   twenty three. */
function ghostPass() {
  const ahead = ghost.pos > position;
  if (ahead === ghost.ahead) return;
  if (Math.abs(ghost.pos - position) < FEEL.GHOST_PASS_GAP) return;
  ghost.ahead = ahead;
  if (ghost.said > 0) return;
  ghost.said = FEEL.GHOST_PASS_COOLDOWN;
  if (ahead) sayDrift('GHOST AHEAD', COLOUR.GHOST_EDGE, 1, true);
  else sayDrift('PASSED THE GHOST', COLOUR.GATE, 1.1, true);
}

/* Drawn from the SAME boundary tables the road is, so it sits in the
   world rather than on the screen and it rides the curve for free.

   bw[k] / hw is scale * w / 2, which is exactly bh[k], so a world x at
   boundary k lands at bx[k] + bh[k] * x with no width lookup at all and
   no chance of using the wrong segment's half width. */
const ghostPt = { sx: 0, sy: 0, ok: false };
function ghostPoint(worldZ, worldX, worldY, first, last, baseIndex) {
  const k = (worldZ + FEEL.CAMERA_DISTANCE) / FEEL.SEGMENT_LENGTH - baseIndex;
  const i = Math.floor(k);
  ghostPt.ok = false;
  if (i < first || i + 1 > last || !bvis[i]) return ghostPt;
  const f = k - i;
  const bxk = bx[i] + (bx[i + 1] - bx[i]) * f;
  const byk = by[i] + (by[i + 1] - by[i]) * f;
  const bhk = bh[i] + (bh[i + 1] - bh[i]) * f;
  ghostPt.sx = bxk + bhk * worldX;
  ghostPt.sy = byk - bhk * worldY;
  ghostPt.ok = true;
  return ghostPt;
}

const ghostCorners = [0, 0, 0, 0, 0, 0, 0, 0];      // four x,y pairs, road plane
const ghostRoof = [0, 0, 0, 0, 0, 0, 0, 0];
function drawGhost(first, last, baseIndex) {
  /* The state test belongs here as well as in ghostUpdate. The frame loop
     returns early on a pause and on the hit stop without updating, so a
     rival left frozen beside the wreck is one early return away at any
     time. The invariant is that the ghost is only ever on screen while
     the car is being driven, so it is asserted where the drawing happens. */
  if (!ghost.shown || state !== DRIVING) return;
  const c = Math.cos(ghost.yawNow), sn = Math.sin(ghost.yawNow);
  const hw = FEEL.CAR_BODY_WIDTH / 2, hl = FEEL.CAR_BODY_LENGTH / 2;
  /* The roof is INSET, and it is what makes this read as a car rather
     than as two slabs floating one above the other. A cabin narrower and
     shorter than the footprint gives the silhouette its shoulders, which
     is the whole of section 7's argument about detail living in the
     shape and not in the shading. */
  const rw = hw * FEEL.GHOST_CABIN_WIDE, rl = hl * FEEL.GHOST_CABIN_LONG;
  const back = hl * FEEL.GHOST_CABIN_BACK;
  const corners = [[-hw, -hl], [hw, -hl], [hw, hl], [-hw, hl]];
  const cabin = [[-rw, -rl + back], [rw, -rl + back], [rw, rl + back], [-rw, rl + back]];
  for (let i = 0; i < 4; i++) {
    const lx = corners[i][0], lz = corners[i][1];
    const wx = ghost.frac + lx * c - lz * sn;
    const wz = ghost.pos + lx * sn + lz * c;
    const p = ghostPoint(wz, wx, 0, first, last, baseIndex);
    if (!p.ok) return;                       // any corner off the tables, skip the frame
    ghostCorners[i * 2] = p.sx; ghostCorners[i * 2 + 1] = p.sy;
    const cx2 = cabin[i][0], cz2 = cabin[i][1];
    const qx = ghost.frac + cx2 * c - cz2 * sn;
    const qz = ghost.pos + cx2 * sn + cz2 * c;
    const q = ghostPoint(qz, qx, FEEL.GHOST_HEIGHT, first, last, baseIndex);
    if (!q.ok) return;
    ghostRoof[i * 2] = q.sx; ghostRoof[i * 2 + 1] = q.sy;
  }
  /* Footprint, then roof, then the roof outlined. Three operations, no
     side walls: a filled box at this alpha reads as a smear where the
     faces overlap, and the gap between two quads reads as height without
     putting anything solid over the road. */
  ctx.globalAlpha = FEEL.GHOST_ALPHA * 0.5;
  ctx.fillStyle = COLOUR.GHOST;
  polygon(ghostCorners[0], ghostCorners[1], ghostCorners[2], ghostCorners[3],
          ghostCorners[4], ghostCorners[5], ghostCorners[6], ghostCorners[7]);
  ctx.fill();
  ctx.globalAlpha = FEEL.GHOST_ALPHA;
  polygon(ghostRoof[0], ghostRoof[1], ghostRoof[2], ghostRoof[3],
          ghostRoof[4], ghostRoof[5], ghostRoof[6], ghostRoof[7]);
  ctx.fill();
  ctx.strokeStyle = COLOUR.GHOST_EDGE;
  ctx.lineWidth = 1.5;
  ctx.stroke();
  ctx.globalAlpha = 1;
}

function drawHazardWarnings(first, last, baseIndex) {
  const warn = FEEL.HAZARD_WARN_SEGMENTS;
  const count = FEEL.HAZARD_WARN_STRIPES;
  const alen = FEEL.HAZARD_ARROW_LENGTH;
  const gap = Math.max(alen + 1, Math.floor(warn / count));
  let any = false;
  ctx.beginPath();
  for (let k = 0; k < hazards.length; k++) {
    const h = hazards[k];
    if (h.from - warn > baseIndex + last || h.from < baseIndex + first) continue;
    const lanes = laneArrows(h, warn);
    if (!lanes || !lanes.length) continue;
    for (let m = 1; m <= count; m++) {
      const tail = h.from - m * gap;          // the wide end, nearest the player
      const head = tail + alen;               // the point, further up the road
      const nt = tail - baseIndex, nh = head - baseIndex;
      if (nt < first || nh > last || !bvis[nt] || !bvis[nh]) continue;
      const st = segAt(tail);
      if (!st) continue;
      const wide = (FEEL.CAR_BODY_WIDTH * 0.55) / st.hw;
      for (let g = 0; g < lanes.length; g++) {
        any = true;
        const lx = lanes[g];
        // An arrowhead pointing the way the car is going: wide across the
        // near end, coming to a point up the road.
        ctx.moveTo(bx[nt] + bw[nt] * (lx - wide), by[nt]);
        ctx.lineTo(bx[nt] + bw[nt] * (lx + wide), by[nt]);
        ctx.lineTo(bx[nh] + bw[nh] * lx, by[nh]);
        ctx.closePath();
      }
    }
  }
  if (!any) return;
  ctx.globalAlpha = 0.5;
  ctx.fillStyle = COLOUR.HAZARD_WARN;
  ctx.fill();
  ctx.globalAlpha = 1;
}

/* The hazards themselves. One box per hazard, standing on the road, drawn
   in four batched passes over every hazard in shot: a wide faint glow, the
   near face, the top face and a lit leading edge. Four fills for the whole
   screen however many are in view, which is the same discipline the road
   itself is drawn under.

   Heights use the horizontal scale, the same way the car and the road
   thickness do, so a hazard keeps its proportions rather than being
   stretched by the vertical anisotropy. */
function hazardQuads(first, last, baseIndex, spread, top, parity) {
  let any = false;
  ctx.beginPath();
  for (let k = 0; k < hazards.length; k++) {
    const h = hazards[k];
    const x = hazardX(h);
    for (let i = h.from; i <= h.to; i++) {
      const n = i - baseIndex;
      if (n < first || n > last || !bvis[n]) continue;
      if (parity !== undefined && (i & 1) !== parity) continue;
      const seg = segAt(i);
      if (!seg) continue;
      any = true;
      const half = (h.half + spread) / seg.hw;
      const rise = top ? bh[n] * FEEL.HAZARD_HEIGHT : 0;
      const riseN = top ? bh[n + 1] * FEEL.HAZARD_HEIGHT : 0;
      const y1 = by[n] - rise, y2 = by[n + 1] - 1 - riseN;
      const l1 = bx[n] + bw[n] * (x - half), r1 = bx[n] + bw[n] * (x + half);
      const l2 = bx[n + 1] + bw[n + 1] * (x - half), r2 = bx[n + 1] + bw[n + 1] * (x + half);
      if (top) {
        // The near face, from the road up to the top of the box.
        ctx.moveTo(l1, by[n]); ctx.lineTo(r1, by[n]);
        ctx.lineTo(r1, y1); ctx.lineTo(l1, y1);
      } else {
        ctx.moveTo(l1, y1); ctx.lineTo(r1, y1); ctx.lineTo(r2, y2); ctx.lineTo(l2, y2);
      }
      ctx.closePath();
    }
  }
  return any;
}

/* The face that actually points at the player, drawn once per hazard
   with diagonal hazard striping across it. This is the whole "do not hit
   me" signal: a tall dark wall leaning bands across itself, which is what
   a crash barrier looks like everywhere in the world.

   Clipped rather than clamped, because a leaning band across a trapezoid
   has no closed form worth writing, and there are only ever a handful of
   hazards inside the draw distance. */
function drawHazardFronts(first, last, baseIndex) {
  for (let k = 0; k < hazards.length; k++) {
    const h = hazards[k];
    const n = h.from - baseIndex;
    if (n < first || n > last || !bvis[n]) continue;
    const seg = segAt(h.from);
    if (!seg) continue;
    const x = hazardX(h);
    const half = h.half / seg.hw;
    const l = bx[n] + bw[n] * (x - half), r = bx[n] + bw[n] * (x + half);
    const top = by[n] - bh[n] * FEEL.HAZARD_HEIGHT, bot = by[n];
    const wpx = r - l, hpx = bot - top;
    if (wpx < 3 || hpx < 3) continue;          // too small to read, skip the work
    ctx.save();
    ctx.beginPath();
    ctx.rect(l, top, wpx, hpx);
    ctx.clip();
    ctx.fillStyle = COLOUR.HAZARD_SIDE;
    ctx.fillRect(l, top, wpx, hpx);
    const slant = hpx * FEEL.HAZARD_STRIPE_SLANT;
    const step = (wpx + slant) / FEEL.HAZARD_STRIPE_COUNT;
    ctx.beginPath();
    for (let i = -1; i < FEEL.HAZARD_STRIPE_COUNT + 1; i += 2) {
      const b0 = l + i * step;
      ctx.moveTo(b0, bot); ctx.lineTo(b0 + step, bot);
      ctx.lineTo(b0 + step + slant, top); ctx.lineTo(b0 + slant, top);
      ctx.closePath();
    }
    ctx.fillStyle = COLOUR.HAZARD_TOP;
    ctx.fill();
    ctx.restore();
  }
}

let HAZARD_GLOW_FILL = 'rgb(' + COLOUR.HAZARD_GLOW + ')';
let GATE_GLOW_FILL = 'rgb(' + COLOUR.GATE_GLOW + ')';
function drawHazards(first, last, baseIndex) {
  if (!hazards.length) return;
  // Wide and faint first, the same two pass glow the road edges use, and
  // still no shadowBlur anywhere.
  if (hazardQuads(first, last, baseIndex, FEEL.HAZARD_CLIP * 2.2, false)) {
    ctx.globalAlpha = 0.28;
    ctx.fillStyle = HAZARD_GLOW_FILL;
    ctx.fill();
    ctx.globalAlpha = 1;
  }
  // The clip shoulder, which is a real band and is drawn as one.
  if (hazardQuads(first, last, baseIndex, FEEL.HAZARD_CLIP, false)) {
    ctx.fillStyle = COLOUR.HAZARD_SIDE;
    ctx.fill();
  }
  // The near face of the core, then its top.
  if (hazardQuads(first, last, baseIndex, 0, true)) {
    ctx.fillStyle = COLOUR.HAZARD_SIDE;
    ctx.fill();
  }
  /* The top, in alternating bands along its length. Two fills rather
     than one, and between them they say "marked object" rather than
     "coloured surface". */
  if (hazardQuads(first, last, baseIndex, 0, false, 0)) {
    ctx.fillStyle = COLOUR.HAZARD_TOP;
    ctx.fill();
  }
  if (hazardQuads(first, last, baseIndex, 0, false, 1)) {
    ctx.fillStyle = COLOUR.HAZARD_DARK;
    ctx.fill();
  }
  drawHazardFronts(first, last, baseIndex);
  // The lit top edge, so the object resolves as a solid at draw distance
  // rather than as a smear, exactly as the road lip does.
  let any = false;
  ctx.beginPath();
  for (let k = 0; k < hazards.length; k++) {
    const h = hazards[k];
    const x = hazardX(h);
    for (let i = h.from; i <= h.to; i++) {
      const n = i - baseIndex;
      if (n < first || n > last || !bvis[n]) continue;
      const seg = segAt(i);
      if (!seg) continue;
      any = true;
      const half = h.half / seg.hw;
      const rise = bh[n] * FEEL.HAZARD_HEIGHT;
      const y = by[n] - rise;
      const t = Math.max(1.2, bh[n] * 90);
      const l1 = bx[n] + bw[n] * (x - half), r1 = bx[n] + bw[n] * (x + half);
      ctx.moveTo(l1, y - t); ctx.lineTo(r1, y - t);
      ctx.lineTo(r1, y + t); ctx.lineTo(l1, y + t);
      ctx.closePath();
    }
  }
  if (any) { ctx.fillStyle = COLOUR.HAZARD_LIP; ctx.fill(); }
}

/* One colour, both sides of the road, every segment on the given stripe.
   from and to are fractions of the half width, measured outward from the
   centre line. */
function bandPass(first, last, wantLight, from, to, colour) {
  ctx.beginPath();
  let any = false;
  for (let n = first; n <= last; n++) {
    if (!bvis[n] || blight[n] !== wantLight) continue;
    any = true;
    const y1 = by[n], y2 = by[n + 1] - 1;
    const a1 = bw[n] * from, a2 = bw[n + 1] * from;
    const c1 = bw[n] * to, c2 = bw[n + 1] * to;
    ctx.moveTo(bx[n] - c1, y1); ctx.lineTo(bx[n] - a1, y1);
    ctx.lineTo(bx[n + 1] - a2, y2); ctx.lineTo(bx[n + 1] - c2, y2);
    ctx.closePath();
    ctx.moveTo(bx[n] + c1, y1); ctx.lineTo(bx[n] + a1, y1);
    ctx.lineTo(bx[n + 1] + a2, y2); ctx.lineTo(bx[n + 1] + c2, y2);
    ctx.closePath();
  }
  if (!any) return;
  ctx.fillStyle = colour;
  ctx.fill();
}

function surfacePass(first, last, wantLight, colour) {
  ctx.beginPath();
  let any = false;
  for (let n = first; n <= last; n++) {
    if (!bvis[n] || blight[n] !== wantLight) continue;
    any = true;
    const y1 = by[n], y2 = by[n + 1] - 1;
    ctx.moveTo(bx[n] - bw[n], y1); ctx.lineTo(bx[n] + bw[n], y1);
    ctx.lineTo(bx[n + 1] + bw[n + 1], y2); ctx.lineTo(bx[n + 1] - bw[n + 1], y2);
    ctx.closePath();
  }
  if (!any) return;
  ctx.fillStyle = colour;
  ctx.fill();
}

function lanePass(first, last) {
  const f = FEEL.LANE_DASH_FRACTION;
  ctx.beginPath();
  let any = false;
  for (let n = first; n <= last; n++) {
    if (!bvis[n] || !blight[n]) continue;
    any = true;
    const y1 = by[n], y2 = by[n + 1] - 1;
    const l1 = bw[n] * f, l2 = bw[n + 1] * f;
    ctx.moveTo(bx[n] - l1, y1); ctx.lineTo(bx[n] + l1, y1);
    ctx.lineTo(bx[n + 1] + l2, y2); ctx.lineTo(bx[n + 1] - l2, y2);
    ctx.closePath();
  }
  if (!any) return;
  ctx.fillStyle = COLOUR.LANE;
  ctx.fill();
}

/* The wide faint half of the glow, over the road and the void alike so it
   spills both ways. One fill for both edges and the whole draw distance.

   THE HEAT HALF IS A SEPARATE PASS AND IT SKIPS THE LIP, and that is not
   tidiness, it is hard limit one holding. The glow band covers the lip,
   so simply raising its alpha with the multiplier DARKENS the brightest
   thing on screen: measured, the lip fell from 207 to 182 in luminance
   going from a multiplier of one to the cap, while the car sat unmoved at
   246. That is the spectacle making the road harder to read, which is
   exactly the failure the limits are there to catch.

   So the resting pass is untouched, to the pixel, and the heat pass is
   drawn inboard and outboard of the lip only. The edge therefore gains
   width and glow as the multiplier climbs and the lip itself can only
   ever gain luminance, from the hot ramp on its dim stripe. */
function edgeGlowPass(first, last) {
  glowBandPath(first, last, EDGE_OUT - FEEL.EDGE_LIP_FRACTION - FEEL.EDGE_GLOW_SPREAD,
               EDGE_OUT + FEEL.EDGE_GLOW_SPREAD);
  ctx.globalAlpha = FEEL.EDGE_GLOW_ALPHA;
  ctx.fillStyle = EDGE_GLOW_FILL;
  ctx.fill();
  ctx.globalAlpha = 1;
  if (worldHeat <= 0.01) return;

  const lip = FEEL.EDGE_LIP_FRACTION;
  const spread = FEEL.EDGE_GLOW_SPREAD * (1 + FEEL.HEAT_EDGE_SPREAD * worldHeat);
  ctx.beginPath();
  glowBandPath(first, last, EDGE_OUT - lip - spread, EDGE_OUT - lip, true);
  glowBandPath(first, last, EDGE_OUT, EDGE_OUT + spread, true);
  ctx.globalAlpha = FEEL.HEAT_EDGE_GLOW * worldHeat;
  ctx.fillStyle = EDGE_GLOW_FILL;
  ctx.fill();
  ctx.globalAlpha = 1;
}

/* Both edges, the whole draw distance, between two fractions of the half
   width. Pass keep to add to a path already open rather than start one. */
function glowBandPath(first, last, inner, outer, keep) {
  if (!keep) ctx.beginPath();
  for (let n = first; n <= last; n++) {
    if (!bvis[n]) continue;
    // The band is under a pixel from here on, so it costs fill rate and
    // shows nothing. Widths shrink with distance, so this can break.
    if (bw[n] < GLOW_CULL_PX) break;
    const y1 = by[n], y2 = by[n + 1] - 1;
    const a1 = bw[n] * inner, a2 = bw[n + 1] * inner;
    const c1 = bw[n] * outer, c2 = bw[n + 1] * outer;
    ctx.moveTo(bx[n] - c1, y1); ctx.lineTo(bx[n] - a1, y1);
    ctx.lineTo(bx[n + 1] - a2, y2); ctx.lineTo(bx[n + 1] - c2, y2);
    ctx.closePath();
    ctx.moveTo(bx[n] + c1, y1); ctx.lineTo(bx[n] + a1, y1);
    ctx.lineTo(bx[n + 1] + a2, y2); ctx.lineTo(bx[n + 1] + c2, y2);
    ctx.closePath();
  }
}

/* The bleed. Hangs off the outer bottom corner of the slab, downward and
   outward onto the void, and dies fast.

   Its top edge lies exactly on the slab's outer bottom corner and it only
   ever goes down and out from there, so it never touches the drivable
   surface, the lip or the shoulder and cannot move any of the numbers the
   hard rule is about. */
function edgeBleedPass(first, last) {
  // Zero means off, and off costs nothing rather than three transparent
  // fills. The cycler can take it to zero, so this is the real path.
  if (FEEL.EDGE_BLEED_ALPHA <= 0) return;
  const w = view.w;
  const bands = Math.max(1, Math.round(FEEL.EDGE_BLEED_BANDS));
  const px = Math.min(w, view.h) * FEEL.EDGE_BLEED_PX;

  /* STROKED, NOT FILLED, and that is a performance decision with a
     measurement behind it. The first version filled a quad per segment
     per band: about 380 subpaths in each of three paths, and it measured
     between two and five milliseconds a frame for roughly six hundred
     visible pixels, because the rasteriser pays for path complexity and
     bounding boxes rather than for lit pixels. On a five year old Celeron
     that is a tenth of the frame budget for a subtle glow, which is not a
     trade worth making.

     The edge is a line, so stroke the line. Two polylines, one per side,
     in a single path, offset DOWNWARD by half the stroke width so the
     whole stroke lands below the slab's outer corner and none of it
     spills back up onto the road. Wider and fainter first, so the stack
     is the falloff exactly as before.

     The width is in screen pixels rather than scaled per segment, which
     is the one thing given up by stroking. It is the right thing to give
     up: a spill that is tight to the edge everywhere is what was asked
     for, and a spill that grew with the near geometry was the part most
     at risk of reading as ground. */
  ctx.lineCap = 'butt';
  ctx.lineJoin = 'round';
  ctx.strokeStyle = EDGE_GLOW_FILL;
  for (let k = bands; k >= 1; k--) {
    const t = k / bands;
    const lw = px * t;
    let any = false;
    ctx.beginPath();
    for (const side of [-1, 1]) {
      let started = false;
      for (let n = first; n <= last; n++) {
        if (!bvis[n]) continue;
        if (bw[n] < GLOW_CULL_PX) break;
        const x = bx[n] + side * (bw[n] * EDGE_OUT + bf[n]);
        // Off the side of the screen near the camera, where the corner is
        // hundreds of pixels wide of the frame and costs the most.
        if (x < -lw || x > w + lw) { started = false; continue; }
        const y = by[n] + bt[n] + lw * 0.5;
        if (started) ctx.lineTo(x, y); else { ctx.moveTo(x, y); started = true; }
        any = true;
      }
    }
    if (!any) continue;
    ctx.lineWidth = lw;
    ctx.globalAlpha = FEEL.EDGE_BLEED_ALPHA;
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
  ctx.lineWidth = 1;
}

/* A second glowing line, along the bottom of the slab. Two lit lines with
   darkness between them state the thickness outright, where one line and
   an occluded silhouette only implied it. */
function drawSlabUnderline(first, last) {
  const scaleW = FEEL.SLAB_BOTTOM_WIDTH / FEEL.ROAD_HALF_WIDTH_BASE;
  const scaleG = FEEL.SLAB_BOTTOM_GLOW / FEEL.ROAD_HALF_WIDTH_BASE;
  underlinePath(first, last, scaleG);
  ctx.globalAlpha = FEEL.EDGE_GLOW_ALPHA;
  ctx.fillStyle = SLAB_BOTTOM_GLOW_FILL;
  ctx.fill();
  ctx.globalAlpha = 1;
  underlinePath(first, last, scaleW);
  ctx.fillStyle = COLOUR.SLAB_BOTTOM;
  ctx.fill();
}

function underlinePath(first, last, thick) {
  ctx.beginPath();
  for (let n = first; n <= last; n++) {
    if (!bvis[n]) continue;
    if (bw[n] < GLOW_CULL_PX) break;
    const o1 = bw[n] * EDGE_OUT + bf[n], o2 = bw[n + 1] * EDGE_OUT + bf[n + 1];
    const y1 = by[n] + bt[n], y2 = by[n + 1] + bt[n + 1];
    const t1 = bw[n] * thick, t2 = bw[n + 1] * thick;
    ctx.moveTo(bx[n] - o1, y1 - t1); ctx.lineTo(bx[n] - o1, y1 + t1);
    ctx.lineTo(bx[n + 1] - o2, y2 + t2); ctx.lineTo(bx[n + 1] - o2, y2 - t2);
    ctx.closePath();
    ctx.moveTo(bx[n] + o1, y1 - t1); ctx.lineTo(bx[n] + o1, y1 + t1);
    ctx.lineTo(bx[n + 1] + o2, y2 + t2); ctx.lineTo(bx[n + 1] + o2, y2 - t2);
    ctx.closePath();
  }
}

/* Posts down both edges. Three batched fills for the lot: the faint glow,
   the ordinary posts and the taller marker posts. */
function drawPylons(first, last, baseIndex, w) {
  const spacing = FEEL.PYLON_SPACING;
  const scaleH = 1 / FEEL.ROAD_HALF_WIDTH_BASE;
  /* The pylons pulsing with the multiplier. The pulse rides the glow pass
     only, so the posts themselves never move or change size and the road
     edge outboard of which they stand is untouched. heatPulse is exactly
     1 at a multiplier of one, so at rest this is the old drawing to the
     pixel and there is no pulse to notice. */
  const glow = FEEL.PYLON_GLOW_SPREAD * (1 + FEEL.HEAT_PYLON_SPREAD * worldHeat);
  pylonPath(first, last, baseIndex, spacing, glow, scaleH, 2);
  ctx.globalAlpha = Math.min(1,
    (FEEL.PYLON_GLOW_ALPHA + FEEL.HEAT_PYLON_GLOW * worldHeat) * heatPulse);
  ctx.fillStyle = PYLON_GLOW_FILL;
  ctx.fill();
  ctx.globalAlpha = 1;
  pylonPath(first, last, baseIndex, spacing, 1, scaleH, 0);
  ctx.fillStyle = COLOUR.PYLON;
  ctx.fill();
  pylonPath(first, last, baseIndex, spacing, 1, scaleH, 1);
  ctx.fillStyle = COLOUR.PYLON_MAJOR;
  ctx.fill();
}

/* which: 0 ordinary posts, 1 marker posts, 2 both. */
function pylonPath(first, last, baseIndex, spacing, widen, scaleH, which) {
  ctx.beginPath();
  for (let n = first; n <= last; n++) {
    if (!bvis[n]) continue;
    const idx = baseIndex + n;
    if (idx % spacing !== 0) continue;
    const major = ((idx / spacing) % FEEL.PYLON_MAJOR_EVERY) === 0;
    if (which !== 2 && (which === 1) !== major) continue;

    const hWorld = major ? FEEL.PYLON_MAJOR_HEIGHT : FEEL.PYLON_HEIGHT;
    const wWorld = (major ? FEEL.PYLON_MAJOR_WIDTH : FEEL.PYLON_WIDTH) * widen;
    // Heights use the horizontal scale, as everything standing up does.
    const rise = bw[n] * hWorld * scaleH;
    if (rise < FEEL.PYLON_MIN_PX) continue;
    const half = bw[n] * wWorld * scaleH * 0.5;
    const out = bw[n] * (EDGE_OUT + FEEL.PYLON_OUT);
    const base = by[n];
    const top = base - rise;

    ctx.moveTo(bx[n] - out - half, top); ctx.lineTo(bx[n] - out + half, top);
    ctx.lineTo(bx[n] - out + half, base); ctx.lineTo(bx[n] - out - half, base);
    ctx.closePath();
    ctx.moveTo(bx[n] + out - half, top); ctx.lineTo(bx[n] + out + half, top);
    ctx.lineTo(bx[n] + out + half, base); ctx.lineTo(bx[n] + out - half, base);
    ctx.closePath();
  }
}

/* The sides of the slab, every visible one batched into a single path so
   the whole cliff costs one fill rather than one per segment.

   These are drawn on both sides regardless of which way the road turns.
   Strictly the outside wall of a corner faces away from the camera and
   should not be there, and on a dead straight road neither wall is
   visible at all, because a vertical plane seen from directly behind and
   above is exactly edge on. Drawing only the true ones would mean the
   road has no thickness on any straight, which is the flat decal the
   whole change is meant to avoid. So this is a stylisation and the one
   place here where the look wins over the geometry. */
function drawWalls(count) {
  ctx.beginPath();
  for (let n = 0; n < count; n++) {
    if (bz[n] <= CAMERA_DEPTH) continue;
    if (by[n + 1] >= by[n]) continue;
    if (bw[n] < WALL_CULL_PX) break;
    const o1 = bw[n] * EDGE_OUT, o2 = bw[n + 1] * EDGE_OUT;
    const l1 = bx[n] - o1, l2 = bx[n + 1] - o2;
    const r1 = bx[n] + o1, r2 = bx[n + 1] + o2;
    const y1 = by[n], y2 = by[n + 1];
    const d1 = y1 + bt[n], d2 = y2 + bt[n + 1];
    const f1 = bf[n], f2 = bf[n + 1];
    ctx.moveTo(l1, y1); ctx.lineTo(l2, y2);
    ctx.lineTo(l2 - f2, d2); ctx.lineTo(l1 - f1, d1);
    ctx.closePath();
    ctx.moveTo(r1, y1); ctx.lineTo(r2, y2);
    ctx.lineTo(r2 + f2, d2); ctx.lineTo(r1 + f1, d1);
    ctx.closePath();
  }
  ctx.fillStyle = COLOUR.WALL;
  ctx.fill();
}

/* The trail. Two lines from the rear wheel contact points, so they still
   scissor apart under drift, but they now fade out behind the car and run
   from cool to hot with the slip that laid them. A run driven on the
   limit leaves a brighter line than a tidy one, which is the whole point:
   the prettiest thing on screen is the thing risk buys. */
/* Deep blue, through cyan, to a hot white. Precomputed, because this is
   read once per marked segment.

   It went through magenta while the road was blue, and magenta was the
   wrong choice the moment the road turned warm: it is close enough in hue
   to the asphalt that the mark stopped separating from it. Blue to cyan
   to white is the far side of the wheel from every road colour, and it
   also puts the intensity in value, which is what survives a hue rotation
   with the mark still legible against the surface. */
const TRAIL_RAMP = [];
const TRAIL_STOPS = ['TRAIL_0', 'TRAIL_1', 'TRAIL_2', 'TRAIL_3', 'TRAIL_4'];

function trailColour(intensity) {
  let i = Math.round(intensity * (TRAIL_RAMP.length - 1));
  if (i < 0) i = 0; else if (i >= TRAIL_RAMP.length) i = TRAIL_RAMP.length - 1;
  return TRAIL_RAMP[i];
}

function drawTrail(first, last, baseIndex) {
  const base = FEEL.ROAD_HALF_WIDTH_BASE;
  for (let n = first; n <= last; n++) {
    if (!bvis[n]) continue;
    const s = segAt(baseIndex + n);
    if (!s || s.ma <= 0) continue;
    // Age behind the car, which is what fades it.
    const age = carSegIndex - s.index;
    if (age < 0) continue;
    const fade = 1 - age / FEEL.TRAIL_FADE_SEGMENTS;
    if (fade <= 0) continue;

    const mw = FEEL.TYRE_MARK_WIDTH * base / s.hw;
    const colour = trailColour(s.ma);
    const y1 = by[n], y2 = by[n + 1] - 1;
    const w1 = bw[n], w2 = bw[n + 1];

    ctx.fillStyle = colour;
    ctx.globalAlpha = s.ma * FEEL.TYRE_MARK_MAX_ALPHA * FEEL.TRAIL_GLOW_ALPHA * fade;
    trailQuads(s, mw * FEEL.TRAIL_GLOW_SPREAD, bx[n], bx[n + 1], w1, w2, y1, y2);
    ctx.globalAlpha = s.ma * FEEL.TYRE_MARK_MAX_ALPHA * fade;
    trailQuads(s, mw, bx[n], bx[n + 1], w1, w2, y1, y2);
  }
  ctx.globalAlpha = 1;
}

function trailQuads(s, mw, x1, x2, w1, w2, y1, y2) {
  ctx.beginPath();
  ctx.moveTo(x1 + (s.ml0 - mw) * w1, y1); ctx.lineTo(x1 + (s.ml0 + mw) * w1, y1);
  ctx.lineTo(x2 + (s.ml1 + mw) * w2, y2); ctx.lineTo(x2 + (s.ml1 - mw) * w2, y2);
  ctx.closePath();
  ctx.moveTo(x1 + (s.mr0 - mw) * w1, y1); ctx.lineTo(x1 + (s.mr0 + mw) * w1, y1);
  ctx.lineTo(x2 + (s.mr1 + mw) * w2, y2); ctx.lineTo(x2 + (s.mr1 - mw) * w2, y2);
  ctx.closePath();
  ctx.fill();
}

/* ==================================================================
   THE CAR

   A real box in the world, not a sprite. Its corners are defined in car
   local space, rolled, yawed, moved out to where the car is, and then
   projected one at a time through the same projection the road uses. The
   front corners are further from the camera than the rear ones, so they
   come back smaller and the two ends move differently on screen without
   anything animating them. That is the entire illusion.

   Faces are filled flat, one tone each, and culled by their own normal
   rather than by any winding convention. The box is convex, so culling
   alone gives the right answer and nothing needs sorting.
   ================================================================== */

// Car local space: x right, y up from the road surface, z forward.
const carT = { worldX: 0, worldY: 0, worldZ: 0, cosY: 1, sinY: 0, cosR: 1, sinR: 0, cosP: 1, sinP: 0 };

const boxPts = [];
for (let i = 0; i < 8; i++) boxPts.push({ wx: 0, wy: 0, wz: 0, sx: 0, sy: 0 });

const BOX_FACES = [
  { idx: [0, 1, 2, 3], nx: 0, ny: 0, nz: -1 },   // rear, the one facing the camera
  { idx: [5, 4, 7, 6], nx: 0, ny: 0, nz: 1 },    // front
  { idx: [4, 0, 3, 7], nx: -1, ny: 0, nz: 0 },   // left
  { idx: [1, 5, 6, 2], nx: 1, ny: 0, nz: 0 },    // right
  { idx: [3, 2, 6, 7], nx: 0, ny: 1, nz: 0 },    // top
  { idx: [4, 5, 1, 0], nx: 0, ny: -1, nz: 0 }    // bottom
];

/* Local to world. roll is applied about the forward axis first, so the
   body leans while the wheels stay flat on the road, then yaw, then the
   car's position. */
function carToWorld(out, lx, ly, lz, rolled) {
  let rx = lx, ry = ly;
  if (rolled) {
    const py = ly - FEEL.CAR_ROLL_PIVOT;
    rx = lx * carT.cosR - py * carT.sinR;
    ry = py * carT.cosR + lx * carT.sinR + FEEL.CAR_ROLL_PIVOT;
  }
  // Pitch about the car's own lateral axis. Flat while driving, and the
  // tumble once it has gone over the edge.
  const pz = lz * carT.cosP - ry * carT.sinP;
  const py2 = ry * carT.cosP + lz * carT.sinP;
  out.wx = carT.worldX + rx * carT.cosY + pz * carT.sinY;
  out.wy = carT.worldY + py2;
  out.wz = carT.worldZ + pz * carT.cosY - rx * carT.sinY;
  return out;
}

const dirOut = { wx: 0, wy: 0, wz: 0 };
function carDirToWorld(lx, ly, lz, rolled) {
  let rx = lx, ry = ly;
  if (rolled) {
    rx = lx * carT.cosR - ly * carT.sinR;
    ry = ly * carT.cosR + lx * carT.sinR;
  }
  const pz = lz * carT.cosP - ry * carT.sinP;
  const py2 = ry * carT.cosP + lz * carT.sinP;
  dirOut.wx = rx * carT.cosY + pz * carT.sinY;
  dirOut.wy = py2;
  dirOut.wz = pz * carT.cosY - rx * carT.sinY;
  return dirOut;
}

/* Build, transform, project and fill one box. Offsets are in car local
   space; yaw is an extra rotation about the box's own centre, which is
   what turns the front wheels against the body. */
/* ------------------------------------------------------------------
   THE BODY, lofted through the stations in FEEL.CAR_STATIONS.

   Each station is a closed ring of eight points: sill, hip, shoulder and
   roof, mirrored. Consecutive rings are joined into quads, which gives a
   chamfered, tapered solid with a fastback roofline and arches flared at
   the axles, out of nothing but numbers. Flat fills per face, no
   gradients, no textures: section 7.5's cut and folded from paper, which
   is what this technique is actually good at.

   Backfaces are culled from a real cross product in world space rather
   than a table, because a lofted hull has no fixed winding to rely on.
   With a convex hull that is the whole visibility problem solved and no
   sort is needed.
   ------------------------------------------------------------------ */
const RING = 8;
const ringPts = [];
for (let i = 0; i < 128; i++) ringPts.push({ wx: 0, wy: 0, wz: 0, sx: 0, sy: 0 });

/* One station's eight points, anticlockwise seen from the front:
   0 sill left, 1 sill right, 2 hip right, 3 shoulder right, 4 roof right,
   5 roof left, 6 shoulder left, 7 hip left. */
function stationRing(st, halfW, bodyH, y0, out, base, camX, w, h) {
  const z = st[0], sill = st[1], hip = st[2], sh = st[3], roof = st[4];
  const yl = st[5], yh = st[6], ys = st[7], yr = st[8];
  const xs = [-sill, sill, hip, sh, roof, -roof, -sh, -hip];
  const ys2 = [yl, yl, yh, ys, yr, yr, ys, yh];
  for (let i = 0; i < RING; i++) {
    const pt = out[base + i];
    carToWorld(pt, xs[i] * halfW, y0 + ys2[i] * bodyH, z * halfW * 0, false);
    // z is a fraction of the half LENGTH and is applied separately so the
    // ring maths above stays in width units.
    carToWorld(pt, xs[i] * halfW, y0 + ys2[i] * bodyH, z * carMesh.halfL, false);
    projectPoint(pt, pt.wx, pt.wy, pt.wz, camX, w, h);
  }
}

const carMesh = { halfL: 0 };
const meshN = { wx: 0, wy: 0, wz: 0 };

function faceVisible(a, b, c, d, camX) {
  const ux = b.wx - a.wx, uy = b.wy - a.wy, uz = b.wz - a.wz;
  const vx = c.wx - a.wx, vy = c.wy - a.wy, vz = c.wz - a.wz;
  meshN.wx = uy * vz - uz * vy;
  meshN.wy = uz * vx - ux * vz;
  meshN.wz = ux * vy - uy * vx;
  const cx = (a.wx + b.wx + c.wx + d.wx) * 0.25 - camX;
  const cy = (a.wy + b.wy + c.wy + d.wy) * 0.25 - camHeight;
  const cz = (a.wz + b.wz + c.wz + d.wz) * 0.25;
  return meshN.wx * cx + meshN.wy * cy + meshN.wz * cz < 0;
}

/* Which tone a face of the hull takes. The band it sits in does the
   shading, exactly the way a flat shaded model has to: roof catches the
   sky, shoulder is the upper flank, hip is the widest and brightest edge
   of the side, sill is always in its own shadow. */
function hullColour(i, z0, z1) {
  const mid = (z0 + z1) * 0.5;
  const glass = mid > FEEL.CAR_GLASS_FROM && mid < FEEL.CAR_GLASS_TO;
  /* From directly above, which is what portrait gives you, the top face
     is nearly all you see. Painting it one colour for the whole length is
     what turned the car into a blob. So the roof over the cabin is GLASS
     and the roof either side of it is body, which reads top down as body,
     glass, body: three bands that describe the taper instead of hiding
     it. The upper flanks stay light, so the dark glass is framed rather
     than bleeding into the sides. */
  if (i === 4) return glass ? COLOUR.CAR_GLASS : COLOUR.CAR_TOP;    // roof
  if (i === 3 || i === 5) return COLOUR.CAR_CABIN_TOP;              // shoulder
  if (i === 2 || i === 6) return COLOUR.CAR_END;                    // shoulder
  if (i === 1 || i === 7) return COLOUR.CAR_HIP;                    // hip, widest
  return COLOUR.CAR_SILL;                                           // sill
}

function drawHull(halfW, bodyH, y0, camX, w, h, seam) {
  const st = FEEL.CAR_STATIONS;
  const n = st.length;
  for (let k = 0; k < n; k++) {
    stationRing(st[k], halfW, bodyH, y0, ringPts, k * RING, camX, w, h);
  }
  // The skin.
  for (let k = 0; k < n - 1; k++) {
    const a0 = k * RING, b0 = (k + 1) * RING;
    for (let i = 0; i < RING; i++) {
      const j = (i + 1) % RING;
      const p1 = ringPts[a0 + i], p2 = ringPts[a0 + j];
      const p3 = ringPts[b0 + j], p4 = ringPts[b0 + i];
      if (!faceVisible(p1, p2, p3, p4, camX)) continue;
      ctx.fillStyle = hullColour(i, st[k][0], st[k + 1][0]);
      polygon(p1.sx, p1.sy, p2.sx, p2.sy, p3.sx, p3.sy, p4.sx, p4.sy);
      if (seam) ctx.stroke();
    }
  }
  // The tail cap, which is the face the player looks at all run.
  const t = 0;
  ctx.beginPath();
  ctx.moveTo(ringPts[t].sx, ringPts[t].sy);
  for (let i = 1; i < RING; i++) ctx.lineTo(ringPts[t + i].sx, ringPts[t + i].sy);
  ctx.closePath();
  ctx.fillStyle = COLOUR.CAR_END;
  ctx.fill();
  if (seam) ctx.stroke();
}

/* A flat quad placed in car space, used for the light bar. Four points,
   no culling: it sits on the tail and the camera is behind the tail. */
const quadPts = [{wx:0,wy:0,wz:0,sx:0,sy:0},{wx:0,wy:0,wz:0,sx:0,sy:0},
                 {wx:0,wy:0,wz:0,sx:0,sy:0},{wx:0,wy:0,wz:0,sx:0,sy:0}];
function quadInCar(x0, y0, z0, x1, y1, z1, camX, w, h) {
  // Upright when z0 and z1 match, flat on its back when they do not, which
  // is how the same helper draws both the light strip and the wing shadow.
  const flat = z0 !== z1;
  const xs = [x0, x1, x1, x0];
  const ys = flat ? [y0, y0, y1, y1] : [y0, y0, y1, y1];
  const zs = flat ? [z0, z0, z1, z1] : [z0, z0, z0, z0];
  for (let i = 0; i < 4; i++) {
    const pt = quadPts[i];
    carToWorld(pt, xs[i], ys[i], zs[i], false);
    projectPoint(pt, pt.wx, pt.wy, pt.wz, camX, w, h);
  }
  polygon(quadPts[0].sx, quadPts[0].sy, quadPts[1].sx, quadPts[1].sy,
          quadPts[2].sx, quadPts[2].sy, quadPts[3].sx, quadPts[3].sy);
}

function drawBox(ox, oy, oz, hw, hh, hl, extraYaw, rolled, faceColours, stroked, camX, w, h) {
  const cy = Math.cos(extraYaw), sy = Math.sin(extraYaw);
  for (let i = 0; i < 8; i++) {
    const sx = (i === 0 || i === 3 || i === 4 || i === 7) ? -hw : hw;
    const sh = (i === 2 || i === 3 || i === 6 || i === 7) ? hh : -hh;
    const sl = (i >= 4) ? hl : -hl;
    // Spin the box about its own vertical axis before it is placed.
    const lx = ox + sx * cy + sl * sy;
    const lz = oz + sl * cy - sx * sy;
    carToWorld(boxPts[i], lx, oy + sh, lz, rolled);
    projectPoint(boxPts[i], boxPts[i].wx, boxPts[i].wy, boxPts[i].wz, camX, w, h);
  }

  for (let f = 0; f < 6; f++) {
    const face = BOX_FACES[f];
    const colour = faceColours[f];
    if (!colour) continue;
    // The face normal, spun with the box and then transformed like any
    // other direction. No winding convention to get wrong.
    const nlx = face.nx * cy + face.nz * sy;
    const nlz = face.nz * cy - face.nx * sy;
    const n = carDirToWorld(nlx, face.ny, nlz, rolled);
    const a = boxPts[face.idx[0]], b = boxPts[face.idx[1]];
    const c = boxPts[face.idx[2]], d = boxPts[face.idx[3]];
    // Centre of the face, against the camera at (camX, CAMERA_HEIGHT, 0).
    const vx = (a.wx + b.wx + c.wx + d.wx) * 0.25 - camX;
    const vy = (a.wy + b.wy + c.wy + d.wy) * 0.25 - camHeight;
    const vz = (a.wz + b.wz + c.wz + d.wz) * 0.25;
    if (n.wx * vx + n.wy * vy + n.wz * vz >= 0) continue;   // facing away
    if (f === 0) drawBox.drewRear = true;
    ctx.fillStyle = colour;
    polygon(a.sx, a.sy, b.sx, b.sy, c.sx, c.sy, d.sx, d.sy);
    // The fold lines. At fifty pixels across, flat tones alone do not
    // separate the roof from the boot from the side, and the car reads as
    // one yellow blob. The edges are what make it read as folded paper.
    if (stroked) ctx.stroke();
  }
}
drawBox.drewRear = false;

/* A sub rectangle of a face that has already been projected, by bilinear
   interpolation of its four screen corners. Cheaper and exactly right for
   putting lights on the flat back panel. */
function faceInset(quad, u0, u1, v0, v1) {
  const p = faceInset.buf;
  const bl = quad[0], br = quad[1], tr = quad[2], tl = quad[3];
  for (let i = 0; i < 4; i++) {
    const u = (i === 0 || i === 3) ? u0 : u1;
    const v = (i < 2) ? v0 : v1;
    const bx = bl.sx + (br.sx - bl.sx) * u, by = bl.sy + (br.sy - bl.sy) * u;
    const tx = tl.sx + (tr.sx - tl.sx) * u, tyy = tl.sy + (tr.sy - tl.sy) * u;
    p[i].x = bx + (tx - bx) * v;
    p[i].y = by + (tyy - by) * v;
  }
  return p;
}
faceInset.buf = [{ x: 0, y: 0 }, { x: 0, y: 0 }, { x: 0, y: 0 }, { x: 0, y: 0 }];

const rearFaceQuad = [{ sx: 0, sy: 0 }, { sx: 0, sy: 0 }, { sx: 0, sy: 0 }, { sx: 0, sy: 0 }];
const WING_COLOURS = [COLOUR.CAR_SPOILER, COLOUR.CAR_SPOILER, COLOUR.CAR_SPOILER,
                      COLOUR.CAR_WING_GAP, COLOUR.CAR_END, COLOUR.CAR_END];
let CAR_RIM_GLOW_FILL = 'rgb(' + COLOUR.CAR_RIM_GLOW + ')';
let CAR_LIGHT_GLOW_FILL = 'rgb(' + COLOUR.CAR_LIGHT_GLOW + ')';

/* Copy the rear face of whichever box was drawn last, so an inset can be
   painted on it without projecting anything again. */
function captureRearFace() {
  for (let i = 0; i < 4; i++) {
    rearFaceQuad[i].sx = boxPts[BOX_FACES[0].idx[i]].sx;
    rearFaceQuad[i].sy = boxPts[BOX_FACES[0].idx[i]].sy;
  }
}

/* A lit strip on that captured face, given a centre and half sizes in
   face coordinates, where u runs across it and v up it. */
function lightStrip(u, du, v, dv) {
  const q = faceInset(rearFaceQuad, u - du, u + du, v - dv, v + dv);
  polygon(q[0].x, q[0].y, q[1].x, q[1].y, q[2].x, q[2].y, q[3].x, q[3].y);
}

/* Screen positions the smoke spawns from, filled in here and read on the
   next frame. One frame of lag on a puff's starting point is invisible. */
const carParts = { rlx: 0, rly: 0, rrx: 0, rry: 0, scale: 20 };
const poolPt = { wx: 0, wy: 0, wz: 0, sx: 0, sy: 0 };

/* The car's own glow, running the same way the trail does, from amber
   when it is gripping to a hot white when it is fully sideways. It stays
   warm at both ends, because one warm object in a cool world is how the
   eye finds it instantly, and that discipline is not up for negotiation.
   Slip drives the trail and the car from one variable. */
const CAR_GLOW_RAMP = [];
/* The fold lines. Dark rather than lit: on a body this chamfered the
   seams are already doing their job by separating tones, and a bright
   outline on every face turns a solid into a wireframe and eats the
   silhouette section 7 asks for. */
const CAR_SEAM_RAMP = [];
const CAR_HEAT_STOPS = ['CAR_HEAT_0', 'CAR_HEAT_1', 'CAR_HEAT_2', 'CAR_HEAT_3'];
function carGlowIndex() {
  let i = Math.round(drift.slipNorm * (CAR_GLOW_RAMP.length - 1));
  if (i < 0) i = 0; else if (i >= CAR_GLOW_RAMP.length) i = CAR_GLOW_RAMP.length - 1;
  return i;
}

const BODY_COLOURS = [COLOUR.CAR_END, COLOUR.CAR_END, COLOUR.CAR_SIDE, COLOUR.CAR_SIDE, COLOUR.CAR_TOP, null];
/* Only the back of the cabin is glass. The sides are pillars and painted
   metal, and colouring them dark made the roof read as a hole. */
const CABIN_COLOURS = [COLOUR.CAR_GLASS, COLOUR.CAR_GLASS, COLOUR.CAR_SIDE, COLOUR.CAR_SIDE, COLOUR.CAR_CABIN_TOP, null];
const WHEEL_COLOURS = [COLOUR.CAR_TYRE, COLOUR.CAR_TYRE, COLOUR.CAR_TYRE, COLOUR.CAR_TYRE, COLOUR.CAR_TYRE_TOP, null];
const SHADOW_COLOURS = [null, null, null, null, COLOUR.CAR_SHADOW, null];

/* The light pool, as a falloff rather than as flat steps. Nested flat
   quads read as nested rectangles, which is worse than no pool at all.
   One radial gradient per ramp step, built once and then filled through a
   scaled transform, so it costs a single fill and no allocation. */
const CAR_POOL_GRADS = [];

/* ==================================================================
   EVERYTHING PRECOMPUTED FROM THE PALETTE, IN ONE PLACE.

   A hue rotation that reaches COLOUR but not the ramps and cached fills
   built out of it leaves last biome's colours scattered through the new
   one, and they show up in exactly the places the eye is already looking:
   the edge glow, the tyre marks, the car. So every derived value is
   rebuilt here and nowhere else, and every one of them is a `let` or an
   array mutated in place rather than a const built at load.
   ================================================================== */
const stopBuf = [];
function stopRampInto(out, keys, n) {
  out.length = 0;
  const stops = [];
  for (let i = 0; i < keys.length; i++) stops.push(rgbOf('rgb(' + COLOUR[keys[i]] + ')'));
  for (let i = 0; i < n; i++) {
    const t = i / (n - 1) * (stops.length - 1);
    const a = stops[Math.floor(t)], b = stops[Math.min(stops.length - 1, Math.floor(t) + 1)];
    const f = t - Math.floor(t);
    out.push([Math.round(a[0] + (b[0] - a[0]) * f),
              Math.round(a[1] + (b[1] - a[1]) * f),
              Math.round(a[2] + (b[2] - a[2]) * f)]);
  }
  return out;
}
function setFaces(into, from) { for (let i = 0; i < from.length; i++) into[i] = from[i]; }

function rebuildDerivedColours() {
  EDGE_HOT_RAMP = rampBetween(COLOUR.EDGE_DARK, COLOUR.EDGE_LIGHT);
  // The roof lights run toward this biome's own hot hue, so the ramp has
  // to follow the place.
  SKYLINE_HOT_RAMP = rampBetween(COLOUR.SKYLINE_TOP, COLOUR.HORIZON_FADE);
  GRID_HOT_RAMP = rampBetween(COLOUR.GRID, COLOUR.GRID_NEAR);
  JUMP_DECK_RAMP = rampBetween(COLOUR.JUMP_DECK_DARK, COLOUR.JUMP_DECK);

  SMOKE_FILL = 'rgb(' + COLOUR.SMOKE + ')';
  EDGE_GLOW_FILL = 'rgb(' + COLOUR.EDGE_GLOW + ')';
  SLAB_BOTTOM_GLOW_FILL = 'rgb(' + COLOUR.SLAB_BOTTOM_GLOW + ')';
  PYLON_GLOW_FILL = 'rgb(' + COLOUR.PYLON_GLOW + ')';
  JUMP_GLOW_FILL = 'rgb(' + COLOUR.JUMP_GLOW + ')';
  HAZARD_GLOW_FILL = 'rgb(' + COLOUR.HAZARD_GLOW + ')';
  GATE_GLOW_FILL = 'rgb(' + COLOUR.GATE_GLOW + ')';
  CAR_RIM_GLOW_FILL = 'rgb(' + COLOUR.CAR_RIM_GLOW + ')';
  CAR_LIGHT_GLOW_FILL = 'rgb(' + COLOUR.CAR_LIGHT_GLOW + ')';

  stopRampInto(stopBuf, TRAIL_STOPS, 24);
  TRAIL_RAMP.length = 0;
  for (let i = 0; i < stopBuf.length; i++) {
    const c = stopBuf[i];
    TRAIL_RAMP.push('rgb(' + c[0] + ',' + c[1] + ',' + c[2] + ')');
  }

  stopRampInto(stopBuf, CAR_HEAT_STOPS, 16);
  CAR_GLOW_RAMP.length = 0;
  CAR_SEAM_RAMP.length = 0;
  CAR_POOL_GRADS.length = 0;
  for (let i = 0; i < stopBuf.length; i++) {
    const c = stopBuf[i], rgb = c[0] + ',' + c[1] + ',' + c[2];
    CAR_GLOW_RAMP.push('rgb(' + rgb + ')');
    CAR_SEAM_RAMP.push(COLOUR.CAR_SEAM);
    /* The light pool, as a falloff rather than as flat steps. Nested flat
       quads read as nested rectangles, which is worse than no pool at
       all. One radial gradient per ramp step, filled through a scaled
       transform, so it costs a single fill and no allocation per frame. */
    const grad = ctx.createRadialGradient(0, 0, 0, 0, 0, 1);
    grad.addColorStop(0, 'rgba(' + rgb + ',1)');
    grad.addColorStop(0.45, 'rgba(' + rgb + ',0.45)');
    grad.addColorStop(1, 'rgba(' + rgb + ',0)');
    CAR_POOL_GRADS.push(grad);
  }

  setFaces(WING_COLOURS, [COLOUR.CAR_SPOILER, COLOUR.CAR_SPOILER, COLOUR.CAR_SPOILER,
                          COLOUR.CAR_WING_GAP, COLOUR.CAR_END, COLOUR.CAR_END]);
  setFaces(BODY_COLOURS, [COLOUR.CAR_END, COLOUR.CAR_END, COLOUR.CAR_SIDE,
                          COLOUR.CAR_SIDE, COLOUR.CAR_TOP, null]);
  setFaces(CABIN_COLOURS, [COLOUR.CAR_GLASS, COLOUR.CAR_GLASS, COLOUR.CAR_SIDE,
                           COLOUR.CAR_SIDE, COLOUR.CAR_CABIN_TOP, null]);
  setFaces(WHEEL_COLOURS, [COLOUR.CAR_TYRE, COLOUR.CAR_TYRE, COLOUR.CAR_TYRE,
                           COLOUR.CAR_TYRE, COLOUR.CAR_TYRE_TOP, null]);
  setFaces(SHADOW_COLOURS, [null, null, null, null, COLOUR.CAR_SHADOW, null]);
}
rebuildDerivedColours();

/* The rim, glowed like everything else lit in this world: wide and faint
   under a solid core. It is a small thing but it is at the corners of the
   silhouette, where the eye already is. */
function rimGlow() {
  captureRearFace();
  ctx.globalAlpha = FEEL.CAR_RIM_GLOW_ALPHA;
  ctx.fillStyle = CAR_RIM_GLOW_FILL;
  lightStrip(0.5, 0.30 * FEEL.CAR_RIM_GLOW_SPREAD, 0.5, 0.09 * FEEL.CAR_RIM_GLOW_SPREAD);
  ctx.globalAlpha = 1;
  ctx.fillStyle = COLOUR.CAR_RIM;
  lightStrip(0.5, 0.30, 0.5, 0.09);
}

function drawCar(w, h) {
  /* An impact destroys the car. It is held for the length of the hit
     stop, which is the frozen moment of contact, and after that there is
     only debris. Going off the road is untouched: that car falls. */
  if (state === DEAD && deathKind === HIT_OBJECT && hitStop <= 0) return;
  /* Projected against the camera, positioned at the car. Those were the
     same thing until the camera started leaning into corners, and keeping
     them apart is what slides the car off centre while it does. */
  const camX = cameraX;
  const yaw = carYaw();
  const roll = clamp(drift.lateralAccel / FEEL.CAR_ROLL_REFERENCE, -1, 1)
             * FEEL.CAR_ROLL_DEG * Math.PI / 180;

  carT.worldX = carX + carCurveX;      // the car rides the road, curve and all
  carT.worldY = carY;
  carT.worldZ = FEEL.CAMERA_DISTANCE;
  carT.cosY = Math.cos(yaw);
  carT.sinY = Math.sin(yaw);
  carT.cosR = Math.cos(roll);
  carT.sinR = Math.sin(roll);
  carT.cosP = Math.cos(carPitch);
  carT.sinP = Math.sin(carPitch);

  const halfW = FEEL.CAR_BODY_WIDTH / 2;
  const halfL = FEEL.CAR_BODY_LENGTH / 2;
  const wheelR = FEEL.CAR_WHEEL_DIAMETER / 2;
  const trackHalf = FEEL.CAR_TRACK / 2;
  const baseHalf = FEEL.CAR_WHEELBASE / 2;
  const steer = steering.value * FEEL.CAR_FRONT_STEER_DEG * Math.PI / 180;

  // The shadow is the yawed footprint of the box rather than a fixed
  // ellipse. With a solid body a shape that did not turn read as a sticker
  // underneath a car; the lane dashes, the shoulder and the tyre marks are
  // the fixed reference, and they are far more legible than an ellipse.
  const glowIdx = carGlowIndex();

  // A pool of the car's own light on the road, so it sits in the world
  // rather than on it, with the contact shadow still under it. Gone once
  // it has left the road, because there is nothing there to light.
  if (carY === 0) {
    carToWorld(poolPt, 0, 0, 0, false);
    projectPoint(poolPt, poolPt.wx, poolPt.wy, poolPt.wz, camX, w, h);
    const scale = CAMERA_DEPTH / FEEL.CAMERA_DISTANCE;
    const rx = scale * halfW * FEEL.CAR_POOL_SIZE * w / 2;
    ctx.save();
    ctx.translate(poolPt.sx, poolPt.sy);
    ctx.scale(rx, rx * FEEL.CAR_POOL_SQUASH);
    ctx.globalAlpha = FEEL.CAR_POOL_ALPHA;
    ctx.fillStyle = CAR_POOL_GRADS[glowIdx];
    ctx.beginPath();
    ctx.arc(0, 0, 1, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
    ctx.globalAlpha = 1;
    drawBox(0, 1, 0, halfW * 0.96, 1, halfL * 0.96, 0, false, SHADOW_COLOURS, false, camX, w, h);
  }

  // Panel seams, lit rather than drawn in shadow.
  ctx.strokeStyle = CAR_SEAM_RAMP[glowIdx];
  ctx.lineWidth = 1;
  ctx.lineJoin = 'round';

  // Far to near: front wheels, body, rear wheels.
  drawBox(-trackHalf, wheelR, baseHalf, FEEL.CAR_WHEEL_WIDTH / 2, wheelR, wheelR * 1.02, steer, false, WHEEL_COLOURS, false, camX, w, h);
  drawBox(trackHalf, wheelR, baseHalf, FEEL.CAR_WHEEL_WIDTH / 2, wheelR, wheelR * 1.02, steer, false, WHEEL_COLOURS, false, camX, w, h);

  /* The body. One lofted hull rather than a box and a box on top of it,
     so the roofline can fall into the tail and the flanks can taper. */
  carMesh.halfL = halfL;
  drawHull(halfW, FEEL.CAR_BODY_HEIGHT, FEEL.CAR_RIDE_HEIGHT, camX, w, h, true);

  /* The rear light bar. The camera lives behind this car, so this is the
     single detail it sees most of, and it gets the same two pass glow the
     road edges get: once wide and faint, once solid, no shadowBlur.

     It burns brighter under braking, which here means scraping, so the
     one thing always in view also reports the one state that is about to
     kill you. */
  const tail = FEEL.CAR_STATIONS[0];
  const lightY = FEEL.CAR_RIDE_HEIGHT + FEEL.CAR_LIGHT_Y * FEEL.CAR_BODY_HEIGHT;
  const lightHalf = halfW * tail[2] * FEEL.CAR_LIGHT_HALF;
  const lightT = FEEL.CAR_BODY_HEIGHT * FEEL.CAR_LIGHT_THICK;
  const lightZ = tail[0] * halfL - 6;
  const hot = scraping ? 1 : 0;
  // Laterally clamped, vertically and rearwardly free.
  const glowHalf = Math.min(lightHalf * FEEL.CAR_LIGHT_GLOW_SPREAD,
                            halfW * tail[2] * FEEL.CAR_LIGHT_GLOW_MAX);
  for (let pass = 0; pass < 2; pass++) {
    const wide = pass === 0 ? glowHalf : lightHalf;
    const tall = pass === 0 ? lightT * FEEL.CAR_LIGHT_GLOW_SPREAD : lightT;
    const z = pass === 0 ? lightZ - FEEL.CAR_LIGHT_GLOW_BACK : lightZ;
    ctx.globalAlpha = pass === 0 ? FEEL.CAR_LIGHT_GLOW_ALPHA * (1 + hot * 0.8) : 1;
    ctx.fillStyle = pass === 0 ? CAR_LIGHT_GLOW_FILL
                  : (hot ? COLOUR.CAR_LIGHT_HOT : COLOUR.CAR_LIGHT);
    quadInCar(-wide, lightY - tall, z, wide, lightY + tall, z, camX, w, h);
  }
  ctx.globalAlpha = 1;

  /* The spoiler. Two posts and a blade above the tail: it reads as
     performance instantly and it gives the silhouette something along its
     top edge, which is the line the player actually sees against the
     sky. */
  const spY = FEEL.CAR_RIDE_HEIGHT + FEEL.CAR_SPOILER_Y * FEEL.CAR_BODY_HEIGHT;
  const spZ = FEEL.CAR_SPOILER_Z * halfL;
  const postX = halfW * FEEL.CAR_SPOILER_POST;
  const postH = (spY - (FEEL.CAR_RIDE_HEIGHT + 0.9 * FEEL.CAR_BODY_HEIGHT)) / 2;
  drawBox(-postX, spY - postH, spZ + 10, 12, postH, 26, 0, false, WING_COLOURS, false, camX, w, h);
  drawBox(postX, spY - postH, spZ + 10, 12, postH, 26, 0, false, WING_COLOURS, false, camX, w, h);
  /* The shadow the wing casts on the boot. Seen from above, a spoiler is
     a horizontal plane floating over another horizontal plane and the two
     merge into one surface: the ONLY thing that separates them is the gap
     underneath. So the gap is drawn. A dark band on the boot lid, wider
     and longer than the blade, and it is what makes the wing exist at all
     in a top down framing. */
  ctx.globalAlpha = FEEL.CAR_SPOILER_SHADOW;
  ctx.fillStyle = COLOUR.CAR_WING_GAP;
  quadInCar(-halfW * FEEL.CAR_SPOILER_HALF * 1.06,
            spY - FEEL.CAR_SPOILER_THICK * 1.5,
            spZ + halfL * FEEL.CAR_SPOILER_CHORD * 1.5,
            halfW * FEEL.CAR_SPOILER_HALF * 1.06,
            spY - FEEL.CAR_SPOILER_THICK * 1.5,
            spZ - halfL * FEEL.CAR_SPOILER_CHORD * 1.5, camX, w, h);
  ctx.globalAlpha = 1;
  drawBox(0, spY, spZ, halfW * FEEL.CAR_SPOILER_HALF, FEEL.CAR_SPOILER_THICK / 2,
          halfL * FEEL.CAR_SPOILER_CHORD, 0, false, WING_COLOURS, true, camX, w, h);

  drawBox.drewRear = false;
  drawBox(-trackHalf, wheelR, -baseHalf, FEEL.CAR_WHEEL_WIDTH / 2, wheelR, wheelR * 1.02, 0, false, WHEEL_COLOURS, false, camX, w, h);
  carParts.rlx = (boxPts[0].sx + boxPts[1].sx) * 0.5;
  carParts.rly = (boxPts[0].sy + boxPts[1].sy) * 0.5;
  if (drawBox.drewRear) rimGlow();
  drawBox.drewRear = false;
  drawBox(trackHalf, wheelR, -baseHalf, FEEL.CAR_WHEEL_WIDTH / 2, wheelR, wheelR * 1.02, 0, false, WHEEL_COLOURS, false, camX, w, h);
  if (drawBox.drewRear) rimGlow();
  carParts.rrx = (boxPts[0].sx + boxPts[1].sx) * 0.5;
  carParts.rry = (boxPts[0].sy + boxPts[1].sy) * 0.5;
  carParts.scale = Math.max(8, Math.abs(carParts.rrx - carParts.rlx));
}

function drawScrapeFlash(w, h) {
  if (!scraping) return;
  ctx.save();
  // The band brightens and turns as the scrape timer runs down, so the
  // player can feel the clock without a meter on the screen.
  ctx.globalAlpha = FEEL.SCRAPE_FLASH_ALPHA * (0.55 + 0.45 * scrapeRisk);
  if (scrapeSide < 0) {
    ctx.fillStyle = scrapeGradientLeft;
    ctx.fillRect(0, 0, scrapeBandWidth, h);
  } else {
    ctx.fillStyle = scrapeGradientRight;
    ctx.fillRect(w - scrapeBandWidth, 0, scrapeBandWidth, h);
  }
  if (scrapeRisk > 0.4) {
    ctx.globalAlpha = (scrapeRisk - 0.4) / 0.6 * FEEL.SCRAPE_FLASH_ALPHA;
    ctx.fillStyle = scrapeSide < 0 ? scrapeOutGradientLeft : scrapeOutGradientRight;
    if (scrapeSide < 0) ctx.fillRect(0, 0, scrapeBandWidth, h);
    else ctx.fillRect(w - scrapeBandWidth, 0, scrapeBandWidth, h);
  }
  ctx.restore();
}

function text(str, x, y, size, weight, align, fill) {
  ctx.font = weight + ' ' + size + 'px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif';
  ctx.textAlign = align || 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = COLOUR.TEXT_SHADOW;
  ctx.fillText(str, x, y + Math.max(1, size * 0.06));
  ctx.fillStyle = fill || COLOUR.TEXT;
  ctx.fillText(str, x, y);
}

/* ------------------------------------------------------------------
   THE PUBLISHER CREDIT, with the game's own mark beside it.

   Small and quiet, and the mark does not change that: it is drawn at the
   credit's own alpha and at a height set from the credit's own type
