    // A flick. Short, sharp, over before it is a problem, and the thing
    // the whole game is named after.
    name: 'kink', intensity: 1,
    build: function () {
      const d = pickDir(), c = FEEL.CURVE_MEDIUM * d;
      addRun(vary(FEEL.RAMP_SHORT), 0, c, roadWidth, 1, true);
      addRun(vary(FEEL.HOLD_SHORT), c, c, 1, 1, false);
      addRun(vary(FEEL.RAMP_SHORT), c, 0, 1, 1, true);
    }
  },
  {
    // Two opposite corners with no straight between them, so the exit of
    // the first is the entry to the second and the car has to be placed
    // rather than just steered.
    name: 's-bend', intensity: 2,
    build: function () {
      const d = pickDir(), c = FEEL.CURVE_MEDIUM * d;
      addRun(vary(FEEL.RAMP_MED), 0, c, roadWidth, 1, true);
      addRun(vary(FEEL.HOLD_MED), c, c, 1, 1, false);
      addRun(vary(FEEL.RAMP_MED), c, -c, 1, 1, true);      // straight through zero
      addRun(vary(FEEL.HOLD_MED), -c, -c, 1, 1, false);
      addRun(vary(FEEL.RAMP_MED), -c, 0, 1, 1, true);
    }
  },
  {
    // The width lever on its own. An ordinary bend through a squeeze,
    // which is harder than the same bend at full width without the corner
    // itself being any stronger.
    name: 'squeeze', intensity: 2,
    build: function () {
      const d = pickDir(), c = FEEL.CURVE_GENTLE * d, n = NARROW();
      addRun(vary(FEEL.RAMP_MED), 0, c, roadWidth, n, true);
      addRun(vary(FEEL.HOLD_MED), c, c * 1.6, n, n, false);
      addRun(vary(FEEL.RAMP_MED), c * 1.6, 0, n, 1, true);
    }
  },
  {
    // Opens out. Hard on the way in, unwinding under the car, so the
    // instinct to keep the lock on is wrong.
    name: 'opening', intensity: 2,
    build: function () {
      const d = pickDir();
      addRun(vary(FEEL.RAMP_SHORT), 0, FEEL.CURVE_HARD * d, roadWidth, 1, true);
      addRun(vary(FEEL.HOLD_MED), FEEL.CURVE_HARD * d, FEEL.CURVE_GENTLE * d, 1, 1, false);
      addRun(vary(FEEL.RAMP_LONG), FEEL.CURVE_GENTLE * d, 0, 1, FEEL.ROAD_WIDTH_WIDE, true);
      roadWidth = FEEL.ROAD_WIDTH_WIDE;
    }
  },
  {
    // Tightens as you commit. The long entry is deliberate: at this draw
    // distance the whole corner is on screen before it is entered, so it
    // is a decision rather than an ambush.
    name: 'tightening', intensity: 3,
    build: function () {
      const d = pickDir();
      addRun(vary(FEEL.RAMP_LONG), 0, FEEL.CURVE_GENTLE * d, roadWidth, 1, true);
      addRun(vary(FEEL.HOLD_MED), FEEL.CURVE_GENTLE * d, FEEL.CURVE_HARD * d, 1, 0.9, false);
      addRun(vary(FEEL.RAMP_SHORT), FEEL.CURVE_HARD * d, 0, 0.9, 1, true);
    }
  },
  {
    // Left right left, narrow, quick. The one that punishes carrying too
    // much sideways speed into it.
    name: 'chicane', intensity: 3,
    build: function () {
      const d = pickDir(), c = FEEL.CURVE_MEDIUM * d, n = NARROW();
      addRun(vary(FEEL.RAMP_SHORT), 0, c, roadWidth, n, true);
      addRun(vary(FEEL.HOLD_SHORT), c, c, n, n, false);
      addRun(vary(FEEL.RAMP_SHORT), c, -c, n, n, true);
      addRun(vary(FEEL.HOLD_SHORT), -c, -c, n, n, false);
      addRun(vary(FEEL.RAMP_SHORT), -c, c, n, n, true);
      addRun(vary(FEEL.HOLD_SHORT), c, c, n, n, false);
      addRun(vary(FEEL.RAMP_MED), c, 0, n, 1, true);
    }
  },
  {
    // A dogleg. Out and straight back, over in a moment, and the shape
    // that most rewards a flick rather than a steer.
    name: 'jink', intensity: 1,
    build: function () {
      const d = pickDir(), c = FEEL.CURVE_MEDIUM * d;
      addRun(vary(FEEL.RAMP_SHORT), 0, c, roadWidth, 1, true);
      addRun(6, c, c, 1, 1, false);
      addRun(vary(FEEL.RAMP_SHORT), c, -c, 1, 1, true);
      addRun(6, -c, -c, 1, 1, false);
      addRun(vary(FEEL.RAMP_SHORT), -c, 0, 1, 1, true);
    }
  },
  {
    // A run of alternating bends with nothing between them. Whichever way
    // the car is already going decides how the next one goes, all the way
    // down, so it is one problem rather than four.
    name: 'esses', intensity: 2,
    build: function () {
      let d = pickDir();
      const c = FEEL.CURVE_MEDIUM;
      const n = 4 + Math.floor(rng() * 2);
      addRun(vary(FEEL.RAMP_SHORT), 0, c * d, roadWidth, 1, true);
      for (let i = 0; i < n; i++) {
        addRun(vary(FEEL.HOLD_SHORT), c * d, c * d, 1, 1, false);
        if (i < n - 1) { addRun(vary(FEEL.RAMP_MED), c * d, -c * d, 1, 1, true); d = -d; }
      }
      addRun(vary(FEEL.RAMP_MED), c * d, 0, 1, 1, true);
      lastDir = d;
    }
  },
  {
    // A very long gentle corner through a sustained squeeze. Nothing about
    // it is sharp and it goes on long enough to become a test of holding
    // a line rather than of reacting.
    name: 'carousel', intensity: 2,
    build: function () {
      const d = pickDir(), c = FEEL.CURVE_GENTLE * 1.4 * d, n = NARROW();
      addRun(vary(FEEL.RAMP_LONG), 0, c, roadWidth, n, true);
      addRun(vary(FEEL.HOLD_LONG), c, c, n, n, false);
      addRun(vary(FEEL.RAMP_LONG), c, 0, n, 1, true);
    }
  },
  {
    // One corner with two apexes. It opens in the middle, which invites
    // the lock to come off, and then loads up again.
    name: 'double-apex', intensity: 3,
    build: function () {
      const d = pickDir();
      addRun(vary(FEEL.RAMP_MED), 0, FEEL.CURVE_MEDIUM * d, roadWidth, 1, true);
      addRun(vary(FEEL.HOLD_SHORT), FEEL.CURVE_MEDIUM * d, FEEL.CURVE_HARD * d, 1, 1, false);
      addRun(vary(FEEL.HOLD_SHORT), FEEL.CURVE_HARD * d, FEEL.CURVE_GENTLE * d, 1, 1, false);
      addRun(vary(FEEL.HOLD_SHORT), FEEL.CURVE_GENTLE * d, FEEL.CURVE_HARD * d, 1, 1, false);
      addRun(vary(FEEL.RAMP_MED), FEEL.CURVE_HARD * d, 0, 1, 1, true);
    }
  },
  {
    // Hard one way straight into hard the other, with no eased transition
    // and nothing in between. The reversal is linear on purpose: it snaps
    // rather than flows, and it is the hardest thing on the road.
    name: 'switchback', intensity: 3,
    build: function () {
      const d = pickDir(), c = FEEL.CURVE_HARD * d;
      addRun(vary(FEEL.RAMP_MED), 0, c, roadWidth, 1, true);
      addRun(vary(FEEL.HOLD_SHORT), c, c, 1, 1, false);
      addRun(vary(FEEL.RAMP_SHORT), c, -c, 1, 1, false);
      addRun(vary(FEEL.HOLD_SHORT), -c, -c, 1, 1, false);
      addRun(vary(FEEL.RAMP_MED), -c, 0, 1, 1, true);
      lastDir = -d;
    }
  },
  {
    // Two tight corners the same way, sharing a very short breath. The
    // second one is where the first one's exit line is paid for.
    name: 'hairpins', intensity: 3,
    build: function () {
      const d = pickDir(), c = FEEL.CURVE_HARD * d;
      addRun(vary(FEEL.RAMP_MED), 0, c, roadWidth, 1, true);
      addRun(vary(FEEL.HOLD_SHORT), c, c, 1, 1, false);
      addRun(vary(FEEL.RAMP_SHORT), c, 0, 1, 1, true);
      addRun(vary(FEEL.LINK_SHORT), 0, 0, 1, 1, false);
      addRun(vary(FEEL.RAMP_SHORT), 0, c, 1, 1, true);
      addRun(vary(FEEL.HOLD_SHORT), c, c, 1, 1, false);
      addRun(vary(FEEL.RAMP_MED), c, 0, 1, 1, true);
    }
  }
];

/* Rhythm. A hard phrase buys the player calm on either side of it, so
   pressure arrives in waves rather than as a flat wall. */
let restOwed = 0;

function phraseWeight(p) {
  if (p.name === 'straight') return FEEL.STRAIGHT_WEIGHT;
  return FEEL.PHRASE_WEIGHT;
}

function addPhrase() {
  /* A due hazard writes the next phrase itself. Ahead of the library
     rather than instead of it: the schedules are sparse, so most phrases
     are still whatever the grammar picks. */
  const due = dueHazardKind();
  if (due) { buildHazardPhrase(due); return; }
  /* Jumps are scheduled exactly as hazards are, and after them, so a
     hazard that is already due keeps the ground it needs. */
  // If it does not fit it builds nothing and falls through to the
  // grammar, because a phrase that adds no segments would leave the top
  // up loop spinning against a road that never grows.
  if (jumpUnlocked() && jumpDue <= segBase + segments.length
      && buildJumpPhrase()) return;

  const resting = restOwed > 0;
  if (resting) restOwed--;
  // Two ceilings at once: what the run has unlocked, and whether this one
  // owes a breath. Resting drops it to the gentlest tier whatever the run
  // has reached, so a breath is a real breath late on too.
  const ceiling = resting ? 1 : maxIntensity();

  let total = 0;
  for (let i = 0; i < PHRASES.length; i++) {
    if (PHRASES[i].intensity > ceiling) continue;
    total += phraseWeight(PHRASES[i]);
  }
  let roll = rng() * total;
  let p = PHRASES[0];
  for (let i = 0; i < PHRASES.length; i++) {
    if (PHRASES[i].intensity > ceiling) continue;
    roll -= phraseWeight(PHRASES[i]);
    if (roll <= 0) { p = PHRASES[i]; break; }
  }

  p.build();
  /* The breath after something demanding. Early in a run almost anything
     buys one; deep in, only the hardest phrases do and often not even
     then, which is most of what makes the late road relentless without a
     single corner having changed. */
  if (restOwed === 0 && p.intensity >= 2 && rng() < restChance()) restOwed = 1;
}

function resetRoad(seed) {
  segments = [];
  hazards = [];
  jumps = [];
  jumpDue = 0;
  hazardDue[HAZ_BLOCKER] = 0;
  hazardDue[HAZ_SPLITTER] = 0;
  hazardDue[HAZ_MOVER] = 0;
  segBase = 0;
  rngState = seed >>> 0;
  roadWidth = 1;
  restOwed = 0;
  lastDir = 1;
  // No tutorial. The opening is the tutorial: a calm straight at full
  // width, then one gentle curve that teaches hold to turn without a word.
  addRun(FEEL.OPENING_STRAIGHT, 0, 0, 1, 1, false);
  addRun(30, 0, FEEL.CURVE_GENTLE, 1, 1, true);
  addRun(90, FEEL.CURVE_GENTLE, FEEL.CURVE_GENTLE, 1, 1, false);
  addRun(30, FEEL.CURVE_GENTLE, 0, 1, 1, true);
  addRun(60, 0, 0, 1, 1, false);
}

/* ==================================================================
   HAZARDS

   Held in a list beside the road rather than in fields on every segment.
   There are only ever a handful inside the draw distance, so a list of
   objects costs nothing, while seven more fields on every segment would
   be paid for by the whole road whether or not anything is on it.

   Each entry spans segments [from, to] and occupies a lateral band around
   x, measured in WORLD units so that a hazard does not shrink when the
   road narrows. A mover swings its x with time; the other two do not.
   ================================================================== */
const HAZ_BLOCKER = 1, HAZ_SPLITTER = 2, HAZ_MOVER = 3;
let hazards = [];
let nextHazardSeg = 0;    // the segment index each kind is next tried at
const hazardDue = { 1: 0, 2: 0, 3: 0 };

/* How far across the road the car can actually get, in world units, from
   a standstill sideways, in the time it has, with the worst corner in the
   span pushing the other way the whole time.

   This is the same shape as worstOvershoot: the sideways speed chases its
   target through GRIP_TIME, so the ground covered in T is not v times T
   but v times (T minus the lag it spends getting there). */
function lateralReach(seconds, curve) {
  const v = FEEL.STEER_RATE * FEEL.ROAD_HALF_WIDTH_BASE
          * (1 - Math.abs(curve) * FEEL.CENTRIFUGAL);
  if (v <= 0) return 0;
  return v * (seconds - FEEL.GRIP_TIME * (1 - Math.exp(-seconds / FEEL.GRIP_TIME)));
}

/* The guarantee. Given a band the car must not be inside, in fractions of
   the local half width, return the worst crossing any starting position
   on the painted road can be forced into, or -1 if there is no gap wide
   enough for the car at all.

   Both edges of the road are considered as starting points, because the
   player may be anywhere, and for each one the nearer usable gap is taken,
   because the player will take it. */
function worstCrossing(lo, hi, carHalf, slack) {
  /* A gap counts only if it admits the car, the slack beyond it, AND
     leaves the car clear of the scrape band.

     That last one is not fussiness. A blocker set far enough out leaves a
     sliver between it and the road edge that a centre-fits test happily
     calls a gap; the car threads it, and then dies to the scrape timer a
     second and a half later having avoided the hazard perfectly. Getting
     past must not cost the run, so the bound here is SCRAPE_START rather
     than the painted edge, and the hazard system takes its definition of
     survivable from the same constant the road edge does. */
  const limit = FEEL.SCRAPE_START;
  const leftOk = lo - carHalf - slack >= -limit;
  const rightOk = hi + carHalf + slack <= limit;
  if (!leftOk && !rightOk) return -1;
  let worst = 0;
  for (let k = 0; k < 2; k++) {
    // The player may be anywhere on the painted road when the warning
    // appears, so both edges are tried as starting points.
    const start = k === 0 ? -1 : 1;
    let best = Infinity;
    if (leftOk) { const t = lo - carHalf; best = Math.min(best, Math.max(0, start - t)); }
    if (rightOk) { const t = hi + carHalf; best = Math.min(best, Math.max(0, t - start)); }
    if (best > worst) worst = best;
  }
  return worst;
}

/* Whether a candidate may be placed. Every condition here is a hard gate
   and any one of them rejects the placement outright.

   1  the road is straight enough over the whole warning run and the
      hazard itself, so it is on screen a second out and so the corner
      does not eat the steering needed to get round it;
   2  the narrowest segment under it still leaves the car a gap;
   3  the worst crossing it can force is inside what the car can cover in
      the warning distance, with HAZARD_SAFETY to spare.

   A mover is checked at both ends of its swing, which is sufficient
   because the crossing it demands is monotonic in x on each side. */
function hazardFits(from, to, xFrac, halfWorld, swingFrac) {
  const warn = FEEL.HAZARD_WARN_SEGMENTS;
  if (pastFinish(to)) return false;              // nothing crosses the line
  /* No two hazards may share a stretch of road, including each other's
     warning runs. Each kind is placed on its own schedule, so without
     this a blocker and a splitter can land on the same segments: both
     pass the crossing check alone and together they seal the road. Every
     check below reasons about ONE band, so one band is what there has to
     be.

     This is also what "combinations" has to mean here. A run that has
     everything unlocked meets all three kinds interleaved; it does not
     meet two at once, because two at once cannot be guaranteed avoidable
     without solving the pair, and then the triple, and so on. */
  for (let i = 0; i < hazards.length; i++) {
    const o = hazards[i];
    if (from - warn <= o.to && to >= o.from - warn) return false;
  }
  const entryEnd = Math.min(to, from + FEEL.HAZARD_ENTRY_SEGMENTS);
  let entryCurve = 0, bodyCurve = 0, minHw = Infinity;
  for (let i = from - warn; i <= to; i++) {
    const seg = segAt(i);
    if (!seg) return false;                       // not generated, cannot vouch for it
    const c = Math.abs(seg.curve * curveScale);
    if (i <= entryEnd) { if (c > entryCurve) entryCurve = c; }
    if (c > bodyCurve) bodyCurve = c;
    if (i >= from && seg.hw < minHw) minHw = seg.hw;
  }
  // The line change happens here, so this is the strict one.
  if (entryCurve > FEEL.HAZARD_MAX_CURVE) return false;
  // Alongside, the car only has to hold a lane, so this is the loose one.
  if (bodyCurve > FEEL.HAZARD_BODY_CURVE) return false;

  const carHalf = (FEEL.CAR_BODY_WIDTH / 2) / minHw;
  const slack = FEEL.HAZARD_MIN_GAP / minHw;
  const half = (halfWorld + FEEL.HAZARD_CLIP) / minHw;   // the clip band counts as blocked
  const seconds = warn * FEEL.SEGMENT_LENGTH / FEEL.SPEED;
  const budget = lateralReach(seconds, entryCurve);
  /* A mover must be outrunnable. Its own sideways speed against the
     car's, both in half widths per second, in the worst curvature this
     placement allows. */
  if (swingFrac > 0) {
    const moverSpeed = swingFrac * Math.PI * 2 / FEEL.MOVER_PERIOD;
    const carSpeed = FEEL.STEER_RATE * (1 - entryCurve * FEEL.CENTRIFUGAL);
    if (carSpeed < moverSpeed * FEEL.MOVER_OUTRUN) return false;
    /* One side has to stay open for the WHOLE sweep. Checking each end of
       the swing separately is not enough: it accepts a mover that is
       passable on the left at one end and only on the right at the other,
       which forces the player to change sides while the thing is moving
       and cannot be guaranteed. With a side that is always open, the
       mover is get out of the middle and hold, which is still timing and
       is still readable, and it is provable. */
    const lim = FEEL.SCRAPE_START;
    let leftAlways = true, rightAlways = true;
    for (let k = -1; k <= 1; k += 2) {
      const x = xFrac + k * swingFrac;
      if (x - half - carHalf - slack < -lim) leftAlways = false;
      if (x + half + carHalf + slack > lim) rightAlways = false;
    }
    if (!leftAlways && !rightAlways) return false;
  }
  for (let k = -1; k <= 1; k++) {
    const x = xFrac + k * swingFrac;
    if (swingFrac === 0 && k !== 0) continue;
    const need = worstCrossing(x - half, x + half, carHalf, slack);
    if (need < 0) return false;                   // no gap wide enough anywhere
    if (need * minHw * FEEL.HAZARD_SAFETY > budget) return false;
  }
  return true;
}

function addHazard(kind, from, to, xFrac, halfWorld, swingFrac) {
  if (!hazardFits(from, to, xFrac, halfWorld, swingFrac)) return false;
  hazards.push({ kind: kind, from: from, to: to, x: xFrac,
                 half: halfWorld, swing: swingFrac,
                 phase: rng() * Math.PI * 2,
                 /* The close call ledger. gap is the least clear air seen
                    over the whole pass, hit records whether it was ever
                    clipped, and done says it has been settled up. All
                    three are written by hazardBand while the car is
                    alongside and read once by resolveCloseCalls. */
                 gap: Infinity, hit: false, done: false });
  return true;
}

/* Where a hazard sits across the road right now, in fractions of the
   local half width. Only a mover moves, and it moves on run time so it is
   the same for the drawing and for the collision test. */
function hazardX(h) {
  if (h.kind !== HAZ_MOVER) return h.x;
  /* THE SWING IS ON THE ROAD'S CLOCK, not the run's. A mover that swung
     on elapsed time would be in a different place for two players who
     arrived at it a second apart, and a hazard that is somewhere else for
     everybody is the one thing a shared road cannot have. */
  return h.x + h.swing * Math.sin(h.phase
         + liveClock() * (Math.PI * 2 / FEEL.MOVER_PERIOD));
}

/* Which kind is due, rarest and longest first so that whoever gets the
   ground is the one that needs most of it. Zero if none is. */
function dueHazardKind() {
  const at = segBase + segments.length;
  const order = [
    { k: HAZ_SPLITTER, time: FEEL.SPLITTER_TIME },
    { k: HAZ_MOVER,    time: FEEL.MOVER_TIME },
    { k: HAZ_BLOCKER,  time: FEEL.BLOCKER_TIME }
  ];
  const t = buildClock();
  for (let i = 0; i < order.length; i++) {
    if (t < order[i].time) continue;
    if (hazardDue[order[i].k] <= at) return order[i].k;
  }
  return 0;
}

function hazardLength(kind) {
  if (kind === HAZ_SPLITTER) return FEEL.SPLITTER_SEGMENTS;
  if (kind === HAZ_MOVER) return FEEL.MOVER_SEGMENTS;
  return FEEL.BLOCKER_SEGMENTS;
}

/* Build the road a hazard needs and then put it on it. This IS a phrase,
   in the same sense as everything in the library: an approach the player
   can read the warning on, the hazard, and a run out to gather up.

   Nothing here weakens the guarantee. The candidate still goes through
   hazardFits, which still checks the real curvature of the real segments,
   the real width, the crossing and the overlap. Building the road first
   only means the check now almost always passes instead of almost always
   failing. */
function buildHazardPhrase(kind) {
  const warn = FEEL.HAZARD_WARN_SEGMENTS;
  const len = hazardLength(kind);
  const every = kind === HAZ_SPLITTER ? FEEL.SPLITTER_EVERY
              : kind === HAZ_MOVER ? FEEL.MOVER_EVERY : FEEL.BLOCKER_EVERY;
  // Jittered, so the spacing never reads as a metronome.
  hazardDue[kind] = segBase + segments.length
                  + Math.round(every * (0.65 + rng() * 0.7));

  let runIn = warn + 2;
  // Clear of the previous hazard's exclusion zone, so the overlap rule
  // never has to refuse a phrase that has already been laid down.
  if (hazards.length) {
    const last = hazards[hazards.length - 1];
    const earliest = last.to + warn + 2;
    const start = segBase + segments.length;
    if (start + runIn < earliest) runIn = earliest - start;
  }

  const c = rng() < FEEL.HAZARD_STRAIGHT_CHANCE ? 0
          : pickDir() * FEEL.CURVE_GENTLE * FEEL.HAZARD_APPROACH_CURVE;
  addRun(runIn, c, c, roadWidth, 1, true);
  const at = segBase + segments.length;
  addRun(len + FEEL.HAZARD_RUNOUT, c, 0, 1, 1, true);

  if (kind === HAZ_BLOCKER) {
    const side = rng() < 0.5 ? -1 : 1;
    const off = FEEL.BLOCKER_OFFSET_MIN
              + rng() * (FEEL.BLOCKER_OFFSET_MAX - FEEL.BLOCKER_OFFSET_MIN);
    return addHazard(HAZ_BLOCKER, at, at + len - 1, side * off, FEEL.BLOCKER_HALF, 0);
  }
  if (kind === HAZ_SPLITTER) {
    return addHazard(HAZ_SPLITTER, at, at + len - 1, 0, FEEL.SPLITTER_HALF, 0);
  }
  return addHazard(HAZ_MOVER, at, at + len - 1, 0, FEEL.MOVER_HALF, FEEL.MOVER_SWING);
}

/* ==================================================================
   JUMPS

   Held in their own list beside the road, exactly as the hazards are, and
   scheduled the same way: the feature is due first and the road is then
   BUILT to suit it, rather than a suitable gap being hunted for in road
   that already exists. That dependency order is what made the hazards
   common enough to be a mechanic and it does the same here.

   A jump occupies segments [from, to] and is centred, always. It is never
   an edge commitment: the old ramps were, and being asked to commit to an
   edge to reach a ramp is a challenge rather than a treat, which is the
   opposite of what this is for.
   ================================================================== */
let jumps = [];
let jumpDue = 0;

function jumpUnlocked() { return buildClock() >= FEEL.JUMP_TIME; }

function jumpLead() { return FEEL.JUMP_ARROW_COUNT * FEEL.JUMP_ARROW_SPACING + 4; }

/* The same exclusion rule the hazards live under, asked BEFORE the road
   is built rather than after, so a jump that does not fit costs nothing.

   Curvature is not tested here and does not need to be: the whole span
   this covers, from the first chevron to the end of the run out, is road
   this function is about to lay down dead straight and flat. That is the
   readability bound, met by construction rather than by rejection.
   The old ramps were placed onto whatever road happened to be there and
   needed a curvature bound to stay readable. This does the opposite, so
   there is no such constant here to get wrong. */
function jumpFits(from, to) {
  const lead = jumpLead();
  const a = from - lead, b = to + FEEL.JUMP_RUNOUT;
  if (pastFinish(b)) return false;               // nothing crosses the line
  for (let i = 0; i < hazards.length; i++) {
    const h = hazards[i];
    if (h.to + FEEL.HAZARD_WARN_SEGMENTS + 2 >= a
        && h.from - FEEL.HAZARD_WARN_SEGMENTS - 2 <= b) return false;
  }
  for (let i = 0; i < jumps.length; i++) {
    if (jumps[i].to + FEEL.JUMP_RUNOUT >= a && jumps[i].from - lead <= b) return false;
  }
  /* And never under a gate. A gate is the one thing on the road that is
     purely good news, and flying over one would take a checkpoint away
     for doing the fun thing. */
  for (let g = nextGate; g <= b; g += FEEL.CHECKPOINT_EVERY) {
    if (g >= a) return false;
  }
  return true;
}

/* The road a jump needs, and then the jump on it. A straight run in so the
   chevrons stand clean, the ramp, and a long flat run out to land on. */
function buildJumpPhrase() {
  const lead = jumpLead();
  const at = segBase + segments.length + lead + 2;
  const to = at + FEEL.JUMP_RAMP_SEGMENTS - 1;
  if (!jumpFits(at, to)) {
    // Try again soon rather than waiting out a whole interval, or a jump
    // that lands beside a hazard would silently cost the player a jump.
    jumpDue = segBase + segments.length + Math.round(FEEL.JUMP_EVERY * 0.25);
    return false;
  }
  jumpDue = to + FEEL.JUMP_RUNOUT
          + Math.round(FEEL.JUMP_EVERY * (0.7 + rng() * 0.6));
  addRun(lead + 2, 0, 0, roadWidth, 1, true);
  addRun(FEEL.JUMP_RAMP_SEGMENTS + FEEL.JUMP_RUNOUT, 0, 0, 1, 1, false);
  jumps.push({ from: at, to: to, riding: false,
               boost: rng() < FEEL.JUMP_BOOST_CHANCE, done: false });
  return true;
}

/* Nothing may be placed at the line or past it. The closing stretch is
   meant to be the hardest part of the day; a blocker straddling the
   finish would decide the run instead of testing it, and a ramp that
   launched the car over the line would be worse again. */
function pastFinish(seg) {
  return mode === DAILY && seg >= finishSeg - FEEL.FINISH_CLEAR_SEGMENTS;
}

function topUpRoad(baseIndex) {
  const needed = baseIndex + FEEL.DRAW_DISTANCE_SEGMENTS + 4;
  /* THE DAILY STOPS GENERATING. It used to build ahead of the camera for
     as long as the tab was open, which is what made it a deterministic
     endless road rather than a track.

     Road is still laid past the line, because the finish has to be
     approached and crossed with something under the car and something
     behind it, and it has to resolve out of the draw distance rather
     than appear. That run out is dead straight at full width: it is not
     part of the track and nothing about it is a test. */
  while (segBase + segments.length < needed) {
    if (pastFinish(segBase + segments.length)) {
      addRun(Math.min(64, needed - (segBase + segments.length)),
             0, 0, roadWidth, 1, true);
      continue;
    }
    addPhrase();
  }
  // Trim what is behind the camera, in one splice rather than one shift
  // per frame, so the array does not grow for the length of a run.
  const behind = baseIndex - segBase;
  if (behind > 128) {
    const drop = behind - 8;
    segments.splice(0, drop);
    segBase += drop;
    while (hazards.length && hazards[0].to < segBase) hazards.shift();
    while (jumps.length && jumps[0].to < segBase) jumps.shift();
  }
}


/* ==================================================================
   GAME STATE AND UPDATE

   The update loop reads steering.value. It does not read a key, a
   touch or a sensor. That is the section 8.1 rule and it is the one
   thing here that is expensive to reverse.
   ================================================================== */
/* FINISHED is not a kind of DEAD and nothing treats it as one. A run
   that reached the line is the only outcome in this game that is a win,
   and every test in the file that reads "not driving" was checked
   against it rather than assumed. */
const TITLE = 0, DRIVING = 1, DEAD = 2, FINISHED = 3;
let state = TITLE;

/* Pause. Section 12 says no pause and the author has overruled it: this
   audience is on managed devices and sometimes needs the screen gone in
   one tap, and calls arrive mid run on a phone. Section 5 is untouched,
   because restart after death is still instant and on the same input.
   This is for during a run only.

   It blanks the view rather than freezing it. A pause that leaves the
   road on screen is a cheat button in a reflex game: it hands the player
   as long as they like to study the corner they are about to enter and
   plan the line through it. */
let paused = false;

function setPaused(on) {
  if (on && state !== DRIVING) return;
  paused = on;
  pauseBtn.innerHTML = on ? ICON.play : ICON.pause;
  pauseBtn.classList.toggle('on', on);
}

function togglePause() {
  if (paused) setPaused(false);
  else if (state === DRIVING) setPaused(true);
}

let position = 0;        // camera z, world units
/* The car's offset from the road centre is held in world units, not in
   road half widths. That is what makes a narrower road genuinely harder:
   the steering covers the same ground per second either way, so on a
   squeezed road it covers a larger share of what is left. carFrac is that
   offset against the local half width, and it is what the bands read. */
let carX = 0;
let carFrac = 0;
let scraping = false;
let scrapeSide = 0;
let scrapeMeter = 0;     // seconds of edge spent, against SCRAPE_TIME_LIMIT
let scrapeRisk = 0;      // that meter as 0 to 1, for feedback
let shake = 0;
let shakeX = 0, shakeY = 0;
let deadFor = 0;
let lastMarkSeg = -1;
let carSegIndex = 0;     // the segment the car is on, read by the trail fade
let prevCarIndex = 0;    // so a long frame cannot tunnel through a hazard
let carCurve = 0;        // road curvature under the car, read by the drawn yaw
let maxCurveSeen = 0;    // largest curvature the generator has actually produced
let carY = 0;            // height above the road, the jump AND the death fall
/* The air. carVY is the only thing the jump adds to the physics: nothing
   here touches drift.headingV or drift.lateralV, which is what preserves
   the slip angle through the whole flight. */
let airborne = false;
let carVY = 0;
let airTime = 0;
let landSlow = 0;         // seconds of the landing speed penalty left
let landSlowTo = 1;       // and how much it costs
let landedBoost = false;  // this ramp carries a time extension
// The two velocities the car left the lip with. Air steering moves both
// of these together, which is what freezes the slip angle in flight.
let airHeadingV = 0;
let airLateralV = 0;
/* The camera rise, expressed as the FRACTION OF THE CAR'S OWN RISE that
   the camera cancels, damped. Kept unitless here and converted to a
   camera height at the point of use, because the projection is
   anisotropic: a height on screen is scaled by w/2 and the camera's own
   height by h/2, so a world for world lift would over correct. */
let camLift = 0;
let carFallV = 0;
let carPitch = 0;
let coastSpeed = 0;

/* The drift state, in one place, because the slip angle is what 4.4
   scores and it should be read from here rather than recomputed. Nothing
   outside update() writes to it.

   headingV is where the driver is pointing the car, lateralV is where
   the car is actually going, both in road half widths per second. The
   gap between them, expressed as an angle against forward speed, is the
   slip. */
const drift = {
  headingV: 0,
  lateralV: 0,
  headingAngle: 0,   // radians off straight ahead
  travelAngle: 0,    // radians off straight ahead
  slip: 0,           // signed radians, heading minus travel
  slipDeg: 0,        // signed degrees
  slipNorm: 0,       // magnitude, 0 to 1 against SLIP_MAX_DEG
  lateralAccel: 0    // road half widths per second squared, what the body leans on
};

function startRun() {
  /* Driving ends the calibration, whichever route into a run was taken.
     startTiltCal refuses to begin one while the car is moving; this is
     the other half of that invariant, for the player who starts a run
     with one already up. A run is a clear enough answer to "are you
     doing this now" and nothing is written, so it is a skip. */
  endTiltCal(false);
  // Midnight can pass with the tab open, and this is the only moment the
  // answer can change anything.
  rollDayIfNeeded();
  /* And the only moment the track length may change. The cycler can move
     the bounds mid session and a track that changed length under the car
     would be worse than either bound. */
  refreshTrackLength();
  finishTime = 0;
  finishMargin = null;
  finishClean = false;
  finishRecord = false;
  runTime = 0;
  /* Before updateDifficulty, not after. On the daily the difficulty is a
     function of the car's segment, so leaving last run's index in place
     would build the opening at deep game width. */
  carSegIndex = 0;
  prevCarIndex = 0;
  position = 0;
  updateDifficulty();
  /* The biome order is a generator input like any other, so on the daily
     it comes off the day and not off Math.random. Its own stream: rng()
     belongs to the road and drawing from it here would move the road. */
  biomeSeed(mode === DAILY ? (dailySeed() ^ 0x5bf03635) : ((Math.random() * 0xFFFFFFFF) >>> 0));
  resetRoad(nextSeed());
  ghost.i = 0;
  ghost.said = 0;
  ghost.shown = false;
  ghost.ahead = true;
  ghostStartRecording();
  position = 0;
  carX = 0;
  carFrac = 0;
  scraping = false;
  scrapeSide = 0;
  scrapeMeter = 0;
  scrapeRisk = 0;
  shake = 0;
  deadFor = 0;
  lastMarkSeg = -1;
  steering.value = 0;
  drift.headingV = 0;
  drift.lateralV = 0;
  drift.headingAngle = 0;
  drift.travelAngle = 0;
  drift.slip = 0;
  drift.slipDeg = 0;
  drift.slipNorm = 0;
  drift.lateralAccel = 0;
  carCurveX = 0;
  carY = 0;
  carFallV = 0;
  carPitch = 0;
  coastSpeed = 0;
  airborne = false;
  carVY = 0;
  airTime = 0;
  landSlow = 0;
  landSlowTo = 1;
  landedBoost = false;
  airHeadingV = 0;
  airLateralV = 0;
  camLift = 0;
  carSegIndex = 0;
  prevCarIndex = 0;
  hazardSide = 0;
  barShow = 0;
  score = 0;
  banked = 0;
  clock = FEEL.CLOCK_START;
  gateFlash = 0;
  clockPop = 0;
  runBestMult = 1;
  gatesPassed = 0;
  runDistance = 0;
  multiplier = 1;
  multPop = 0;
  runTime = 0;
  resetSpectacle();
  // A fresh run has no checkpoint behind it and no continues on it, so
  // it is a clean run until proven otherwise and it owns the on ramp.
  continues = 0;
  skipOnRamp = false;
  cpValid = false;
  resumeFlash = 0;
  clearDebris();
  nextGate = Math.round(FEEL.CHECKPOINT_EVERY * 0.7);
  /* Every run opens on the unturned palette. That is the game's own
     colour and it is what the boot flash and the death screen sit in, so
     it stays the thing a cold player sees first. The variety is at the
     gates, which is where it was asked for. lastBiomeHue is set so the
     FIRST gate is already a long way from it. */
  applyBiome(0);
  lastBiomeHue = 0;
  biomeBag.length = 0;
  biomeRecent.length = 0;
  for (let i = 0; i < smoke.length; i++) smoke[i].life = 0;
  smokeCount = 0;
  smokeAcc = 0;
  calibrateTilt();
  state = DRIVING;
}

/* ==================================================================
   CONTINUES

   This settles section 14's open question about lives and recoveries:
   neither. Instead a run may resume from the last gate, free and
   unlimited, and what it costs is a scoreboard rather than a life.

   The problem is that dying often means replaying the opening of the
   track over and over and rarely seeing anything new, which is the
   opposite of section 4.5's whole argument about why run twenty should
   differ from run two.

   WHAT RESUMES: the position, the elapsed time and therefore the
   difficulty at that gate, the clock as the gate left it, and the banked
   score. What does not is the multiplier, because the car crashed.

   THERE IS NO ON RAMP ON A CONTINUE. The first gate lands at about
   twenty three seconds, inside the thirty second on ramp, so resuming
   there would otherwise hand a player who has already driven a minute
   the beginner's wide road. skipOnRamp is what says so, and it is read by
   every place the on ramp is: the difficulty ramp, the phrase library's
   intensity and rest rate, and the clock. */
let continues = 0;        // this run, and the whole of the record split
let skipOnRamp = false;
let cpValid = false;
let cpSeg = 0, cpTime = 0, cpBanked = 0, cpClock = 0, cpBiome = 0, cpGates = 0;
let resumeFlash = 0;

function saveCheckpoint(seg) {
  cpValid = true;
  cpSeg = seg;
  cpTime = runTime;
  cpBanked = banked;
  cpClock = clock;
  cpBiome = biome;
  cpGates = gatesPassed;
}

function canContinue() { return cpValid && state === DEAD; }

/* The road from a checkpoint forward. The stretch behind is long gone,
   trimmed by topUpRoad hundreds of segments ago, so this builds a fresh
   one from the gate rather than replaying the generator to get back
   there. The player has not seen the road past the gate anyway, and a new
   stretch is the point of continuing rather than a compromise.

   segBase is the CAMERA's segment, not the car's, or the first frame
   after a resume has no road under the camera at all. */
function resumeRoad(carSeg) {
  const base = Math.floor((carSeg * FEEL.SEGMENT_LENGTH - FEEL.CAMERA_DISTANCE)
                          / FEEL.SEGMENT_LENGTH);
  segments = [];
  hazards = [];
  jumps = [];
  jumpDue = base + Math.round(FEEL.JUMP_EVERY * 0.5);
  /* Each kind gets its ordinary spacing before it is due again, NOT the
     resume point itself. Setting them due immediately guaranteed a hazard
     within a second of every single resume, which measured as four
     seconds off the median survival: a continue is not allowed to be
     easier and it is not allowed to be an ambush either. */
  hazardDue[HAZ_BLOCKER] = base + Math.round(FEEL.BLOCKER_EVERY * 0.5);
  hazardDue[HAZ_SPLITTER] = base + Math.round(FEEL.SPLITTER_EVERY * 0.5);
  hazardDue[HAZ_MOVER] = base + Math.round(FEEL.MOVER_EVERY * 0.5);
  segBase = base;
  rngState = nextSeed(base + 1) >>> 0;
  roadWidth = 1;
  restOwed = 0;
  lastDir = 1;
  // Long enough to arrive on rather than to be dropped into a corner,
  // and short enough that a resume is not a rest.
  addRun(FEEL.RESUME_STRAIGHT, 0, 0, 1, 1, false);
  return base;
}

function continueRun() {
  if (!cpValid) { startRun(); return; }
  endTiltCal(false);              // see startRun
  continues++;
  // Same reason as startRun: the difficulty is read off the car's segment.
  carSegIndex = cpSeg;
  prevCarIndex = cpSeg;
  position = cpSeg * FEEL.SEGMENT_LENGTH - FEEL.CAMERA_DISTANCE;
  /* THE RECORDING REWINDS TO THE CHECKPOINT AND CARRIES ON. It used to
     stop dead here, on the reasoning that a continued run is not a lap,
     which is true of the RECORD and was the wrong rule for the ghost: a
     ghost is a learning tool, and the section you are about to drive
     again is exactly the section you most want to see driven.

     Replay carries on too, as it always has, with the pass state reset
     with the clock rather than left over from the run that just ended. */
  ghostRewind();
  ghost.i = 0;
  ghost.said = 0;
  ghost.shown = false;
  ghost.ahead = true;
  skipOnRamp = true;
  runTime = cpTime;
  updateDifficulty();
  resumeRoad(cpSeg);
  position = cpSeg * FEEL.SEGMENT_LENGTH - FEEL.CAMERA_DISTANCE;
  carX = 0;
  carFrac = 0;
  scraping = false;
  scrapeSide = 0;
  scrapeMeter = 0;
  scrapeRisk = 0;
  shake = 0;
  deadFor = 0;
  lastMarkSeg = -1;
  steering.value = 0;
  drift.headingV = 0;
  drift.lateralV = 0;
  drift.headingAngle = 0;
  drift.travelAngle = 0;
  drift.slip = 0;
  drift.slipDeg = 0;
  drift.slipNorm = 0;
  drift.lateralAccel = 0;
  carCurveX = 0;
  carY = 0;
  carFallV = 0;
  carPitch = 0;
  coastSpeed = 0;
  airborne = false;
  carVY = 0;
  airTime = 0;
  landSlow = 0;
  landSlowTo = 1;
  landedBoost = false;
  airHeadingV = 0;
  airLateralV = 0;
  camLift = 0;
  carSegIndex = cpSeg;
  prevCarIndex = cpSeg;
  hazardSide = 0;
  barShow = 0;
  banked = cpBanked;
  score = 0;
  clock = Math.min(FEEL.CLOCK_MAX, cpClock + FEEL.CONTINUE_CLOCK_GRACE);
  gateFlash = 0;
  clockPop = 0;
  gatesPassed = cpGates;
  multiplier = 1;
  multPop = 0;
  nextGate = cpSeg + FEEL.CHECKPOINT_EVERY;
  applyBiome(cpBiome);
  for (let i = 0; i < smoke.length; i++) smoke[i].life = 0;
  smokeCount = 0;
  smokeAcc = 0;
  clearDebris();
  const keep = continues;
  resetSpectacle();
  continues = keep;               // resetSpectacle must not wipe the count
  resumeFlash = FEEL.RESUME_FLASH_TIME;
  calibrateTilt();
  state = DRIVING;
}

function startOrRestart() {
  /* THE TAP ON THE TITLE SCREEN IS TODAY'S TRACK, and it says so rather
     than leaning on `mode` happening to hold DAILY there. It does hold
     it, because that is what it is set to at load and the only routes
     that change it start a run themselves, but the guarantee the front
     door makes should not depend on that staying true. */
  if (state === TITLE) { startDaily(); return; }
  /* A finished run restarts and never continues. There is nothing to
     continue from: the track is over, and the one action stays one
     action. */
  if (state === FINISHED && deadFor >= FEEL.DEATH_INPUT_LOCK) { startRun(); return; }
  if (state === DEAD && deadFor >= FEEL.DEATH_INPUT_LOCK) {
    // The reflex tap continues when there is somewhere to continue from,
    // and restarts when there is not. Either way it is one action with
    // nothing to hunt for, which is what section 5 requires.
    if (canContinue()) continueRun(); else startRun();
  }
}

function update(dt) {
  // Shake decays in every state, so a crash still reads as a crash.
  const decay = Math.exp(-dt / FEEL.SHAKE_DECAY_TIME);
  shake *= decay;
  shakeX = (Math.random() * 2 - 1) * shake;
  shakeY = (Math.random() * 2 - 1) * shake;

  // And across: it leans the way the road ahead is bending, so the far end
  // of a tight corner stays on screen and the lean starts before the car
  // gets there rather than once it is already in the corner.
  lookCurve += (lookAheadCurve() - lookCurve) * (1 - Math.exp(-dt / FEEL.CAMERA_LOOK_TIME));
  /* Everything that draws reads cameraX and nothing else, so this one
     line moves the road, the car, the grid and the skyline together.
     Nothing that decides anything reads it: the bands, the hit tests, the
     tyre marks and the hazard placement are all in world units or in road
     fractions, so the camera cannot change what is true, only what is
     shown. */
  cameraX = carX * FEEL.CAMERA_FOLLOW + lookCurve * FEEL.CAMERA_LOOK;

  if (state === DEAD) { updateFall(dt); return; }
  /* A finished run holds still. Nothing falls, nothing explodes and the
     car keeps its shape sitting under the line, which is the picture the
     completion screen is drawn over. Only the clock on the screen itself
     runs, and it runs on real time so the input lock and the score roll
     behave exactly as they do on the death screen. */
  if (state === FINISHED) { deadFor += dt; return; }
  /* THE TITLE SCREEN NEEDS A CLOCK OF ITS OWN. Nothing else advances
     there: runTime belongs to a run and deadFor to a run that ended, so
     a blink hung off either would sit frozen. This is the only thing
     that moves on that screen and it moves nothing in the world. */
  if (state === TITLE) { titleTime += dt; return; }
  if (state !== DRIVING) return;

  runTime += dt;
  updateDifficulty();
  topUpRoad(Math.floor(position / FEEL.SEGMENT_LENGTH));
  const carIndex = Math.floor((position + FEEL.CAMERA_DISTANCE) / FEEL.SEGMENT_LENGTH);
  prevCarIndex = carSegIndex;
  carSegIndex = carIndex;
  const carSegment = segAt(carIndex);
  // Curvature is stored as shape and scaled on read, so the live gain
  // reshapes the road that is already on screen.
  const curve = (carSegment ? carSegment.curve : 0) * curveScale;
  carCurve = curve;
  const localHalf = carSegment ? carSegment.hw : FEEL.ROAD_HALF_WIDTH_BASE;

  /* The landing penalty, which is the whole cost of a bad landing beyond
     the shake. It runs down on its own and never stacks. */
  if (landSlow > 0) landSlow = Math.max(0, landSlow - dt);
  const landFactor = landSlow > 0 ? landSlowTo : 1;
  const speed = FEEL.SPEED * (scraping ? FEEL.SCRAPE_SPEED_FACTOR : 1) * landFactor;
  const prevPos = position;
  position += speed * dt;

  // Up the wedge and off the lip: the one moment the jump adds to the
  // physics. carY is a drawn height until the lip, and a real one after.
  if (!airborne) {
    rampRide(carIndex, (position + FEEL.CAMERA_DISTANCE)
                       / FEEL.SEGMENT_LENGTH - carIndex, localHalf);
  }

  /* The only place steering is consumed, and the whole drift model.

     The driver asks for a sideways speed. The nose comes round to face it
     almost at once; the tyres take GRIP_TIME to actually deliver it. A
     curve pushes the car outwards but not the nose, so it drags the two
     apart for as long as the corner lasts. Flicking the wheel drags them
     apart hard and briefly. Both of those gaps are the drift. */
  // Sideways speeds are world units per second. STEER_RATE is quoted in
  // base half widths per second, so it converts once here and the ratio
  // between steering and centrifugal is untouched by either the rate or
  // the local width.
  const rate = FEEL.STEER_RATE * FEEL.ROAD_HALF_WIDTH_BASE;
  const intent = steering.value * rate;

  if (airborne) {
    /* IN THE AIR THE SLIP IS FROZEN, and this is the whole point of the
       feature. Running the ordinary model at a reduced rate was tried
       first and it was wrong: both velocities chase the same target, so
       the gap between them, which IS the drift, closes on its own and
       the car lands straight. Measured, it landed straight every time.

       So air steering shifts the WHOLE FRAME instead. Heading and travel
       are nudged by the same amount, from the values the car left the lip
       with, using the same time constant. Their difference is untouched
       to the last decimal. The driver can move the car sideways to find
       the road again; they cannot straighten it out, and they cannot make
       it more sideways either. Whatever angle went up comes down. */
    const nudge = intent * FEEL.JUMP_AIR_STEER;
    const k = 1 - Math.exp(-dt / FEEL.HEADING_SNAP_TIME);
    drift.headingV += (airHeadingV + nudge - drift.headingV) * k;
    drift.lateralV += (airLateralV + nudge - drift.lateralV) * k;
    // Nothing is pushing sideways on it, so it flies level.
    drift.lateralAccel = 0;
  } else {
    // The nose comes round to where the driver is pointing.
    drift.headingV += (intent - drift.headingV) * (1 - Math.exp(-dt / FEEL.HEADING_SNAP_TIME));
    const gripTarget = intent - curve * FEEL.CENTRIFUGAL * rate;
    drift.lateralV += (gripTarget - drift.lateralV) * (1 - Math.exp(-dt / FEEL.GRIP_TIME));
    // The acceleration the model is actually applying sideways, straight
    // out of the lerp rather than differenced between frames, so it is
    // smooth enough to lean a body on without any filtering.
    drift.lateralAccel = (gripTarget - drift.lateralV) / FEEL.GRIP_TIME;
  }

  const prevX = carX;
  carX += drift.lateralV * dt;
  carFrac = carX / localHalf;
  ghostRecord(prevPos, prevX, dt);

  // Sideways speed against forward speed is an angle. The difference of
  // the two angles is the slip.
  drift.headingAngle = Math.atan(drift.headingV / speed);
  drift.travelAngle = Math.atan(drift.lateralV / speed);
  drift.slip = drift.headingAngle - drift.travelAngle;
  drift.slipDeg = drift.slip * 180 / Math.PI;
  drift.slipNorm = clamp(Math.abs(drift.slipDeg) / FEEL.SLIP_MAX_DEG, 0, 1);

  /* The camera starts coming up the moment the wheels leave the road,
     which is the climb rather than the launch, so there is no step in it
     at the lip. It is damped in both directions by the same constant. */
  const camWant = carY > 0 ? FEEL.JUMP_CAM_FOLLOW : 0;
  camLift += (camWant - camLift) * (1 - Math.exp(-dt / FEEL.JUMP_CAM_TIME));

  if (airborne) {
    /* Flying. Gravity, and the ground rules are all suspended: no tyre
       marks, no scrape band, no hazard collision, and the road edge
       cannot kill because there is nothing under the wheels to leave. */
    airTime += dt;
    carVY -= FEEL.JUMP_GRAVITY * dt;
    carY += carVY * dt;
    if (carY <= 0) { carY = 0; land(localHalf); }
    scraping = false;
    scrapeMeter = Math.max(0, scrapeMeter - dt * FEEL.SCRAPE_RECOVER_RATE);
    scrapeRisk = clamp(scrapeMeter / FEEL.SCRAPE_TIME_LIMIT, 0, 1);
    return;
  }
  layTyreMarks(carIndex, prevX);
  updateSmoke(dt);

  const offset = Math.abs(carFrac);
  if (offset > FEEL.OFF_ROAD) { crash(); return; }

  /* Three bands on a hazard, the same three the road edge has. Section
     4.2's argument is that a binary cliff reads as unfair and a gradient
     reads as hard, and an insta kill hazard would put the cliff straight
     back in the middle of the road.

     It cost almost nothing to honour: clipping one sets the same scraping
     flag the shoulder sets, so the speed penalty, the budget drain, the
     edge flash, the shake and the bar all come along without a line of
     new feedback code. Only the death test is the hazard's own. */
  const clipped = hazardBand(carIndex, localHalf);
  if (clipped === 2) { crash(HIT_OBJECT); return; }

  scraping = offset > FEEL.SCRAPE_START || clipped === 1;
  scrapeSide = clipped === 1 ? hazardSide
             : (scraping ? Math.sign(carFrac) : 0);
  if (scraping) {
    scrapeMeter += dt;
    addShake(FEEL.SCRAPE_SHAKE_PX);
    if (scrapeMeter > FEEL.SCRAPE_TIME_LIMIT) { crash(); return; }
  } else {
    scrapeMeter = Math.max(0, scrapeMeter - dt * FEEL.SCRAPE_RECOVER_RATE);
  }
  scrapeRisk = clamp(scrapeMeter / FEEL.SCRAPE_TIME_LIMIT, 0, 1);
}

/* Up the wedge and off the lip.

   The car RIDES the ramp rather than teleporting off it: while it is on
   the deck its height is the deck's height, so the wheels are on the
   surface the player can see rather than through it, and the launch
   happens at the lip with that height already banked. Every segment
   crossed this frame is considered, the same way the hazard band is,
   because at this speed a long frame covers more than one segment and
   would otherwise drive straight through a ramp without noticing it. */
function rampRide(carIndex, carFracZ, localHalf) {
  for (let i = 0; i < jumps.length; i++) {
    const j = jumps[i];
    if (j.done) continue;
    if (j.to < prevCarIndex || j.from > carIndex) continue;
    /* THE WIDTH IS ASKED ONCE, AT THE FOOT OF THE RAMP. Drive past it on
       the outside and nothing happens, which is what makes the chevrons
       worth aiming at. But once the wheels are on the deck the jump is
       yours whatever the drift does with you after that: being carried
       off sideways up a ramp is the good part, not a mistake. */
    if (!j.riding) {
      if (Math.abs(carX / localHalf) > FEEL.JUMP_RAMP_HALF) { j.done = true; continue; }
      j.riding = true;
    }
    if (carIndex <= j.to) {
      // Still climbing. Nothing else changes: no grip change, no speed
      // change, no steering change. It is a shape, not a mechanic.
      carY = jumpHeightAt(j, carIndex + carFracZ);
      return;
    }
    j.done = true;
    airborne = true;
    airTime = 0;
    airHeadingV = drift.headingV;
    airLateralV = drift.lateralV;
    carVY = FEEL.JUMP_LAUNCH_V;
    carY = FEEL.JUMP_RAMP_HEIGHT;
    landedBoost = j.boost;
    audioSting(STING_JUMP);
    return;
  }
  carY = 0;
}

/* Back on the ground. FORGIVING BY DESIGN: only landing off the road
   kills. The scrape band is a bad landing rather than a fatal one, and it
   costs speed and a shake, which is a cost the player can drive out of. */
function land(localHalf) {
  airborne = false;
  carVY = 0;
  airTime = 0;
  const offset = Math.abs(carX / localHalf);
  if (offset > FEEL.OFF_ROAD) { crash(); return; }
  const bad = offset > FEEL.SCRAPE_START;
  landSlow = FEEL.JUMP_LAND_SLOW_TIME;
  landSlowTo = bad ? FEEL.JUMP_LAND_SLOW_BAD : FEEL.JUMP_LAND_SLOW;
  addShake(bad ? FEEL.JUMP_LAND_SHAKE_BAD : FEEL.JUMP_LAND_SHAKE);
  audioSting(bad ? STING_CLOSE : STING_LAND);
  if (landedBoost) {
    // Hitting the ramp is the whole of the earning. No ring, no pickup.
    clock = Math.min(FEEL.CLOCK_MAX, clock + FEEL.JUMP_BOOST_SECONDS);
    clockPop = FEEL.CLOCK_POP_TIME;
    landedBoost = false;
  }
}

/* The curvature the camera leans on. An average of the road ahead of the
   car rather than the curvature under it, with triangular weights falling
   to zero at the far end of the window, so the corner about to arrive
   counts for most, the one past it only nudges, and a sustained corner
   still averages to its own curvature rather than being flattened.

   The window is clipped to road still on screen, live, because the whole
   point of the lean is to keep visible road visible. */
function lookAheadCurve() {
  const visible = (sightSeg < 0 ? FEEL.DRAW_DISTANCE_SEGMENTS : sightSeg)
                - carAheadSegs;
  let span = Math.round(FEEL.CAMERA_LOOK_AHEAD / FEEL.SEGMENT_LENGTH);
  if (span > visible) span = visible;
  if (span < 1) span = 1;
  let sum = 0, weight = 0;
  for (let i = 0; i < span; i++) {
    const s = segAt(carSegIndex + i);
    if (!s) break;
    const w = span - i;
    sum += s.curve * w;
    weight += w;
  }
  return weight > 0 ? sum * curveScale / weight : 0;
}

/* Which band of a hazard the car is in on this frame: 0 clear, 1 the
   clip shoulder, 2 the deadly core. Only hazards the car is actually
   alongside are considered, and the car is a box, so this is an overlap
   of two intervals rather than a point test.

   Every segment the car crossed this frame is checked rather than only
   the one it ended on, because at this speed a long frame covers more
   than one segment and would otherwise pass straight through a blocker. */
let hazardSide = 0;
function hazardBand(carIndex, localHalf) {
  const carHalf = (FEEL.CAR_BODY_WIDTH / 2) / localHalf;
  const lo = carFrac - carHalf, hi = carFrac + carHalf;
  let worst = 0;
  for (let i = 0; i < hazards.length; i++) {
    const h = hazards[i];
    if (h.to < prevCarIndex || h.from > carIndex) continue;
    const x = hazardX(h);
    const core = h.half / localHalf;
    const clip = (h.half + FEEL.HAZARD_CLIP) / localHalf;
    /* The close call ledger, kept here because this is the one place that
       already knows the car is alongside this hazard and already has the
       geometry out. Clear air between the side of the car and the outside
       of the clip shoulder, back in world units, at its narrowest over the
       whole pass. */
    const air = (Math.abs(carFrac - x) - clip - carHalf) * localHalf;
    if (air < h.gap) h.gap = air;
    if (hi <= x - clip || lo >= x + clip) continue;
    h.hit = true;
    if (hi > x - core && lo < x + core) return 2;
    worst = 1;
    // The flash belongs on the side the hazard is, not the side of the
    // road the car happens to be on.
    hazardSide = carFrac < x ? -1 : 1;
  }
  return worst;
}

/* Two ways to die, and they no longer look the same.

   OFF_ROAD is a fall: the car slides over the lip and drops into the
   void, which is the whole point of a narrow slab at altitude and it is
   unchanged.

   HIT_OBJECT is an impact: the car stops dead, comes apart and throws
   debris, and the world holds still for a moment. A hazard was a solid
   thing that killed you by being touched, and it read as the game simply
   stopping. */
const OFF_ROAD = 0, HIT_OBJECT = 1;
let deathKind = OFF_ROAD;

function crash(kind) {
  deathKind = kind === HIT_OBJECT ? HIT_OBJECT : OFF_ROAD;
  audioCrash();
  runDistance = Math.round(position / 100);   // world units are centimetres
  bankScore();
  /* THE LINE IS KEPT WHETHER THE RUN WAS ANY GOOD OR NOT. A crash is
     still the most recent thing that happened on this road, and the
     ghost is the last run. See the ghost block header. */
  ghostBank();
  // A run has been played, so the tilt button has had its chance to be
  // noticed and does not get to keep asking.
  stopTiltHint(true);
  onRunEnded();
  state = DEAD;
  deadFor = 0;
  scraping = false;
  /* Both lanes go quiet. A callout is feedback on driving and there is no
     driving any more, and leaving one to fade over the result screen is
     exactly the clutter the two lanes were built to avoid. */
  calloutLife = 0;
  driftLife = 0;
  breakChain();
  carFallV = 0;
  carY = 0;
  carPitch = 0;
  coastSpeed = FEEL.SPEED;
  if (deathKind === HIT_OBJECT) {
    explode();
  } else {
    addShake(FEEL.CRASH_SHAKE_PX);
  }
}

/* The fall. Cheap, because the car is already a box in the world: it just
   needs a height and a rotation about its own lateral axis.

   An impact does not fall. It stopped against something solid, so the
   car stays where it hit and the debris carries the motion instead. */
function updateFall(dt) {
  deadFor += dt;
  if (deathKind === HIT_OBJECT) return;

  coastSpeed *= Math.exp(-dt / FEEL.CRASH_COAST_TIME);
  position += coastSpeed * dt;
  carX += drift.lateralV * dt;

  const seg = segAt(Math.floor((position + FEEL.CAMERA_DISTANCE) / FEEL.SEGMENT_LENGTH));
  const localHalf = seg ? seg.hw : FEEL.ROAD_HALF_WIDTH_BASE;
  carFrac = carX / localHalf;

  // Nothing drops until it is actually past the lip, or the car would sink
  // through a road it is still standing on.
  if (Math.abs(carFrac) > EDGE_OUT) {
    carFallV += FEEL.CRASH_GRAVITY * dt;
    carY -= carFallV * dt;
    carPitch -= FEEL.CRASH_TUMBLE * dt;
  }
}


/* ==================================================================
   DRIFT FEEDBACK

   Section 7 calls tyre marks the highest value single effect in a drift
   game. They are stored on the road segments rather than in a list of
   their own, so they curve with the road for free and get thrown away
   with it.
   ================================================================== */
/* How far the car is turned, in radians, and the single source of it. The
   drawn body and the rear wheel contact points both read this, so the
   marks can never come off a car pointing somewhere else.

   Two terms, but only one of them is live. The first is the steering the
   driver is asking for. The second was the curvature of the road under
   the car, which is not physical and which is now zero, because a car
   that turns without being asked reads as the game steering for you. See
   CAR_CURVE_YAW. Nothing here may rotate the car off the driver's own
   input while that constant is zero. */
// Used by the drawing to ask "is the run over", so a finish counts.
function dead() { return state === DEAD || state === FINISHED; }

function carYaw() {
  return drift.headingAngle * FEEL.CAR_YAW_GAIN + carCurve * FEEL.CAR_CURVE_YAW;
}

/* Where the two rear wheels touch the road, in world units, given a centre
   position. They yaw with the body, so as the car comes sideways the pair
   swings apart and the two marks sweep away from each other. That
   divergence is the rotation, drawn. */
const rearContact = { left: 0, right: 0 };
function rearWheelOffsets(centreX) {
  const yaw = carYaw();
  const c = Math.cos(yaw), s = Math.sin(yaw);
  const trackHalf = FEEL.CAR_TRACK / 2;
  const shared = -FEEL.CAR_WHEELBASE / 2 * s;
  rearContact.left = centreX - trackHalf * c + shared;
  rearContact.right = centreX + trackHalf * c + shared;
  return rearContact;
}

function layTyreMarks(carIndex, prevX) {
  const alpha = (drift.slipNorm - FEEL.TYRE_MARK_MIN_SLIP) / (1 - FEEL.TYRE_MARK_MIN_SLIP);
  // The marks come off the rear axle, which is behind the car's centre, so
  // they start where the wheels are rather than where the middle is.
  const axleZ = position + FEEL.CAMERA_DISTANCE - FEEL.CAR_WHEELBASE / 2;
  const axleIndex = Math.floor(axleZ / FEEL.SEGMENT_LENGTH);
  if (alpha <= 0) { lastMarkSeg = axleIndex; return; }
  // Stored as the raw slip intensity from zero to one. The renderer turns
  // it into a colour and an alpha, because both now depend on it.
  const a = clamp(alpha, 0, 1);

  const prev = rearWheelOffsets(prevX);
  const pl = prev.left, pr = prev.right;
  const now = rearWheelOffsets(carX);

  // Fill in any segment the car stepped over this frame, so a long frame
  // does not punch a hole in the line.
  let from = axleIndex;
  if (lastMarkSeg >= 0 && axleIndex - lastMarkSeg > 0 && axleIndex - lastMarkSeg <= 4) {
    from = lastMarkSeg + 1;
  }
  for (let i = from; i <= axleIndex; i++) {
    const s = segAt(i);
    if (!s) continue;
    // Stored against this segment's own width, because that is what the
    // projection hands back when the segment is drawn.
    if (s.ma === 0) { s.ml0 = pl / s.hw; s.mr0 = pr / s.hw; }
    s.ml1 = now.left / s.hw;
    s.mr1 = now.right / s.hw;
    if (a > s.ma) s.ma = a;
  }
  lastMarkSeg = axleIndex;
}

/* Smoke is screen space. The car is pinned to one spot on screen, so
   there is nothing to gain from putting the puffs in the world, and a
   ring buffer of fixed objects means no allocation while sliding. */
let SMOKE_FILL = 'rgb(' + COLOUR.SMOKE + ')';
const smoke = [];
let smokeCount = 0;
let smokeHead = 0;
let smokeAcc = 0;
for (let i = 0; i < FEEL.SMOKE_MAX; i++) {
  smoke.push({ x: 0, y: 0, vx: 0, vy: 0, r: 0, life: 0 });
}

function spawnSmoke(side) {
  const p = smoke[smokeHead];
  smokeHead = (smokeHead + 1) % FEEL.SMOKE_MAX;
  if (smokeCount < FEEL.SMOKE_MAX) smokeCount++;
  // Off whichever rear wheel, at the position the last frame drew it.
  const jitter = carParts.scale * 0.18;
  p.x = (side < 0 ? carParts.rlx : carParts.rrx) + (Math.random() * 2 - 1) * jitter;
  p.y = (side < 0 ? carParts.rly : carParts.rry) + (Math.random() * 2 - 1) * jitter * 0.4;
  p.vx = -drift.lateralV * 40 + (Math.random() * 2 - 1) * 45;
  p.vy = FEEL.SMOKE_BACK_SPEED * (0.75 + Math.random() * 0.5);
  p.r = carParts.scale * FEEL.SMOKE_START_RADIUS;
  p.life = FEEL.SMOKE_LIFE;
}

function updateSmoke(dt) {
  for (let i = 0; i < FEEL.SMOKE_MAX; i++) {
    const p = smoke[i];
    if (p.life <= 0) continue;
    p.life -= dt;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.r += FEEL.SMOKE_GROWTH * dt;
  }
  if (drift.slipNorm <= FEEL.SMOKE_MIN_SLIP) { smokeAcc = 0; return; }
  const strength = (drift.slipNorm - FEEL.SMOKE_MIN_SLIP) / (1 - FEEL.SMOKE_MIN_SLIP);
  smokeAcc += dt * FEEL.SMOKE_RATE * strength;
  let guard = 0;
  while (smokeAcc >= 1 && guard < 8) {
    smokeAcc -= 1;
    guard++;
    spawnSmoke(guard & 1 ? -1 : 1);
  }
  if (smokeAcc > 1) smokeAcc = 1;
}

/* Something under the cliff. A plane of lines well below the road, so the
   void has a floor and a sense of speed of its own. The rows scroll with
   the camera, the columns slide with the car, and the whole thing is two
   stroked paths. Kept dim: nothing down here may compete with the edges. */
function drawGrid(w, h) {
  const rise = camHeight + FEEL.GRID_DEPTH;
  const spacing = FEEL.GRID_SPACING;
  const offset = position - Math.floor(position / spacing) * spacing;

  ctx.lineWidth = 1;
  /* The floor answers the drift too, far more faintly than the skyline
     does, because it sits BEHIND the road rather than beyond it and the
     void beside the road has to stay empty. One ramp lookup and no extra
     geometry, no extra pass and no extra fill, so it is genuinely free.
     At a lift of zero this is exactly COLOUR.GRID, as it always was. */
  ctx.strokeStyle = rampAt(GRID_HOT_RAMP, cityGlow * FEEL.GRID_DRIFT_LIFT);
  ctx.beginPath();

  let nearY = 0, farY = 0, nearScale = 0, farScale = 0;
  for (let i = 1; i <= FEEL.GRID_ROWS; i++) {
    const dz = i * spacing - offset;
    if (dz <= CAMERA_DEPTH) continue;
    const scale = CAMERA_DEPTH / dz;
    const y = horizonY + scale * rise * h / 2;
    if (y > h + 40) continue;
    if (!nearScale) { nearScale = scale; nearY = y; }
    farScale = scale; farY = y;
    ctx.moveTo(-40, y);
    ctx.lineTo(w + 40, y);
  }

  if (nearScale) {
    const half = (FEEL.GRID_COLUMNS - 1) / 2;
    for (let i = -half; i <= half; i++) {
      const wx = i * FEEL.GRID_COLUMN_SPACING - cameraX;
      ctx.moveTo(w / 2 + nearScale * wx * w / 2, nearY);
      ctx.lineTo(w / 2 + farScale * wx * w / 2, farY);
    }
  }
  ctx.stroke();
}

/* Distant towers across the void, below the road. Generated once from a
   fixed pattern so it is the same every frame, repeated horizontally, and
   parallaxed slowly against both the car's sideways position and the
   distance travelled. Dark silhouettes with a dim lit top: it is an
   anchor to read the road against, and it must never pull the eye off the
   edges, so nothing here goes anywhere near their brightness. */
const skylineH = [];
/* The window layout, generated once at load and never again. Each
   building gets a grid and each window a fixed threshold, so lighting the
   city is a comparison per window and nothing else: no allocation, no
   randomness at draw time, and the same city every frame.

   THE THRESHOLDS ARE CLUSTERED PER BUILDING. A window's threshold is its
   building's base plus a small jitter, so buildings come on roughly whole
   and one after another rather than as a uniform speckle spreading across
   the skyline. That is the difference between a city waking up block by
   block and a brightness slider.

   Its own generator, not rng(), which belongs to the road: consuming from
   that stream here would change the track a pinned seed produces. */
const cityRows = [];
const cityCols = [];
const cityStart = [];
const cityThr = [];
(function () {
  let seed = 1337;
  function next() { seed = (seed * 1103515245 + 12345) & 0x7fffffff; return (seed % 1000) / 1000; }
  for (let i = 0; i < FEEL.SKYLINE_COUNT; i++) {
    skylineH.push(next());
    const rows = 2 + (i % 4);
    const cols = 2 + (i % 2);
    cityRows.push(rows);
    cityCols.push(cols);
    cityStart.push(cityThr.length);
    // Taller buildings light later, so the skyline fills from the low
    // blocks upward and the tallest are the reward for a long chain.
    const base = 0.06 + 0.72 * (0.45 * next() + 0.55 * skylineH[i]);
    for (let k = 0; k < rows * cols; k++) {
      cityThr.push(clamp(base + (next() - 0.5) * 0.22, 0, 1));
    }
  }
})();

function drawSkyline(w, h) {
  const period = FEEL.SKYLINE_PERIOD;
  const step = period / FEEL.SKYLINE_COUNT;
  const baseY = horizonY + h * FEEL.SKYLINE_DROP;
  const minH = h * FEEL.SKYLINE_MIN_HEIGHT;
  const spanH = h * (FEEL.SKYLINE_MAX_HEIGHT - FEEL.SKYLINE_MIN_HEIGHT);
  let shift = -carX * FEEL.SKYLINE_PARALLAX - position * FEEL.SKYLINE_DRIFT;
  shift = shift - Math.floor(shift / period) * period;

  ctx.beginPath();
  for (let rep = -1; rep <= Math.ceil(w / period); rep++) {
    for (let i = 0; i < FEEL.SKYLINE_COUNT; i++) {
      const x = shift + rep * period + i * step;
      if (x > w + step || x < -step * 2) continue;
      const th = minH + skylineH[i] * spanH;
      ctx.rect(x, baseY - th, step * 0.86, th);
    }
  }
  ctx.fillStyle = COLOUR.SKYLINE;
  ctx.fill();

  /* The windows, between the silhouettes and the roof line so the roofs
     stay on top of them. One batched fill for every lit window in shot,
     using the same repeat loop and the same culling the bodies use. */
  if (cityGlow > 0.01) {
    ctx.beginPath();
    let any = false;
    for (let rep = -1; rep <= Math.ceil(w / period); rep++) {
      for (let i = 0; i < FEEL.SKYLINE_COUNT; i++) {
        const x = shift + rep * period + i * step;
        if (x > w + step || x < -step * 2) continue;
        const th = minH + skylineH[i] * spanH;
        // Too short to hold a window that would read as one.
        if (th < FEEL.CITY_MIN_BUILDING_PX) continue;
        const rows = cityRows[i], cols = cityCols[i], at = cityStart[i];
        const bwid = step * 0.86;
        const cellW = bwid / cols, cellH = th / rows;
        const ww = Math.max(1, cellW * FEEL.CITY_WINDOW_FILL);
        const wh = Math.max(1, cellH * FEEL.CITY_WINDOW_FILL);
        const top = baseY - th;
        for (let r = 0; r < rows; r++) {
          for (let c = 0; c < cols; c++) {
            if (cityThr[at + r * cols + c] > cityGlow) continue;
            any = true;
            ctx.rect(x + (c + 0.5) * cellW - ww / 2,
                     top + (r + 0.5) * cellH - wh / 2, ww, wh);
          }
        }
      }
    }
    if (any) {
      // Brighter as well as more numerous, but the alpha is the thing the
      // hard rule bites on and it is capped by CITY_ALPHA.
      ctx.globalAlpha = FEEL.CITY_ALPHA * (0.45 + 0.55 * cityGlow) * cityPulse;
      ctx.fillStyle = COLOUR.SKYLINE_WINDOW;
      ctx.fill();
      ctx.globalAlpha = 1;
    }
  }

  /* A dim lit line on the roofs, so they read as built rather than as a
     ragged hole in the background. This is where the city lights come up
     with the multiplier: the line thickens and runs toward this biome's
     own hot hue. The building bodies are deliberately left alone, because
     they are the silhouette the far road is read against and lifting them
     would cost contrast rather than buy anything. */
  const lit = 1.5 + FEEL.HEAT_SKYLINE_THICK * worldHeat * heatPulse;
  ctx.beginPath();
  for (let rep = -1; rep <= Math.ceil(w / period); rep++) {
    for (let i = 0; i < FEEL.SKYLINE_COUNT; i++) {
      const x = shift + rep * period + i * step;
      if (x > w + step || x < -step * 2) continue;
      const th = minH + skylineH[i] * spanH;
      ctx.rect(x, baseY - th, step * 0.86, lit);
    }
  }
  ctx.fillStyle = rampAt(SKYLINE_HOT_RAMP, worldHeat * FEEL.HEAT_SKYLINE_LIFT);
  ctx.fill();
}

function drawSmoke() {
  if (smokeCount === 0) return;
  ctx.fillStyle = SMOKE_FILL;
  for (let i = 0; i < FEEL.SMOKE_MAX; i++) {
    const p = smoke[i];
    if (p.life <= 0) continue;
    const t = p.life / FEEL.SMOKE_LIFE;
    ctx.globalAlpha = t * FEEL.SMOKE_ALPHA;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}


/* ==================================================================
   RENDER
   ================================================================== */
/* A general point projection, for anything that is not lying flat on the
   road. Same camera, same segments, one deliberate difference.

   The inherited projection is anisotropic: it scales across the screen by
   half the width and down it by half the height, which on a portrait phone
   is a two to one vertical stretch. A flat road never shows it up, and the
   camera was tuned with it in place, so it stays. A box with real height
   does show it up, and would come out twice as tall as it should be.

   So the ground stays exactly where the road puts it, and only the rise
   above the ground uses the horizontal scale. The wheels still touch the
   road to the pixel, and the car keeps its own proportions. */
function projectPoint(out, wx, wy, wz, camX, w, h) {
  const scale = CAMERA_DEPTH / wz;
  out.sx = w / 2 + scale * (wx - camX) * w / 2;
  out.sy = horizonY + scale * camHeight * h / 2 - scale * wy * w / 2;
  return out;
}

function polygon(x1, y1, x2, y2, x3, y3, x4, y4) {
  ctx.beginPath();
  ctx.moveTo(x1, y1);
  ctx.lineTo(x2, y2);
  ctx.lineTo(x3, y3);
  ctx.lineTo(x4, y4);
  ctx.closePath();
  ctx.fill();
}


/* How far the road has wandered sideways by the time it reaches the car.
   The curve in this technique is faked by sliding the segments across, so
   a car drawn at a fixed screen position would sit off its own road in a
   corner, and off its own tyre marks with it. Captured during the walk
   and used to place the car. */
let carCurveX = 0;

/* The road is walked once into these, then drawn from them twice: the
   walls of the slab, and its top surface. Boundary k is where segment k
   starts, so segment n runs between boundary n and boundary n + 1. */
const MAX_BOUNDS = 520;
const bx = new Float64Array(MAX_BOUNDS);
const by = new Float64Array(MAX_BOUNDS);
const bw = new Float64Array(MAX_BOUNDS);
const bz = new Float64Array(MAX_BOUNDS);
const bt = new Float64Array(MAX_BOUNDS);
const bf = new Float64Array(MAX_BOUNDS);
const bh = new Float64Array(MAX_BOUNDS);   // world height to pixels at this boundary
/* The nearest segment whose road centre has left the screen, or -1 while
   the whole draw distance is still visible. */
let sightSeg = -1;
/* Segments between the camera and the car. Road under the car is road the
   player is already committed to, so it is not lookahead and is left out
   of the sight measure, which otherwise reports the near field swinging
   out of frame whenever the camera leans. */
const carAheadSegs = Math.ceil(FEEL.CAMERA_DISTANCE / FEEL.SEGMENT_LENGTH) + 2;
const bvis = new Uint8Array(MAX_BOUNDS);
const blight = new Uint8Array(MAX_BOUNDS);

/* Past these projected half widths the wide faint passes and the cliff
   are smaller than a pixel. Widths shrink monotonically with distance, so
   the loops break rather than continue. */
const GLOW_CULL_PX = 2.5;
const WALL_CULL_PX = 1.6;

let EDGE_GLOW_FILL = 'rgb(' + COLOUR.EDGE_GLOW + ')';
let SLAB_BOTTOM_GLOW_FILL = 'rgb(' + COLOUR.SLAB_BOTTOM_GLOW + ')';
let PYLON_GLOW_FILL = 'rgb(' + COLOUR.PYLON_GLOW + ')';
// The outer lip of the slab, half width plus the shoulder, as a multiple
// of the half width. The shoulder is the scrape band, so the drawn edge of
// the road really is the last place the car may be.
const EDGE_OUT = 1 + FEEL.RUMBLE_WIDTH_FRACTION;

function drawRoad(w, h) {
  const seg = FEEL.SEGMENT_LENGTH;
  const baseIndex = Math.floor(position / seg);
  const base = segAt(baseIndex);
  if (!base) return;
  const percent = (position - baseIndex * seg) / seg;
  // The camera, which is the car plus its lean into the corner.
  const camX = cameraX;

  let x = 0;
  let dx = -(base.curve * curveScale * percent);

  const carZ = position + FEEL.CAMERA_DISTANCE;
  const carIdx = Math.floor(carZ / seg);
  const carSegFrac = (carZ - carIdx * seg) / seg;

  /* One walk, recording every boundary between segments, because the road
     is now drawn in two passes over the same geometry and walking it twice
     would mean accumulating the curve twice. */
  const want = Math.min(FEEL.DRAW_DISTANCE_SEGMENTS, MAX_BOUNDS - 1);
  let count = 0;
  let lastHw = base.hw;
  for (let k = 0; k <= want; k++) {
    const s = segAt(baseIndex + k);
    if (s) lastHw = s.hw;
    const dz = (baseIndex + k) * seg - position;
    const scale = CAMERA_DEPTH / dz;
    bx[k] = w / 2 + scale * (x - camX) * w / 2;
    by[k] = horizonY + scale * camHeight * h / 2;
    bw[k] = scale * lastHw * w / 2;
    bz[k] = dz;
    // Thickness is a height, so it uses the horizontal scale, the same way
    // the car's height does and for the same reason.
    bt[k] = scale * FEEL.ROAD_THICKNESS * w / 2;
    bf[k] = scale * FEEL.ROAD_FLARE * w / 2;
    bh[k] = scale * w / 2;
    count = k;
    if (baseIndex + k === carIdx) carCurveX = x + dx * carSegFrac;
    if (!s) break;
    x += dx;
    dx += s.curve * curveScale;
  }

  /* Decide once which segments are drawn and which stripe they are on,
     then draw the whole road one colour at a time. Per segment this used
     to be five to seven fills; batched it is a fixed handful for the
     entire road, which is what pays for the pylons and the glow. */
  let maxy = h;
  let first = -1, last = -1;
  sightSeg = -1;
  for (let n = 0; n < count; n++) {
    const s = segAt(baseIndex + n);
    bvis[n] = 0;
    if (!s) break;
    if (bz[n] <= CAMERA_DEPTH || by[n + 1] >= by[n] || by[n + 1] >= maxy) continue;
    bvis[n] = 1;
    blight[n] = (Math.floor(s.index / FEEL.RUMBLE_SEGMENTS) & 1) === 0 ? 1 : 0;
    /* How far ahead the road is still on screen. Curves are faked by
       sliding segments sideways, so a tight enough corner walks the road
       out of frame and the player cannot see where it goes. That distance,
       in seconds, is the true ceiling on corner tightness, and it is worth
       watching rather than discovering. */
    if (sightSeg < 0 && n > carAheadSegs && (bx[n] < 0 || bx[n] > w)) sightSeg = n;
    if (first < 0) first = n;
    last = n;
    maxy = by[n + 1];
  }
  if (first < 0) return;

  drawWalls(count);
  drawSlabUnderline(first, last);
  /* AFTER the underline, not before. The underline's own glow is drawn
     around the slab bottom and is up to three pixels tall, against a mean
     bleed drop of six, so putting the bleed underneath it hid most of the
     effect: measured, only 44 pixels in the whole frame changed. It also
     reads better this way round, because the underline is the thing doing
     the radiating and the spill belongs on top of it. */
  edgeBleedPass(first, last);

  const lip = FEEL.EDGE_LIP_FRACTION;
  const band = FEEL.RUMBLE_WIDTH_FRACTION - lip;
  bandPass(first, last, 1, band, EDGE_OUT - lip, COLOUR.SHOULDER_LIGHT);
  bandPass(first, last, 0, band, EDGE_OUT - lip, COLOUR.SHOULDER_DARK);
  bandPass(first, last, 1, EDGE_OUT - lip, EDGE_OUT, COLOUR.EDGE_LIGHT);
  // The dim half of the lip runs toward the light half as the multiplier
  // climbs, so the edge stripe burns hotter and the edge as a whole only
  // ever gains luminance.
  bandPass(first, last, 0, EDGE_OUT - lip, EDGE_OUT,
           rampAt(EDGE_HOT_RAMP, worldHeat * FEEL.HEAT_EDGE_LIFT));
  surfacePass(first, last, 1, COLOUR.ROAD_LIGHT);
  surfacePass(first, last, 0, COLOUR.ROAD_DARK);
  lanePass(first, last);
  edgeGlowPass(first, last);
  drawTrail(first, last, baseIndex);
  drawGate(first, last, baseIndex);
  drawHazardWarnings(first, last, baseIndex);
  drawJumps(first, last, baseIndex);
  drawPylons(first, last, baseIndex, w);
  drawHazards(first, last, baseIndex);
  // Last in the world and before the car, which render draws afterwards,
  // so the ghost can never sit on top of the thing you are steering.
  drawGhost(first, last, baseIndex);
}

/* The warning, painted on the road surface a full second before the
   hazard, across exactly the width the hazard occupies. This is what real
   roads do and it costs one batched fill for every warning in shot.

   It matters more here than on a real road, because sight is about two
   seconds and a hazard that resolves at the same moment it has to be
   avoided is the unfairness section 4.3 is about. The stripes are on the
   ground, so they are visible while the object itself is still a speck. */
/* The checkpoint gate: a post either side of the road and a beam across
   the top of them. Drawn from the same boundary tables the road is, so it
   sits in the world rather than on the screen, and it is only ever one
   object so it costs three fills.

   It is deliberately the widest thing on the road and it has nothing in
   the driving line, because a gate is the one thing out here that is
   purely good news. */
/* Is the gate being approached the LINE? Gate N is the finish, so this
   is true for the whole of the closing stretch, which is what makes the
   structure resolve out of the draw distance instead of appearing. */
function atFinishGate() {
  return mode === DAILY && gatesPassed >= dailyGates - 1;
}

/* ==================================================================
   THE FINISH, DRAWN IN THE WORLD.

   The payoff of a finite track is not a message on a HUD. It is a thing
   on the road that comes up out of the distance and gets bigger, so the
   last thirty seconds are driven at something rather than toward a
   number counting down.

   Built as a gate that has grown up: the same two posts and beam, the
   same two pass glow, in the same palette, so it reads as the same
   family and not as a foreign object. What makes it the LAST one is
   scale and a banner. It is more than four times the height of a
   checkpoint, which is what lets it clear the horizon and be visible
   from the far end of the draw distance while a gate is still a smudge.
   ================================================================== */
function drawFinishGate(first, last, baseIndex) {
  const n = nextGate - baseIndex;
  if (n < first || n > last || !bvis[n]) return;
  const seg = segAt(nextGate);
  if (!seg) return;
  const out = 1 + FEEL.RUMBLE_WIDTH_FRACTION;
  const post = FEEL.FINISH_POST / seg.hw;
  const top = by[n] - bh[n] * FEEL.FINISH_HEIGHT;
  const lx = bx[n] + bw[n] * (out + post * 0.5), rx = bx[n] - bw[n] * (out + post * 0.5);
  const pw = Math.max(2, bw[n] * post);
  const banner = (by[n] - top) * FEEL.FINISH_BANNER;

  for (let pass = 0; pass < 2; pass++) {
    const spread = pass === 0 ? pw * 2.2 : 0;
    ctx.globalAlpha = pass === 0 ? 0.26 : 1;
    ctx.fillStyle = pass === 0 ? GATE_GLOW_FILL : COLOUR.GATE_POST;
    ctx.beginPath();
    ctx.rect(lx - pw / 2 - spread / 2, top, pw + spread, by[n] - top);
    ctx.rect(rx - pw / 2 - spread / 2, top, pw + spread, by[n] - top);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
