  const percent = (position - baseIndex * seg) / seg;
  const camX = carX;

  let x = 0;
  let dx = -(base.curve * percent);

  const carZ = position + FEEL.CAMERA_DISTANCE;
  const carIdx = Math.floor(carZ / seg);
  const carSegFrac = (carZ - carIdx * seg) / seg;

  /* One walk, recording every boundary between segments, because the road
     is now drawn in two passes over the same geometry and walking it twice
     would mean accumulating the curve twice. */
  const want = Math.min(FEEL.DRAW_DISTANCE_SEGMENTS, MAX_BOUNDS - 1);
  let count = 0;
  let lastHw = base.hw;
  for (let k = 0; k <= want; k++) {
    const s = segAt(baseIndex + k);
    if (s) lastHw = s.hw;
    const dz = (baseIndex + k) * seg - position;
    const scale = CAMERA_DEPTH / dz;
    bx[k] = w / 2 + scale * (x - camX) * w / 2;
    by[k] = horizonY + scale * FEEL.CAMERA_HEIGHT * h / 2;
    bw[k] = scale * lastHw * w / 2;
    bz[k] = dz;
    // Thickness is a height, so it uses the horizontal scale, the same way
    // the car's height does and for the same reason.
    bt[k] = scale * FEEL.ROAD_THICKNESS * w / 2;
    bf[k] = scale * FEEL.ROAD_FLARE * w / 2;
    count = k;
    if (baseIndex + k === carIdx) carCurveX = x + dx * carSegFrac;
    if (!s) break;
    x += dx;
    dx += s.curve;
  }

  /* Decide once which segments are drawn and which stripe they are on,
     then draw the whole road one colour at a time. Per segment this used
     to be five to seven fills; batched it is a fixed handful for the
     entire road, which is what pays for the pylons and the glow. */
  let maxy = h;
  let first = -1, last = -1;
  for (let n = 0; n < count; n++) {
    const s = segAt(baseIndex + n);
    bvis[n] = 0;
    if (!s) break;
    if (bz[n] <= CAMERA_DEPTH || by[n + 1] >= by[n] || by[n + 1] >= maxy) continue;
    bvis[n] = 1;
    blight[n] = (Math.floor(s.index / FEEL.RUMBLE_SEGMENTS) & 1) === 0 ? 1 : 0;
    if (first < 0) first = n;
    last = n;
    maxy = by[n + 1];
  }
  if (first < 0) return;

  drawWalls(count);
  drawSlabUnderline(first, last);

  const lip = FEEL.EDGE_LIP_FRACTION;
  const band = FEEL.RUMBLE_WIDTH_FRACTION - lip;
  bandPass(first, last, 1, band, EDGE_OUT - lip, COLOUR.SHOULDER_LIGHT);
  bandPass(first, last, 0, band, EDGE_OUT - lip, COLOUR.SHOULDER_DARK);
  bandPass(first, last, 1, EDGE_OUT - lip, EDGE_OUT, COLOUR.EDGE_LIGHT);
  bandPass(first, last, 0, EDGE_OUT - lip, EDGE_OUT, COLOUR.EDGE_DARK);
  surfacePass(first, last, 1, COLOUR.ROAD_LIGHT);
  surfacePass(first, last, 0, COLOUR.ROAD_DARK);
  lanePass(first, last);
  edgeGlowPass(first, last);
  drawTrail(first, last, baseIndex);
  drawPylons(first, last, baseIndex, w);
}

/* One colour, both sides of the road, every segment on the given stripe.
   from and to are fractions of the half width, measured outward from the
   centre line. */
function bandPass(first, last, wantLight, from, to, colour) {
  ctx.beginPath();
  let any = false;
  for (let n = first; n <= last; n++) {
    if (!bvis[n] || blight[n] !== wantLight) continue;
    any = true;
    const y1 = by[n], y2 = by[n + 1] - 1;
    const a1 = bw[n] * from, a2 = bw[n + 1] * from;
    const c1 = bw[n] * to, c2 = bw[n + 1] * to;
    ctx.moveTo(bx[n] - c1, y1); ctx.lineTo(bx[n] - a1, y1);
    ctx.lineTo(bx[n + 1] - a2, y2); ctx.lineTo(bx[n + 1] - c2, y2);
    ctx.closePath();
    ctx.moveTo(bx[n] + c1, y1); ctx.lineTo(bx[n] + a1, y1);
    ctx.lineTo(bx[n + 1] + a2, y2); ctx.lineTo(bx[n + 1] + c2, y2);
    ctx.closePath();
  }
  if (!any) return;
  ctx.fillStyle = colour;
  ctx.fill();
}

function surfacePass(first, last, wantLight, colour) {
  ctx.beginPath();
  let any = false;
  for (let n = first; n <= last; n++) {
    if (!bvis[n] || blight[n] !== wantLight) continue;
    any = true;
    const y1 = by[n], y2 = by[n + 1] - 1;
    ctx.moveTo(bx[n] - bw[n], y1); ctx.lineTo(bx[n] + bw[n], y1);
    ctx.lineTo(bx[n + 1] + bw[n + 1], y2); ctx.lineTo(bx[n + 1] - bw[n + 1], y2);
    ctx.closePath();
  }
  if (!any) return;
  ctx.fillStyle = colour;
  ctx.fill();
}

function lanePass(first, last) {
  const f = FEEL.LANE_DASH_FRACTION;
  ctx.beginPath();
  let any = false;
  for (let n = first; n <= last; n++) {
    if (!bvis[n] || !blight[n]) continue;
    any = true;
    const y1 = by[n], y2 = by[n + 1] - 1;
    const l1 = bw[n] * f, l2 = bw[n + 1] * f;
    ctx.moveTo(bx[n] - l1, y1); ctx.lineTo(bx[n] + l1, y1);
    ctx.lineTo(bx[n + 1] + l2, y2); ctx.lineTo(bx[n + 1] - l2, y2);
    ctx.closePath();
  }
  if (!any) return;
  ctx.fillStyle = COLOUR.LANE;
  ctx.fill();
}

/* The wide faint half of the glow, over the road and the void alike so it
   spills both ways. One fill for both edges and the whole draw distance. */
function edgeGlowPass(first, last) {
  const spread = FEEL.EDGE_GLOW_SPREAD;
  const inner = EDGE_OUT - FEEL.EDGE_LIP_FRACTION - spread;
  const outer = EDGE_OUT + spread;
  ctx.beginPath();
  for (let n = first; n <= last; n++) {
    if (!bvis[n]) continue;
    // The band is under a pixel from here on, so it costs fill rate and
    // shows nothing. Widths shrink with distance, so this can break.
    if (bw[n] < GLOW_CULL_PX) break;
    const y1 = by[n], y2 = by[n + 1] - 1;
    const a1 = bw[n] * inner, a2 = bw[n + 1] * inner;
    const c1 = bw[n] * outer, c2 = bw[n + 1] * outer;
    ctx.moveTo(bx[n] - c1, y1); ctx.lineTo(bx[n] - a1, y1);
    ctx.lineTo(bx[n + 1] - a2, y2); ctx.lineTo(bx[n + 1] - c2, y2);
    ctx.closePath();
    ctx.moveTo(bx[n] + c1, y1); ctx.lineTo(bx[n] + a1, y1);
    ctx.lineTo(bx[n + 1] + a2, y2); ctx.lineTo(bx[n + 1] + c2, y2);
    ctx.closePath();
  }
  ctx.globalAlpha = FEEL.EDGE_GLOW_ALPHA;
  ctx.fillStyle = EDGE_GLOW_FILL;
  ctx.fill();
  ctx.globalAlpha = 1;
}

/* A second glowing line, along the bottom of the slab. Two lit lines with
   darkness between them state the thickness outright, where one line and
   an occluded silhouette only implied it. */
function drawSlabUnderline(first, last) {
  const scaleW = FEEL.SLAB_BOTTOM_WIDTH / FEEL.ROAD_HALF_WIDTH_BASE;
  const scaleG = FEEL.SLAB_BOTTOM_GLOW / FEEL.ROAD_HALF_WIDTH_BASE;
  underlinePath(first, last, scaleG);
  ctx.globalAlpha = FEEL.EDGE_GLOW_ALPHA;
  ctx.fillStyle = SLAB_BOTTOM_GLOW_FILL;
  ctx.fill();
  ctx.globalAlpha = 1;
  underlinePath(first, last, scaleW);
  ctx.fillStyle = COLOUR.SLAB_BOTTOM;
  ctx.fill();
}

function underlinePath(first, last, thick) {
  ctx.beginPath();
  for (let n = first; n <= last; n++) {
    if (!bvis[n]) continue;
    if (bw[n] < GLOW_CULL_PX) break;
    const o1 = bw[n] * EDGE_OUT + bf[n], o2 = bw[n + 1] * EDGE_OUT + bf[n + 1];
    const y1 = by[n] + bt[n], y2 = by[n + 1] + bt[n + 1];
    const t1 = bw[n] * thick, t2 = bw[n + 1] * thick;
    ctx.moveTo(bx[n] - o1, y1 - t1); ctx.lineTo(bx[n] - o1, y1 + t1);
    ctx.lineTo(bx[n + 1] - o2, y2 + t2); ctx.lineTo(bx[n + 1] - o2, y2 - t2);
    ctx.closePath();
    ctx.moveTo(bx[n] + o1, y1 - t1); ctx.lineTo(bx[n] + o1, y1 + t1);
    ctx.lineTo(bx[n + 1] + o2, y2 + t2); ctx.lineTo(bx[n + 1] + o2, y2 - t2);
    ctx.closePath();
  }
}

/* Posts down both edges. Three batched fills for the lot: the faint glow,
   the ordinary posts and the taller marker posts. */
function drawPylons(first, last, baseIndex, w) {
  const spacing = FEEL.PYLON_SPACING;
  const scaleH = 1 / FEEL.ROAD_HALF_WIDTH_BASE;
  pylonPath(first, last, baseIndex, spacing, FEEL.PYLON_GLOW_SPREAD, scaleH, 2);
  ctx.globalAlpha = FEEL.PYLON_GLOW_ALPHA;
  ctx.fillStyle = PYLON_GLOW_FILL;
  ctx.fill();
  ctx.globalAlpha = 1;
  pylonPath(first, last, baseIndex, spacing, 1, scaleH, 0);
  ctx.fillStyle = COLOUR.PYLON;
  ctx.fill();
  pylonPath(first, last, baseIndex, spacing, 1, scaleH, 1);
  ctx.fillStyle = COLOUR.PYLON_MAJOR;
  ctx.fill();
}

/* which: 0 ordinary posts, 1 marker posts, 2 both. */
function pylonPath(first, last, baseIndex, spacing, widen, scaleH, which) {
  ctx.beginPath();
  for (let n = first; n <= last; n++) {
    if (!bvis[n]) continue;
    const idx = baseIndex + n;
    if (idx % spacing !== 0) continue;
    const major = ((idx / spacing) % FEEL.PYLON_MAJOR_EVERY) === 0;
    if (which !== 2 && (which === 1) !== major) continue;

    const hWorld = major ? FEEL.PYLON_MAJOR_HEIGHT : FEEL.PYLON_HEIGHT;
    const wWorld = (major ? FEEL.PYLON_MAJOR_WIDTH : FEEL.PYLON_WIDTH) * widen;
    // Heights use the horizontal scale, as everything standing up does.
    const rise = bw[n] * hWorld * scaleH;
    if (rise < FEEL.PYLON_MIN_PX) continue;
    const half = bw[n] * wWorld * scaleH * 0.5;
    const out = bw[n] * (EDGE_OUT + FEEL.PYLON_OUT);
    const base = by[n];
    const top = base - rise;

    ctx.moveTo(bx[n] - out - half, top); ctx.lineTo(bx[n] - out + half, top);
    ctx.lineTo(bx[n] - out + half, base); ctx.lineTo(bx[n] - out - half, base);
    ctx.closePath();
    ctx.moveTo(bx[n] + out - half, top); ctx.lineTo(bx[n] + out + half, top);
    ctx.lineTo(bx[n] + out + half, base); ctx.lineTo(bx[n] + out - half, base);
    ctx.closePath();
  }
}

/* The sides of the slab, every visible one batched into a single path so
   the whole cliff costs one fill rather than one per segment.

   These are drawn on both sides regardless of which way the road turns.
   Strictly the outside wall of a corner faces away from the camera and
   should not be there, and on a dead straight road neither wall is
   visible at all, because a vertical plane seen from directly behind and
   above is exactly edge on. Drawing only the true ones would mean the
   road has no thickness on any straight, which is the flat decal the
   whole change is meant to avoid. So this is a stylisation and the one
   place here where the look wins over the geometry. */
function drawWalls(count) {
  ctx.beginPath();
  for (let n = 0; n < count; n++) {
    if (bz[n] <= CAMERA_DEPTH) continue;
    if (by[n + 1] >= by[n]) continue;
    if (bw[n] < WALL_CULL_PX) break;
    const o1 = bw[n] * EDGE_OUT, o2 = bw[n + 1] * EDGE_OUT;
    const l1 = bx[n] - o1, l2 = bx[n + 1] - o2;
    const r1 = bx[n] + o1, r2 = bx[n + 1] + o2;
    const y1 = by[n], y2 = by[n + 1];
    const d1 = y1 + bt[n], d2 = y2 + bt[n + 1];
    const f1 = bf[n], f2 = bf[n + 1];
    ctx.moveTo(l1, y1); ctx.lineTo(l2, y2);
    ctx.lineTo(l2 - f2, d2); ctx.lineTo(l1 - f1, d1);
    ctx.closePath();
    ctx.moveTo(r1, y1); ctx.lineTo(r2, y2);
    ctx.lineTo(r2 + f2, d2); ctx.lineTo(r1 + f1, d1);
    ctx.closePath();
  }
  ctx.fillStyle = COLOUR.WALL;
  ctx.fill();
}

/* The trail. Two lines from the rear wheel contact points, so they still
   scissor apart under drift, but they now fade out behind the car and run
   from cool to hot with the slip that laid them. A run driven on the
   limit leaves a brighter line than a tidy one, which is the whole point:
   the prettiest thing on screen is the thing risk buys. */
const TRAIL_RAMP = [];
(function () {
  // Cool blue, through the magenta the palette already used, to a hot
  // white. Precomputed, because this is read once per marked segment.
  const stops = [[74, 134, 255], [186, 96, 236], [255, 94, 206], [255, 190, 240], [255, 255, 255]];
  for (let i = 0; i < 24; i++) {
    const t = i / 23 * (stops.length - 1);
    const a = stops[Math.floor(t)], b = stops[Math.min(stops.length - 1, Math.floor(t) + 1)];
    const f = t - Math.floor(t);
    TRAIL_RAMP.push('rgb(' + Math.round(a[0] + (b[0] - a[0]) * f) + ','
      + Math.round(a[1] + (b[1] - a[1]) * f) + ','
      + Math.round(a[2] + (b[2] - a[2]) * f) + ')');
  }
})();

function trailColour(intensity) {
  let i = Math.round(intensity * (TRAIL_RAMP.length - 1));
  if (i < 0) i = 0; else if (i >= TRAIL_RAMP.length) i = TRAIL_RAMP.length - 1;
  return TRAIL_RAMP[i];
}

function drawTrail(first, last, baseIndex) {
  const base = FEEL.ROAD_HALF_WIDTH_BASE;
  for (let n = first; n <= last; n++) {
    if (!bvis[n]) continue;
    const s = segAt(baseIndex + n);
    if (!s || s.ma <= 0) continue;
    // Age behind the car, which is what fades it.
    const age = carSegIndex - s.index;
    if (age < 0) continue;
    const fade = 1 - age / FEEL.TRAIL_FADE_SEGMENTS;
    if (fade <= 0) continue;

    const mw = FEEL.TYRE_MARK_WIDTH * base / s.hw;
    const colour = trailColour(s.ma);
    const y1 = by[n], y2 = by[n + 1] - 1;
    const w1 = bw[n], w2 = bw[n + 1];

    ctx.fillStyle = colour;
    ctx.globalAlpha = s.ma * FEEL.TYRE_MARK_MAX_ALPHA * FEEL.TRAIL_GLOW_ALPHA * fade;
    trailQuads(s, mw * FEEL.TRAIL_GLOW_SPREAD, bx[n], bx[n + 1], w1, w2, y1, y2);
    ctx.globalAlpha = s.ma * FEEL.TYRE_MARK_MAX_ALPHA * fade;
    trailQuads(s, mw, bx[n], bx[n + 1], w1, w2, y1, y2);
  }
  ctx.globalAlpha = 1;
}

function trailQuads(s, mw, x1, x2, w1, w2, y1, y2) {
  ctx.beginPath();
  ctx.moveTo(x1 + (s.ml0 - mw) * w1, y1); ctx.lineTo(x1 + (s.ml0 + mw) * w1, y1);
  ctx.lineTo(x2 + (s.ml1 + mw) * w2, y2); ctx.lineTo(x2 + (s.ml1 - mw) * w2, y2);
  ctx.closePath();
  ctx.moveTo(x1 + (s.mr0 - mw) * w1, y1); ctx.lineTo(x1 + (s.mr0 + mw) * w1, y1);
  ctx.lineTo(x2 + (s.mr1 + mw) * w2, y2); ctx.lineTo(x2 + (s.mr1 - mw) * w2, y2);
  ctx.closePath();
  ctx.fill();
}

/* ==================================================================
   THE CAR

   A real box in the world, not a sprite. Its corners are defined in car
   local space, rolled, yawed, moved out to where the car is, and then
   projected one at a time through the same projection the road uses. The
   front corners are further from the camera than the rear ones, so they
   come back smaller and the two ends move differently on screen without
   anything animating them. That is the entire illusion.

   Faces are filled flat, one tone each, and culled by their own normal
   rather than by any winding convention. The box is convex, so culling
   alone gives the right answer and nothing needs sorting.
   ================================================================== */

// Car local space: x right, y up from the road surface, z forward.
const carT = { worldX: 0, worldY: 0, worldZ: 0, cosY: 1, sinY: 0, cosR: 1, sinR: 0, cosP: 1, sinP: 0 };

const boxPts = [];
for (let i = 0; i < 8; i++) boxPts.push({ wx: 0, wy: 0, wz: 0, sx: 0, sy: 0 });

const BOX_FACES = [
  { idx: [0, 1, 2, 3], nx: 0, ny: 0, nz: -1 },   // rear, the one facing the camera
  { idx: [5, 4, 7, 6], nx: 0, ny: 0, nz: 1 },    // front
  { idx: [4, 0, 3, 7], nx: -1, ny: 0, nz: 0 },   // left
  { idx: [1, 5, 6, 2], nx: 1, ny: 0, nz: 0 },    // right
  { idx: [3, 2, 6, 7], nx: 0, ny: 1, nz: 0 },    // top
  { idx: [4, 5, 1, 0], nx: 0, ny: -1, nz: 0 }    // bottom
];

/* Local to world. roll is applied about the forward axis first, so the
   body leans while the wheels stay flat on the road, then yaw, then the
   car's position. */
function carToWorld(out, lx, ly, lz, rolled) {
  let rx = lx, ry = ly;
  if (rolled) {
    const py = ly - FEEL.CAR_ROLL_PIVOT;
    rx = lx * carT.cosR - py * carT.sinR;
    ry = py * carT.cosR + lx * carT.sinR + FEEL.CAR_ROLL_PIVOT;
  }
  // Pitch about the car's own lateral axis. Flat while driving, and the
  // tumble once it has gone over the edge.
  const pz = lz * carT.cosP - ry * carT.sinP;
  const py2 = ry * carT.cosP + lz * carT.sinP;
  out.wx = carT.worldX + rx * carT.cosY + pz * carT.sinY;
  out.wy = carT.worldY + py2;
  out.wz = carT.worldZ + pz * carT.cosY - rx * carT.sinY;
  return out;
}

const dirOut = { wx: 0, wy: 0, wz: 0 };
function carDirToWorld(lx, ly, lz, rolled) {
  let rx = lx, ry = ly;
  if (rolled) {
    rx = lx * carT.cosR - ly * carT.sinR;
    ry = ly * carT.cosR + lx * carT.sinR;
  }
  const pz = lz * carT.cosP - ry * carT.sinP;
  const py2 = ry * carT.cosP + lz * carT.sinP;
  dirOut.wx = rx * carT.cosY + pz * carT.sinY;
  dirOut.wy = py2;
  dirOut.wz = pz * carT.cosY - rx * carT.sinY;
  return dirOut;
}

/* Build, transform, project and fill one box. Offsets are in car local
   space; yaw is an extra rotation about the box's own centre, which is
   what turns the front wheels against the body. */
function drawBox(ox, oy, oz, hw, hh, hl, extraYaw, rolled, faceColours, stroked, camX, w, h) {
  const cy = Math.cos(extraYaw), sy = Math.sin(extraYaw);
  for (let i = 0; i < 8; i++) {
    const sx = (i === 0 || i === 3 || i === 4 || i === 7) ? -hw : hw;
    const sh = (i === 2 || i === 3 || i === 6 || i === 7) ? hh : -hh;
    const sl = (i >= 4) ? hl : -hl;
    // Spin the box about its own vertical axis before it is placed.
    const lx = ox + sx * cy + sl * sy;
    const lz = oz + sl * cy - sx * sy;
    carToWorld(boxPts[i], lx, oy + sh, lz, rolled);
    projectPoint(boxPts[i], boxPts[i].wx, boxPts[i].wy, boxPts[i].wz, camX, w, h);
  }

  for (let f = 0; f < 6; f++) {
    const face = BOX_FACES[f];
    const colour = faceColours[f];
    if (!colour) continue;
    // The face normal, spun with the box and then transformed like any
    // other direction. No winding convention to get wrong.
    const nlx = face.nx * cy + face.nz * sy;
    const nlz = face.nz * cy - face.nx * sy;
    const n = carDirToWorld(nlx, face.ny, nlz, rolled);
    const a = boxPts[face.idx[0]], b = boxPts[face.idx[1]];
    const c = boxPts[face.idx[2]], d = boxPts[face.idx[3]];
    // Centre of the face, against the camera at (camX, CAMERA_HEIGHT, 0).
    const vx = (a.wx + b.wx + c.wx + d.wx) * 0.25 - camX;
    const vy = (a.wy + b.wy + c.wy + d.wy) * 0.25 - FEEL.CAMERA_HEIGHT;
    const vz = (a.wz + b.wz + c.wz + d.wz) * 0.25;
    if (n.wx * vx + n.wy * vy + n.wz * vz >= 0) continue;   // facing away
    if (f === 0) drawBox.drewRear = true;
    ctx.fillStyle = colour;
    polygon(a.sx, a.sy, b.sx, b.sy, c.sx, c.sy, d.sx, d.sy);
    // The fold lines. At fifty pixels across, flat tones alone do not
    // separate the roof from the boot from the side, and the car reads as
    // one yellow blob. The edges are what make it read as folded paper.
    if (stroked) ctx.stroke();
  }
}
drawBox.drewRear = false;

/* A sub rectangle of a face that has already been projected, by bilinear
   interpolation of its four screen corners. Cheaper and exactly right for
   putting lights on the flat back panel. */
function faceInset(quad, u0, u1, v0, v1) {
  const p = faceInset.buf;
  const bl = quad[0], br = quad[1], tr = quad[2], tl = quad[3];
  for (let i = 0; i < 4; i++) {
    const u = (i === 0 || i === 3) ? u0 : u1;
    const v = (i < 2) ? v0 : v1;
    const bx = bl.sx + (br.sx - bl.sx) * u, by = bl.sy + (br.sy - bl.sy) * u;
    const tx = tl.sx + (tr.sx - tl.sx) * u, tyy = tl.sy + (tr.sy - tl.sy) * u;
    p[i].x = bx + (tx - bx) * v;
    p[i].y = by + (tyy - by) * v;
  }
  return p;
}
faceInset.buf = [{ x: 0, y: 0 }, { x: 0, y: 0 }, { x: 0, y: 0 }, { x: 0, y: 0 }];

const rearFaceQuad = [{ sx: 0, sy: 0 }, { sx: 0, sy: 0 }, { sx: 0, sy: 0 }, { sx: 0, sy: 0 }];
const CAR_LIGHT_GLOW_FILL = 'rgb(' + COLOUR.CAR_LIGHT_GLOW + ')';

/* Copy the rear face of whichever box was drawn last, so an inset can be
   painted on it without projecting anything again. */
function captureRearFace() {
  for (let i = 0; i < 4; i++) {
    rearFaceQuad[i].sx = boxPts[BOX_FACES[0].idx[i]].sx;
    rearFaceQuad[i].sy = boxPts[BOX_FACES[0].idx[i]].sy;
  }
}

/* A lit strip on that captured face, given a centre and half sizes in
   face coordinates, where u runs across it and v up it. */
function lightStrip(u, du, v, dv) {
  const q = faceInset(rearFaceQuad, u - du, u + du, v - dv, v + dv);
  polygon(q[0].x, q[0].y, q[1].x, q[1].y, q[2].x, q[2].y, q[3].x, q[3].y);
}

/* Screen positions the smoke spawns from, filled in here and read on the
   next frame. One frame of lag on a puff's starting point is invisible. */
const carParts = { rlx: 0, rly: 0, rrx: 0, rry: 0, scale: 20 };
const poolPt = { wx: 0, wy: 0, wz: 0, sx: 0, sy: 0 };

/* The car's own glow, running the same way the trail does, from amber
   when it is gripping to a hot white when it is fully sideways. It stays
   warm at both ends, because one warm object in a cool world is how the
   eye finds it instantly, and that discipline is not up for negotiation.
   Slip drives the trail and the car from one variable. */
const CAR_GLOW_RAMP = [];
const CAR_SEAM_RAMP = [];
(function () {
  const stops = [[255, 176, 46], [255, 214, 110], [255, 246, 214], [255, 255, 255]];
  for (let i = 0; i < 16; i++) {
    const t = i / 15 * (stops.length - 1);
    const a = stops[Math.floor(t)], b = stops[Math.min(stops.length - 1, Math.floor(t) + 1)];
    const f = t - Math.floor(t);
    const r = Math.round(a[0] + (b[0] - a[0]) * f);
    const g = Math.round(a[1] + (b[1] - a[1]) * f);
    const bl = Math.round(a[2] + (b[2] - a[2]) * f);
    CAR_GLOW_RAMP.push('rgb(' + r + ',' + g + ',' + bl + ')');
    CAR_SEAM_RAMP.push('rgba(' + r + ',' + g + ',' + bl + ',0.55)');
  }
})();
function carGlowIndex() {
  let i = Math.round(drift.slipNorm * (CAR_GLOW_RAMP.length - 1));
  if (i < 0) i = 0; else if (i >= CAR_GLOW_RAMP.length) i = CAR_GLOW_RAMP.length - 1;
  return i;
}

const BODY_COLOURS = [COLOUR.CAR_END, COLOUR.CAR_END, COLOUR.CAR_SIDE, COLOUR.CAR_SIDE, COLOUR.CAR_TOP, null];
/* Only the back of the cabin is glass. The sides are pillars and painted
   metal, and colouring them dark made the roof read as a hole. */
const CABIN_COLOURS = [COLOUR.CAR_GLASS, COLOUR.CAR_GLASS, COLOUR.CAR_SIDE, COLOUR.CAR_SIDE, COLOUR.CAR_CABIN_TOP, null];
const WHEEL_COLOURS = [COLOUR.CAR_TYRE, COLOUR.CAR_TYRE, COLOUR.CAR_TYRE, COLOUR.CAR_TYRE, COLOUR.CAR_TYRE_TOP, null];
const SHADOW_COLOURS = [null, null, null, null, COLOUR.CAR_SHADOW, null];

/* The light pool, as a falloff rather than as flat steps. Nested flat
   quads read as nested rectangles, which is worse than no pool at all.
   One radial gradient per ramp step, built once and then filled through a
   scaled transform, so it costs a single fill and no allocation. */
const CAR_POOL_GRADS = [];
(function () {
  const stops = [[255, 176, 46], [255, 214, 110], [255, 246, 214], [255, 255, 255]];
  for (let i = 0; i < 16; i++) {
    const t = i / 15 * (stops.length - 1);
    const a = stops[Math.floor(t)], b = stops[Math.min(stops.length - 1, Math.floor(t) + 1)];
    const f = t - Math.floor(t);
    const r = Math.round(a[0] + (b[0] - a[0]) * f);
    const g = Math.round(a[1] + (b[1] - a[1]) * f);
    const bl = Math.round(a[2] + (b[2] - a[2]) * f);
    const grad = ctx.createRadialGradient(0, 0, 0, 0, 0, 1);
    grad.addColorStop(0, 'rgba(' + r + ',' + g + ',' + bl + ',1)');
    grad.addColorStop(0.45, 'rgba(' + r + ',' + g + ',' + bl + ',0.45)');
    grad.addColorStop(1, 'rgba(' + r + ',' + g + ',' + bl + ',0)');
    CAR_POOL_GRADS.push(grad);
  }
})();

function drawCar(w, h) {
  const camX = carX;
  const yaw = drift.headingAngle * FEEL.CAR_YAW_GAIN;
  const roll = clamp(drift.lateralAccel / FEEL.CAR_ROLL_REFERENCE, -1, 1)
             * FEEL.CAR_ROLL_DEG * Math.PI / 180;

  carT.worldX = camX + carCurveX;      // the car rides the road, curve and all
  carT.worldY = carY;
  carT.worldZ = FEEL.CAMERA_DISTANCE;
  carT.cosY = Math.cos(yaw);
  carT.sinY = Math.sin(yaw);
  carT.cosR = Math.cos(roll);
  carT.sinR = Math.sin(roll);
  carT.cosP = Math.cos(carPitch);
  carT.sinP = Math.sin(carPitch);

  const halfW = FEEL.CAR_BODY_WIDTH / 2;
  const halfL = FEEL.CAR_BODY_LENGTH / 2;
  const wheelR = FEEL.CAR_WHEEL_DIAMETER / 2;
  const trackHalf = FEEL.CAR_TRACK / 2;
  const baseHalf = FEEL.CAR_WHEELBASE / 2;
  const steer = steering.value * FEEL.CAR_FRONT_STEER_DEG * Math.PI / 180;

  // The shadow is the yawed footprint of the box rather than a fixed
  // ellipse. With a solid body a shape that did not turn read as a sticker
  // underneath a car; the lane dashes, the shoulder and the tyre marks are
  // the fixed reference, and they are far more legible than an ellipse.
  const glowIdx = carGlowIndex();

  // A pool of the car's own light on the road, so it sits in the world
  // rather than on it, with the contact shadow still under it. Gone once
  // it has left the road, because there is nothing there to light.
  if (carY === 0) {
    carToWorld(poolPt, 0, 0, 0, false);
    projectPoint(poolPt, poolPt.wx, poolPt.wy, poolPt.wz, camX, w, h);
    const scale = CAMERA_DEPTH / FEEL.CAMERA_DISTANCE;
    const rx = scale * halfW * FEEL.CAR_POOL_SIZE * w / 2;
    ctx.save();
    ctx.translate(poolPt.sx, poolPt.sy);
    ctx.scale(rx, rx * FEEL.CAR_POOL_SQUASH);
    ctx.globalAlpha = FEEL.CAR_POOL_ALPHA;
    ctx.fillStyle = CAR_POOL_GRADS[glowIdx];
    ctx.beginPath();
    ctx.arc(0, 0, 1, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
    ctx.globalAlpha = 1;
    drawBox(0, 1, 0, halfW * 0.96, 1, halfL * 0.96, 0, false, SHADOW_COLOURS, false, camX, w, h);
  }

  // Panel seams, lit rather than drawn in shadow.
  ctx.strokeStyle = CAR_SEAM_RAMP[glowIdx];
  ctx.lineWidth = 1;
  ctx.lineJoin = 'round';

  // Far to near: front wheels, body, rear wheels.
  drawBox(-trackHalf, wheelR, baseHalf, FEEL.CAR_WHEEL_WIDTH / 2, wheelR, wheelR * 1.02, steer, false, WHEEL_COLOURS, false, camX, w, h);
  drawBox(trackHalf, wheelR, baseHalf, FEEL.CAR_WHEEL_WIDTH / 2, wheelR, wheelR * 1.02, steer, false, WHEEL_COLOURS, false, camX, w, h);

  const bodyMid = FEEL.CAR_RIDE_HEIGHT + FEEL.CAR_BODY_HEIGHT / 2;
  drawBox.drewRear = false;
  drawBox(0, bodyMid, 0, halfW, FEEL.CAR_BODY_HEIGHT / 2, halfL, 0, true, BODY_COLOURS, true, camX, w, h);
  // The rear face was just projected, so the lights are an inset of it.
  captureRearFace();
  if (drawBox.drewRear) {
    // The light strips, glowed the same way the road edges are: once wide
    // and faint, once normal. Two extra fills and no shadowBlur.
    const s = FEEL.CAR_LIGHT_GLOW_SPREAD;
    ctx.globalAlpha = FEEL.CAR_LIGHT_GLOW_ALPHA;
    ctx.fillStyle = CAR_LIGHT_GLOW_FILL;
    lightStrip(0.20, 0.12 * s, 0.46, 0.16 * s);
    lightStrip(0.80, 0.12 * s, 0.46, 0.16 * s);
    ctx.globalAlpha = 1;
    ctx.fillStyle = COLOUR.CAR_LIGHT;
    lightStrip(0.20, 0.12, 0.46, 0.16);
    lightStrip(0.80, 0.12, 0.46, 0.16);
  }

  const cabinMid = FEEL.CAR_RIDE_HEIGHT + FEEL.CAR_BODY_HEIGHT + FEEL.CAR_CABIN_HEIGHT / 2;
  drawBox(0, cabinMid, FEEL.CAR_CABIN_OFFSET, FEEL.CAR_CABIN_WIDTH / 2,
          FEEL.CAR_CABIN_HEIGHT / 2, FEEL.CAR_CABIN_LENGTH / 2, 0, true, CABIN_COLOURS, true, camX, w, h);

  drawBox.drewRear = false;
  drawBox(-trackHalf, wheelR, -baseHalf, FEEL.CAR_WHEEL_WIDTH / 2, wheelR, wheelR * 1.02, 0, false, WHEEL_COLOURS, false, camX, w, h);
  carParts.rlx = (boxPts[0].sx + boxPts[1].sx) * 0.5;
  carParts.rly = (boxPts[0].sy + boxPts[1].sy) * 0.5;
  if (drawBox.drewRear) { captureRearFace(); ctx.fillStyle = COLOUR.CAR_RIM; lightStrip(0.5, 0.30, 0.5, 0.09); }
  drawBox.drewRear = false;
  drawBox(trackHalf, wheelR, -baseHalf, FEEL.CAR_WHEEL_WIDTH / 2, wheelR, wheelR * 1.02, 0, false, WHEEL_COLOURS, false, camX, w, h);
  if (drawBox.drewRear) { captureRearFace(); ctx.fillStyle = COLOUR.CAR_RIM; lightStrip(0.5, 0.30, 0.5, 0.09); }
  carParts.rrx = (boxPts[0].sx + boxPts[1].sx) * 0.5;
  carParts.rry = (boxPts[0].sy + boxPts[1].sy) * 0.5;
  carParts.scale = Math.max(8, Math.abs(carParts.rrx - carParts.rlx));
}

function drawScrapeFlash(w, h) {
  if (!scraping) return;
  ctx.save();
  // The band brightens and turns as the scrape timer runs down, so the
  // player can feel the clock without a meter on the screen.
  ctx.globalAlpha = FEEL.SCRAPE_FLASH_ALPHA * (0.55 + 0.45 * scrapeRisk);
  if (scrapeSide < 0) {
    ctx.fillStyle = scrapeGradientLeft;
    ctx.fillRect(0, 0, scrapeBandWidth, h);
  } else {
    ctx.fillStyle = scrapeGradientRight;
    ctx.fillRect(w - scrapeBandWidth, 0, scrapeBandWidth, h);
  }
  if (scrapeRisk > 0.4) {
    ctx.globalAlpha = (scrapeRisk - 0.4) / 0.6 * FEEL.SCRAPE_FLASH_ALPHA;
    ctx.fillStyle = scrapeSide < 0 ? scrapeOutGradientLeft : scrapeOutGradientRight;
    if (scrapeSide < 0) ctx.fillRect(0, 0, scrapeBandWidth, h);
    else ctx.fillRect(w - scrapeBandWidth, 0, scrapeBandWidth, h);
  }
  ctx.restore();
}

function text(str, x, y, size, weight, align) {
  ctx.font = weight + ' ' + size + 'px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif';
  ctx.textAlign = align || 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = COLOUR.TEXT_SHADOW;
  ctx.fillText(str, x, y + Math.max(1, size * 0.06));
  ctx.fillStyle = COLOUR.TEXT;
  ctx.fillText(str, x, y);
}

function drawOverlay(w, h) {
  if (state === TITLE) {
    const s = Math.min(w, h);
    text('TAILFLICK', w / 2, h * 0.34, Math.round(s * 0.13), '800');
    text('hold left or right to steer', w / 2, h * 0.45, Math.round(s * 0.045), '600');
    text('tap or press any key to start', w / 2, h * 0.52, Math.round(s * 0.045), '600');
  } else if (state === DEAD) {
    const s = Math.min(w, h);
    text('OFF THE ROAD', w / 2, h * 0.40, Math.round(s * 0.10), '800');
    if (deadFor >= FEEL.DEATH_INPUT_LOCK) {
      text('tap or press any key', w / 2, h * 0.50, Math.round(s * 0.05), '600');
    }
  }
}

/* The debug readout. Everything needed to report a camera back sits on
   one line, so a screenshot is a complete answer. */
function drawHud(w, h) {
  if (!showDebug) return;
  const pad = 10;
  const lines = [
    fpsShown.toFixed(0) + ' fps   worst ' + fpsWorstShown.toFixed(1) + ' ms',
    tunerLine(0),
    tunerLine(1),
    tunerLine(2),
    tunerLine(3),
    tunerLine(4),
    'slip ' + drift.slipDeg.toFixed(0) + '°  edge ' + (scrapeRisk * 100).toFixed(0)
      + '%  ' + (seedPinned ? 'seed ' + lastSeed : 'seed free')
  ];
  ctx.font = '600 13px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  let widest = 0;
  for (let i = 0; i < lines.length; i++) {
    const tw = ctx.measureText(lines[i]).width;
    if (tw > widest) widest = tw;
  }
  const top = hudTop;
  ctx.fillStyle = 'rgba(10,30,45,0.6)';
  ctx.fillRect(pad - 5, top - 4, widest + 10, lines.length * 18 + 8);
  ctx.fillStyle = '#ffffff';
  for (let i = 0; i < lines.length; i++) {
    ctx.fillText(lines[i], pad, top + i * 18);
  }
}

function render() {
  const w = view.w, h = view.h;
  ctx.setTransform(view.dpr, 0, 0, view.dpr, 0, 0);

  ctx.save();
  ctx.translate(shakeX, shakeY);

  /* Everything shakes together. There is no ground any more, so the void
     is the whole background and the road is an object floating in it. */
  ctx.fillStyle = COLOUR.VOID;
  ctx.fillRect(-40, -40, w + 80, h + 80);

  const glow = h * FEEL.HORIZON_GLOW_FRACTION;
  ctx.fillStyle = horizonGradient;
  ctx.fillRect(-40, horizonY - glow, w + 80, glow * 2);

  drawSkyline(w, h);
  drawGrid(w, h);
  drawRoad(w, h);
  ctx.fillStyle = hazeGradient;
  ctx.fillRect(-40, horizonY - 1, w + 80, h * FEEL.HORIZON_FADE_FRACTION + 2);
  drawSmoke();
  drawCar(w, h);
  ctx.restore();

  drawScrapeFlash(w, h);
  drawOverlay(w, h);
  drawHud(w, h);
}


/* ==================================================================
   MAIN LOOP
   ================================================================== */
let lastTime = 0;

function frame(now) {
  window.requestAnimationFrame(frame);

  const rawDt = lastTime ? (now - lastTime) / 1000 : 0;
  lastTime = now;
  const dt = Math.min(rawDt, FEEL.MAX_FRAME_DELTA);

  if (noteTimer > 0) {
    noteTimer -= dt;
    if (noteTimer <= 0) noteEl.hidden = true;
  }

  updateRepeat(dt);
  updateTilt(dt);
  updateSteering(dt);
  update(dt);
  render();
  sampleFps(rawDt);
}

recomputeCamera();
resetRoad(nextSeed());
resize();
window.requestAnimationFrame(frame);
</script>
