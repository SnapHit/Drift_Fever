<!doctype html>
<html lang="en-au">
<head>
<meta charset="utf-8">
<title>Tailflick</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="description" content="Tailflick, a browser drift game. One file, no downloads, nothing to install.">
<meta name="theme-color" content="#68c8f0">
<!-- An empty data URI, so the browser does not go and ask for a favicon.
     That request would be same origin and harmless, but the rule is zero. -->
<link rel="icon" href="data:,">
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    background: #68c8f0;
  }
  body {
    touch-action: none;
    overscroll-behavior: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  #game {
    display: block;
    width: 100%;
    height: 100%;
  }
  /* Chrome sits above the canvas so a tap on a button is never read as
     steering. It spans the full width, so it must not swallow pointers
     itself: only the buttons take them, everything else falls through to
     the canvas and still steers. */
  #chrome {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 2;
    pointer-events: none;
    padding: calc(env(safe-area-inset-top, 0px) + 8px) calc(env(safe-area-inset-right, 0px) + 8px) 0 calc(env(safe-area-inset-left, 0px) + 8px);
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 6px;
  }
  #buttons {
    display: flex;
    flex-wrap: wrap;
    justify-content: flex-end;
    gap: 6px;
    width: 100%;
  }
  #tuner {
    display: flex;
    gap: 6px;
    margin-right: auto;
  }
  #tuner[hidden] {
    display: none;
  }
  #chrome button, #note {
    pointer-events: auto;
  }
  #chrome button {
    font: 600 12px/1 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: #12303f;
    background: rgba(255, 255, 255, 0.7);
    border: 0;
    border-radius: 7px;
    padding: 9px 11px;
    cursor: pointer;
    touch-action: manipulation;
  }
  #chrome button[hidden] {
    display: none;
  }
  #chrome button.on {
    background: #ffd23d;
    color: #2a1f00;
  }
  #note {
    max-width: 62vw;
    font: 500 12px/1.35 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: #12303f;
    background: rgba(255, 255, 255, 0.82);
    border-radius: 7px;
    padding: 8px 10px;
    text-align: right;
  }
  #note[hidden] {
    display: none;
  }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="chrome">
  <div id="buttons">
    <div id="tuner" hidden>
      <button data-act="prev" type="button">&#9664;</button>
      <button data-act="dec" type="button">&minus;</button>
      <button data-act="inc" type="button">+</button>
      <button data-act="next" type="button">&#9654;</button>
      <button data-act="reset" type="button">reset</button>
      <button data-act="seed" type="button">seed</button>
    </div>
    <button id="fpsBtn" type="button">FPS</button>
    <button id="tiltBtn" type="button" hidden>Tilt</button>
  </div>
  <div id="note" hidden></div>
</div>
<script>
'use strict';

/* ==================================================================
   TAILFLICK

   One self-contained file. No requests, no dependencies, no build.
   Session one: the road, one steering axis, the scrape band, death.
   ================================================================== */


/* ------------------------------------------------------------------
   FEEL CONSTANTS. NOT TO BE CASUALLY CHANGED.

   Every number that decides how the game feels lives in this block,
   including every multiplier used inside the update loop. If a value
   affects feel and it is not here, that is a bug.

   Change one at a time, play it on a phone, and keep the ones that
   survive. Do not retune this block while changing anything else.
   ------------------------------------------------------------------ */
const FEEL = {

  /* Camera and projection.
     The four marked LIVE are adjustable while driving behind the FPS
     toggle, because they can only be judged by playing. Whatever is on
     screen in the debug readout is what the game is actually using.

     CAMERA_HEIGHT only means anything relative to the road width: those
     two are one ratio, and raising the camera makes the road and the car
     smaller on screen. HORIZON_FRACTION buys that space back by moving
     the horizon up and giving the road more of the screen.
     DRAW_DISTANCE_SEGMENTS times SEGMENT_LENGTH is both the planning
     horizon and the frame budget, so it is the first thing to lower if
     a weak machine drops frames. FIELD_OF_VIEW_DEG is a sense of speed
     lever, not a rendering detail: wider reads as faster and distorts
     more, and narrower zooms everything in. */
  /* These four were found by playing on a phone and are settled. Treat
     them the way the build order treats the rest of this block. */
  FIELD_OF_VIEW_DEG:         78,     // LIVE
  CAMERA_HEIGHT:           1800,     // LIVE
  CAMERA_DISTANCE:         3600,     // LIVE, how far the camera sits behind the car
  HORIZON_FRACTION:        0.50,     // LIVE, where the horizon sits down the screen
  DRAW_DISTANCE_SEGMENTS:   200,
  SEGMENT_LENGTH:           200,

  /* The road's width now lives on the segment, so phrases can squeeze and
     open it. This is the reference width: everything expressed in road
     half widths means half widths of this, and the live width only scales
     what is drawn and how much margin there actually is. Narrowing makes
     a corner harder without touching its strength, which is the whole
     point, because the corner strengths are already at their ceiling. */
  ROAD_HALF_WIDTH_BASE:    2000,
  ROAD_WIDTH_NARROW:       0.74,     // tightest a phrase may squeeze to
  ROAD_WIDTH_WIDE:         1.12,     // widest a phrase may open to

  /* The road is a slab in space, not a ribbon painted on ground. LIVE,
     because how thick it reads is the difference between a solid object
     and a decal, and that can only be judged by driving.

     The grid below it is what stops the void being nothing to fall into.
     GRID_DEPTH is how far under the road it sits, GRID_SPACING how far
     apart its lines are along the road, and GRID_LINES how many of each
     kind get drawn before it is too far away to matter. */
  /* Thickness and flare trade against each other rather than adding up.
     The wall is occluded by the nearer road, so a taller wall reaches down
     across more segments and more of it disappears, taking the underline
     with it. Width of the visible band is set by the flare, not the drop.
     Deep is sold by the grid and the skyline, not by this number. */
  ROAD_THICKNESS:           420,     // LIVE
  /* The slab is battered: wider at the bottom than at the top. A truly
     vertical side is invisible here, and not by a small margin. A slab
     seen from a camera directly above and behind it occludes its own
     sides completely, and each segment's wall is hidden by the next
     nearer segment's surface. The flare has to beat that: it only shows
     from a distance where it exceeds 1.65 times the width one segment
     gains by being closer, which works out at about 660000 over the
     distance. Below roughly 350 the cliff simply is not there.
     LIVE, because it and the thickness are one shape. */
  ROAD_FLARE:               640,     // LIVE
  EDGE_LIP_FRACTION:       0.13,     // of the half width, the bright lip itself

  /* Glow, done by drawing a bright thing twice: once wide and faint, once
     normal. That is two fills and no shadowBlur, which stays banned. It is
     used on the road edges, the car lights and the tyre marks, and nowhere
     else, because it is what separates neon from coloured lines and it
     stops meaning anything if everything has it. */
  EDGE_GLOW_SPREAD:        0.22,     // of the half width, each side of the lip
  EDGE_GLOW_ALPHA:         0.30,

  /* The underside line. Two glowing lines with dark between them read as a
     solid with thickness far better than one line and an occlusion. This
     one stays dimmer than the top lip, which owns brightest. */
  SLAB_BOTTOM_WIDTH:         80,     // world units, the line itself
  SLAB_BOTTOM_GLOW:         190,     // world units, the faint pass around it

  /* Pylons down both edges. The cheapest sense of speed there is, an edge
     cue in peripheral vision, and a corner readable before the surface is,
     which is section 4.3 done through art instead of camera. Every major
     one is taller and brighter so the line reads as rhythm. */
  PYLON_SPACING:              6,     // segments between pylons
  PYLON_MAJOR_EVERY:          4,     // every nth pylon is a marker post
  PYLON_HEIGHT:             430,     // world units
  PYLON_MAJOR_HEIGHT:       760,
  PYLON_WIDTH:               85,
  PYLON_MAJOR_WIDTH:        110,
  PYLON_OUT:               0.06,     // of the half width, how far outboard they stand
  PYLON_MIN_PX:             1.4,     // culled once shorter than this on screen
  PYLON_GLOW_SPREAD:        1.9,     // multiple of the pylon width
  PYLON_GLOW_ALPHA:        0.22,

  /* The horizon. Section 7.3 calls it the emotional anchor and it was a
     colour ramp. Distant towers seen across the void, well below the road,
     which is the altitude reading rather than the neon one. It parallaxes
     slowly and it is nowhere near the edges in brightness. */
  SKYLINE_COUNT:             40,
  SKYLINE_PERIOD:          1100,     // pixels the pattern repeats over
  SKYLINE_MIN_HEIGHT:     0.008,     // of screen height
  SKYLINE_MAX_HEIGHT:      0.05,
  SKYLINE_DROP:           0.008,     // how far below the horizon its base sits
  SKYLINE_PARALLAX:       0.018,     // against the car's sideways position
  SKYLINE_DRIFT:         0.0016,     // against distance travelled
  /* The floor sits a long way down, which is the point: the distinctive
     thing here is a narrow slab at altitude, not the neon on it. Deep
     enough that the near rows fall off the bottom of the screen and only
     the distant ones are in shot, which is what real height looks like. */
  GRID_DEPTH:             11000,
  GRID_SPACING:            2400,
  GRID_ROWS:                 44,
  GRID_COLUMNS:              15,
  GRID_COLUMN_SPACING:     4200,
  HORIZON_GLOW_FRACTION:   0.09,     // of screen height
  RUMBLE_SEGMENTS:            4,     // stripe length, in segments
  RUMBLE_WIDTH_FRACTION:   0.65,     // of the road half width. This is the shoulder,
                                     // and it is drawn to match the scrape band below.
  LANE_DASH_FRACTION:      0.02,     // of the road half width
  HORIZON_FADE_FRACTION:   0.14,     // of screen height, the haze band
  MAX_PIXEL_RATIO:            2,     // capped for weak integrated graphics

  /* Motion. Speed is constant in this build: speed escalation is step 3
     of the build order and is deliberately not here yet. */
  SPEED:                   9000,     // world units per second
  /* LIVE. Base road half widths per second at full lock, once the tyres
     have caught up. It is a target, not a jump. Raising it tightens the
     turning circle and is safe against the centrifugal ceiling, because
     the curve term below is scaled by this same number and the ratio does
     not move. What it does change is how far the car overshoots when you
     reverse out of a slide, which is bounded by STEER_RATE times GRIP_TIME
     against the width of the scrape band. */
  STEER_RATE:               2.2,     // LIVE
  STEER_RAMP_TIME:         0.10,     // seconds for keyboard or touch to reach full lock

  /* The drift. GRIP_TIME is the whole mechanic: the car's actual sideways
     velocity chases what the steering is asking for, and lags it by this
     long. HEADING_SNAP_TIME is how fast the nose comes round, and it must
     stay well under GRIP_TIME or there is no gap between where the car
     points and where it is going, which is to say no drift. The angle
     between those two is the slip angle, and it is the number 4.4 will
     score. Raise GRIP_TIME for a looser, slidier car. LIVE, and meant to
     be balanced against STEER_RATE by playing: a tighter turn feeds more
     sideways speed into the same grip and slides further. */
  GRIP_TIME:               0.30,     // LIVE
  HEADING_SNAP_TIME:       0.06,
  SLIP_MAX_DEG:              30,     // slip angle that counts as fully sideways
  CAR_YAW_GAIN:             1.2,     // drawn yaw against real heading, for readability
  /* CENTRIFUGAL is the fraction of full steering authority a curve of 1.0
     eats. It is not free to raise: CURVE_HARD times CENTRIFUGAL is how
     much of full lock the hardest curve costs just to hold a line, and at
     1.0 the hardest curve becomes unsurvivable no matter how well it is
     driven. At these values the hardest curve costs a bit over half. */
  CENTRIFUGAL:             0.11,

  /* The three bands from section 4.2, measured in road half widths, so
     1.0 is the painted edge of the road and the car is CAR_BODY_WIDTH
     across, which is 0.30 of a half width.
     The band is wide on purpose: 4.4 wants the player to live in it, so
     it is a destination and not a mercy window. SCRAPE_START puts the
     outside wheels on the shoulder, OFF_ROAD takes them off the far side
     of it, and RUMBLE_WIDTH_FRACTION is set so the shoulder you can see
     is exactly the band you are allowed to be in.

     What stops the band being a free ride is the timer, not its width.
     SCRAPE_TIME_LIMIT is how long you may hold the edge before it kills
     you, and it refills at SCRAPE_RECOVER_RATE of that while you are back
     on the road, so risk is spent and earned rather than held. Tune these
     two for how long a player should be able to sustain risk. */
  SCRAPE_START:            0.85,
  OFF_ROAD:                1.50,
  SCRAPE_SPEED_FACTOR:     0.62,     // forward speed multiplier while scraping
  SCRAPE_TIME_LIMIT:        1.6,     // seconds of edge before it kills you
  SCRAPE_RECOVER_RATE:      0.8,     // refill rate on the road, against the drain rate

  /* Feedback. Section 7 warns that shake is the fastest route to motion
     sickness on a phone held close to the face. Keep these low. */
  SCRAPE_SHAKE_PX:            4,
  CRASH_SHAKE_PX:            16,
  /* Leaving the road is a fall now rather than a freeze. The car keeps
     the sideways speed that put it there, slides off the lip, and only
     then starts dropping, so it goes over the edge instead of sinking
     through the surface. The camera coasts rather than stopping dead. */
  CRASH_GRAVITY:          26000,     // world units per second squared
  CRASH_TUMBLE:             2.4,     // radians per second, nose over
  CRASH_COAST_TIME:        0.55,     // seconds for the camera to run down
  SHAKE_DECAY_TIME:        0.22,     // seconds to fall to about a third
  SCRAPE_FLASH_ALPHA:      0.32,
  DEATH_INPUT_LOCK:        0.30,     // seconds before a restart is accepted

  /* Tilt. TILT_SMOOTHING_TIME matters most on cheap Android handsets that
     derive orientation from the accelerometer.

     The two LIVE ones move together or not at all. TILT_DEADZONE_DEG is
     subtracted from TILT_FULL_LOCK_DEG to get the usable span, so shrinking
     the full lock angle without shrinking the deadzone hands a bigger share
     of the wrist to the dead part. The readout prints the deadzone as a
     percentage of full lock for exactly that reason: hold that percentage
     roughly steady while hunting for the lock angle. */
  TILT_SMOOTHING_TIME:     0.08,     // seconds, exponential smoothing
  TILT_DEADZONE_DEG:        2.0,     // LIVE, the neutral state from section 4.1
  TILT_FULL_LOCK_DEG:        16,     // LIVE, degrees from the calibrated zero to full lock
  /* Past this share of the full lock angle, the deadzone has eaten most of
     the analogue range and the gyro is behaving like a switch. The readout
     says so rather than clamping it, because the right answer is to shrink
     the deadzone, not to stop looking for sensitivity. */
  TILT_DEADZONE_WARN:      0.30,
  TILT_SENSOR_TIMEOUT:      1.5,     // seconds to wait for a first real reading

  /* The car, in world units, the same units as the road. It is a real box
     in the world now, so these are its actual dimensions and they set the
     perceived mass. Where it sits on screen is not a constant: it falls
     out of CAMERA_DISTANCE and HORIZON_FRACTION, and the front of the car
     is further from the camera than the back, so the two ends project at
     different scales on their own.

     The road is 4000 units across, so a unit is roughly three millimetres
     and the car below is about 1.8 by 3.5 metres. BODY_WIDTH also sets the
     margin: SCRAPE_START is 1 minus half the body width in road half
     widths, so the outside wheels reach the shoulder as the scrape begins.
     Move one, check the other.

     One caution about the length. The ground plane is stretched along the
     road by the same anisotropy the car's height dodges, so a car that is
     twice as long as it is wide in world units reads closer to three times
     on screen. The length below is set by how it looks, not by the ratio.
     If the road ever gets an isotropic projection, lengthen it again. */
  CAR_BODY_WIDTH:           600,
  CAR_BODY_LENGTH:          880,
  CAR_BODY_HEIGHT:          250,
  CAR_RIDE_HEIGHT:           85,     // ground to the underside of the body
  CAR_CABIN_LENGTH:         380,
  CAR_CABIN_WIDTH:          450,
  CAR_CABIN_HEIGHT:         175,
  CAR_CABIN_OFFSET:         -40,     // negative sits the cabin back towards the rear
  CAR_WHEEL_DIAMETER:       230,
  CAR_WHEEL_WIDTH:          100,
  CAR_TRACK:                630,     // wheel centre to wheel centre, wider than the body
  CAR_WHEELBASE:            560,     // front axle to rear axle
  CAR_FRONT_STEER_DEG:       30,     // how far the front wheels turn at full lock

  /* Body roll. It leans away from the direction it is being accelerated,
     which is what makes it read as having weight. Section 7 warns about
     overdoing motion on a phone held close to the face, so this is small
     on purpose. CAR_ROLL_REFERENCE is the sideways acceleration, in road
     half widths per second squared, at which the lean saturates. */
  CAR_ROLL_DEG:             7.0,
  CAR_ROLL_REFERENCE:       8.0,
  CAR_ROLL_PIVOT:            60,     // height of the axis it leans about
  CAR_POOL_ALPHA:          0.30,     // the light the car spills onto the road
  CAR_POOL_SIZE:            5.2,     // multiple of the body half width
  CAR_POOL_SQUASH:         0.62,     // it lies on the road, so it is an ellipse
  CAR_LIGHT_GLOW_SPREAD:    2.3,     // multiple of the light strip, for its glow
  CAR_LIGHT_GLOW_ALPHA:    0.34,

  /* Tyre marks. They live on the road segments, so they are bounded by
     the segment window and cannot grow through a long run. They are only
     visible between the camera and the car, which means CAMERA_DISTANCE
     decides how much of your own line you get to see. They are laid from
     the two rear wheel contact points, which yaw with the body, so the
     pair sweeps apart as the car comes sideways. */
  TYRE_MARK_WIDTH:        0.028,     // road half widths
  /* Low, so that a tidy line still leaves a faint cool trace and the ramp
     has somewhere to start. The intensity doubles as the alpha, so near
     the threshold the mark is there but almost invisible. */
  TYRE_MARK_MIN_SLIP:      0.05,
  /* Higher than it was, because the road underneath is far darker now.
     At the old value the marks came out a muted purple instead of the
     glow the palette needs them to be. Still nowhere near the edge. */
  TYRE_MARK_MAX_ALPHA:     0.70,
  /* The trail. The marks are the trail, rather than a second ribbon that
     would compete with them. They fade out behind the car over this many
     segments, and their colour runs from a dim cool line when the car is
     gripping to a hot one when it is fully sideways. That ramp is 4.4's
     argument made visually: the best looking thing on screen is the thing
     the player earns by taking risk, and it exists before any score does. */
  TRAIL_FADE_SEGMENTS:       46,
  TRAIL_GLOW_SPREAD:        3.4,     // multiple of the mark width
  TRAIL_GLOW_ALPHA:        0.34,

  /* Tyre smoke. Screen space, because the car is at a fixed screen
     position, and capped so a long slide cannot grow the buffer. */
  SMOKE_MIN_SLIP:          0.30,
  SMOKE_RATE:                60,     // puffs per second at full slip
  SMOKE_LIFE:              0.45,     // seconds
  SMOKE_BACK_SPEED:         340,     // pixels per second down the screen
  SMOKE_GROWTH:              50,     // pixels per second of radius. Overdo this and
                                     // the puffs merge into one grey boulder.
  SMOKE_START_RADIUS:      0.09,     // of the car width
  SMOKE_ALPHA:             0.16,
  SMOKE_MAX:                 70,     // hard cap on live puffs

  /* Road generation. The road is built from phrases rather than from an
     independent random pick per section, so corners can set each other up.
     Lengths below are in segments and every phrase jitters them, so these
     are centres rather than exact values.

     The corner strengths are at their ceiling and must not be raised.
     CURVE_HARD times CENTRIFUGAL is already 55% of full lock, and at 100%
     a corner is unsurvivable however well it is driven. Difficulty comes
     from sequencing and from road width. */
  OPENING_STRAIGHT:         140,     // segments of calm before anything happens
  RAMP_SHORT:                10,
  RAMP_MED:                  26,
  RAMP_LONG:                 48,
  HOLD_SHORT:                16,
  HOLD_MED:                  52,
  HOLD_LONG:                125,
  LINK_SHORT:                14,     // the breath between linked corners
  /* Straights are connectors, not scenery. Long enough to read the next
     corner and reset the line, short enough that they are never the thing
     you are doing. They are not deleted, because without them the hard
     sequences have nothing to be hard against, and section 4.3 needs
     somewhere to look ahead from. */
  RECOVERY_MIN:              20,
  RECOVERY_MAX:              44,
  STRAIGHT_WEIGHT:            1,     // against PHRASE_WEIGHT for everything else
  PHRASE_WEIGHT:              3,
  DIRECTION_FLIP_CHANCE:   0.68,     // how often a phrase turns the other way
  PHRASE_JITTER:           0.28,     // fractional variation on every length
  CURVE_GENTLE:             1.6,
  CURVE_MEDIUM:             3.2,
  CURVE_HARD:               5.0,

  /* Frame. Clamped so a stutter cannot teleport the player off the road. */
  MAX_FRAME_DELTA:      1 / 20
};


/* ------------------------------------------------------------------
   PALETTE. Neon on dark.

   Section 7 refuses this look and the reasoning there is about
   distinctiveness and about readability. The distinctiveness argument has
   been overruled deliberately by the author. The readability argument has
   not, and it is binding, so this block is ordered by luminance and the
   order is the specification:

     1. the road edge, brightest thing on screen, nothing may beat it
     2. the car, bright and warm so it never reads as part of the road
     3. tyre marks, glowing, a third hue so they are never an edge
     4. the road surface, dark but plainly lighter than the void
     5. the centre line, dimmer than the edge and never competing
     6. the walls of the slab, darker than its top, so the edge catches
        light and the wall does not
     7. the grid and the void

   The Beakdown failure this is closest to is a dark surface lost against
   a dark background, so item 4 above is the one to check first if any of
   this is changed.
   ------------------------------------------------------------------ */
const COLOUR = {
  VOID:         '#04060e',
  GRID:         'rgba(64,148,196,0.20)',
  GRID_NEAR:    'rgba(88,196,240,0.30)',
  HORIZON_GLOW: '#2e7fa8',

  ROAD_LIGHT:   '#1b2440',     // the surface, plainly above the void
  ROAD_DARK:    '#161d35',
  /* The side of the slab. It has to sit below the road surface in value,
     which is what was asked for, and still be separable from the void,
     which is nearly black. There is not much room between those, so most
     of the silhouette comes from this occluding the grid behind it. */
  WALL:         '#111a35',
  SHOULDER_LIGHT:'#2a6a8c',    // the scrape band, a zone rather than an edge
  SHOULDER_DARK:'#215671',
  EDGE_LIGHT:   '#dcfeff',     // the brightest thing on screen, and it must stay that way
  EDGE_DARK:    '#8af2ff',
  LANE:         '#31507e',     // dim on purpose, it must never read as an edge

  EDGE_GLOW:    '109,236,255',  // the faint wide pass under the lip
  SLAB_BOTTOM:  '#2f86ad',      // the underside line, dimmer than the top lip
  SLAB_BOTTOM_GLOW: '47,134,173',
  PYLON:        '#4fb4d6',
  PYLON_MAJOR:  '#9cf0ff',
  PYLON_GLOW:   '96,206,240',
  SKYLINE:      '#091321',
  SKYLINE_TOP:  '#164059',

  SCRAPE:       '#fff0a8',
  SCRAPE_OUT:   '#ff5a3d',     // the flash shifts to this as the scrape timer runs out
  SMOKE:        '176,226,255',
  /* Flat per face, no gradients, no blurs. Section 7.5: cut and folded
     from paper. The shading is three fixed tones of one colour, which is
     what tells the eye it is a solid and not a sticker. */
  CAR_TOP:      '#ffc93a',
  CAR_END:      '#e89a1c',
  CAR_SIDE:     '#b06f12',
  CAR_CABIN_TOP:'#ffe07a',
  CAR_GLASS:    '#123044',
  CAR_LIGHT:    '#ff4d5e',
  CAR_LIGHT_GLOW: '255,77,94',
  CAR_RIM:      '#ffd98a',
  CAR_TYRE:     '#0d1220',
  CAR_TYRE_TOP: '#1b2437',
  CAR_SHADOW:   'rgba(0,0,0,0.5)',
  TEXT:         '#dffbff',
  TEXT_SHADOW:  'rgba(0,8,20,0.75)'
};

const STORAGE_PREFIX = 'tailflick.';


/* ------------------------------------------------------------------
   Derived values. Not tunable in themselves, recomputed whenever one of
   the LIVE camera constants above is moved.
   ------------------------------------------------------------------ */
let CAMERA_DEPTH = 0;
let horizonY = 0;

/* The authored defaults for the four LIVE values, kept so the reset
   button has something to go back to and so the game can say out loud
   when it is running on tuned numbers rather than these. */
const TUNABLES = [
  { key: 'CAMERA_HEIGHT',      label: 'height',  step: 100,  min: 400,  max: 9000,  dp: 0, group: 0 },
  { key: 'CAMERA_DISTANCE',    label: 'dist',    step: 100,  min: 600,  max: 14000, dp: 0, group: 0 },
  { key: 'FIELD_OF_VIEW_DEG',  label: 'fov',     step: 2,    min: 40,   max: 130,   dp: 0, group: 0 },
  { key: 'HORIZON_FRACTION',   label: 'horizon', step: 0.02, min: 0.12, max: 0.70,  dp: 2, group: 0 },
  { key: 'TILT_FULL_LOCK_DEG', label: 'lock',    step: 1,    min: 4,    max: 45,    dp: 0, group: 1 },
  // A quarter of a degree, because the deadzone is the sensitivity control
  // and half degree steps were too coarse to find its bottom end.
  { key: 'TILT_DEADZONE_DEG',  label: 'dead',    step: 0.25, min: 0,    max: 12,    dp: 2, group: 1 },
  { key: 'STEER_RATE',         label: 'steer',   step: 0.1,  min: 0.6,  max: 5.0,   dp: 1, group: 2 },
  { key: 'GRIP_TIME',          label: 'grip',    step: 0.02, min: 0.04, max: 1.0,   dp: 2, group: 2 },
  { key: 'ROAD_THICKNESS',     label: 'thick',   step: 20,   min: 0,    max: 1200,  dp: 0, group: 3 },
  { key: 'ROAD_FLARE',         label: 'flare',   step: 20,   min: 0,    max: 1400,  dp: 0, group: 3 },
  { key: 'PYLON_SPACING',      label: 'pylons',  step: 1,    min: 2,    max: 40,    dp: 0, group: 4 },
  { key: 'PYLON_HEIGHT',       label: 'post',    step: 30,   min: 60,   max: 2400,  dp: 0, group: 4 },
  { key: 'EDGE_GLOW_ALPHA',    label: 'glow',    step: 0.02, min: 0,    max: 0.9,   dp: 2, group: 4 },
  { key: 'GRID_DEPTH',         label: 'depth',   step: 500,  min: 500,  max: 40000, dp: 0, group: 4 }
];
const TUNABLE_DEFAULTS = {};
TUNABLES.forEach(function (t) { TUNABLE_DEFAULTS[t.key] = FEEL[t.key]; });

function recomputeCamera() {
  CAMERA_DEPTH = 1 / Math.tan((FEEL.FIELD_OF_VIEW_DEG / 2) * Math.PI / 180);
  if (view.h) resize();   // the horizon and both cached gradients move with it
}


/* ------------------------------------------------------------------
   Small helpers.
   ------------------------------------------------------------------ */
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }

function storeGet(key) {
  try { return window.localStorage.getItem(STORAGE_PREFIX + key); }
  catch (e) { return null; }
}
function storeSet(key, value) {
  try { window.localStorage.setItem(STORAGE_PREFIX + key, value); }
  catch (e) { /* no memory is fine, the game still plays */ }
}


/* ------------------------------------------------------------------
   Canvas and view.
   ------------------------------------------------------------------ */
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d', { alpha: false });
const view = { w: 0, h: 0, dpr: 1 };
let hazeGradient = null;
let horizonGradient = null;
let scrapeGradientLeft = null;
let scrapeGradientRight = null;
let scrapeOutGradientLeft = null;
let scrapeOutGradientRight = null;
let scrapeBandWidth = 0;

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, FEEL.MAX_PIXEL_RATIO);
  const w = Math.max(1, canvas.clientWidth);
  const h = Math.max(1, canvas.clientHeight);
  view.w = w;
  view.h = h;
  view.dpr = dpr;
  // Live tuning calls this many times a second while a button is held, and
  // assigning width or height reallocates the backing store even when the
  // value has not changed. Only touch it when it actually moved.
  const cw = Math.round(w * dpr), ch = Math.round(h * dpr);
  if (canvas.width !== cw) canvas.width = cw;
  if (canvas.height !== ch) canvas.height = ch;

  horizonY = Math.round(h * FEEL.HORIZON_FRACTION);

  // The distant road fades into the horizon glow rather than staying sharp
  // all the way to the vanishing point.
  const fade = h * FEEL.HORIZON_FADE_FRACTION;
  hazeGradient = ctx.createLinearGradient(0, horizonY, 0, horizonY + fade);
  hazeGradient.addColorStop(0, 'rgba(20,44,66,0.92)');
  hazeGradient.addColorStop(1, 'rgba(20,44,66,0)');

  /* Section 7.3 wants a horizon to read curvature against, and taking the
     ground away would have removed it. This band puts it back: a glow on
     the line the road converges to, brighter than the void and nowhere
     near as bright as the road edges. */
  const glow = h * FEEL.HORIZON_GLOW_FRACTION;
  horizonGradient = ctx.createLinearGradient(0, horizonY - glow, 0, horizonY + glow);
  horizonGradient.addColorStop(0, 'rgba(46,127,168,0)');
  horizonGradient.addColorStop(0.5, COLOUR.HORIZON_GLOW);
  horizonGradient.addColorStop(1, 'rgba(46,127,168,0)');

  // Cached, because the scrape flash is drawn on the frames where the
  // player is under the most pressure and can least afford a hitch.
  scrapeBandWidth = w * 0.22;
  scrapeGradientLeft = ctx.createLinearGradient(0, 0, scrapeBandWidth, 0);
  scrapeGradientLeft.addColorStop(0, COLOUR.SCRAPE);
  scrapeGradientLeft.addColorStop(1, 'rgba(255,240,168,0)');
  scrapeGradientRight = ctx.createLinearGradient(w, 0, w - scrapeBandWidth, 0);
  scrapeGradientRight.addColorStop(0, COLOUR.SCRAPE);
  scrapeGradientRight.addColorStop(1, 'rgba(255,240,168,0)');
  scrapeOutGradientLeft = ctx.createLinearGradient(0, 0, scrapeBandWidth, 0);
  scrapeOutGradientLeft.addColorStop(0, COLOUR.SCRAPE_OUT);
  scrapeOutGradientLeft.addColorStop(1, 'rgba(255,90,61,0)');
  scrapeOutGradientRight = ctx.createLinearGradient(w, 0, w - scrapeBandWidth, 0);
  scrapeOutGradientRight.addColorStop(0, COLOUR.SCRAPE_OUT);
  scrapeOutGradientRight.addColorStop(1, 'rgba(255,90,61,0)');

  if (showDebug) measureChrome();
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', resize);


/* ==================================================================
   INPUT LAYER

   Everything below writes into steering.value, a single continuous
   number from -1 to +1. Section 8.1: the update loop reads that value
   and nothing else, and does not know or care where it came from.
   Keyboard and touch are the digital special case and ramp toward the
   extreme. Tilt is analogue and writes its smoothed value straight in.
   ================================================================== */
const steering = { value: 0 };

const held = { keyLeft: false, keyRight: false, touchLeft: false, touchRight: false };
const touchSides = new Map();   // pointerId -> -1 or +1

function digitalTarget() {
  const left = held.keyLeft || held.touchLeft;
  const right = held.keyRight || held.touchRight;
  return (left ? -1 : 0) + (right ? 1 : 0);
}

function updateSteering(dt) {
  const target = digitalTarget();
  if (tilt.active && target === 0) {
    steering.value = tilt.value;
  } else {
    const step = dt / FEEL.STEER_RAMP_TIME;
    if (steering.value < target) steering.value = Math.min(steering.value + step, target);
    else if (steering.value > target) steering.value = Math.max(steering.value - step, target);
  }
  steering.value = clamp(steering.value, -1, 1);
}

function clearHeldInput() {
  held.keyLeft = held.keyRight = held.touchLeft = held.touchRight = false;
  touchSides.clear();
}


/* --- Keyboard. Both cases of every letter, so caps lock is not a dead key. --- */
window.addEventListener('keydown', function (e) {
  if (e.repeat) { return; }
  const k = e.key;
  if (k === 'ArrowLeft' || k === 'a' || k === 'A') { held.keyLeft = true; e.preventDefault(); }
  else if (k === 'ArrowRight' || k === 'd' || k === 'D') { held.keyRight = true; e.preventDefault(); }
  else if (k === 'f' || k === 'F') { setDebug(!showDebug); return; }
  // The tuning keys are the keyboard twin of the on screen buttons, and
  // like F they must not also start a run.
  else if (k === '[') { selectTuning(-1); return; }
  else if (k === ']') { selectTuning(1); return; }
  else if (k === '-' || k === '_') { nudgeTuning(-1); return; }
  else if (k === '=' || k === '+') { nudgeTuning(1); return; }
  else if (k === '0') { resetTuning(); return; }
  firstGesture();
  startOrRestart();
});

window.addEventListener('keyup', function (e) {
  const k = e.key;
  if (k === 'ArrowLeft' || k === 'a' || k === 'A') held.keyLeft = false;
  else if (k === 'ArrowRight' || k === 'd' || k === 'D') held.keyRight = false;
});

window.addEventListener('blur', clearHeldInput);
document.addEventListener('visibilitychange', function () {
  if (document.hidden) clearHeldInput();
});


/* --- Touch and mouse, through pointer events, one code path for both.
       Left half of the screen is left, right half is right, nothing held
       is the neutral from section 4.1. --- */
function pointerSide(e) {
  return (e.clientX < view.w / 2) ? -1 : 1;
}

function applyTouchSides() {
  let left = false, right = false;
  touchSides.forEach(function (side) {
    if (side < 0) left = true; else right = true;
  });
  held.touchLeft = left;
  held.touchRight = right;
}

canvas.addEventListener('pointerdown', function (e) {
  touchSides.set(e.pointerId, pointerSide(e));
  applyTouchSides();
  if (canvas.setPointerCapture) { try { canvas.setPointerCapture(e.pointerId); } catch (err) {} }
  e.preventDefault();
  firstGesture();
  startOrRestart();
});

canvas.addEventListener('pointermove', function (e) {
  if (!touchSides.has(e.pointerId)) return;
  touchSides.set(e.pointerId, pointerSide(e));
  applyTouchSides();
});

function releasePointer(e) {
  touchSides.delete(e.pointerId);
  applyTouchSides();
}
canvas.addEventListener('pointerup', releasePointer);
canvas.addEventListener('pointercancel', releasePointer);
canvas.addEventListener('contextmenu', function (e) { e.preventDefault(); });


/* ==================================================================
   TILT

   Opt in behind a button. The game is completely playable by someone
   who never touches it. One permission code path, per section 8.2:
   call requestPermission if it exists, otherwise treat it as granted,
   and handle a denial as a first class outcome.
   ================================================================== */
const tilt = {
  supported: false,
  active: false,
  listening: false,
  value: 0,         // smoothed, -1 to +1, written into steering.value
  rawDeg: null,     // latest reading, already remapped for screen orientation
  zeroDeg: null,    // the posture captured at enable and at every run start
  seenSensor: false,
  waitedFor: 0
};

const tiltBtn = document.getElementById('tiltBtn');
const noteEl = document.getElementById('note');
let noteTimer = 0;

function showNote(text, seconds) {
  noteEl.textContent = text;
  noteEl.hidden = false;
  noteTimer = seconds;
}

function inCrossOriginFrame() {
  if (window.top === window.self) return false;
  try { return window.top.location.origin !== window.location.origin; }
  catch (e) { return true; }
}

function detectTiltSupport() {
  // Desktop has the interface but no sensor, so the button would sit there
  // doing nothing. A cross origin frame gets no events at all and cannot be
  // made to. Hide the button in both cases, per the section 8.3 table.
  if (!('DeviceOrientationEvent' in window)) return false;
  if (inCrossOriginFrame()) return false;
  if (window.matchMedia && !window.matchMedia('(any-pointer: coarse)').matches) return false;
  return true;
}

function orientationAngle() {
  if (window.screen && window.screen.orientation && typeof window.screen.orientation.angle === 'number') {
    return window.screen.orientation.angle;
  }
  return (typeof window.orientation === 'number') ? ((window.orientation + 360) % 360) : 0;
}

function onDeviceOrientation(e) {
  if (e.gamma === null || e.gamma === undefined) return;   // no real sensor behind the event
  tilt.seenSensor = true;

  // gamma is left to right tilt in portrait. In landscape gamma and beta
  // swap roles, so remap off the screen angle.
  const angle = orientationAngle();
  let deg;
  if (angle === 90) deg = -e.beta;
  else if (angle === 180) deg = -e.gamma;
  else if (angle === 270) deg = e.beta;
  else deg = e.gamma;

  tilt.rawDeg = deg;
  if (tilt.zeroDeg === null) tilt.zeroDeg = deg;
}

function calibrateTilt() {
  // Nobody holds a phone flat. Everything is relative to the posture the
  // player is actually in, recaptured at the start of every run.
  tilt.zeroDeg = tilt.rawDeg;
  tilt.value = 0;
}

function updateTilt(dt) {
  if (!tilt.active) return;

  if (!tilt.seenSensor) {
    tilt.waitedFor += dt;
    if (tilt.waitedFor > FEEL.TILT_SENSOR_TIMEOUT) {
      disableTilt();
      tilt.supported = false;
      tiltBtn.hidden = true;
      showNote('No motion sensor on this device.', 4);
    }
    return;
  }
  if (tilt.rawDeg === null || tilt.zeroDeg === null) return;

  const rel = tilt.rawDeg - tilt.zeroDeg;
  const magnitude = Math.abs(rel);
  let target = 0;
  if (magnitude > FEEL.TILT_DEADZONE_DEG) {
    const span = Math.max(1, FEEL.TILT_FULL_LOCK_DEG - FEEL.TILT_DEADZONE_DEG);
    target = clamp((magnitude - FEEL.TILT_DEADZONE_DEG) / span, 0, 1) * Math.sign(rel);
  }
  const k = 1 - Math.exp(-dt / FEEL.TILT_SMOOTHING_TIME);
  tilt.value += (target - tilt.value) * k;
}

function onTiltPermission(result) {
  if (result !== 'granted') {
    // Denial is sticky on iOS. Never let the button appear to do nothing.
    tilt.active = false;
    tiltBtn.classList.remove('on');
    storeSet('tilt', '0');
    showNote('Tilt was blocked. This browser will not ask again for this page.', 5);
    return;
  }
  if (!tilt.listening) {
    window.addEventListener('deviceorientation', onDeviceOrientation);
    tilt.listening = true;
  }
  tilt.active = true;
  tilt.waitedFor = 0;
  tilt.value = 0;
  tilt.zeroDeg = null;
  tiltBtn.classList.add('on');
  storeSet('tilt', '1');
  showNote('Tilt on. Hold the phone how you like, it zeroes to your posture at the start of every run.', 4);
}

function requestTilt() {
  // Must be called synchronously inside a gesture handler, with no async
  // work before it, or it silently fails. One path, both platforms.
  const DOE = window.DeviceOrientationEvent;
  const request = (DOE && typeof DOE.requestPermission === 'function')
    ? DOE.requestPermission()
    : Promise.resolve('granted');
  request.then(onTiltPermission, function () { onTiltPermission('denied'); });
}

function disableTilt() {
  tilt.active = false;
  tilt.value = 0;
  tiltBtn.classList.remove('on');
}

tiltBtn.addEventListener('pointerdown', function (e) {
  e.stopPropagation();
});
tiltBtn.addEventListener('click', function (e) {
  e.stopPropagation();
  // Drop focus, or the next space or enter meant for the game activates
  // the button again instead of starting the run.
  tiltBtn.blur();
  if (tilt.active) {
    disableTilt();
    storeSet('tilt', '0');
    showNote('Tilt off.', 2);
  } else {
    requestTilt();
  }
});

/* The preference persists, the grant does not: most iOS versions want a
   fresh gesture every page load, so re-request on the first one. */
let wantsTilt = storeGet('tilt') === '1';
let gestureUsed = false;
function firstGesture() {
  if (gestureUsed) return;
  gestureUsed = true;
  if (wantsTilt && tilt.supported) requestTilt();
}

tilt.supported = detectTiltSupport();
tiltBtn.hidden = !tilt.supported;


/* ------------------------------------------------------------------
   Frame rate counter, toggled with the button or the F key, so it can
   be measured on a real device rather than assumed on this one.
   ------------------------------------------------------------------ */
const fpsBtn = document.getElementById('fpsBtn');
const tunerEl = document.getElementById('tuner');
let showDebug = false;
let fpsFrames = 0, fpsElapsed = 0, fpsWorst = 0, fpsShown = 0, fpsWorstShown = 0;

/* The readout sits under the button row, which wraps to two lines on a
   narrow phone, so its height is measured rather than assumed. */
let hudTop = 54;
function measureChrome() {
  const box = document.getElementById('buttons').getBoundingClientRect();
  if (box.height > 0) hudTop = Math.round(box.bottom) + 8;
}

function setDebug(on) {
  showDebug = on;
  fpsBtn.classList.toggle('on', on);
  tunerEl.hidden = !on;
  fpsFrames = 0; fpsElapsed = 0; fpsWorst = 0;
  if (on) window.requestAnimationFrame(measureChrome);
}
fpsBtn.addEventListener('pointerdown', function (e) { e.stopPropagation(); });
fpsBtn.addEventListener('click', function (e) {
  e.stopPropagation();
  fpsBtn.blur();
  setDebug(!showDebug);
});

function sampleFps(rawDt) {
  fpsFrames++;
  fpsElapsed += rawDt;
  if (rawDt > fpsWorst) fpsWorst = rawDt;
  if (fpsElapsed >= 0.5) {
    fpsShown = fpsFrames / fpsElapsed;
    fpsWorstShown = fpsWorst * 1000;
    fpsFrames = 0; fpsElapsed = 0; fpsWorst = 0;
  }
}


/* ------------------------------------------------------------------
   Live camera tuning. The camera can only be judged by driving, so the
   four LIVE constants are adjustable from the road, on a phone, behind
   the same toggle as the frame rate counter. The readout on the canvas
   is the whole answer: screenshot it and the numbers are reportable.

   The values persist, so a reload in the middle of a tuning session does
   not throw the work away. That could hide stale numbers behind a hidden
   panel, so the button reads FPS* whenever anything is off default.
   ------------------------------------------------------------------ */
let tuneIndex = 0;

function tunerLine(group) {
  let out = '';
  for (let i = 0; i < TUNABLES.length; i++) {
    const t = TUNABLES[i];
    if (t.group !== group) continue;
    out += (i === tuneIndex ? '▸' : ' ') + t.label + ' ' + FEEL[t.key].toFixed(t.dp) + '  ';
  }
  if (group === 1) {
    // The deadzone only means anything as a share of the usable span.
    out += '(' + Math.round(deadShare() * 100) + '% dead)';
    if (deadShare() > FEEL.TILT_DEADZONE_WARN) out += ' SHRINK DEAD';
  }
  if (group === 2) {
    out += 'slide ' + worstOvershoot().toFixed(2)
        + '/' + (FEEL.OFF_ROAD - FEEL.SCRAPE_START).toFixed(2);
  }
  if (group === 3) {
    // Below this the flare loses to the width one segment gains by being
    // nearer, and the cliff stops being visible at all.
    out += 'min ' + Math.round(660000 / FEEL.CAMERA_DISTANCE);
  }
  return out;
}

function deadShare() {
  return FEEL.TILT_DEADZONE_DEG / Math.max(0.01, FEEL.TILT_FULL_LOCK_DEG);
}

/* How far the car keeps running outwards after the driver slams the lock
   the other way, in road half widths, worst case.

   Reversing sets a new target of minus the current sideways speed, so the
   speed follows v0 minus 2 v0 exp(minus t over tau), which reaches zero at
   tau ln2, and the ground covered getting there is 0.31 v0 tau rather than
   the v0 tau a first guess gives. Compared against the width of the scrape
   band, this is the number that says whether the current STEER_RATE and
   GRIP_TIME leave a mistake recoverable. Worst case is full lock outwards
   with the hardest corner pushing the same way, on the narrowest road. */
const REVERSAL_FACTOR = 0.31;
function worstOvershoot() {
  const v = FEEL.STEER_RATE * (1 + FEEL.CURVE_HARD * FEEL.CENTRIFUGAL) / FEEL.ROAD_WIDTH_NARROW;
  return REVERSAL_FACTOR * v * FEEL.GRIP_TIME;
}

function tunerDirty() {
  for (let i = 0; i < TUNABLES.length; i++) {
    if (FEEL[TUNABLES[i].key] !== TUNABLE_DEFAULTS[TUNABLES[i].key]) return true;
  }
  return false;
}

function markTuning() {
  fpsBtn.textContent = tunerDirty() ? 'FPS*' : 'FPS';
  recomputeCamera();
}

function saveTuning() {
  const out = {};
  TUNABLES.forEach(function (t) { out[t.key] = FEEL[t.key]; });
  storeSet('tune2', JSON.stringify(out));
}

function loadTuning() {
  const raw = storeGet('tune2');
  if (!raw) return;
  let parsed = null;
  try { parsed = JSON.parse(raw); } catch (e) { return; }
  if (!parsed || typeof parsed !== 'object') return;
  TUNABLES.forEach(function (t) {
    const v = parsed[t.key];
    if (typeof v === 'number' && isFinite(v)) FEEL[t.key] = clamp(v, t.min, t.max);
  });
}

function nudgeTuning(dir) {
  const t = TUNABLES[tuneIndex];
  const next = clamp(FEEL[t.key] + dir * t.step, t.min, t.max);
  FEEL[t.key] = parseFloat(next.toFixed(t.dp + 2));
  markTuning();
  saveTuning();
}

function selectTuning(dir) {
  tuneIndex = (tuneIndex + dir + TUNABLES.length) % TUNABLES.length;
}

function resetTuning() {
  TUNABLES.forEach(function (t) { FEEL[t.key] = TUNABLE_DEFAULTS[t.key]; });
  markTuning();
  saveTuning();
}

/* Pinning the seed makes every run generate the same road, so two grip
   settings can be compared on the same corners instead of on two
   different tracks. Debug only, and off by default. */
let seedPinned = false;
const PINNED_SEED = 20260802;
let lastSeed = PINNED_SEED;

function nextSeed() {
  lastSeed = seedPinned ? PINNED_SEED : ((Math.random() * 0xFFFFFFFF) >>> 0);
  return lastSeed;
}

function toggleSeed() {
  seedPinned = !seedPinned;
  const btn = tunerEl.querySelector('[data-act="seed"]');
  if (btn) btn.classList.toggle('on', seedPinned);
  // Restart into the pinned road at once, or the toggle does nothing
  // visible until the next crash.
  if (state !== TITLE) startRun();
}

/* Held buttons repeat, because stepping the camera height a hundred at a
   time with single taps is not a thing anyone will do twice. */
const repeat = { dir: 0, held: 0, fired: 0 };
const REPEAT_DELAY = 0.35, REPEAT_INTERVAL = 0.07;

function updateRepeat(dt) {
  if (!repeat.dir) return;
  repeat.held += dt;
  if (repeat.held < REPEAT_DELAY) return;
  const due = Math.floor((repeat.held - REPEAT_DELAY) / REPEAT_INTERVAL) + 1;
  while (repeat.fired < due) { repeat.fired++; nudgeTuning(repeat.dir); }
}

function stopRepeat() { repeat.dir = 0; repeat.held = 0; repeat.fired = 0; }

tunerEl.addEventListener('pointerdown', function (e) {
  const act = e.target.getAttribute && e.target.getAttribute('data-act');
  if (!act) return;
  e.stopPropagation();
  e.preventDefault();
  if (act === 'prev') selectTuning(-1);
  else if (act === 'next') selectTuning(1);
  else if (act === 'reset') resetTuning();
  else if (act === 'seed') toggleSeed();
  else if (act === 'dec') { nudgeTuning(-1); repeat.dir = -1; repeat.held = 0; repeat.fired = 0; }
  else if (act === 'inc') { nudgeTuning(1); repeat.dir = 1; repeat.held = 0; repeat.fired = 0; }
});
tunerEl.addEventListener('pointerup', stopRepeat);
tunerEl.addEventListener('pointercancel', stopRepeat);
tunerEl.addEventListener('pointerleave', stopRepeat);
window.addEventListener('blur', stopRepeat);

loadTuning();
markTuning();


/* ==================================================================
   THE ROAD

   Lou's segmented pseudo 3D road. Segments hold a curve value only:
   hills are step 3 territory and are not here. The road is generated
   ahead of the camera and trimmed behind it, so it is genuinely
   endless rather than a loop.
   ================================================================== */
let segments = [];
let segBase = 0;         // world index of segments[0]

function segAt(index) {
  return segments[index - segBase];
}

function addSegment(curve, halfWidth) {
  // hw is this segment's road half width, so phrases can squeeze and open
  // the road. ma, ml and mr are the tyre marks it carries: darkness, and
  // the two rear wheel positions entering and leaving, held as fractions
  // of this segment's own width so they draw correctly wherever it is.
  // Marks ride the segments, so trimming the road behind the camera frees
  // them too and nothing accumulates over a run.
  segments.push({
    index: segBase + segments.length, curve: curve, hw: halfWidth,
    ma: 0, ml0: 0, ml1: 0, mr0: 0, mr1: 0
  });
}


/* ------------------------------------------------------------------
   A seeded generator, so a pinned seed reproduces a track exactly and
   two settings can be compared on the same road. Mulberry32.
   ------------------------------------------------------------------ */
let rngState = 1;
function rng() {
  rngState = (rngState + 0x6D2B79F5) | 0;
  let t = Math.imul(rngState ^ (rngState >>> 15), 1 | rngState);
  t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
function vary(n) { return Math.max(3, Math.round(n * (1 + (rng() * 2 - 1) * FEEL.PHRASE_JITTER))); }
/* Biased against repeating itself, so the road does not wander off in one
   direction for three phrases running. */
let lastDir = 1;
function pickDir() {
  lastDir = (rng() < FEEL.DIRECTION_FLIP_CHANCE) ? -lastDir : lastDir;
  return lastDir;
}


/* ==================================================================
   THE PHRASE LIBRARY

   The road is a sequence of phrases rather than a sequence of unrelated
   random corners. Each phrase is a shape that means something to drive:
   a corner that tightens as you commit, two hairpins that share an exit,
   a squeeze that makes an ordinary bend serious. This is still entirely
   procedural, and no track is authored: what is authored is the grammar.

   Two things the old generator could not say, and every phrase here can.
   The entry ramp and the exit ramp are independent, so a corner can open
   differently from how it enters. And the curve moves during the hold, so
   it can tighten or unwind under the car.
   ================================================================== */
let roadWidth = 1;      // current half width, as a multiple of the base

function addRun(count, c0, c1, w0, w1, ease) {
  const base = FEEL.ROAD_HALF_WIDTH_BASE;
  for (let i = 0; i < count; i++) {
    const p = count > 1 ? i / (count - 1) : 1;
    const t = ease ? (1 - Math.cos(p * Math.PI)) / 2 : p;
    addSegment(c0 + (c1 - c0) * t, base * (w0 + (w1 - w0) * t));
  }
  roadWidth = w1;
}

const NARROW = function () {
  return FEEL.ROAD_WIDTH_NARROW + rng() * (1 - FEEL.ROAD_WIDTH_NARROW) * 0.5;
};

const PHRASES = [
  {
    // Recovery. Not filler: it is where the player resets their line and
    // the road comes back to its normal width.
    name: 'straight', intensity: 0,
    build: function () {
      const len = FEEL.RECOVERY_MIN + Math.round(rng() * (FEEL.RECOVERY_MAX - FEEL.RECOVERY_MIN));
      addRun(len, 0, 0, roadWidth, 1, true);
    }
  },
  {
    // A long constant radius corner. Nothing to solve, everything to hold,
    // and it opens out wide so the exit is a reward.
    name: 'sweeper', intensity: 1,
    build: function () {
      const d = pickDir(), c = FEEL.CURVE_MEDIUM * d;
      addRun(vary(FEEL.RAMP_MED), 0, c, roadWidth, 1, true);
      addRun(vary(FEEL.HOLD_LONG), c, c, 1, FEEL.ROAD_WIDTH_WIDE, false);
      addRun(vary(FEEL.RAMP_MED), c, 0, FEEL.ROAD_WIDTH_WIDE, 1, true);
    }
  },
  {
    // A flick. Short, sharp, over before it is a problem, and the thing
    // the whole game is named after.
    name: 'kink', intensity: 1,
    build: function () {
      const d = pickDir(), c = FEEL.CURVE_MEDIUM * d;
      addRun(vary(FEEL.RAMP_SHORT), 0, c, roadWidth, 1, true);
      addRun(vary(FEEL.HOLD_SHORT), c, c, 1, 1, false);
      addRun(vary(FEEL.RAMP_SHORT), c, 0, 1, 1, true);
    }
  },
  {
    // Two opposite corners with no straight between them, so the exit of
    // the first is the entry to the second and the car has to be placed
    // rather than just steered.
    name: 's-bend', intensity: 2,
    build: function () {
      const d = pickDir(), c = FEEL.CURVE_MEDIUM * d;
      addRun(vary(FEEL.RAMP_MED), 0, c, roadWidth, 1, true);
      addRun(vary(FEEL.HOLD_MED), c, c, 1, 1, false);
      addRun(vary(FEEL.RAMP_MED), c, -c, 1, 1, true);      // straight through zero
      addRun(vary(FEEL.HOLD_MED), -c, -c, 1, 1, false);
      addRun(vary(FEEL.RAMP_MED), -c, 0, 1, 1, true);
    }
  },
  {
    // The width lever on its own. An ordinary bend through a squeeze,
    // which is harder than the same bend at full width without the corner
    // itself being any stronger.
    name: 'squeeze', intensity: 2,
    build: function () {
      const d = pickDir(), c = FEEL.CURVE_GENTLE * d, n = NARROW();
      addRun(vary(FEEL.RAMP_MED), 0, c, roadWidth, n, true);
      addRun(vary(FEEL.HOLD_MED), c, c * 1.6, n, n, false);
      addRun(vary(FEEL.RAMP_MED), c * 1.6, 0, n, 1, true);
    }
  },
  {
    // Opens out. Hard on the way in, unwinding under the car, so the
    // instinct to keep the lock on is wrong.
    name: 'opening', intensity: 2,
    build: function () {
      const d = pickDir();
      addRun(vary(FEEL.RAMP_SHORT), 0, FEEL.CURVE_HARD * d, roadWidth, 1, true);
      addRun(vary(FEEL.HOLD_MED), FEEL.CURVE_HARD * d, FEEL.CURVE_GENTLE * d, 1, 1, false);
      addRun(vary(FEEL.RAMP_LONG), FEEL.CURVE_GENTLE * d, 0, 1, FEEL.ROAD_WIDTH_WIDE, true);
      roadWidth = FEEL.ROAD_WIDTH_WIDE;
    }
  },
  {
    // Tightens as you commit. The long entry is deliberate: at this draw
    // distance the whole corner is on screen before it is entered, so it
    // is a decision rather than an ambush.
    name: 'tightening', intensity: 3,
    build: function () {
      const d = pickDir();
      addRun(vary(FEEL.RAMP_LONG), 0, FEEL.CURVE_GENTLE * d, roadWidth, 1, true);
      addRun(vary(FEEL.HOLD_MED), FEEL.CURVE_GENTLE * d, FEEL.CURVE_HARD * d, 1, 0.9, false);
      addRun(vary(FEEL.RAMP_SHORT), FEEL.CURVE_HARD * d, 0, 0.9, 1, true);
    }
  },
  {
    // Left right left, narrow, quick. The one that punishes carrying too
    // much sideways speed into it.
    name: 'chicane', intensity: 3,
    build: function () {
      const d = pickDir(), c = FEEL.CURVE_MEDIUM * d, n = NARROW();
      addRun(vary(FEEL.RAMP_SHORT), 0, c, roadWidth, n, true);
      addRun(vary(FEEL.HOLD_SHORT), c, c, n, n, false);
      addRun(vary(FEEL.RAMP_SHORT), c, -c, n, n, true);
      addRun(vary(FEEL.HOLD_SHORT), -c, -c, n, n, false);
      addRun(vary(FEEL.RAMP_SHORT), -c, c, n, n, true);
      addRun(vary(FEEL.HOLD_SHORT), c, c, n, n, false);
      addRun(vary(FEEL.RAMP_MED), c, 0, n, 1, true);
    }
  },
  {
    // A dogleg. Out and straight back, over in a moment, and the shape
    // that most rewards a flick rather than a steer.
    name: 'jink', intensity: 1,
    build: function () {
      const d = pickDir(), c = FEEL.CURVE_MEDIUM * d;
      addRun(vary(FEEL.RAMP_SHORT), 0, c, roadWidth, 1, true);
      addRun(6, c, c, 1, 1, false);
      addRun(vary(FEEL.RAMP_SHORT), c, -c, 1, 1, true);
      addRun(6, -c, -c, 1, 1, false);
      addRun(vary(FEEL.RAMP_SHORT), -c, 0, 1, 1, true);
    }
  },
  {
    // A run of alternating bends with nothing between them. Whichever way
    // the car is already going decides how the next one goes, all the way
    // down, so it is one problem rather than four.
    name: 'esses', intensity: 2,
    build: function () {
      let d = pickDir();
      const c = FEEL.CURVE_MEDIUM;
      const n = 4 + Math.floor(rng() * 2);
      addRun(vary(FEEL.RAMP_SHORT), 0, c * d, roadWidth, 1, true);
      for (let i = 0; i < n; i++) {
        addRun(vary(FEEL.HOLD_SHORT), c * d, c * d, 1, 1, false);
        if (i < n - 1) { addRun(vary(FEEL.RAMP_MED), c * d, -c * d, 1, 1, true); d = -d; }
      }
      addRun(vary(FEEL.RAMP_MED), c * d, 0, 1, 1, true);
      lastDir = d;
    }
  },
  {
    // A very long gentle corner through a sustained squeeze. Nothing about
    // it is sharp and it goes on long enough to become a test of holding
    // a line rather than of reacting.
    name: 'carousel', intensity: 2,
    build: function () {
      const d = pickDir(), c = FEEL.CURVE_GENTLE * 1.4 * d, n = NARROW();
      addRun(vary(FEEL.RAMP_LONG), 0, c, roadWidth, n, true);
      addRun(vary(FEEL.HOLD_LONG), c, c, n, n, false);
      addRun(vary(FEEL.RAMP_LONG), c, 0, n, 1, true);
    }
  },
  {
    // One corner with two apexes. It opens in the middle, which invites
    // the lock to come off, and then loads up again.
    name: 'double-apex', intensity: 3,
    build: function () {
      const d = pickDir();
      addRun(vary(FEEL.RAMP_MED), 0, FEEL.CURVE_MEDIUM * d, roadWidth, 1, true);
      addRun(vary(FEEL.HOLD_SHORT), FEEL.CURVE_MEDIUM * d, FEEL.CURVE_HARD * d, 1, 1, false);
      addRun(vary(FEEL.HOLD_SHORT), FEEL.CURVE_HARD * d, FEEL.CURVE_GENTLE * d, 1, 1, false);
      addRun(vary(FEEL.HOLD_SHORT), FEEL.CURVE_GENTLE * d, FEEL.CURVE_HARD * d, 1, 1, false);
      addRun(vary(FEEL.RAMP_MED), FEEL.CURVE_HARD * d, 0, 1, 1, true);
    }
  },
  {
    // Hard one way straight into hard the other, with no eased transition
    // and nothing in between. The reversal is linear on purpose: it snaps
    // rather than flows, and it is the hardest thing on the road.
    name: 'switchback', intensity: 3,
    build: function () {
      const d = pickDir(), c = FEEL.CURVE_HARD * d;
      addRun(vary(FEEL.RAMP_MED), 0, c, roadWidth, 1, true);
      addRun(vary(FEEL.HOLD_SHORT), c, c, 1, 1, false);
      addRun(vary(FEEL.RAMP_SHORT), c, -c, 1, 1, false);
      addRun(vary(FEEL.HOLD_SHORT), -c, -c, 1, 1, false);
      addRun(vary(FEEL.RAMP_MED), -c, 0, 1, 1, true);
      lastDir = -d;
    }
  },
  {
    // Two tight corners the same way, sharing a very short breath. The
    // second one is where the first one's exit line is paid for.
    name: 'hairpins', intensity: 3,
    build: function () {
      const d = pickDir(), c = FEEL.CURVE_HARD * d;
      addRun(vary(FEEL.RAMP_MED), 0, c, roadWidth, 1, true);
      addRun(vary(FEEL.HOLD_SHORT), c, c, 1, 1, false);
      addRun(vary(FEEL.RAMP_SHORT), c, 0, 1, 1, true);
      addRun(vary(FEEL.LINK_SHORT), 0, 0, 1, 1, false);
      addRun(vary(FEEL.RAMP_SHORT), 0, c, 1, 1, true);
      addRun(vary(FEEL.HOLD_SHORT), c, c, 1, 1, false);
      addRun(vary(FEEL.RAMP_MED), c, 0, 1, 1, true);
    }
  }
];

/* Rhythm. A hard phrase buys the player calm on either side of it, so
   pressure arrives in waves rather than as a flat wall. */
let restOwed = 0;

function phraseWeight(p) {
  return p.name === 'straight' ? FEEL.STRAIGHT_WEIGHT : FEEL.PHRASE_WEIGHT;
}

function addPhrase() {
  const resting = restOwed > 0;
  if (resting) restOwed--;

  // Weighted, so that resting means an easier corner far more often than
  // it means a straight.
  let total = 0;
  for (let i = 0; i < PHRASES.length; i++) {
    if (resting && PHRASES[i].intensity > 1) continue;
    total += phraseWeight(PHRASES[i]);
  }
  let roll = rng() * total;
  let p = PHRASES[0];
  for (let i = 0; i < PHRASES.length; i++) {
    if (resting && PHRASES[i].intensity > 1) continue;
    roll -= phraseWeight(PHRASES[i]);
    if (roll <= 0) { p = PHRASES[i]; break; }
  }

  p.build();
  // One breath after anything demanding, not two. The breath is usually a
  // corner rather than a straight, so this reads as chaining rather than
  // as a gap, and the hard phrases sit closer together than they did.
  if (restOwed === 0 && p.intensity >= 2) restOwed = 1;
}

function resetRoad(seed) {
  segments = [];
  segBase = 0;
  rngState = seed >>> 0;
  roadWidth = 1;
  restOwed = 0;
  lastDir = 1;
  // No tutorial. The opening is the tutorial: a calm straight at full
  // width, then one gentle curve that teaches hold to turn without a word.
  addRun(FEEL.OPENING_STRAIGHT, 0, 0, 1, 1, false);
  addRun(30, 0, FEEL.CURVE_GENTLE, 1, 1, true);
  addRun(90, FEEL.CURVE_GENTLE, FEEL.CURVE_GENTLE, 1, 1, false);
  addRun(30, FEEL.CURVE_GENTLE, 0, 1, 1, true);
  addRun(60, 0, 0, 1, 1, false);
}

function topUpRoad(baseIndex) {
  const needed = baseIndex + FEEL.DRAW_DISTANCE_SEGMENTS + 4;
  while (segBase + segments.length < needed) addPhrase();
  // Trim what is behind the camera, in one splice rather than one shift
  // per frame, so the array does not grow for the length of a run.
  const behind = baseIndex - segBase;
  if (behind > 128) {
    const drop = behind - 8;
    segments.splice(0, drop);
    segBase += drop;
  }
}


/* ==================================================================
   GAME STATE AND UPDATE

   The update loop reads steering.value. It does not read a key, a
   touch or a sensor. That is the section 8.1 rule and it is the one
   thing here that is expensive to reverse.
   ================================================================== */
const TITLE = 0, DRIVING = 1, DEAD = 2;
let state = TITLE;

let position = 0;        // camera z, world units
/* The car's offset from the road centre is held in world units, not in
   road half widths. That is what makes a narrower road genuinely harder:
   the steering covers the same ground per second either way, so on a
   squeezed road it covers a larger share of what is left. carFrac is that
   offset against the local half width, and it is what the bands read. */
let carX = 0;
let carFrac = 0;
let scraping = false;
let scrapeSide = 0;
let scrapeMeter = 0;     // seconds of edge spent, against SCRAPE_TIME_LIMIT
let scrapeRisk = 0;      // that meter as 0 to 1, for feedback
let shake = 0;
let shakeX = 0, shakeY = 0;
let deadFor = 0;
let lastMarkSeg = -1;
let carSegIndex = 0;     // the segment the car is on, read by the trail fade
let carY = 0;            // height above the road, only ever negative, while falling
let carFallV = 0;
let carPitch = 0;
let coastSpeed = 0;

/* The drift state, in one place, because the slip angle is what 4.4
   scores and it should be read from here rather than recomputed. Nothing
   outside update() writes to it.

   headingV is where the driver is pointing the car, lateralV is where
   the car is actually going, both in road half widths per second. The
   gap between them, expressed as an angle against forward speed, is the
   slip. */
const drift = {
  headingV: 0,
  lateralV: 0,
  headingAngle: 0,   // radians off straight ahead
  travelAngle: 0,    // radians off straight ahead
  slip: 0,           // signed radians, heading minus travel
  slipDeg: 0,        // signed degrees
  slipNorm: 0,       // magnitude, 0 to 1 against SLIP_MAX_DEG
  lateralAccel: 0    // road half widths per second squared, what the body leans on
};

function startRun() {
  resetRoad(nextSeed());
  position = 0;
  carX = 0;
  carFrac = 0;
  scraping = false;
  scrapeSide = 0;
  scrapeMeter = 0;
  scrapeRisk = 0;
  shake = 0;
  deadFor = 0;
  lastMarkSeg = -1;
  steering.value = 0;
  drift.headingV = 0;
  drift.lateralV = 0;
  drift.headingAngle = 0;
  drift.travelAngle = 0;
  drift.slip = 0;
  drift.slipDeg = 0;
  drift.slipNorm = 0;
  drift.lateralAccel = 0;
  carCurveX = 0;
  carY = 0;
  carFallV = 0;
  carPitch = 0;
  coastSpeed = 0;
  for (let i = 0; i < smoke.length; i++) smoke[i].life = 0;
  smokeCount = 0;
  smokeAcc = 0;
  calibrateTilt();
  state = DRIVING;
}

function startOrRestart() {
  if (state === TITLE) { startRun(); return; }
  if (state === DEAD && deadFor >= FEEL.DEATH_INPUT_LOCK) { startRun(); }
}

function update(dt) {
  // Shake decays in every state, so a crash still reads as a crash.
  const decay = Math.exp(-dt / FEEL.SHAKE_DECAY_TIME);
  shake *= decay;
  shakeX = (Math.random() * 2 - 1) * shake;
  shakeY = (Math.random() * 2 - 1) * shake;

  if (state === DEAD) { updateFall(dt); return; }
  if (state !== DRIVING) return;

  topUpRoad(Math.floor(position / FEEL.SEGMENT_LENGTH));
  const carIndex = Math.floor((position + FEEL.CAMERA_DISTANCE) / FEEL.SEGMENT_LENGTH);
  carSegIndex = carIndex;
  const carSegment = segAt(carIndex);
  const curve = carSegment ? carSegment.curve : 0;
  const localHalf = carSegment ? carSegment.hw : FEEL.ROAD_HALF_WIDTH_BASE;

  const speed = FEEL.SPEED * (scraping ? FEEL.SCRAPE_SPEED_FACTOR : 1);
  position += speed * dt;

  /* The only place steering is consumed, and the whole drift model.

     The driver asks for a sideways speed. The nose comes round to face it
     almost at once; the tyres take GRIP_TIME to actually deliver it. A
     curve pushes the car outwards but not the nose, so it drags the two
     apart for as long as the corner lasts. Flicking the wheel drags them
     apart hard and briefly. Both of those gaps are the drift. */
  // Sideways speeds are world units per second. STEER_RATE is quoted in
  // base half widths per second, so it converts once here and the ratio
  // between steering and centrifugal is untouched by either the rate or
  // the local width.
  const rate = FEEL.STEER_RATE * FEEL.ROAD_HALF_WIDTH_BASE;
  const intent = steering.value * rate;
  const gripTarget = intent - curve * FEEL.CENTRIFUGAL * rate;
  drift.headingV += (intent - drift.headingV) * (1 - Math.exp(-dt / FEEL.HEADING_SNAP_TIME));
  drift.lateralV += (gripTarget - drift.lateralV) * (1 - Math.exp(-dt / FEEL.GRIP_TIME));

  // The acceleration the model is actually applying sideways, straight out
  // of the lerp rather than differenced between frames, so it is smooth
  // enough to lean a body on without any filtering.
  drift.lateralAccel = (gripTarget - drift.lateralV) / FEEL.GRIP_TIME;

  const prevX = carX;
  carX += drift.lateralV * dt;
  carFrac = carX / localHalf;

  // Sideways speed against forward speed is an angle. The difference of
  // the two angles is the slip.
  drift.headingAngle = Math.atan(drift.headingV / speed);
  drift.travelAngle = Math.atan(drift.lateralV / speed);
  drift.slip = drift.headingAngle - drift.travelAngle;
  drift.slipDeg = drift.slip * 180 / Math.PI;
  drift.slipNorm = clamp(Math.abs(drift.slipDeg) / FEEL.SLIP_MAX_DEG, 0, 1);

  layTyreMarks(carIndex, prevX);
  updateSmoke(dt);

  const offset = Math.abs(carFrac);
  if (offset > FEEL.OFF_ROAD) { crash(); return; }

  scraping = offset > FEEL.SCRAPE_START;
  scrapeSide = scraping ? Math.sign(carFrac) : 0;
  if (scraping) {
    scrapeMeter += dt;
    if (shake < FEEL.SCRAPE_SHAKE_PX) shake = FEEL.SCRAPE_SHAKE_PX;
    if (scrapeMeter > FEEL.SCRAPE_TIME_LIMIT) { crash(); return; }
  } else {
    scrapeMeter = Math.max(0, scrapeMeter - dt * FEEL.SCRAPE_RECOVER_RATE);
  }
  scrapeRisk = clamp(scrapeMeter / FEEL.SCRAPE_TIME_LIMIT, 0, 1);
}

function crash() {
  state = DEAD;
  deadFor = 0;
  scraping = false;
  shake = FEEL.CRASH_SHAKE_PX;
  carFallV = 0;
  carY = 0;
  carPitch = 0;
  coastSpeed = FEEL.SPEED;
}

/* The fall. Cheap, because the car is already a box in the world: it just
   needs a height and a rotation about its own lateral axis. */
function updateFall(dt) {
  deadFor += dt;

  coastSpeed *= Math.exp(-dt / FEEL.CRASH_COAST_TIME);
  position += coastSpeed * dt;
  carX += drift.lateralV * dt;

  const seg = segAt(Math.floor((position + FEEL.CAMERA_DISTANCE) / FEEL.SEGMENT_LENGTH));
  const localHalf = seg ? seg.hw : FEEL.ROAD_HALF_WIDTH_BASE;
  carFrac = carX / localHalf;

  // Nothing drops until it is actually past the lip, or the car would sink
  // through a road it is still standing on.
  if (Math.abs(carFrac) > EDGE_OUT) {
    carFallV += FEEL.CRASH_GRAVITY * dt;
    carY -= carFallV * dt;
    carPitch -= FEEL.CRASH_TUMBLE * dt;
  }
}


/* ==================================================================
   DRIFT FEEDBACK

   Section 7 calls tyre marks the highest value single effect in a drift
   game. They are stored on the road segments rather than in a list of
   their own, so they curve with the road for free and get thrown away
   with it.
   ================================================================== */
/* Where the two rear wheels touch the road, in world units, given a centre
   position. They yaw with the body, so as the car comes sideways the pair
   swings apart and the two marks sweep away from each other. That
   divergence is the rotation, drawn. */
const rearContact = { left: 0, right: 0 };
function rearWheelOffsets(centreX) {
  const yaw = drift.headingAngle * FEEL.CAR_YAW_GAIN;
  const c = Math.cos(yaw), s = Math.sin(yaw);
  const trackHalf = FEEL.CAR_TRACK / 2;
  const shared = -FEEL.CAR_WHEELBASE / 2 * s;
  rearContact.left = centreX - trackHalf * c + shared;
  rearContact.right = centreX + trackHalf * c + shared;
  return rearContact;
}

function layTyreMarks(carIndex, prevX) {
  const alpha = (drift.slipNorm - FEEL.TYRE_MARK_MIN_SLIP) / (1 - FEEL.TYRE_MARK_MIN_SLIP);
  // The marks come off the rear axle, which is behind the car's centre, so
  // they start where the wheels are rather than where the middle is.
  const axleZ = position + FEEL.CAMERA_DISTANCE - FEEL.CAR_WHEELBASE / 2;
  const axleIndex = Math.floor(axleZ / FEEL.SEGMENT_LENGTH);
  if (alpha <= 0) { lastMarkSeg = axleIndex; return; }
  // Stored as the raw slip intensity from zero to one. The renderer turns
  // it into a colour and an alpha, because both now depend on it.
  const a = clamp(alpha, 0, 1);

  const prev = rearWheelOffsets(prevX);
  const pl = prev.left, pr = prev.right;
  const now = rearWheelOffsets(carX);

  // Fill in any segment the car stepped over this frame, so a long frame
  // does not punch a hole in the line.
  let from = axleIndex;
  if (lastMarkSeg >= 0 && axleIndex - lastMarkSeg > 0 && axleIndex - lastMarkSeg <= 4) {
    from = lastMarkSeg + 1;
  }
  for (let i = from; i <= axleIndex; i++) {
    const s = segAt(i);
    if (!s) continue;
    // Stored against this segment's own width, because that is what the
    // projection hands back when the segment is drawn.
    if (s.ma === 0) { s.ml0 = pl / s.hw; s.mr0 = pr / s.hw; }
    s.ml1 = now.left / s.hw;
    s.mr1 = now.right / s.hw;
    if (a > s.ma) s.ma = a;
  }
  lastMarkSeg = axleIndex;
}

/* Smoke is screen space. The car is pinned to one spot on screen, so
   there is nothing to gain from putting the puffs in the world, and a
   ring buffer of fixed objects means no allocation while sliding. */
const SMOKE_FILL = 'rgb(' + COLOUR.SMOKE + ')';
const smoke = [];
let smokeCount = 0;
let smokeHead = 0;
let smokeAcc = 0;
for (let i = 0; i < FEEL.SMOKE_MAX; i++) {
  smoke.push({ x: 0, y: 0, vx: 0, vy: 0, r: 0, life: 0 });
}

function spawnSmoke(side) {
  const p = smoke[smokeHead];
  smokeHead = (smokeHead + 1) % FEEL.SMOKE_MAX;
  if (smokeCount < FEEL.SMOKE_MAX) smokeCount++;
  // Off whichever rear wheel, at the position the last frame drew it.
  const jitter = carParts.scale * 0.18;
  p.x = (side < 0 ? carParts.rlx : carParts.rrx) + (Math.random() * 2 - 1) * jitter;
  p.y = (side < 0 ? carParts.rly : carParts.rry) + (Math.random() * 2 - 1) * jitter * 0.4;
  p.vx = -drift.lateralV * 40 + (Math.random() * 2 - 1) * 45;
  p.vy = FEEL.SMOKE_BACK_SPEED * (0.75 + Math.random() * 0.5);
  p.r = carParts.scale * FEEL.SMOKE_START_RADIUS;
  p.life = FEEL.SMOKE_LIFE;
}

function updateSmoke(dt) {
  for (let i = 0; i < FEEL.SMOKE_MAX; i++) {
    const p = smoke[i];
    if (p.life <= 0) continue;
    p.life -= dt;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.r += FEEL.SMOKE_GROWTH * dt;
  }
  if (drift.slipNorm <= FEEL.SMOKE_MIN_SLIP) { smokeAcc = 0; return; }
  const strength = (drift.slipNorm - FEEL.SMOKE_MIN_SLIP) / (1 - FEEL.SMOKE_MIN_SLIP);
  smokeAcc += dt * FEEL.SMOKE_RATE * strength;
  let guard = 0;
  while (smokeAcc >= 1 && guard < 8) {
    smokeAcc -= 1;
    guard++;
    spawnSmoke(guard & 1 ? -1 : 1);
  }
  if (smokeAcc > 1) smokeAcc = 1;
}

/* Something under the cliff. A plane of lines well below the road, so the
   void has a floor and a sense of speed of its own. The rows scroll with
   the camera, the columns slide with the car, and the whole thing is two
   stroked paths. Kept dim: nothing down here may compete with the edges. */
function drawGrid(w, h) {
  const rise = FEEL.CAMERA_HEIGHT + FEEL.GRID_DEPTH;
  const spacing = FEEL.GRID_SPACING;
  const offset = position - Math.floor(position / spacing) * spacing;

  ctx.lineWidth = 1;
  ctx.strokeStyle = COLOUR.GRID;
  ctx.beginPath();

  let nearY = 0, farY = 0, nearScale = 0, farScale = 0;
  for (let i = 1; i <= FEEL.GRID_ROWS; i++) {
    const dz = i * spacing - offset;
    if (dz <= CAMERA_DEPTH) continue;
    const scale = CAMERA_DEPTH / dz;
    const y = horizonY + scale * rise * h / 2;
    if (y > h + 40) continue;
    if (!nearScale) { nearScale = scale; nearY = y; }
    farScale = scale; farY = y;
    ctx.moveTo(-40, y);
    ctx.lineTo(w + 40, y);
  }

  if (nearScale) {
    const half = (FEEL.GRID_COLUMNS - 1) / 2;
    for (let i = -half; i <= half; i++) {
      const wx = i * FEEL.GRID_COLUMN_SPACING - carX;
      ctx.moveTo(w / 2 + nearScale * wx * w / 2, nearY);
      ctx.lineTo(w / 2 + farScale * wx * w / 2, farY);
    }
  }
  ctx.stroke();
}

/* Distant towers across the void, below the road. Generated once from a
   fixed pattern so it is the same every frame, repeated horizontally, and
   parallaxed slowly against both the car's sideways position and the
   distance travelled. Dark silhouettes with a dim lit top: it is an
   anchor to read the road against, and it must never pull the eye off the
   edges, so nothing here goes anywhere near their brightness. */
const skylineH = [];
(function () {
  let seed = 1337;
  for (let i = 0; i < FEEL.SKYLINE_COUNT; i++) {
    seed = (seed * 1103515245 + 12345) & 0x7fffffff;
    skylineH.push((seed % 1000) / 1000);
  }
})();

function drawSkyline(w, h) {
  const period = FEEL.SKYLINE_PERIOD;
  const step = period / FEEL.SKYLINE_COUNT;
  const baseY = horizonY + h * FEEL.SKYLINE_DROP;
  const minH = h * FEEL.SKYLINE_MIN_HEIGHT;
  const spanH = h * (FEEL.SKYLINE_MAX_HEIGHT - FEEL.SKYLINE_MIN_HEIGHT);
  let shift = -carX * FEEL.SKYLINE_PARALLAX - position * FEEL.SKYLINE_DRIFT;
  shift = shift - Math.floor(shift / period) * period;

  ctx.beginPath();
  for (let rep = -1; rep <= Math.ceil(w / period); rep++) {
    for (let i = 0; i < FEEL.SKYLINE_COUNT; i++) {
      const x = shift + rep * period + i * step;
      if (x > w + step || x < -step * 2) continue;
      const th = minH + skylineH[i] * spanH;
      ctx.rect(x, baseY - th, step * 0.86, th);
    }
  }
  ctx.fillStyle = COLOUR.SKYLINE;
  ctx.fill();

  // A dim lit line on the roofs, so they read as built rather than as a
  // ragged hole in the background.
  ctx.beginPath();
  for (let rep = -1; rep <= Math.ceil(w / period); rep++) {
    for (let i = 0; i < FEEL.SKYLINE_COUNT; i++) {
      const x = shift + rep * period + i * step;
      if (x > w + step || x < -step * 2) continue;
      const th = minH + skylineH[i] * spanH;
      ctx.rect(x, baseY - th, step * 0.86, 1.5);
    }
  }
  ctx.fillStyle = COLOUR.SKYLINE_TOP;
  ctx.fill();
}

function drawSmoke() {
  if (smokeCount === 0) return;
  ctx.fillStyle = SMOKE_FILL;
  for (let i = 0; i < FEEL.SMOKE_MAX; i++) {
    const p = smoke[i];
    if (p.life <= 0) continue;
    const t = p.life / FEEL.SMOKE_LIFE;
    ctx.globalAlpha = t * FEEL.SMOKE_ALPHA;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}


/* ==================================================================
   RENDER
   ================================================================== */
/* A general point projection, for anything that is not lying flat on the
   road. Same camera, same segments, one deliberate difference.

   The inherited projection is anisotropic: it scales across the screen by
   half the width and down it by half the height, which on a portrait phone
   is a two to one vertical stretch. A flat road never shows it up, and the
   camera was tuned with it in place, so it stays. A box with real height
   does show it up, and would come out twice as tall as it should be.

   So the ground stays exactly where the road puts it, and only the rise
   above the ground uses the horizontal scale. The wheels still touch the
   road to the pixel, and the car keeps its own proportions. */
function projectPoint(out, wx, wy, wz, camX, w, h) {
  const scale = CAMERA_DEPTH / wz;
  out.sx = w / 2 + scale * (wx - camX) * w / 2;
  out.sy = horizonY + scale * FEEL.CAMERA_HEIGHT * h / 2 - scale * wy * w / 2;
  return out;
}

function polygon(x1, y1, x2, y2, x3, y3, x4, y4) {
  ctx.beginPath();
  ctx.moveTo(x1, y1);
  ctx.lineTo(x2, y2);
  ctx.lineTo(x3, y3);
  ctx.lineTo(x4, y4);
  ctx.closePath();
  ctx.fill();
}


/* How far the road has wandered sideways by the time it reaches the car.
   The curve in this technique is faked by sliding the segments across, so
   a car drawn at a fixed screen position would sit off its own road in a
   corner, and off its own tyre marks with it. Captured during the walk
   and used to place the car. */
let carCurveX = 0;

/* The road is walked once into these, then drawn from them twice: the
   walls of the slab, and its top surface. Boundary k is where segment k
   starts, so segment n runs between boundary n and boundary n + 1. */
const MAX_BOUNDS = 520;
const bx = new Float64Array(MAX_BOUNDS);
const by = new Float64Array(MAX_BOUNDS);
const bw = new Float64Array(MAX_BOUNDS);
const bz = new Float64Array(MAX_BOUNDS);
const bt = new Float64Array(MAX_BOUNDS);
const bf = new Float64Array(MAX_BOUNDS);
const bvis = new Uint8Array(MAX_BOUNDS);
const blight = new Uint8Array(MAX_BOUNDS);

/* Past these projected half widths the wide faint passes and the cliff
   are smaller than a pixel. Widths shrink monotonically with distance, so
   the loops break rather than continue. */
const GLOW_CULL_PX = 2.5;
const WALL_CULL_PX = 1.6;

const EDGE_GLOW_FILL = 'rgb(' + COLOUR.EDGE_GLOW + ')';
const SLAB_BOTTOM_GLOW_FILL = 'rgb(' + COLOUR.SLAB_BOTTOM_GLOW + ')';
const PYLON_GLOW_FILL = 'rgb(' + COLOUR.PYLON_GLOW + ')';
// The outer lip of the slab, half width plus the shoulder, as a multiple
// of the half width. The shoulder is the scrape band, so the drawn edge of
// the road really is the last place the car may be.
const EDGE_OUT = 1 + FEEL.RUMBLE_WIDTH_FRACTION;

function drawRoad(w, h) {
  const seg = FEEL.SEGMENT_LENGTH;
  const baseIndex = Math.floor(position / seg);
  const base = segAt(baseIndex);
  if (!base) return;
