<!doctype html>
<html lang="en-au">
<head>
<meta charset="utf-8">
<title>Drift Fever</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="description" content="Drift Fever, a browser drift game. One file, no downloads, nothing to install.">
<meta name="theme-color" content="#e2521c">
<!-- Add to Home Screen. On an iPhone this is the only thing that reliably
     removes the browser chrome: the Fullscreen API has been flag gated and
     unreliable there for years, and Chrome on iOS is WebKit underneath so
     it inherits the same gap. These two tags are the whole of it. There is
     deliberately NO manifest: iOS does not read one for this, and it would
     be a second file and a second request for no benefit. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Drift Fever">
<!-- The Android equivalent, also manifest free. -->
<meta name="mobile-web-app-capable" content="yes">
<!-- An empty data URI, so the browser does not go and ask for a favicon.
     That request would be same origin and harmless, but the rule is zero. -->
<link rel="icon" href="data:,">
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    background: #e2521c;
  }
  body {
    touch-action: none;
    overscroll-behavior: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  #game {
    display: block;
    width: 100%;
    height: 100%;
  }
  /* Chrome sits above the canvas so a tap on a button is never read as
     steering. It spans the full width, so it MUST NOT swallow pointers
     itself: pointer-events is none on the container and auto on the
     buttons, so everything between and around them falls through to the
     canvas and still steers.

     This is not a precaution, it is a repeat. Beakdown shipped with an
     in-play button row in a full width container without this, and the
     invisible strip between the buttons ate every tap across that band of
     the screen. The game was unplayable and the cause took a long time to
     find, because nothing is visible and nothing throws. Drift Fever steers
     on the left and right halves of the screen, so any container laid over
     it is exposed to exactly the same failure. Every new overlay goes in
     here, under these rules, or it gets its own pointer-events none. */
  #chrome {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 2;
    pointer-events: none;
    padding: calc(env(safe-area-inset-top, 0px) + 8px) calc(env(safe-area-inset-right, 0px) + 8px) 0 calc(env(safe-area-inset-left, 0px) + 8px);
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 6px;
  }
  #buttons {
    display: flex;
    flex-wrap: wrap;
    justify-content: flex-end;
    gap: 6px;
    width: 100%;
  }
  #tuner {
    display: flex;
    gap: 6px;
    margin-right: auto;
  }
  #tuner[hidden] {
    display: none;
  }
  #chrome button, #note {
    pointer-events: auto;
  }
  #chrome button {
    font: 600 12px/1 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: #3a1405;
    background: rgba(255, 236, 214, 0.78);
    border: 0;
    border-radius: 7px;
    padding: 9px 11px;
    cursor: pointer;
    touch-action: manipulation;
  }
  #chrome button[hidden] {
    display: none;
  }
  #chrome button.on {
    background: #ffb03a;
    color: #2a0d02;
  }
  #note {
    max-width: 62vw;
    font: 500 12px/1.35 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: #3a1405;
    background: rgba(255, 238, 218, 0.86);
    border-radius: 7px;
    padding: 8px 10px;
    text-align: right;
  }
  #note[hidden] {
    display: none;
  }
  /* The corner pads: mute, pause and the two tilt controls. Round, barely
     there until touched, and low enough in the frame that they are out of
     the way of the road.

     POINTER EVENTS. This container spans the full width of the screen and
     sits over a game that steers on the left and right halves, which is
     precisely the Beakdown failure described at the top of this
     stylesheet: an invisible full width strip over the play area ate every
     tap along its band and the game was unplayable. So pointer-events is
     none on #pads and on .padGroup, and auto only on the buttons
     themselves. Everything between and around the four circles falls
     through to the canvas and still steers. Do not put a background, a
     hit target or a pointer-events:auto on either container.

     SAFE AREA. The bottom inset is where iOS puts the home indicator and
     Android puts its gesture bar, so the whole row is pushed above it and
     the side insets are respected too. */
  #pads {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 2;
    pointer-events: none;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    padding: 0 calc(env(safe-area-inset-right, 0px) + 12px)
             calc(env(safe-area-inset-bottom, 0px) + 12px)
             calc(env(safe-area-inset-left, 0px) + 12px);
  }
  .padGroup {
    pointer-events: none;
    display: flex;
    gap: 10px;
  }
  /* 64 across, comfortably over the 56 point minimum a thumb needs, with
     a lit body rather than a hairline so they read as objects. The inner
     shadows are what give them a rim and a bevel; there is no image and no
     filter, so four of them cost nothing. */
  #pads button {
    pointer-events: auto;
    position: relative;
    width: 64px;
    height: 64px;
    border-radius: 50%;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: rgba(255, 234, 210, 0.92);
    background:
      radial-gradient(circle at 50% 32%, rgba(255, 168, 92, 0.34), rgba(52, 18, 8, 0.66) 70%),
      rgba(26, 10, 4, 0.5);
    border: 2px solid rgba(255, 150, 80, 0.5);
    box-shadow: inset 0 1px 0 rgba(255, 212, 170, 0.4),
                inset 0 -7px 16px rgba(0, 0, 0, 0.45),
                0 3px 10px rgba(0, 0, 0, 0.4);
    cursor: pointer;
    touch-action: manipulation;
    -webkit-backdrop-filter: blur(3px);
    backdrop-filter: blur(3px);
    transition: transform 90ms ease-out, background 140ms ease-out;
  }
  #pads button[hidden] {
    display: none;
  }
  #pads button svg {
    width: 30px;
    height: 30px;
    display: block;
    pointer-events: none;
  }
  #pads button:active {
    transform: scale(0.92);
    background:
      radial-gradient(circle at 50% 32%, rgba(255, 208, 140, 0.6), rgba(190, 74, 20, 0.75) 70%),
      rgba(120, 44, 12, 0.7);
  }
  /* The active state, the same amber the tilt button already used. */
  #pads button.on {
    color: #2e0e02;
    background: radial-gradient(circle at 50% 30%, #ffd68a, #ffab34 72%);
    border-color: #fff6dc;
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.55),
                inset 0 -7px 16px rgba(150, 60, 0, 0.35),
                0 3px 14px rgba(255, 140, 40, 0.4);
  }
  /* The tilt hint from section 5's one exception to no onboarding: a ring
     that breathes out of the button and nothing else. No overlay, no words
     and nothing to dismiss. It is added only where a sensor exists and it
     is taken away for good on the first tap, on the first completed run,
     or on a timer, whichever comes first. */
  #pads button.hint::after {
    content: '';
    position: absolute;
    inset: -3px;
    border-radius: 50%;
    border: 2px solid rgba(255, 176, 58, 0.9);
    animation: padPulse 1.7s ease-out infinite;
  }
  @keyframes padPulse {
    0%   { transform: scale(1); opacity: 0.9; }
    70%  { transform: scale(1.5); opacity: 0; }
    100% { transform: scale(1.5); opacity: 0; }
  }
  @media (prefers-reduced-motion: reduce) {
    #pads button.hint::after { animation: none; opacity: 0.9; }
  }
  /* On the narrowest handsets, four 64s and their gaps leave barely a
     finger of canvas between the two groups, and that band is where a tap
     has to be able to reach the road. 58 is still clear of the 56 point
     minimum a thumb needs. */
  @media (max-width: 359px) {
    #pads button { width: 58px; height: 58px; }
    #pads button svg { width: 27px; height: 27px; }
    .padGroup { gap: 7px; }
  }
  /* A probe for the safe area insets, so the canvas can keep the resource
     bar and the pause overlay clear of the home indicator and the gesture
     bar. Canvas cannot read env() itself. Zero sized and never hit
     testable. */
  #safe {
    position: fixed;
    left: 0;
    top: 0;
    width: 0;
    height: 0;
    pointer-events: none;
    padding-bottom: env(safe-area-inset-bottom, 0px);
    padding-top: env(safe-area-inset-top, 0px);
  }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="chrome">
  <div id="buttons">
    <div id="tuner" hidden>
      <button data-act="prev" type="button">&#9664;</button>
      <button data-act="dec" type="button">&minus;</button>
      <button data-act="inc" type="button">+</button>
      <button data-act="next" type="button">&#9654;</button>
      <button data-act="reset" type="button">reset</button>
      <button data-act="seed" type="button">seed</button>
    </div>
  </div>
  <div id="note" hidden></div>
</div>
<div id="pads">
  <div class="padGroup">
    <button id="soundBtn" type="button" aria-label="Sound"></button>
    <button id="musicBtn" type="button" aria-label="Music"></button>
  </div>
  <div class="padGroup">
    <button id="fullBtn" type="button" hidden aria-label="Fullscreen"></button>
    <button id="tiltBtn" type="button" hidden aria-label="Tilt steering"></button>
    <button id="pauseBtn" type="button" aria-label="Pause"></button>
  </div>
</div>
<div id="safe"></div>
<script>
'use strict';

/* ==================================================================
   DRIFT FEVER

   One self-contained file. No requests, no dependencies, no build.
   Session one: the road, one steering axis, the scrape band, death.
   ================================================================== */


/* ------------------------------------------------------------------
   FEEL CONSTANTS. NOT TO BE CASUALLY CHANGED.

   Every number that decides how the game feels lives in this block,
   including every multiplier used inside the update loop. If a value
   affects feel and it is not here, that is a bug.

   Change one at a time, play it on a phone, and keep the ones that
   survive. Do not retune this block while changing anything else.
   ------------------------------------------------------------------ */
const FEEL = {

  /* Camera and projection.
     The four marked LIVE are adjustable while driving behind the FPS
     toggle, because they can only be judged by playing. Whatever is on
     screen in the debug readout is what the game is actually using.

     CAMERA_HEIGHT only means anything relative to the road width: those
     two are one ratio, and raising the camera makes the road and the car
     smaller on screen. HORIZON_FRACTION buys that space back by moving
     the horizon up and giving the road more of the screen.
     DRAW_DISTANCE_SEGMENTS times SEGMENT_LENGTH is both the planning
     horizon and the frame budget, so it is the first thing to lower if
     a weak machine drops frames. FIELD_OF_VIEW_DEG is a sense of speed
     lever, not a rendering detail: wider reads as faster and distorts
     more, and narrower zooms everything in. */
  /* These four were found by playing on a phone and are settled. Treat
     them the way the build order treats the rest of this block. */
  FIELD_OF_VIEW_DEG:         92,     // LIVE
  /* ----------------------------------------------------------------
     WHERE THE ROAD LEAVES THE SCREEN, written down so it is not worked
     out again from scratch.

     Curves are faked by sliding segments sideways, so a constant curve c
     after the scale S accumulates a lateral offset of c*S*n(n-1)/2 world
     units over n segments, while the distance to those segments is only
     n*L. The projection divides by that distance, so the SCREEN offset of
     the road centre grows LINEARLY in n, and the road centre crosses the
     screen edge at

         n = 2*L / (CAMERA_DEPTH * c * S) + 1     segments from the camera

     where CAMERA_DEPTH is 1/tan(FOV/2). Three consequences, all measured
     as well as derived:

     CAMERA_HEIGHT DOES NOTHING HERE. It appears only in by[], never in
     bx[]. Raising it from 1800 to 6000 moved the mean visible road by
     0.02 seconds. A higher camera holding a bend in frame is true of a
     real 3D camera and false of this projection. It is raised anyway,
     because the more top down look was wanted for its own sake.

     FOV IS THE ONLY CAMERA LEVER. n scales with tan(FOV/2).

     CURVE SCALE IS THE OTHER, and it is the honest one, which is why
     CURVE_SCALE_DEEP is now equal to CURVE_SCALE: the deep game escalates
     through road width, phrase intensity and rest frequency instead.

     At the values below, and at the hardest corner the generator makes
     (CURVE_HARD 5.0, so a post scale curvature of 12.5), the road centre
     leaves the frame 34 segments out, which is 0.30 seconds past the car.
     Staying in frame a full second past the car needs the post scale
     curvature under about 6.4, which is a raw curve of 2.6: between
     CURVE_GENTLE and CURVE_MEDIUM. Every medium and hard corner in the
     game is therefore partly off screen at its apex, and the only fixes
     left are a wider FOV, a weaker CURVE_HARD, or yawing the camera into
     the corner rather than sliding the road. */
  CAMERA_HEIGHT:           2200,     // LIVE
  CAMERA_DISTANCE:         4100,     // LIVE, how far the camera sits behind the car
  /* CAMERA_LOOK slides the camera sideways toward the way the road is
     bending, so the far road stays in frame for longer. It is zero, and
     zero means the camera is locked to the car: the car sits centred and
     stays centred, and nothing slides the world sideways underneath the
     player.

     It was 125 and it was wrong. The offset itself was the complaint, not
     how fast it arrived, and no amount of smoothing or anticipation fixes
     an offset. Two sessions were spent making the lean gentler when the
     answer was not to lean. Corner preview is given up with it, and the
     pylons and the camera height already do that job.

     The machinery below stays so it can be dialled back up from zero on
     the cycler, and it is worth understanding before doing so: curves are
     faked by sliding segments sideways, so lateral offset grows as the
     square of distance while this is a constant. Measured, it buys about
     2% more visible road per 500 world units of camera offset. It is not
     a lever, which is the other reason it is zero.

     CAMERA_LOOK_AHEAD is where the curvature is read from when it is not
     zero: an average over a stretch ahead, weighted toward the near end
     and clipped to road still on screen, so the lean leads the corner
     rather than being shoved by it. */
  /* How much of the car's own sideways position the camera copies.

     1.0 is the camera sitting exactly on the car: the car is pinned to
     the centre of the screen and the road sweeps across it. Because the
     road fills most of the frame, that reads as the SCREEN moving rather
     than the road, which a cold player reported as disorienting.

     0 is the camera sitting on the road centreline: the road is pinned
     and the car visibly moves across it.

     Only the two extremes have ever been tried and both are wrong. This
     is the middle, and it is not CAMERA_LOOK coming back. CAMERA_LOOK
     offset the camera by CURVATURE, a derivative, so it lurched whenever
     the curvature changed and it moved the camera off the car for reasons
     the player had not caused. This copies a POSITION the player is
     already driving, so it is continuous by construction and it can only
     move when the car moves.

     LIVE, on a fine step, and 1.0 so nothing changes until it is tuned. */
  CAMERA_FOLLOW:            1.0,     // LIVE
  CAMERA_LOOK:                0,     // LIVE, world units per unit of curvature
  CAMERA_LOOK_AHEAD:      11000,     // LIVE, world units up the road it reads from
  CAMERA_LOOK_TIME:        0.70,     // seconds of lag on it
  HORIZON_FRACTION:        0.32,     // LIVE, where the horizon sits down the screen
  DRAW_DISTANCE_SEGMENTS:   200,
  SEGMENT_LENGTH:           200,

  /* The road's width now lives on the segment, so phrases can squeeze and
     open it. This is the reference width: everything expressed in road
     half widths means half widths of this, and the live width only scales
     what is drawn and how much margin there actually is. Narrowing makes
     a corner harder without touching its strength, which is the whole
     point, because the corner strengths are already at their ceiling. */
  ROAD_HALF_WIDTH_BASE:    2300,
  ROAD_WIDTH_NARROW:       0.74,     // tightest a phrase may squeeze to
  ROAD_WIDTH_WIDE:         1.12,     // widest a phrase may open to

  /* The road is a slab in space, not a ribbon painted on ground. LIVE,
     because how thick it reads is the difference between a solid object
     and a decal, and that can only be judged by driving.

     The grid below it is what stops the void being nothing to fall into.
     GRID_DEPTH is how far under the road it sits, GRID_SPACING how far
     apart its lines are along the road, and GRID_LINES how many of each
     kind get drawn before it is too far away to matter. */
  /* Thickness and flare trade against each other rather than adding up.
     The wall is occluded by the nearer road, so a taller wall reaches down
     across more segments and more of it disappears, taking the underline
     with it. Width of the visible band is set by the flare, not the drop.
     Deep is sold by the grid and the skyline, not by this number. */
  ROAD_THICKNESS:           640,     // LIVE
  /* The slab is battered: wider at the bottom than at the top. A truly
     vertical side is invisible here, and not by a small margin. A slab
     seen from a camera directly above and behind it occludes its own
     sides completely, and each segment's wall is hidden by the next
     nearer segment's surface. The flare has to beat that: it only shows
     from a distance where it exceeds 1.65 times the width one segment
     gains by being closer, which works out at about 660000 over the
     distance. Below roughly 350 the cliff simply is not there.
     LIVE, because it and the thickness are one shape. */
  ROAD_FLARE:               880,     // LIVE
  EDGE_LIP_FRACTION:       0.13,     // of the half width, the bright lip itself

  /* Glow, done by drawing a bright thing twice: once wide and faint, once
     normal. That is two fills and no shadowBlur, which stays banned. It is
     used on the road edges, the car lights and the tyre marks, and nowhere
     else, because it is what separates neon from coloured lines and it
     stops meaning anything if everything has it. */
  EDGE_GLOW_SPREAD:        0.22,     // of the half width, each side of the lip
  EDGE_GLOW_ALPHA:         0.46,

  /* The underside line. Two glowing lines with dark between them read as a
     solid with thickness far better than one line and an occlusion. This
     one stays dimmer than the top lip, which owns brightest. */
  SLAB_BOTTOM_WIDTH:         80,     // world units, the line itself
  SLAB_BOTTOM_GLOW:         190,     // world units, the faint pass around it

  /* Pylons down both edges. The cheapest sense of speed there is, an edge
     cue in peripheral vision, and a corner readable before the surface is,
     which is section 4.3 done through art instead of camera. Every major
     one is taller and brighter so the line reads as rhythm. */
  PYLON_SPACING:             14,     // segments between pylons
  PYLON_MAJOR_EVERY:          4,     // every nth pylon is a marker post
  PYLON_HEIGHT:             640,     // world units
  PYLON_MAJOR_HEIGHT:       760,
  PYLON_WIDTH:               85,
  PYLON_MAJOR_WIDTH:        110,
  PYLON_OUT:               0.06,     // of the half width, how far outboard they stand
  PYLON_MIN_PX:             1.4,     // culled once shorter than this on screen
  PYLON_GLOW_SPREAD:        1.9,     // multiple of the pylon width
  PYLON_GLOW_ALPHA:        0.22,

  /* The horizon. Section 7.3 calls it the emotional anchor and it was a
     colour ramp. Distant towers seen across the void, well below the road,
     which is the altitude reading rather than the neon one. It parallaxes
     slowly and it is nowhere near the edges in brightness. */
  SKYLINE_COUNT:             40,
  SKYLINE_PERIOD:          1100,     // pixels the pattern repeats over
  SKYLINE_MIN_HEIGHT:     0.008,     // of screen height
  SKYLINE_MAX_HEIGHT:      0.05,
  SKYLINE_DROP:           0.008,     // how far below the horizon its base sits
  SKYLINE_PARALLAX:       0.018,     // against the car's sideways position
  SKYLINE_DRIFT:         0.0016,     // against distance travelled
  /* The floor sits a long way down, which is the point: the distinctive
     thing here is a narrow slab at altitude, not the neon on it. Deep
     enough that the near rows fall off the bottom of the screen and only
     the distant ones are in shot, which is what real height looks like. */
  GRID_DEPTH:             15000,
  GRID_SPACING:            2400,
  GRID_ROWS:                 44,
  GRID_COLUMNS:              15,
  GRID_COLUMN_SPACING:     4200,
  HORIZON_GLOW_FRACTION:   0.09,     // of screen height
  RUMBLE_SEGMENTS:            4,     // stripe length, in segments
  RUMBLE_WIDTH_FRACTION:   0.65,     // of the road half width. This is the shoulder,
                                     // and it is drawn to match the scrape band below.
  LANE_DASH_FRACTION:      0.02,     // of the road half width
  HORIZON_FADE_FRACTION:   0.14,     // of screen height, the haze band
  MAX_PIXEL_RATIO:            2,     // capped for weak integrated graphics

  /* Motion. Speed is constant in this build: speed escalation is step 3
     of the build order and is deliberately not here yet. */
  SPEED:                   9000,     // world units per second
  /* LIVE. Base road half widths per second at full lock, once the tyres
     have caught up. It is a target, not a jump. Raising it tightens the
     turning circle and is safe against the centrifugal ceiling, because
     the curve term below is scaled by this same number and the ratio does
     not move. What it does change is how far the car overshoots when you
     reverse out of a slide, which is bounded by STEER_RATE times GRIP_TIME
     against the width of the scrape band. */
  STEER_RATE:               3.2,     // LIVE
  STEER_RAMP_TIME:         0.10,     // seconds for keyboard or touch to reach full lock

  /* The drift. GRIP_TIME is the whole mechanic: the car's actual sideways
     velocity chases what the steering is asking for, and lags it by this
     long. HEADING_SNAP_TIME is how fast the nose comes round, and it must
     stay well under GRIP_TIME or there is no gap between where the car
     points and where it is going, which is to say no drift. The angle
     between those two is the slip angle, and it is the number 4.4 will
     score. Raise GRIP_TIME for a looser, slidier car. LIVE, and meant to
     be balanced against STEER_RATE by playing: a tighter turn feeds more
     sideways speed into the same grip and slides further. */
  GRIP_TIME:               0.40,     // LIVE
  HEADING_SNAP_TIME:       0.06,
  SLIP_MAX_DEG:              30,     // slip angle that counts as fully sideways
  /* How far the car is drawn turned. LIVE, both of them.

     CAR_YAW_GAIN is the honest half: the nose points where the steering
     is asking, and only there.

     CAR_CURVE_YAW was the lie, added to stop the car looking detached as
     the road bent around it, and it is zero now. It read as the game
     steering for you, which is far worse than reading as detached: a
     driving game that appears to have aim assistance has lost the only
     thing it was selling. Nothing may now rotate the car that the driver
     did not ask for.

     It stays on the cycler so it can be dialled back up from zero, but
     note before doing so that it is not needed to avoid detachment.
     Holding a line through any real corner already costs most of full
     lock, because centrifugal is 0.124 and a medium corner after the
     curve scale is 8.0, so CAR_YAW_GAIN alone yaws the car hard into
     every bend. That is honest yaw, out of the driver's own input. */
  CAR_YAW_GAIN:             1.0,     // LIVE
  CAR_CURVE_YAW:              0,     // LIVE, radians per unit of road curvature

  /* CENTRIFUGAL is the fraction of full steering authority a curve of 1.0
     eats. LIVE, and the number that decides whether a corner is something
     you drive or something that happens around you.

     It is not free to raise. The generator's real ceiling is CURVE_HARD
     exactly: every phrase interpolates between two endpoints and none can
     overshoot them, so nothing on the road is ever stronger than 5. That
     times this is the share of full lock the hardest corner costs just to
     hold a line, and at 1.0 the corner is unsurvivable however well it is
     driven. The debug readout prints that product live, beside the largest
     curvature actually generated, so it can be walked up in full view. */
  CENTRIFUGAL:            0.124,     // LIVE

  /* The three bands from section 4.2, measured in road half widths, so
     1.0 is the painted edge of the road and the car is CAR_BODY_WIDTH
     across, which is 0.26 of a half width.
     The band is wide on purpose: 4.4 wants the player to live in it, so
     it is a destination and not a mercy window. SCRAPE_START puts the
     outside wheels on the shoulder, OFF_ROAD takes them off the far side
     of it, and RUMBLE_WIDTH_FRACTION is set so the shoulder you can see
     is exactly the band you are allowed to be in.

     What stops the band being a free ride is the timer, not its width.
     SCRAPE_TIME_LIMIT is how long you may hold the edge before it kills
     you, and it refills at SCRAPE_RECOVER_RATE of that while you are back
     on the road, so risk is spent and earned rather than held. Tune these
     two for how long a player should be able to sustain risk. */
  SCRAPE_START:            0.87,
  OFF_ROAD:                1.50,
  SCRAPE_SPEED_FACTOR:     0.62,     // forward speed multiplier while scraping
  SCRAPE_TIME_LIMIT:        1.6,     // seconds of edge before it kills you
  SCRAPE_RECOVER_RATE:      0.8,     // refill rate on the road, against the drain rate

  /* Feedback. Section 7 warns that shake is the fastest route to motion
     sickness on a phone held close to the face. Keep these low. */
  SCRAPE_SHAKE_PX:            4,
  CRASH_SHAKE_PX:            16,
  /* The budget bar. Section 7 wants the risk state legible without UI and
     it already is: the edge flash shifts colour as the timer runs down,
     and that stays the primary channel because in a reflex game the eyes
     never leave the road. This is the secondary channel, for learning the
     system and for reading between corners, so it sits low and central
     where the eyes already are rather than in a corner nobody will glance
     at, it disappears when the budget is full, and it never gets bright
     enough to argue with the road edges. */
  BAR_WIDTH:               0.42,     // of screen width
  BAR_HEIGHT:                 6,     // pixels
  /* Above the safe area AND above the corner pads, which are 48 across
     with a 12 margin, so the row is 76 tall. The bar is centred and the
     pads are in the corners so they never actually touch, but sitting
     them on the same line read as clutter. */
  BAR_BOTTOM:                92,     // pixels above the safe area
  BAR_FADE_TIME:           0.45,     // seconds to fade away once full again
  BAR_ALPHA:               0.70,

  /* Leaving the road is a fall now rather than a freeze. The car keeps
     the sideways speed that put it there, slides off the lip, and only
     then starts dropping, so it goes over the edge instead of sinking
     through the surface. The camera coasts rather than stopping dead. */
  /* ----------------------------------------------------------------
     Scoring, which is section 4.4: score the risk, not the distance.

     The failure this is built against is a permanent shallow drift. If
     time spent sideways is what pays, the whole game collapses into one
     move held for ever, so time alone must pay almost nothing and the
     multiplier has to be bought with depth and with proximity to the
     edge, both at once.

     That is why the two factors MULTIPLY rather than add, and why both
     go to zero at their easy end. Sitting sideways in the middle of the
     road earns a climb of exactly zero, not a small one, and a
     multiplier that is not climbing is decaying. Sitting on the edge
     without slip earns zero the same way. Only both together pay, and
     the scrape timer from 4.2 is what stops the paying state being
     somewhere you can live.

     MULT_SLIP_POWER above 1 bends the slip term against shallow angles
     specifically, so easing into a lazy slide barely registers while
     committing to one pays quickly. */
  /* Two rates, not one, and the split is the whole point.

     SCORE_SURVIVE_RATE is what mere time is worth, and it is deliberately
     small. SCORE_RISK_RATE is paid on the multiplier ABOVE one, so it is
     paid for risk taken and for nothing else.

     A single rate times the multiplier was the obvious shape and it does
     not work. Thirty seconds of coasting sideways in the middle is ten
     times the exposure of three seconds on the edge, so for the three
     seconds to win, the mean multiplier across them has to clear ten.
     With a cap of twelve that needs an instant climb to the cap and it
     only just gets there; with any realistic climb the cap would have to
     be past twenty, which is the runaway the cap exists to prevent. The
     arithmetic does not care how the constants are tuned.

     So time pays a trickle and risk pays the rest, which is a closer read
     of 4.4 than the single rate was anyway: score the risk, not the
     distance. Distance still pays something, because a run that survives
     ought to beat one that does not. */
  SCORE_SURVIVE_RATE:        10,     // points per second, just for still being on the road
  SCORE_RISK_RATE:          110,     // points per second per multiplier above one
  MULT_MIN_SLIP:           0.25,     // slipNorm under this is not drifting at all
  MULT_SLIP_POWER:          1.6,     // above 1 punishes shallow angles
  MULT_EDGE_START:         0.45,     // road half widths, where the edge term leaves zero
  MULT_EDGE_PEAK:          1.15,     // and where it reaches full, inside the scrape band
  MULT_CLIMB_RATE:          3.2,     // multiplier per second, at full slip on the edge
  MULT_DECAY_RATE:          1.1,     // per second whenever nothing is being earned
  MULT_MAX:                  12,
  /* The readout. It has to teach the rule inside one corner without a
     word, so the number is large, it sits where the eyes already are, and
     it takes its colour from the same ramp the tyre marks run through, so
     the trail on the road and the number on the screen are visibly the
     same signal. */
  SCORE_TOP:               0.05,     // of screen height
  SCORE_SIZE:             0.062,     // of the smaller screen dimension
  MULT_TOP:               0.125,
  MULT_SIZE:              0.085,
  MULT_GROWTH:             0.55,     // how much the number swells at full multiplier
  MULT_POP_TIME:           0.18,     // seconds of kick each time it crosses a whole number

  /* ----------------------------------------------------------------
     Checkpoints and the clock, which together are the progression layer.

     A gate every CHECKPOINT_EVERY segments banks the score, tops the
     clock up and moves the run to a new place to look at.

     BANKING settles the open question in section 14. The score you keep
     is the score you had at the last gate; what you have earned since is
     pending and a crash loses it. Every run ends in a crash, so that is
     not a punishment bolted on, it is what makes a gate an event: the
     number rolls over and is yours.

     THE CLOCK is meant to be honest and almost never the thing that
     kills you. It drains at one second per second and drifting pays it
     back, scaled by slip exactly as the multiplier is, so anyone taking
     the corners properly tops it up without thinking about it. The rates
     below are set so that a driver who never slides at all loses about a
     fifth of a second per second, which is a couple of minutes of
     deliberately passive driving before it bites, and a driver who
     actually drifts gains. It does not run at all during the on ramp. */
  /* A RESOURCE AT ITS CAP COMMUNICATES NOTHING. The first version paid
     drifting back faster than time was spent, so a competent driver
     pinned the clock at the ceiling and the number never moved. It was
     working perfectly and saying nothing, which is the same as not being
     there.

     So the balance is inverted: between gates even good driving runs a
     small deficit, and the gate is the income that clears it. That makes
     the clock swing by most of its range on every cycle, and a number
     that moves is the entire point. It is not harder: the gates span the
     road and cannot be missed, so a driver who is drifting still ends
     each cycle up on where they started. Drifting now buys a shallower
     drain rather than a surplus, which is still visible in real time and
     is what the readout shows. */
  CLOCK_START:               20,     // seconds in hand at the start of a run
  CLOCK_MAX:                 26,     // LIVE, the most that can be banked
  CLOCK_CHECKPOINT:          16,     // LIVE, seconds a gate is worth
  CLOCK_DRIFT_RATE:         1.1,     // LIVE, seconds paid back per second at full slip
  /* The clock's own slip threshold, and it is much higher than the
     multiplier's on purpose. Corners in this game generate slip whether
     you meant it or not: a driver deliberately holding the middle and not
     sliding still measures 0.58 mean slip, barely under a driver who is
     drifting properly. Paying from MULT_MIN_SLIP therefore paid everyone
     the same and made the clock a decoration. From here, only slip that
     was actually asked for pays. */
  CLOCK_MIN_SLIP:          0.55,
  /* The warning band has to be somewhere the clock actually goes. At 8
     against a clock that lived at 40 it was thirty two seconds below
     anywhere the player ever visited and never once fired. */
  CLOCK_LOW:                 14,     // LIVE, seconds under which the readout warns
  CHECKPOINT_EVERY:        1500,     // LIVE, segments between gates, about 33 seconds
  CHECKPOINT_HEIGHT:       1500,     // world units, the posts either side
  CHECKPOINT_POST:          260,     // world units, how thick they are
  CHECKPOINT_FLASH:         0.5,     // seconds of the crossing flash
  CLOCK_TOP:               0.20,     // of screen height, under the multiplier
  CLOCK_SIZE:             0.055,     // of the smaller screen dimension
  CLOCK_GATE_SIZE:        0.036,     // the distance to the next gate, beside it
  CLOCK_PAY_SIZE:         0.030,     // the live payback readout
  CLOCK_POP_TIME:          1.30,     // seconds the gate payout stays up

  CRASH_GRAVITY:          26000,     // world units per second squared
  CRASH_TUMBLE:             2.4,     // radians per second, nose over
  CRASH_COAST_TIME:        0.55,     // seconds for the camera to run down
  SHAKE_DECAY_TIME:        0.22,     // seconds to fall to about a third
  SCRAPE_FLASH_ALPHA:      0.32,
  DEATH_INPUT_LOCK:        0.30,     // seconds before a restart is accepted

  /* ----------------------------------------------------------------
     Audio. Everything here is synthesised: oscillators and one generated
     noise buffer. Nothing is fetched, nothing is decoded, and there is no
     sample data in the file, because section 6's audience is behind a
     content filter and a single blocked request is a broken game.

     It is off until a station is picked, and it is off again on the next
     load. Section 5 says audio defaults off and stays off across sessions,
     so the chosen station is deliberately NOT persisted: these are shared
     classroom machines and the next person to open the page gets silence.
     ---------------------------------------------------------------- */
  AUDIO_MASTER:            0.55,     // the whole graph, never near 1
  AUDIO_FADE_TIME:         0.08,     // seconds, the follow on every live level
  AUDIO_START_TIME:        0.35,     // seconds to fade the graph in on a station change
  /* The very first start is slower than a station change, because it is
     the one nobody asked for. A game that comes up at full level in a
     quiet room gets closed before the player finds the mute. */
  AUDIO_FIRST_FADE:         1.2,     // seconds, silence to full on the first gesture
  /* The pause does not mute. It closes a lowpass over the whole graph, so
     the music is still there and muffled, which reads as the game being
     set aside rather than as the audio having crashed. */
  AUDIO_PAUSE_CUTOFF:       300,     // Hz the master lowpass closes to
  AUDIO_OPEN_CUTOFF:      18000,     // Hz it sits at otherwise
  AUDIO_PAUSE_TIME:        0.18,     // seconds of sweep, each way

  /* The skid, and it is the one that matters. ONE voice, started once and
     never retriggered: a looping noise buffer through a bandpass whose
     frequency, Q and level are all driven by the slip angle. Retriggering
     a skid per event is what makes drift games sound like a stuck record.

     Fatigue is the thing to design against here, because this sound is
     present for most of a good run. Three defences: the top end is rolled
     off by a fixed lowpass after the bandpass, the band moves over a
     deliberately modest range so it reads as a tyre loading up rather
     than as a siren, and SKID_WOBBLE keeps it alive at a held slip angle
     without any of that movement being large.

     SKID_GAIN_MAX is NOT a level and must not be read as one. It is a
     gain applied before two filters that throw most of the energy away,
     so it compensates for them and the number that matters is what comes
     out. Measured at the master output at full slip: at 0.30 the skid was
     0.016 RMS against the music's 0.046, so the sound carrying the core
     mechanic was three times quieter than the backing track despite the
     two constants looking comparable. 1.10 only brought it to parity, so
     this is 1.60, which measures 0.075 RMS against the music's 0.049, a
     lead of about four decibels. The worst case the graph can produce,
     full slip plus a scrape plus a crash on top, peaks at 0.40 of full
     scale, so there are eight decibels of headroom left. There is
     no clipping and no distortion: the path is linear, so a louder skid
     is a louder skid and not a harsher one.

     Note that bite scales this by slip, and a typical fast lap sits near
     0.65 slip rather than 1.0, so the sustained level in play is roughly
     two thirds of the figure above. */
  SKID_GAIN_MAX:           1.60,
  SKID_MIN_SLIP:           0.08,     // slipNorm below this is silent
  SKID_FREQ_LOW:            520,     // Hz at the first hint of slip
  SKID_FREQ_HIGH:          1250,     // Hz fully sideways. Modest on purpose.
  SKID_Q_LOW:               1.1,
  SKID_Q_HIGH:              4.2,     // tighter as it bites, which is the whistle
  SKID_TOP_CUTOFF:         2600,     // Hz, the fixed roll off that stops the hiss
  SKID_WOBBLE_HZ:           5.7,     // a slow, small breath on the band
  SKID_WOBBLE_FREQ:          70,     // Hz of deviation, audio rate, no per frame cost

  /* The scrape. Also one continuous voice, because scraping is a state
     rather than an event, but it has to be unmistakable against the skid
     at a glance: two high Q bands at a deliberately non harmonic ratio
     ring like metal on metal, where the skid is broad and soft. It also
     tightens as the budget runs out, which is the same thing the edge
     flash is already saying. */
  SCRAPE_GAIN_MAX:         0.26,
  SCRAPE_FREQ:             2100,     // Hz, the first band
  SCRAPE_FREQ_RATIO:       1.48,     // the second, off any harmonic of the first
  SCRAPE_Q:                  11,
  SCRAPE_RISK_LIFT:        0.35,     // how far under full it starts, so the max is the max

  /* The crash, and then quiet. One envelope on a noise burst with the
     filter sweeping down, and every other voice pulled to nothing under
     it, so the wind down is clean rather than a skid that outlives the
     car. */
  CRASH_GAIN:              0.50,
  CRASH_FREQ_FROM:         1400,     // Hz the sweep starts at
  CRASH_FREQ_TO:            110,     // Hz it lands on
  CRASH_TIME:              0.90,     // seconds of tail

  /* The music. Driving, arpeggiated, and built in layers rather than as
     one part, so the intensity can rise smoothly with what the car is
     doing instead of switching between arrangements. MUSIC_HEAT_TIME is
     what keeps that smooth: the heat follows slip and scrape through a
     long lag, so a flick does not make the music stutter. */
  MUSIC_GAIN:              0.34,
  MUSIC_BPM:                148,     // high tempo, per the brief
  MUSIC_STEPS:               16,     // steps in a bar, so these are sixteenths
  MUSIC_LOOKAHEAD:         0.14,     // seconds of notes scheduled in front
  MUSIC_HEAT_TIME:         0.90,     // seconds of lag on the intensity
  MUSIC_BASS_GAIN:         0.30,
  MUSIC_ARP_GAIN:          0.20,
  MUSIC_OCTAVE_GAIN:       0.13,     // the layer that only arrives under pressure
  MUSIC_HAT_GAIN:          0.09,
  MUSIC_ARP_CUTOFF_LOW:     700,     // Hz at rest, dull
  MUSIC_ARP_CUTOFF_HIGH:   4200,     // Hz on the edge, open
  MUSIC_NOTE_DECAY:        0.16,     // seconds
  MUSIC_BASS_DECAY:        0.20,
  MUSIC_HAT_DECAY:        0.045,
  MUSIC_ATTACK:           0.006,     // seconds. Short, but not zero, or it clicks.
  MUSIC_DUCK:              0.35,     // how far the music drops under a crash

  /* Tilt. TILT_SMOOTHING_TIME matters most on cheap Android handsets that
     derive orientation from the accelerometer.

     The two LIVE ones move together or not at all. TILT_DEADZONE_DEG is
     subtracted from TILT_FULL_LOCK_DEG to get the usable span, so shrinking
     the full lock angle without shrinking the deadzone hands a bigger share
     of the wrist to the dead part. The readout prints the deadzone as a
     percentage of full lock for exactly that reason: hold that percentage
     roughly steady while hunting for the lock angle. */
  /* Which way a tilt steers. The sign that comes off the sensor is not
     reliable across handsets and browsers, and the reading also degrades
     as the phone approaches upright, where the spec's own decomposition
     is at a singularity. So this is the shipped default and the Flip
     button beside Tilt reverses it permanently, rather than a sign error
     ever being a blocker again.

     THE CONVENTION, written down because this has now been reversed four
     times and each time it was reasoned about from scratch.

     A positive steering value turns the car RIGHT. That is fixed by the
     keyboard, where the right key sets the digital target to +1, and it
     runs through unchanged: intent is steering times the rate, lateralV
     chases intent, carX adds lateralV, and a positive carX is the right
     hand side of the road. Nothing between the sensor and the car
     reverses it.

     In portrait the reading is e.gamma, and gamma is positive when the
     device's right edge is tipped DOWN. The chain from there is
     sign preserving throughout: rel is the reading minus the calibrated
     zero times this constant, the deadzone takes a magnitude and puts
     Math.sign(rel) straight back on, the smoothing is a lerp toward that
     target, and updateSteering assigns tilt.value to steering.value
     unmodified.

     So at +1: drop the right edge, gamma rises, steering goes positive,
     the car goes right. Drop the left edge and it goes left. That is the
     direction a driver expects and it is what this must be.

     At -1 it was exactly inverted, which is the bug reported in sessions
     ten, twelve and thirteen. Session eleven had it right and session
     thirteen broke it again. It is on the debug cycler behind ?debug=1
     so it can be settled on a handset rather than in another session. */
  TILT_DIRECTION:             1,
  TILT_SMOOTHING_TIME:     0.08,     // seconds, exponential smoothing
  TILT_DEADZONE_DEG:       1.50,     // LIVE, the neutral state from section 4.1
  TILT_FULL_LOCK_DEG:        15,     // LIVE, degrees from the calibrated zero to full lock
  /* Past this share of the full lock angle, the deadzone has eaten most of
     the analogue range and the gyro is behaving like a switch. The readout
     says so rather than clamping it, because the right answer is to shrink
     the deadzone, not to stop looking for sensitivity. */
  TILT_DEADZONE_WARN:      0.30,
  TILT_SENSOR_TIMEOUT:      1.5,     // seconds to wait for a first real reading
  /* Section 5 says no tutorial and that stands. Tilt is the one exception
     because it is an invisible option behind a button nobody has a reason
     to press, and a ring that breathes around that button is not a
     tutorial: no overlay, no words, nothing to dismiss.

     The timer is the important half. It stops on the stored flag, but
     storage fails silently on locked down school profiles, which is
     precisely this audience, so first visit detection quietly becomes
     every visit for some players. A pulse that gives up after a few
     seconds regardless is fine. One that greets a returning player for
     ever is not. Frame time, so it does not run down in a hidden tab. */
  TILT_HINT_SECONDS:         10,

  /* The car, in world units, the same units as the road. It is a real box
     in the world now, so these are its actual dimensions and they set the
     perceived mass. Where it sits on screen is not a constant: it falls
     out of CAMERA_DISTANCE and HORIZON_FRACTION, and the front of the car
     is further from the camera than the back, so the two ends project at
     different scales on their own.

     The road is 4600 units across, so a unit is roughly two and a half
     millimetres and the car is about 1.5 by 2.2 metres. BODY_WIDTH sets the
     margin: SCRAPE_START is 1 minus half the body width in road half
     widths, so the outside wheels reach the shoulder as the scrape begins.
     Move one, check the other.

     One caution about the length. The ground plane is stretched along the
     road by the same anisotropy the car's height dodges, so a car that is
     twice as long as it is wide in world units reads closer to three times
     on screen. The length below is set by how it looks, not by the ratio.
     If the road ever gets an isotropic projection, lengthen it again. */
  CAR_BODY_WIDTH:           600,
  CAR_BODY_LENGTH:          880,
  CAR_BODY_HEIGHT:          250,
  CAR_RIDE_HEIGHT:           85,     // ground to the underside of the body
  CAR_CABIN_LENGTH:         380,
  CAR_CABIN_WIDTH:          450,
  CAR_CABIN_HEIGHT:         175,
  CAR_CABIN_OFFSET:         -40,     // negative sits the cabin back towards the rear
  CAR_WHEEL_DIAMETER:       230,
  CAR_WHEEL_WIDTH:          100,
  CAR_TRACK:                630,     // wheel centre to wheel centre, wider than the body
  CAR_WHEELBASE:            560,     // front axle to rear axle
  CAR_FRONT_STEER_DEG:       30,     // how far the front wheels turn at full lock

  /* Body roll. It leans away from the direction it is being accelerated,
     which is what makes it read as having weight. Section 7 warns about
     overdoing motion on a phone held close to the face, so this is small
     on purpose. CAR_ROLL_REFERENCE is the sideways acceleration, in road
     half widths per second squared, at which the lean saturates. */
  /* Off. It read as the car tilting rather than as the car drifting, which
     is a different and worse thing to say. The constant and the code stay
     so it can be put back by moving one number. */
  CAR_ROLL_DEG:             0.0,
  CAR_ROLL_REFERENCE:       8.0,
  CAR_ROLL_PIVOT:            60,     // height of the axis it leans about
  CAR_POOL_ALPHA:          0.30,     // the light the car spills onto the road
  CAR_POOL_SIZE:            5.2,     // multiple of the body half width
  CAR_POOL_SQUASH:         0.62,     // it lies on the road, so it is an ellipse
  CAR_LIGHT_GLOW_SPREAD:    2.3,     // multiple of the light strip, for its glow
  CAR_LIGHT_GLOW_ALPHA:    0.34,

  /* Tyre marks. They live on the road segments, so they are bounded by
     the segment window and cannot grow through a long run. They are only
     visible between the camera and the car, which means CAMERA_DISTANCE
     decides how much of your own line you get to see. They are laid from
     the two rear wheel contact points, which yaw with the body, so the
     pair sweeps apart as the car comes sideways. */
  TYRE_MARK_WIDTH:        0.028,     // road half widths
  /* Low, so that a tidy line still leaves a faint cool trace and the ramp
     has somewhere to start. The intensity doubles as the alpha, so near
     the threshold the mark is there but almost invisible. */
  TYRE_MARK_MIN_SLIP:      0.05,
  /* Higher than it was, because the road underneath is far darker now.
     At the old value the marks came out a muted purple instead of the
     glow the palette needs them to be. Still nowhere near the edge. */
  TYRE_MARK_MAX_ALPHA:     0.70,
  /* The trail. The marks are the trail, rather than a second ribbon that
     would compete with them. They fade out behind the car over this many
     segments, and their colour runs from a dim cool line when the car is
     gripping to a hot one when it is fully sideways. That ramp is 4.4's
     argument made visually: the best looking thing on screen is the thing
     the player earns by taking risk, and it exists before any score does. */
  TRAIL_FADE_SEGMENTS:       46,
  TRAIL_GLOW_SPREAD:        3.4,     // multiple of the mark width
  TRAIL_GLOW_ALPHA:        0.34,

  /* Tyre smoke. Screen space, because the car is at a fixed screen
     position, and capped so a long slide cannot grow the buffer. */
  SMOKE_MIN_SLIP:          0.30,
  SMOKE_RATE:                60,     // puffs per second at full slip
  SMOKE_LIFE:              0.45,     // seconds
  SMOKE_BACK_SPEED:         340,     // pixels per second down the screen
  SMOKE_GROWTH:              50,     // pixels per second of radius. Overdo this and
                                     // the puffs merge into one grey boulder.
  SMOKE_START_RADIUS:      0.09,     // of the car width
  SMOKE_ALPHA:             0.16,
  SMOKE_MAX:                 70,     // hard cap on live puffs

  /* Road generation. The road is built from phrases rather than from an
     independent random pick per section, so corners can set each other up.
     Lengths below are in segments and every phrase jitters them, so these
     are centres rather than exact values.

     The corner strengths are at their ceiling and must not be raised.
     CURVE_HARD times CENTRIFUGAL is already 55% of full lock, and at 100%
     a corner is unsurvivable however well it is driven. Difficulty comes
     from sequencing and from road width. */
  OPENING_STRAIGHT:         140,     // segments of calm before anything happens
  RAMP_SHORT:                10,
  RAMP_MED:                  26,
  RAMP_LONG:                 48,
  HOLD_SHORT:                16,
  HOLD_MED:                  52,
  HOLD_LONG:                125,
  LINK_SHORT:                14,     // the breath between linked corners
  /* Straights are connectors, not scenery. Long enough to read the next
     corner and reset the line, short enough that they are never the thing
     you are doing. They are not deleted, because without them the hard
     sequences have nothing to be hard against, and section 4.3 needs
     somewhere to look ahead from. */
  RECOVERY_MIN:              20,
  RECOVERY_MAX:              44,
  STRAIGHT_WEIGHT:            1,     // against PHRASE_WEIGHT for everything else
  PHRASE_WEIGHT:              3,
  DIRECTION_FLIP_CHANCE:   0.68,     // how often a phrase turns the other way
  PHRASE_JITTER:           0.28,     // fractional variation on every length
  /* The three corner strengths, and one gain over all of them.

     Visual tightness and difficulty are two dials, not one. These values
     and CURVE_SCALE decide how sharply the road bends on screen. That
     product times CENTRIFUGAL decides how hard it throws the car, and only
     the second one has a ceiling at 1.0. So the shape can be made far
     tighter at unchanged difficulty by raising this and dropping
     CENTRIFUGAL to match, and the two can then be tuned apart.

     CURVE_SCALE is applied where the curvature is read rather than where
     it is stored, so moving it live reshapes the road already on screen
     instead of only the road not yet generated. The three below keep their
     relationship to each other and are not separately tunable on purpose. */
  CURVE_GENTLE:             1.6,
  CURVE_MEDIUM:             3.2,
  CURVE_HARD:               5.0,
  CURVE_SCALE:              2.5,     // LIVE, the reference the ramp is built around

  /* ----------------------------------------------------------------
     Road hazards, which is section 4.5: escalate by KIND, not by degree.
     Three of them, each a different skill, introduced one at a time.

     BLOCKER  occupies part of the width. A line change. Placed off centre
              so the clean line often runs near an edge, which spends the
              scrape economy that already exists rather than inventing a
              second one.
     SPLITTER a long bar down the middle. Pick a side and commit. A
              decision rather than a reflex, and a fork in feel without
              any fork geometry.
     MOVER    a blocker sliding across the road. Timing.

     All three are the same box with different parameters, so there is one
     piece of geometry, one collision test and one draw pass.

     THEY MUST NEVER BE UNAVOIDABLE, and that is enforced rather than
     hoped for. See hazardFits: every candidate is checked against the
     lateral distance the car can actually cover in the warning distance,
     at the worst curvature in the span, from the worst starting side, and
     rejected if the margin is under HAZARD_SAFETY. Nothing is placed that
     has not passed.

     THEY GET THE SAME THREE BANDS AS THE ROAD EDGE. Clipping the shoulder
     of one drives the existing scrape state, so it costs speed and budget
     and brings the flash and the shake with it. Hitting the core kills.
     Section 4.2's argument against a binary cliff applies to a hazard
     exactly as it applies to the road edge. */
  /* Taller and striped, because a cold player read these as jumps and
     aimed at them. Height alone is not the fix: what says "solid" is a
     dark vertical face carrying diagonal hazard striping, which is the
     one marking that universally means do not hit. */
  HAZARD_HEIGHT:            900,     // world units, tall enough to read at distance
  HAZARD_STRIPE_COUNT:        7,     // diagonal bands across the front face
  HAZARD_STRIPE_SLANT:      0.9,     // of the face height, how far the bands lean
  HAZARD_CLIP:              140,     // world units of shoulder each side, the middle band
  HAZARD_WARN_SEGMENTS:      45,     // a full second of warning, painted on the road
  HAZARD_WARN_STRIPES:        4,     // arrowheads painted in the OPEN lane
  HAZARD_ARROW_LENGTH:        7,     // segments each arrowhead spans
  /* The curvature a hazard may sit in at its entry, after the scale.

     This is a READABILITY bound and nothing else. The road slides off the
     side of the screen at about 2L/(CAMERA_DEPTH x curvature) segments,
     so for a warning run of 45 segments to be on screen at all the
     curvature has to stay under about 9.2. Set below that with margin.

     It deliberately does NOT try to be the safety bound as well. The
     crossing check in hazardFits already uses the actual curvature of the
     actual span, so it rejects anything unreachable by arithmetic rather
     than by a blanket rule, and it self limits long before this: at 7.0,
     centrifugal has eaten 87% of the steering and almost nothing passes.
     Setting this to 3.0 as a catch-all made hazards so rare that a player
     met one every ten minutes. */
  HAZARD_MAX_CURVE:         7.0,
  HAZARD_SAFETY:           1.35,     // required margin on the crossing check
  /* A gap exactly one car wide is not a gap. The car carries GRIP_TIME of
     lag, so it cannot be placed into a slot and held there, and a check
     that only asks whether the centre fits will happily build one. Every
     usable gap has to admit the car and this much slack as well. Movers
     were the ones that exposed it: at the ends of their swing they left
     a sliver against the far edge that passed a centre-fits test and was
     undriveable in practice. */
  HAZARD_MIN_GAP:           260,     // world units of slack beyond the car

  /* The crossing has to be made at the ENTRY. Once alongside a hazard the
     car only has to hold a lane, which is a much weaker requirement, so
     the strict curvature gate covers the warning run and the first few
     segments and the body is allowed to bend further.

     Without this a splitter never places at all: 44 segments of hazard
     plus 45 of warning is 89 segments, and 89 segments under a post scale
     curvature of 3.0 essentially never occurs in this grammar. The body
     limit is set below the point where centrifugal eats the whole of the
     steering, which is 1/CENTRIFUGAL, about 8.0, so the car can always
     still hold its lane. */
  HAZARD_ENTRY_SEGMENTS:      8,
  HAZARD_BODY_CURVE:        6.0,

  BLOCKER_HALF:             420,     // world units
  BLOCKER_SEGMENTS:           5,
  BLOCKER_OFFSET_MIN:      0.28,     // road half widths from the centre line
  BLOCKER_OFFSET_MAX:      0.62,
  SPLITTER_HALF:            300,
  SPLITTER_SEGMENTS:         44,     // about a second of committing to one side
  MOVER_HALF:               320,
  MOVER_SEGMENTS:             5,
  MOVER_SWING:             0.36,     // road half widths either side of centre
  /* Slow enough to read, and that is a hard number rather than a feel.
     A mover the car cannot outrun sideways is not a timing problem, it is
     a coin toss: commit to a side, watch it follow you, die. So the sweep
     speed is gated against the car's own lateral speed in hazardFits and
     the placement is rejected if the ratio is under MOVER_OUTRUN. At a
     swing of 0.52 and this period the mover crosses at about 0.54 half
     widths per second against roughly 2.0 the car can manage in the worst
     curvature a hazard is allowed to sit in. */
  MOVER_PERIOD:             6.0,     // seconds for a full sweep
  MOVER_OUTRUN:             2.5,     // times faster the car must be, sideways

  /* When each kind first appears, in seconds of the run, and how often
     one is tried after that. The on ramp has none at all: a new player
     never meets a mover and a good player meets everything, which is the
     same split the difficulty ramp already uses and it does the
     forgiveness work for free. EVERY is a mean gap in segments, so
     smaller is more often. All six are LIVE. */
  /* A hazard is SCHEDULED first and the road is then built to suit it,
     rather than a suitable gap being hunted for in road that already
     exists. That is the right dependency order and it is what makes them
     common enough to be a mechanic: hunting refused about 1160 of every
     1600 candidates, almost all of them warning runs that fell inside a
     corner, and it capped the whole system at roughly one hazard a
     minute.

     It also improves the road rather than costing anything. A readable
     approach IS the planning time section 4.3 asks for, and a hazard that
     resolves properly beats one that appears out of a bend.

     The approach is a lazy bend rather than a dead straight most of the
     time, because a game that lays sixty segments of nothing every time
     it wants to show you something has traded one kind of boring for
     another. Anything up to CURVE_GENTLE stays inside the readability
     gate with room to spare. */
  HAZARD_APPROACH_CURVE:    0.7,     // of CURVE_GENTLE, the lazy bend it arrives on
  HAZARD_STRAIGHT_CHANCE:  0.40,     // how often the approach is dead straight instead
  HAZARD_RUNOUT:             16,     // segments of gathering up afterwards

  /* The first blocker is inside the on ramp on purpose. A blocker on a
     wide road at eighteen seconds is not a threat, it is the teaching
     moment section 5 says to use instead of words: it is unmissable, it
     is survivable, and it explains itself. */
  BLOCKER_TIME:              18,     // seconds, inside the on ramp
  SPLITTER_TIME:             55,
  MOVER_TIME:                85,
  /* Mean segments between hazards of that kind, and now that the road is
     built to suit them these are the real spacing rather than an attempt
     rate that mostly failed. A segment is about a fortieth of a second,
     so a thousand segments is roughly twenty two seconds. All LIVE. */
  BLOCKER_EVERY:           1000,     // LIVE
  SPLITTER_EVERY:          3200,     // LIVE
  MOVER_EVERY:             2400,     // LIVE

  /* ----------------------------------------------------------------
     Progressive difficulty, in two halves that are deliberately not the
     same thing.

     THE ON RAMP is the first ONRAMP_SECONDS and it replaces the tutorial
     section 5 refuses to allow. Wide road, gentle curves, nothing above
     ONRAMP_INTENSITY, and rests often. A player who understands nothing
     should get through it, and a player who understands the game should
     pass through it in a minute without ever noticing it was there.

     THE DEEP GAME is everything after, and it keeps ramping over
     RAMP_SECONDS: curve scale up, road down to ROAD_SQUEEZE, everything
     unlocked, rests rare.

     Difficulty comes from geometry, width and frequency, and never from
     speed. Speed is the wrong lever in this engine: centrifugal is per
     second, so a faster car spends less time in a corner and the corner
     gets weaker, and all a speed ramp really buys is less reaction time.

     ADAPTATION TOUCHES THE ON RAMP AND NOTHING ELSE. It moves where the
     easy part ends inside the window, never where the window ends, so
     difficulty past ONRAMP_SECONDS is a pure function of elapsed time and
     identical for everybody. That is what keeps scores comparable: every
     score worth comparing was earned in the shared part of the run. */
  /* FORGIVENESS COMES FROM MARGIN, NOT FROM ABSENCE. The first version of
     this on ramp was specified as an absence of things: rests seven times
     in ten, most of the phrase library locked out, corners that barely
     bent, for a whole minute. It was survivable and it was the least
     interesting minute in the game, which is the minute almost everybody
     plays.

     What actually stops a new player dying is the width and the scrape
     band, so those stay generous and everything else comes back. Corners
     that are real corners on a road wide enough to survive them are the
     thing worth learning; a straight is punctuation. All of these are
     LIVE so the balance can be found by playing rather than by argument. */
  ONRAMP_SECONDS:            30,     // LIVE, the whole on ramp, the same for everyone
  ONRAMP_FLAT:                6,     // seconds of it that stay at the easiest setting
  ONRAMP_CURVE:             1.9,     // LIVE, curve scale at the start of a run
  ONRAMP_WIDTH:            1.22,     // LIVE, road width multiplier at the start
  ONRAMP_INTENSITY:           2,     // LIVE, hardest phrase the on ramp may use
  ONRAMP_REST:             0.22,     // LIVE, chance of a forced breath after a phrase
  RAMP_SECONDS:             100,     // LIVE, on ramp end to full difficulty
  /* Equal to CURVE_SCALE, so the curve does not escalate past the on
     ramp at all. It was 3.1, which pushed curvature 24% past anything the
     camera was set up for and walked most of the drivable surface off the
     side of the screen on every hard corner. Width, intensity and rest
     frequency carry the deep game instead, and they are better levers in
     this engine anyway. Raising this above CURVE_SCALE costs visible road
     roughly in proportion: see the note above CAMERA_HEIGHT. */
  CURVE_SCALE_DEEP:         2.5,     // where the curve scale ends up
  ROAD_SQUEEZE:            0.88,     // road width multiplier at full difficulty
  DEEP_INTENSITY:             3,
  /* How much the on ramp may soften for somebody who keeps dying in it.
     Nothing is announced and there is no menu, per section 7.7. */
  ADAPT_DEATH_WINDOW:        30,     // dying inside this many seconds counts as struggling
  ADAPT_STEP:              0.34,     // how fast the softening comes and goes
  /* Kept under ONRAMP_SECONDS with room, or the eased flat runs past the
     end of the window and difficulty stops being identical for everybody
     after it, which is the one thing the on ramp must not break. */
  ADAPT_FLAT_EXTRA:          12,     // extra seconds of the easiest setting, at full ease
  ADAPT_CURVE_EASE:         0.3,     // curve scale taken off the start, at full ease
  ADAPT_WIDTH_EASE:        0.14,     // road width added at the start, at full ease

  /* Frame. Clamped so a stutter cannot teleport the player off the road. */
  MAX_FRAME_DELTA:      1 / 20
};


/* ------------------------------------------------------------------
   PALETTE. Neon on dark.

   Section 7 refuses this look and the reasoning there is about
   distinctiveness and about readability. The distinctiveness argument has
   been overruled deliberately by the author. The readability argument has
   not, and it is binding, so this block is ordered by luminance and the
   order is the specification:

     1. the road edge, brightest thing on screen, nothing may beat it
     2. the car, bright and warm so it never reads as part of the road
     3. tyre marks, glowing, a third hue so they are never an edge
     4. the road surface, dark but plainly lighter than the void
     5. the centre line, dimmer than the edge and never competing
     6. the walls of the slab, darker than its top, so the edge catches
        light and the wall does not
     7. the grid and the void

   The Beakdown failure this is closest to is a dark surface lost against
   a dark background, so item 4 above is the one to check first if any of
   this is changed.
   ------------------------------------------------------------------ */
/* The palette is one decision, made twice.

   The world is warm: reds and oranges, saturated, dark where it needs to
   be dark and hot where it needs to be seen. The car is cool, and that is
   not a taste, it is the whole reason it reads. A yellow car worked
   because it was the one warm object in a cool world; turning the world
   warm without turning the car would have hidden it. So the relationship
   is inverted rather than kept, and the car is now the one cool object in
   a warm world. It stays the highest contrast thing on screen, which is
   the only rule about it that matters.

   The three rules from the neon session are unchanged and still bind:
   the road edges are the brightest thing on screen, the road surface
   stays plainly above the void in value, and the centre line stays dim
   enough that it can never be mistaken for an edge. The tyre marks are a
   fourth: they ran cool to hot through magenta before, and magenta on
   warm asphalt is a much weaker read than magenta on blue, so the ramp is
   now blue to cyan to white and carries its intensity in value rather
   than in hue. */
/* The place the run is in. Only the background moves: the sky, the glow
   on the horizon, the grid under the road and the skyline on it. The road
   itself and the car are deliberately untouched, because the readability
   rules from the neon session are load bearing and a biome that breaks
   them is a biome that kills people. This is the smallest thing that
   honestly reads as somewhere new, and it cannot make the game unfair. */
const BIOMES = [
  { VOID: '#0b0503', GRID: 'rgba(150,58,22,0.22)', GRID_NEAR: 'rgba(214,88,30,0.32)',
    HORIZON_GLOW: '#b8431a', HAZE: '58,20,10', HORIZON_FADE: '184,67,26',
    SKYLINE: '#170906', SKYLINE_TOP: '#66200c' },
  { VOID: '#0a0410', GRID: 'rgba(120,40,150,0.22)', GRID_NEAR: 'rgba(180,70,215,0.32)',
    HORIZON_GLOW: '#8a2ec2', HAZE: '40,14,58', HORIZON_FADE: '138,46,194',
    SKYLINE: '#120620', SKYLINE_TOP: '#4a1470' },
  { VOID: '#03080b', GRID: 'rgba(24,110,120,0.22)', GRID_NEAR: 'rgba(40,180,190,0.32)',
    HORIZON_GLOW: '#127f8e', HAZE: '10,42,48', HORIZON_FADE: '18,127,142',
    SKYLINE: '#04141a', SKYLINE_TOP: '#0d5566' },
  { VOID: '#0b0703', GRID: 'rgba(150,110,20,0.22)', GRID_NEAR: 'rgba(220,168,36,0.32)',
    HORIZON_GLOW: '#b8871a', HAZE: '54,38,10', HORIZON_FADE: '184,135,26',
    SKYLINE: '#170f04', SKYLINE_TOP: '#6a4a0c' }
];
let biome = 0;
function applyBiome(i) {
  biome = ((i % BIOMES.length) + BIOMES.length) % BIOMES.length;
  const b = BIOMES[biome];
  for (const k in b) COLOUR[k] = b[k];
  // The horizon and haze gradients are cached, so they have to be rebuilt.
  if (view.h) resize();
}

  { key: 'CAMERA_LOOK_AHEAD',  label: 'ahead',   step: 500,  min: 0,    max: 30000, dp: 0, group: 7 },
  /* Two positions only, and it is here because the flip button is gone
     and this is now the single place the tilt direction lives. It has
     been reversed three times; settling it on the phone beats settling it
     in another session. */
  { key: 'TILT_DIRECTION',     label: 'tiltdir', step: 2,    min: -1,   max: 1,     dp: 0, group: 1 }
];
const TUNABLE_DEFAULTS = {};
TUNABLES.forEach(function (t) { TUNABLE_DEFAULTS[t.key] = FEEL[t.key]; });

function recomputeCamera() {
  CAMERA_DEPTH = 1 / Math.tan((FEEL.FIELD_OF_VIEW_DEG / 2) * Math.PI / 180);
  camHeight = FEEL.CAMERA_HEIGHT;
  if (view.h) resize();   // the horizon and both cached gradients move with it
}


/* ------------------------------------------------------------------
   Small helpers.
   ------------------------------------------------------------------ */
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }

function storeGet(key) {
  try { return window.localStorage.getItem(STORAGE_PREFIX + key); }
  catch (e) { return null; }
}
function storeSet(key, value) {
  try { window.localStorage.setItem(STORAGE_PREFIX + key, value); }
  catch (e) { /* no memory is fine, the game still plays */ }
}


/* ------------------------------------------------------------------
   Canvas and view.
   ------------------------------------------------------------------ */
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d', { alpha: false });
const view = { w: 0, h: 0, dpr: 1 };
let hazeGradient = null;
let horizonGradient = null;
let safeBottom = 0;      // home indicator and gesture bar, measured from CSS
let scrapeGradientLeft = null;
let scrapeGradientRight = null;
let scrapeOutGradientLeft = null;
let scrapeOutGradientRight = null;
let scrapeBandWidth = 0;

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, FEEL.MAX_PIXEL_RATIO);
  const w = Math.max(1, canvas.clientWidth);
  const h = Math.max(1, canvas.clientHeight);
  view.w = w;
  view.h = h;
  view.dpr = dpr;
  // Live tuning calls this many times a second while a button is held, and
  // assigning width or height reallocates the backing store even when the
  // value has not changed. Only touch it when it actually moved.
  const cw = Math.round(w * dpr), ch = Math.round(h * dpr);
  if (canvas.width !== cw) canvas.width = cw;
  if (canvas.height !== ch) canvas.height = ch;

  horizonY = Math.round(h * FEEL.HORIZON_FRACTION);

  const probe = window.getComputedStyle(document.getElementById('safe'));
  safeBottom = parseFloat(probe.paddingBottom) || 0;

  // The distant road fades into the horizon glow rather than staying sharp
  // all the way to the vanishing point.
  const fade = h * FEEL.HORIZON_FADE_FRACTION;
  hazeGradient = ctx.createLinearGradient(0, horizonY, 0, horizonY + fade);
  hazeGradient.addColorStop(0, 'rgba(' + COLOUR.HAZE + ',0.92)');
  hazeGradient.addColorStop(1, 'rgba(' + COLOUR.HAZE + ',0)');

  /* Section 7.3 wants a horizon to read curvature against, and taking the
     ground away would have removed it. This band puts it back: a glow on
     the line the road converges to, brighter than the void and nowhere
     near as bright as the road edges. */
  const glow = h * FEEL.HORIZON_GLOW_FRACTION;
  horizonGradient = ctx.createLinearGradient(0, horizonY - glow, 0, horizonY + glow);
  horizonGradient.addColorStop(0, 'rgba(' + COLOUR.HORIZON_FADE + ',0)');
  horizonGradient.addColorStop(0.5, COLOUR.HORIZON_GLOW);
  horizonGradient.addColorStop(1, 'rgba(' + COLOUR.HORIZON_FADE + ',0)');

  // Cached, because the scrape flash is drawn on the frames where the
  // player is under the most pressure and can least afford a hitch.
  scrapeBandWidth = w * 0.22;
  scrapeGradientLeft = ctx.createLinearGradient(0, 0, scrapeBandWidth, 0);
  scrapeGradientLeft.addColorStop(0, COLOUR.SCRAPE);
  scrapeGradientLeft.addColorStop(1, 'rgba(' + COLOUR.SCRAPE_FADE + ',0)');
  scrapeGradientRight = ctx.createLinearGradient(w, 0, w - scrapeBandWidth, 0);
  scrapeGradientRight.addColorStop(0, COLOUR.SCRAPE);
  scrapeGradientRight.addColorStop(1, 'rgba(' + COLOUR.SCRAPE_FADE + ',0)');
  scrapeOutGradientLeft = ctx.createLinearGradient(0, 0, scrapeBandWidth, 0);
  scrapeOutGradientLeft.addColorStop(0, COLOUR.SCRAPE_OUT);
  scrapeOutGradientLeft.addColorStop(1, 'rgba(' + COLOUR.SCRAPE_OUT_FADE + ',0)');
  scrapeOutGradientRight = ctx.createLinearGradient(w, 0, w - scrapeBandWidth, 0);
  scrapeOutGradientRight.addColorStop(0, COLOUR.SCRAPE_OUT);
  scrapeOutGradientRight.addColorStop(1, 'rgba(' + COLOUR.SCRAPE_OUT_FADE + ',0)');

  if (showDebug) measureChrome();
  // fullReady is a var on purpose: resize runs during start up, well
  // before the fullscreen block further down has been evaluated, and a
  // let or a const would be in its temporal dead zone at that point.
  if (fullReady) syncFullButton();
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', resize);
// resize fires on rotation too, and on some Android browsers it is the
// only one that does, so the tilt re zero hangs off it as well.
window.addEventListener('resize', function () {
  if (typeof onOrientationChanged === 'function') onOrientationChanged();
});


/* ==================================================================
   INPUT LAYER

   Everything below writes into steering.value, a single continuous
   number from -1 to +1. Section 8.1: the update loop reads that value
   and nothing else, and does not know or care where it came from.
   Keyboard and touch are the digital special case and ramp toward the
   extreme. Tilt is analogue and writes its smoothed value straight in.
   ================================================================== */
const steering = { value: 0 };

const held = { keyLeft: false, keyRight: false, touchLeft: false, touchRight: false };
const touchSides = new Map();   // pointerId -> -1 or +1

function digitalTarget() {
  const left = held.keyLeft || held.touchLeft;
  const right = held.keyRight || held.touchRight;
  return (left ? -1 : 0) + (right ? 1 : 0);
}

function updateSteering(dt) {
  const target = digitalTarget();
  if (tilt.active && target === 0) {
    steering.value = tilt.value;
  } else {
    const step = dt / FEEL.STEER_RAMP_TIME;
    if (steering.value < target) steering.value = Math.min(steering.value + step, target);
    else if (steering.value > target) steering.value = Math.max(steering.value - step, target);
  }
  steering.value = clamp(steering.value, -1, 1);
}

function clearHeldInput() {
  held.keyLeft = held.keyRight = held.touchLeft = held.touchRight = false;
  touchSides.clear();
}


/* --- Keyboard. Both cases of every letter, so caps lock is not a dead key. --- */
window.addEventListener('keydown', function (e) {
  if (e.repeat) { return; }
  const k = e.key;
  if (k === 'ArrowLeft' || k === 'a' || k === 'A') { held.keyLeft = true; e.preventDefault(); }
  else if (k === 'ArrowRight' || k === 'd' || k === 'D') { held.keyRight = true; e.preventDefault(); }
  else if (k === 'f' || k === 'F') { if (debugAllowed) setDebug(!showDebug); return; }
  else if (k === 'Escape' || k === 'p' || k === 'P') { togglePause(); return; }
  // The tuning keys are the keyboard twin of the on screen buttons, and
  // like F they must not also start a run.
  else if (debugAllowed && k === '[') { selectTuning(-1); return; }
  else if (debugAllowed && k === ']') { selectTuning(1); return; }
  else if (debugAllowed && (k === '-' || k === '_')) { nudgeTuning(-1); return; }
  else if (debugAllowed && (k === '=' || k === '+')) { nudgeTuning(1); return; }
  else if (debugAllowed && k === '0') { resetTuning(); return; }
  firstGesture();
  startOrRestart();
});

window.addEventListener('keyup', function (e) {
  const k = e.key;
  if (k === 'ArrowLeft' || k === 'a' || k === 'A') held.keyLeft = false;
  else if (k === 'ArrowRight' || k === 'd' || k === 'D') held.keyRight = false;
});

window.addEventListener('blur', clearHeldInput);
document.addEventListener('visibilitychange', function () {
  if (document.hidden) {
    clearHeldInput();
    // A game still making noise in a tab nobody is looking at is exactly
    // what gets it closed, so the whole graph goes quiet with the tab.
    if (audio) { try { audio.ac.suspend(); } catch (e) {} }
  } else {
    resumeAudio();
  }
});


/* --- Touch and mouse, through pointer events, one code path for both.
       Left half of the screen is left, right half is right, nothing held
       is the neutral from section 4.1. --- */
function pointerSide(e) {
  return (e.clientX < view.w / 2) ? -1 : 1;
}

function applyTouchSides() {
  let left = false, right = false;
  touchSides.forEach(function (side) {
    if (side < 0) left = true; else right = true;
  });
  held.touchLeft = left;
  held.touchRight = right;
}

canvas.addEventListener('pointerdown', function (e) {
  e.preventDefault();
  // A tap anywhere on the covered view resumes, and does not also steer.
  if (paused) { setPaused(false); return; }
  touchSides.set(e.pointerId, pointerSide(e));
  applyTouchSides();
  if (canvas.setPointerCapture) { try { canvas.setPointerCapture(e.pointerId); } catch (err) {} }
  firstGesture();
