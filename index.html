  // The car's own screen position, which the rear light points already
  // record every frame, so the debris comes off the car rather than off
  // the middle of the screen.
  const cx = (carParts.rlx + carParts.rrx) * 0.5;
  const cy = (carParts.rly + carParts.rry) * 0.5;
  const n = Math.min(debris.length, Math.round(FEEL.EXPLODE_PARTICLES));
  debrisCount = n;
  /* Math.random, NOT rng(). This drew nine values a particle off the ROAD
     GENERATOR'S stream for four sessions, so every crash permanently
     shifted every corner generated after it: a pinned seed stopped
     reproducing its own road the moment anybody died on it, and two
     players on the same daily road who had crashed a different number of
     times were driving different roads from that point on. Nothing this
     side of the game may draw from rng(). It is the road's, and only the
     road's, and debris is decoration. */
  for (let i = 0; i < n; i++) {
    const p = debris[i];
    const a = Math.random() * Math.PI * 2;
    // Biased upward and outward, because that is what an impact throws.
    const speed = FEEL.EXPLODE_SPEED * (FEEL.EXPLODE_SPREAD
                  + (1 - FEEL.EXPLODE_SPREAD) * Math.random());
    p.x = cx + (Math.random() * 2 - 1) * s * 0.02;
    p.y = cy + (Math.random() * 2 - 1) * s * 0.02;
    p.vx = Math.cos(a) * speed;
    p.vy = Math.sin(a) * speed - speed * 0.45;
    p.r = s * FEEL.EXPLODE_SIZE * (0.35 + 0.65 * Math.random());
    p.rot = Math.random() * Math.PI;
    p.spin = (Math.random() * 2 - 1) * FEEL.EXPLODE_SPIN;
    p.life = FEEL.EXPLODE_TIME * (0.6 + 0.4 * Math.random());
    // A third of the pieces are hot: they are the fire and the rest are
    // the car. Two colours, two batched fills, and it reads as both.
    p.hot = Math.random() < 0.38 ? 1 : 0;
  }
}

function updateDebris(dt) {
  if (debrisCount === 0) return;
  const drag = Math.exp(-dt / FEEL.EXPLODE_DRAG);
  let live = 0;
  for (let i = 0; i < debrisCount; i++) {
    const p = debris[i];
    if (p.life <= 0) continue;
    p.life -= dt;
    p.vx *= drag;
    p.vy = p.vy * drag + FEEL.EXPLODE_GRAVITY * dt;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.rot += p.spin * dt;
    if (p.life > 0) live++;
  }
  if (live === 0) debrisCount = 0;
}

function drawDebris() {
  if (debrisCount === 0) return;
  // Two passes, one colour each, the same batching discipline the road
  // and the tyre marks use.
  for (let pass = 0; pass < 2; pass++) {
    let any = false;
    ctx.beginPath();
    for (let i = 0; i < debrisCount; i++) {
      const p = debris[i];
      if (p.life <= 0 || p.hot !== pass) continue;
      any = true;
      const t = clamp(p.life / FEEL.EXPLODE_TIME, 0, 1);
      const r = p.r * (0.35 + 0.65 * t);
      // Squares rather than circles: flat shading, cut and folded from
      // paper, and four line segments beat an arc for this many pieces.
      const c = Math.cos(p.rot) * r, sn = Math.sin(p.rot) * r;
      ctx.moveTo(p.x - c + sn, p.y - sn - c);
      ctx.lineTo(p.x + c + sn, p.y + sn - c);
      ctx.lineTo(p.x + c - sn, p.y + sn + c);
      ctx.lineTo(p.x - c - sn, p.y - sn + c);
      ctx.closePath();
    }
    if (!any) continue;
    ctx.fillStyle = pass ? COLOUR.HAZARD_TOP : COLOUR.CAR_SIDE;
    ctx.fill();
  }
}

/* Close calls, section 4.4 applied to obstacles. The gap is recorded by
   hazardBand while the car is alongside, in world units of clear air
   between the side of the car and the outside of the clip shoulder, and
   this settles up once the hazard is behind. Clipping it at any point
   during the pass disqualifies it: the reward is for the line that was
   nearly a mistake and was not one. */
function resolveCloseCalls() {
  for (let i = 0; i < hazards.length; i++) {
    const h = hazards[i];
    if (h.done || h.to >= carSegIndex) continue;
    h.done = true;
    if (h.hit || h.gap > FEEL.HAZARD_CLOSE_MARGIN) continue;
    score += FEEL.HAZARD_CLOSE_BONUS;
    audioSting(STING_CLOSE);
    sayCallout('CLOSE CALL  +' + FEEL.HAZARD_CLOSE_BONUS, CALL_CLOSE, COLOUR.HAZARD_LIP);
  }
}

/* The callouts. Each flies in a very short way, reads, and dies. The
   slide is deliberately tiny: section 7 warns that motion is the thing
   most easily overdone here, and the job is legibility not choreography.

   Both lanes go through one drawing routine and differ only in which row
   of the sky band they sit on and how big they are. */
/* WHICH MODE, AND WHAT THE GHOST IS DOING. In play, small and dim and
   always in the same place, hanging off hudBottom the way everything
   else in this stack does rather than off a fraction of the height.

   ENDLESS USED TO DRAW NOTHING, on the reasoning that there was no
   second mode to be confused with. There is now, and the consequence was
   that a player looking for the ghost had no way to tell whether they
   were in the mode that has one. Silence is not the same as "you are in
   the ordinary mode", so endless says so too.

   THE SECOND LINE IS THE ANSWER TO "WHERE IS THE GHOST". Everything the
   ghost can be doing is a state the player cannot otherwise see: daily
   only, and it is the LAST run rather than the best one, which is the
   half that decides whether the line ahead is worth trusting. Each of
   those now says itself, at the start of the run, and then gets out of
   the way. */
function modeSecondLine() {
  if (mode !== DAILY) return null;
  if (continues > 0) return 'CONTINUED RUN, IT CANNOT TAKE THE RECORD';
  if (!ghost.live) return 'NO GHOST YET, THIS RUN BECOMES ONE';
  return 'CHASING YOUR LAST RUN';
}

/* ------------------------------------------------------------------
   THE PIPS. One mark per gate, filling as they are passed.

   A COUNTER WOULD BE WORSE AND THAT IS THE WHOLE ARGUMENT. "GATE 3"
   tells the player nothing about whether there are five more or fifty,
   which is exactly the question a finite track has to answer. A row
   shows the SHAPE of the day in one look with nothing to parse, and it
   is the same glance that says how much is left.

   THE LAST PIP IS THE LINE and it is drawn wider and in the score's own
   gold, so the end of the row reads as an end rather than as one more
   of the same.

   PIPS ONLY EXIST ON THE DAILY, because endless has no end to draw. That
   makes their presence the mode indicator as well, which is the cheapest
   possible answer to the question the last session had to spend a line
   of text on.
   ------------------------------------------------------------------ */
function drawPips(w, h, y) {
  const s = Math.min(w, h);
  const n = dailyGates;
  const pip = s * FEEL.PIP_SIZE;
  const gap = s * FEEL.PIP_GAP;
  // The finish pip is wider, so the row itself has a shape.
  const lastW = pip * 1.9;
  const total = (n - 1) * (pip + gap) + lastW;
  let x = w / 2 - total / 2;
  // Measured at 0.5: three pixels tall on a 320 wide handset, which is a
  // row you can see and not a row you can count.
  const hgt = Math.max(2.5, pip * 0.60);
  for (let i = 0; i < n; i++) {
    const last = i === n - 1;
    const wdt = last ? lastW : pip;
    const done = i < gatesPassed;
    ctx.globalAlpha = done ? FEEL.PIP_ALPHA_DONE : FEEL.PIP_ALPHA_TODO;
    ctx.fillStyle = last ? COLOUR.SCORE : COLOUR.GATE;
    roundRect(x, y - hgt / 2, wdt, hgt, hgt * 0.5);
    ctx.fill();
    /* The one being driven toward, breathing. It is the only pip that
       moves and it is always the next thing to happen, so the row reads
       as a position and not only as a total. */
    if (!done && i === gatesPassed && state === DRIVING) {
      ctx.globalAlpha = 0.30 + 0.35 * Math.abs(Math.sin(runTime * 3));
      roundRect(x, y - hgt / 2, wdt, hgt, hgt * 0.5);
      ctx.fill();
    }
    x += wdt + gap;
  }
  ctx.globalAlpha = 1;
  return hgt;
}

function drawModeMark(w, h) {
  /* WHILE DRIVING ONLY. The death screen says all of this in its own
     records line, and drawing both put two lines of teal on top of each
     other at the top of that screen. */
  if (state !== DRIVING) return;
  const s = Math.min(w, h);
  const y = hudBottom + s * 0.026;

  // The pips carry the mode on the daily, so the word is not needed
  // there. Endless has no pips, so it says so.
  /* ENDLESS NAMES ITSELF AND SAYS WHAT IT COSTS. The bare word was
     doing its job and was not enough: it told the player which mode they
     were in without telling them what they were missing, so somebody
     hunting for the ghost read it and carried on hunting. */
  let line, colour;
  if (mode !== DAILY) {
    line = 'RANDOM TRACK   NO FINISH, NO GHOST';
    colour = COLOUR.TEXT;
  } else {
    colour = COLOUR.GATE;
    line = 'TRACK #' + trackNumber(todayStamp)
         + (dailyBest > 0 ? '   BEST ' + dailyBest : '');
    if (continues > 0) line += '   CONTINUED';
    else if (ghost.live) line += '   ' + ghostGapLabel();
  }
  let below = y;
  if (mode === DAILY) {
    drawPips(w, h, y);
    below = y + s * 0.028;
  }
  ctx.globalAlpha = 0.42;
  text(line, w / 2, below, fittedSize(line, '700', Math.round(s * 0.026), w * 0.85),
       '700', 'center', colour);

  /* Once, at the start of the run, then gone. It is the one thing here
     that is a sentence rather than a readout, and a sentence that stays
     on screen becomes furniture and stops being read. */
  const second = modeSecondLine();
  if (second && runTime < FEEL.MODE_NOTE_SECONDS) {
    const fade = clamp((FEEL.MODE_NOTE_SECONDS - runTime) / 0.8, 0, 1);
    ctx.globalAlpha = 0.42 * fade;
    text(second, w / 2, below + s * 0.032,
         fittedSize(second, '700', Math.round(s * 0.023), w * 0.9), '700',
         'center', continues > 0 ? COLOUR.SCORE : colour);
  }
  ctx.globalAlpha = 1;
}

/* Where you stand against the ghost, in seconds, which is the only unit
   a driver thinks in. It is here rather than only in the callouts
   because the ghost spends most of a run outside the draw distance: the
   callouts say when you pass it, this says where it is the rest of the
   time. */
function ghostGapLabel() {
  if (runTime >= ghost.t[ghost.n - 1]) return 'GHOST OUTLASTED';
  const gap = (position - ghost.pos) / FEEL.SPEED;
  if (Math.abs(gap) < 0.05) return 'GHOST LEVEL';
  return 'GHOST ' + (gap > 0 ? '+' : '') + gap.toFixed(1) + 's';
}

function drawCallout(w, h) {
  drawLane(w, h, calloutText, calloutColour, calloutLife, calloutSide,
           FEEL.CALLOUT_ROW_EVENT, 1);
  drawLane(w, h, driftText, driftColour, driftLife, driftSide,
           FEEL.CALLOUT_ROW_DRIFT, driftSize);
}

function drawLane(w, h, str, colour, life, side, row, scale) {
  if (life <= 0) return;
  const s = Math.min(w, h);
  const t = 1 - life / FEEL.CALLOUT_TIME;             // 0 at birth, 1 at death
  let alpha = 1, slide = 0;
  if (t < FEEL.CALLOUT_IN) {
    const u = t / FEEL.CALLOUT_IN;
    alpha = u;
    slide = (1 - u) * w * FEEL.CALLOUT_SLIDE;
  } else if (t > 1 - FEEL.CALLOUT_OUT) {
    alpha = (1 - t) / FEEL.CALLOUT_OUT;
  }
  /* The band of sky between the bottom of the HUD stack and the horizon.
     Both ends are measured rather than assumed, so it holds in portrait
     and in landscape, and it is never over road: everything above the
     horizon line is sky by construction. The two lanes take fixed shares
     of that band, so they cannot collide however tall it is. */
  const top = hudBottom + s * FEEL.CALLOUT_GAP_TOP;
  const bottom = horizonY - s * FEEL.CALLOUT_RISE;
  const y = bottom > top ? top + (bottom - top) * row : top;
  /* Sized to fit and then clamped on screen. Offset to the side plus a
     long string plus a narrow handset runs the text off the edge, and a
     callout that cannot be read has cost clutter and bought nothing. */
  const size = fittedSize(str, '800', Math.round(s * FEEL.CALLOUT_SIZE * scale),
                          w * FEEL.CALLOUT_MAX_WIDTH);
  ctx.font = '800 ' + size + 'px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif';
  const half = ctx.measureText(str).width / 2;
  const edge = s * FEEL.CALLOUT_GAP_TOP;
  let x = w / 2 + side * (w * FEEL.CALLOUT_SIDE + slide);
  x = clamp(x, half + edge, w - half - edge);
  ctx.globalAlpha = alpha;
  text(str, x, y, size, '800', 'center', colour);
  ctx.globalAlpha = 1;
}

/* The two full screen washes, both short and both capped low. They are
   the only things in the game that cover the road, so they are the ones
   that get checked hardest against hard limit two. */
function drawSpectacleFlash(w, h) {
  if (gateFlash2 > 0) {
    const u = gateFlash2 / FEEL.CHECKPOINT_FLASH;
    ctx.globalAlpha = FEEL.GATE_FLASH_ALPHA * u * u;
    ctx.fillStyle = COLOUR.GATE;
    ctx.fillRect(0, 0, w, h);
    // The posts sweeping past, which is what a gate crossing looks like
    // from inside the car.
    const bar = w * FEEL.GATE_BAR_WIDTH;
    ctx.globalAlpha = FEEL.GATE_FLASH_ALPHA * u;
    ctx.fillRect(0, 0, bar * (0.4 + u), h);
    ctx.fillRect(w - bar * (0.4 + u), 0, bar * (0.4 + u), h);
    ctx.globalAlpha = 1;
  }
  if (beatFlash > 0) {
    const u = beatFlash / FEEL.BEST_FLASH_TIME;
    ctx.globalAlpha = FEEL.BEST_FLASH_ALPHA * u * u;
    ctx.fillStyle = COLOUR.SCORE_BEST;
    ctx.fillRect(0, 0, w, h);
    ctx.globalAlpha = 1;
  }
  if (resumeFlash > 0) {
    const u = resumeFlash / FEEL.RESUME_FLASH_TIME;
    ctx.globalAlpha = FEEL.GATE_FLASH_ALPHA * u * u;
    ctx.fillStyle = COLOUR.GATE;
    ctx.fillRect(0, 0, w, h);
    ctx.globalAlpha = 1;
  }
  if (explodeFlash > 0) {
    const u = explodeFlash / FEEL.EXPLODE_FLASH_TIME;
    ctx.globalAlpha = FEEL.EXPLODE_FLASH_ALPHA * u * u;
    ctx.fillStyle = COLOUR.HAZARD_LIP;
    ctx.fillRect(0, 0, w, h);
    ctx.globalAlpha = 1;
  }
}

let barShow = 0;
function updateBar(dt) {
  const wanted = state === DRIVING && scrapeRisk > 0.01 ? 1 : 0;
  if (wanted) barShow = 1;
  else barShow = Math.max(0, barShow - dt / FEEL.BAR_FADE_TIME);
}

function drawBar(w, h) {
  if (barShow <= 0) return;
  const left = 1 - scrapeRisk;
  const bw2 = w * FEEL.BAR_WIDTH;
  const bh2 = FEEL.BAR_HEIGHT;
  const x = (w - bw2) / 2;
  const y = h - safeBottom - FEEL.BAR_BOTTOM - bh2;

  ctx.globalAlpha = barShow * FEEL.BAR_ALPHA;
  ctx.fillStyle = COLOUR.BAR_TRACK;
  ctx.fillRect(x, y, bw2, bh2);
  // Cool while there is room, warm as it runs out, which is the same thing
  // the edge flash is saying at the same moment.
  ctx.fillStyle = left < 0.35 ? COLOUR.BAR_LOW : COLOUR.BAR_FILL;
  ctx.fillRect(x, y, bw2 * left, bh2);
  ctx.globalAlpha = 1;
}

/* The debug readout. Everything needed to report a camera back sits on
   one line, so a screenshot is a complete answer. */
function drawHud(w, h) {
  if (!showDebug) return;
  const pad = 10;
  let lines = [
    fpsShown.toFixed(0) + ' fps   worst ' + fpsWorstShown.toFixed(1) + ' ms'
      + (tunerDirty() ? '   TUNED' : ''),
    tunerLine(0),
    tunerLine(1),
    tunerLine(2),
    tunerLine(3),
    tunerLine(4),
    tunerLine(5),
    tunerLine(6),
    tunerLine(7),
    tunerLine(8),
    tunerLine(9),
    tunerLine(10),
    tunerLine(11),
    tunerLine(12),
    tunerLine(13),
    tunerLine(14),
    tunerLine(15),
    tunerLine(16),
    tunerLine(17),
    tunerLine(18),
    tunerLine(19),
    tunerLine(20),
    tunerLine(21),
    tunerLine(22),
    /* 23 to 26 were added in the last two sessions and never listed here,
       so the jump, biome and ghost groups could be cycled to and tuned
       but never read. A cycler with an invisible group is a cycler that
       lies about what is selected. */
    tunerLine(23),
    tunerLine(24),
    tunerLine(25),
    tunerLine(26),
    tunerLine(27),
    'slip ' + drift.slipDeg.toFixed(0) + '°  edge ' + (scrapeRisk * 100).toFixed(0)
      + '%  ' + (seedPinned ? 'seed ' + lastSeed : 'seed free'),
    't ' + runTime.toFixed(0) + 's  live curve ' + curveScale.toFixed(2)
      + '  width ' + widthScale.toFixed(2) + '  int ' + maxIntensity()
      + '  ease ' + ease.toFixed(2) + ' used ' + adaptEase().toFixed(2),
    (mode === DAILY ? 'DAILY ' + todayStamp + ' seed ' + dailySeed() : 'endless')
      + '  today ' + dailyBest
      + '  ghost ' + (ghost.live ? ghost.n + ' pts ' + dailyGhostBytes + 'B' : 'none')
      + (ghostRec.live ? '  REC ' + ghostRec.n : '')
      + (ghost.shown ? '  gap ' + Math.round((ghost.pos - position) / 100) + 'm' : '')
  ];
  /* Sized to fit AND wrapped, because the readout gains values most
     sessions and a line that runs off the side of a phone is a line that
     cannot be read at the moment it is needed. Shrinking alone stopped
     being enough: it is clamped at eight pixels, and the spectacle
     session took several groups past what eight pixels could hold, so
     anything still too wide is now folded at a space instead of being
     cut off. Continuation lines are indented so a fold cannot be
     mistaken for a new group. */
  const pad2 = pad * 2 + 10;
  let size = 13;
  const font = s => '600 ' + s + 'px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif';
  ctx.font = font(size);
  const room = w - pad2;
  let widest = 0;
  for (let i = 0; i < lines.length; i++) {
    const tw = ctx.measureText(lines[i]).width;
    if (tw > widest) widest = tw;
  }
  if (widest > room) {
    size = Math.max(8, Math.floor(size * room / widest));
    ctx.font = font(size);
  }
  const wrapped = [];
  for (let i = 0; i < lines.length; i++) {
    /* Every tuner line begins with the cursor column, which is a space on
       all but one of them, so the search for a fold point starts at index
       one. Starting at zero finds that leading space, measures an empty
       string, and quietly decides the line already fits. */
    let rest = lines[i];
    let lead = '';
    for (;;) {
      if (ctx.measureText(lead + rest).width <= room) break;
      let cut = -1;
      for (let k = rest.indexOf(' ', 1); k > 0; k = rest.indexOf(' ', k + 1)) {
        if (ctx.measureText(lead + rest.slice(0, k)).width > room) break;
        cut = k;
      }
      if (cut <= 0) break;
      wrapped.push(lead + rest.slice(0, cut));
      // The groups are separated by two spaces, so skip whatever run of
      // them the fold landed on rather than starting the next line on one.
      while (cut < rest.length && rest.charAt(cut) === ' ') cut++;
      rest = rest.slice(cut);
      lead = '   ';
    }
    wrapped.push(lead + rest);
  }
  lines = wrapped;
  widest = 0;
  for (let i = 0; i < lines.length; i++) {
    const tw = ctx.measureText(lines[i]).width;
    if (tw > widest) widest = tw;
  }
  const lineH = Math.round(size * 1.38);
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  const top = hudTop;
  ctx.fillStyle = 'rgba(26,10,4,0.66)';
  ctx.fillRect(pad - 5, top - 4, widest + 10, lines.length * lineH + 8);
  ctx.fillStyle = '#ffffff';
  for (let i = 0; i < lines.length; i++) {
    ctx.fillText(lines[i], pad, top + i * lineH);
  }
}

function render() {
  const w = view.w, h = view.h;
  ctx.setTransform(view.dpr, 0, 0, view.dpr, 0, 0);

  /* THE CAMERA FOLLOWS THE CAR UP, damped, and only ever partly. camLift
     is the fraction of the rise the camera cancels, so the conversion to
     a camera height has to undo the projection's anisotropy: a world
     height lands on screen through w/2 and the camera's height through
     h/2. Raising the camera pushes the whole world down the screen, which
     is what sells the height; the car still climbs the part the camera
     does not take, so it never leaves the frame either. */
  // Clamped at zero because carY also carries the death fall, and the
  // camera must not chase a car that is dropping into the void.
  camHeight = FEEL.CAMERA_HEIGHT + camLift * Math.max(0, carY) * (w / h);

  ctx.save();
  ctx.translate(shakeX, shakeY);

  /* Everything shakes together. There is no ground any more, so the void
     is the whole background and the road is an object floating in it. */
  ctx.fillStyle = COLOUR.VOID;
  ctx.fillRect(-40, -40, w + 80, h + 80);

  const glow = h * FEEL.HORIZON_GLOW_FRACTION;
  ctx.fillStyle = horizonGradient;
  ctx.fillRect(-40, horizonY - glow, w + 80, glow * 2);
  /* The horizon deepening with the multiplier. A second pass of the band
     that is already cached rather than a rebuilt gradient, so it costs
     one fill and nothing else.

     ONLY THE HALF ABOVE THE HORIZON LINE, and that is hard limit two
     holding. The road converges to the horizon from BELOW, so the lower
     half of this band sits directly behind the far road: deepening it
     there lit the void without lighting the road, and the surface against
     void contrast between 1.7 and 3.3 seconds out, which is the planning
     horizon section 4.3 is about, fell from a difference of 0.4 to one of
     4.8 the wrong way. Above the line is sky and only sky, so the glow
     can swell as much as it likes there and the road cannot lose by it. */
  if (worldHeat > 0.01) {
    ctx.globalAlpha = FEEL.HEAT_HORIZON * worldHeat;
    ctx.fillRect(-40, horizonY - glow, w + 80, glow);
    ctx.globalAlpha = 1;
  }

  drawSkyline(w, h);
  drawGrid(w, h);
  drawRoad(w, h);
  ctx.fillStyle = hazeGradient;
  ctx.fillRect(-40, horizonY - 1, w + 80, h * FEEL.HORIZON_FADE_FRACTION + 2);
  drawSmoke();
  drawCar(w, h);
  drawDebris();
  ctx.restore();

  drawScrapeFlash(w, h);
  drawSpectacleFlash(w, h);
  drawBar(w, h);
  // The score first, because the callout measures itself against the
  // bottom of the HUD stack and the clock is what sets it.
  drawScore(w, h);
  drawModeMark(w, h);
  drawCallout(w, h);
  drawOverlay(w, h);
  drawPauseCover(w, h);
  /* Over the pause cover, because the gesture keeps running while the
     game does not and a prompt hidden behind the cover would be a prompt
     nobody answers. Under the boot credit, which owns the first second
     of the page outright. */
  drawTiltCal(w, h);
  /* Both lockups are DOM, so the frame ends by making the document agree
     with what was just drawn rather than by drawing them. Neither writes
     anything unless something actually changed. */
  syncBoot();
  syncCredit();
  drawHud(w, h);
}

/* ------------------------------------------------------------------
   THE CALIBRATION PROMPT. An arrow, two words and a line of state, sat
   in the band above the pads where nothing else lives.

   IT IS NOT A SCREEN. No cover, no dimming, no dismissal: the game is
   still there behind it and still fully playable on touch and keys. That
   is deliberate, because a modal here would be the settings screen
   section 12 forbids wearing a different hat.

   The arrow points LEFT because left is what is being asked for, and it
   is the whole instruction. The two words underneath are for anybody who
   does not read an arrow as an instruction, which on a first ever visit
   is most people.
   ------------------------------------------------------------------ */
function drawTiltCal(w, h) {
  if (tiltCal.phase === CAL_OFF) return;
  const s = Math.min(w, h);
  const y = h - safeBottom - FEEL.DEATH_BOTTOM - s * 0.10;

  if (tiltCal.phase === CAL_DONE) {
    const line = tiltCal.ok ? 'TILT SET' : 'KEEPING THE DEFAULT';
    ctx.globalAlpha = clamp(tiltCal.said, 0, 1);
    text(line, w / 2, y, fittedSize(line, '800', Math.round(s * 0.05), w * 0.8),
         '800', 'center', tiltCal.ok ? COLOUR.GATE : COLOUR.TEXT);
    ctx.globalAlpha = 1;
    return;
  }

  const reading = tiltCal.phase === CAL_READ;
  /* The arrow only wakes up once the posture has settled, so the two
     phases are told apart without a word: hold still, then move. */
  const pulse = reading ? 0.55 + 0.45 * Math.abs(Math.sin(tiltCal.waited * 4)) : 0.3;
  const a = s * 0.068;
  const cx = w / 2, cy = y - s * 0.055;
  ctx.globalAlpha = pulse;
  ctx.strokeStyle = COLOUR.GATE;
  ctx.lineWidth = Math.max(4, s * 0.015);
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.beginPath();
  ctx.moveTo(cx + a * 0.85, cy - a * 0.6);
  ctx.lineTo(cx - a * 0.55, cy);
  ctx.lineTo(cx + a * 0.85, cy + a * 0.6);
  ctx.stroke();
  ctx.globalAlpha = 1;

  const line = reading ? 'TILT LEFT' : 'HOLD STILL';
  text(line, w / 2, y + s * 0.030,
       fittedSize(line, '800', Math.round(s * 0.055), w * 0.8), '800',
       'center', COLOUR.GATE);
  ctx.globalAlpha = 0.55;
  const sub = 'hold the phone how you want to play     tap to skip';
  text(sub, w / 2, y + s * 0.072,
       fittedSize(sub, '600', Math.round(s * 0.028), w * 0.9), '600');
  ctx.globalAlpha = 1;
}

/* The cover. Opaque, over everything except the debug readout, because
   leaving the road visible turns the pause into a free look at the corner
   ahead. */
/* ==================================================================
   THE WAY BACK, AND WHY IT IS ON THE PAUSE OVERLAY.

   Once you are in the daily there has to be a way out of it, and there
   are only three places it could go.

   NOT THE DEATH SCREEN. That is the one action restart from section 5
   and it stays one action: the reflex tap continues or restarts, and it
   is never a question. Putting a mode choice there would make the loop
   that the whole game hangs off into a decision.

   NOT THE TITLE SCREEN ALONE, because you only get back to it by
   reloading, which is the problem being solved.

   PAUSE. It is already a deliberate action, it is already off the
   restart path, and it already obscures the view, so nothing is being
   given up. Section 12 forbids menus and this is not one: it is a single
   button on a screen that already exists, and nothing is ever asked of
   a player who does not press pause.
   ================================================================== */
const modeRect = { x: 0, y: 0, w: 0, h: 0, live: false };

function drawPauseCover(w, h) {
  modeRect.live = false;
  if (!paused) return;
  ctx.fillStyle = COLOUR.PAUSE_COVER;
  ctx.fillRect(0, 0, w, h);
  const s = Math.min(w, h);
  text('PAUSED', w / 2, h * 0.44, Math.round(s * 0.11), '800');
  text('tap to resume', w / 2, h * 0.53, Math.round(s * 0.045), '600');

  /* Anchored to the bottom edge, exactly where RESTART sits on the death
     screen and where TODAY'S TRACK sits on the title screen. Three canvas
     buttons, one place: a player who has met one already knows the next. */
  const daily = mode === DAILY;
  const label = daily ? 'SWITCH TO A RANDOM TRACK' : "SWITCH TO TODAY'S TRACK";
  const size = Math.round(s * 0.038);
  ctx.font = '800 ' + size + 'px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif';
  const bw = ctx.measureText(label).width + size * 2.2;
  const bh = size * 2.2;
  const by0 = h - safeBottom - FEEL.DEATH_BOTTOM;
  modeRect.x = w / 2 - bw / 2;
  modeRect.y = by0 - bh / 2;
  modeRect.w = bw;
  modeRect.h = bh;
  modeRect.live = true;

  // It starts a fresh run, so say so. Switching mid run cannot mean
  // anything else: the road under the car belongs to the mode it is in.
  ctx.globalAlpha = 0.6;
  text('starts a new run', w / 2, by0 - bh * 0.95,
       Math.round(s * 0.030), '700');
  ctx.globalAlpha = 1;

  ctx.globalAlpha = 0.9;
  ctx.fillStyle = COLOUR.BAR_TRACK;
  roundRect(modeRect.x, modeRect.y, bw, bh, bh * 0.3);
  ctx.fill();
  ctx.lineWidth = 2;
  ctx.strokeStyle = daily ? COLOUR.SCORE : COLOUR.GATE;
  ctx.stroke();
  ctx.globalAlpha = 1;
  text(label, w / 2, by0, size, '800', 'center', daily ? COLOUR.SCORE : COLOUR.GATE);
}

function hitMode(e) {
  if (!modeRect.live || !paused) return false;
  const r = canvas.getBoundingClientRect();
  const x = e.clientX - r.left, y = e.clientY - r.top;
  return x >= modeRect.x && x <= modeRect.x + modeRect.w
      && y >= modeRect.y && y <= modeRect.y + modeRect.h;
}

function switchMode() {
  mode = mode === DAILY ? ENDLESS : DAILY;
  setPaused(false);
  startRun();
}


/* ==================================================================
   AUDIO

   Synthesised in full: three oscillators, one generated noise buffer,
   and a fixed graph of filters and gains. No fetch, no decodeAudioData,
   no sample data anywhere in this file. Section 6 again: one blocked
   request is a broken game for this audience.

   The graph is built once, on the gesture that picks a station, and then
   never grows. Nothing is created or destroyed per note, per skid or per
   crash: notes are a frequency step and an envelope on a voice that is
   already running, and the skid is a single looping noise source whose
   filter is steered. That is what keeps the per frame cost flat, and it
   is also what makes the skid sound like a tyre rather than like a sound
   effect being retriggered.

   ON by default, which overrules sections 5 and 6. That was a deliberate
   call and not an oversight, and it comes with the mitigations that make
   it survivable for a classroom:

     nothing is built or heard until the first gesture, which is what the
     browser enforces anyway, so the graph is created inside that gesture
     and starts unlocked rather than fighting the policy;

     the first start fades from silence over AUDIO_FIRST_FADE rather than
     arriving at level;

     the mute pad is on screen and one tap away from the very first frame,
     not behind a start screen or a menu;

     and the choice is stored, so anyone who mutes once is never surprised
     again on any later visit.

   The dial still exists, but it now picks between tracks rather than
   between silence and sound.
   ================================================================== */

/* Three states, cycled by one button, in this order. The dial that used
   to sit on the splash screen is gone: it was a menu on the way into a
   game whose whole pitch is that there is nothing between you and the
   road, and one button says the same thing in less space.

   TYRES rather than NEON is the default, and that is the classroom
   argument from section 6 taken seriously. The skid is quiet, textural
   and is most of what makes the drift read; music is unmistakably a game
   from across a room and is what gets somebody caught. Anyone who wants
   music is one tap away and their choice is remembered. */
const TRACKS = [
  { id: 'neon',
    // A natural minor run, and a saw.
    wave: 'sawtooth', root: 55, tempo: 1,
    arp: [0, 3, 7, 10, 12, 10, 7, 3], bass: [0, 0, 7, 0, 10, 0, 7, 5] }
];
let track = 0;            // only one for now, and the list is here so that
                          // adding a second is a data change and not a
                          // rewrite. Nothing selects between them yet.

/* Two switches rather than one cycle, because they are two decisions and
   they default differently.

   SOUND is the tyres, the scrape and the crash, and it is on. The skid is
   quiet, textural and is most of what makes the drift read at all.

   MUSIC is off, and that is section 6 taken seriously rather than a taste
   judgement: the skid could be a video playing in the next tab, but an
   arpeggio at 148bpm is unmistakably a game from across a classroom and
   it is what gets somebody caught. Anyone who wants it is one tap away
   and the choice is remembered.

   A stored value always wins over the default, in both directions. */
let sfxOn = storeGet('sfx') !== '0';
let musicOn = storeGet('music') === '1';
function anySound() { return sfxOn || musicOn; }

let audio = null;         // the graph, once there is one, and never before one

/* Equal temperament from a root, so the note tables above are semitone
   offsets and a station is a scale plus a waveform rather than a tune. */
function semis(root, n) { return root * Math.pow(2, n / 12); }

function buildAudio() {
  const Ctx = window.AudioContext || window.webkitAudioContext;
  if (!Ctx) return null;
  let ac;
  try { ac = new Ctx(); } catch (e) { return null; }

  /* Two seconds of white noise, generated here. It is the source for the
     skid, the scrape and the crash, and two seconds is long enough that
     the loop point is not a rhythm. */
  const frames = Math.floor(ac.sampleRate * 2);
  const noise = ac.createBuffer(1, frames, ac.sampleRate);
  const data = noise.getChannelData(0);
  for (let i = 0; i < frames; i++) data[i] = Math.random() * 2 - 1;

  function node(type) { return ac['create' + type](); }
  function loopNoise() {
    const src = node('BufferSource');
    src.buffer = noise;
    src.loop = true;
    return src;
  }
  function filter(kind, freq, q) {
    const f = node('BiquadFilter');
    f.type = kind;
    f.frequency.value = freq;
    if (q !== undefined) f.Q.value = q;
    return f;
  }
  function gain(v) { const g = node('Gain'); g.gain.value = v; return g; }

  // Master. Everything lands on the pause filter first, so the pause can
  // close a lowpass over the lot rather than muting it.
  const pauseFilter = filter('lowpass', FEEL.AUDIO_OPEN_CUTOFF, 0.7);
  const master = gain(0);
  pauseFilter.connect(master);
  master.connect(ac.destination);
  const bus = gain(1);
  bus.connect(pauseFilter);

  // --- The skid. One voice, started once, never retriggered. ---
  const skidSrc = loopNoise();
  const skidBand = filter('bandpass', FEEL.SKID_FREQ_LOW, FEEL.SKID_Q_LOW);
  const skidTop = filter('lowpass', FEEL.SKID_TOP_CUTOFF, 0.6);
  const skidGain = gain(0);
  skidSrc.connect(skidBand); skidBand.connect(skidTop);
  skidTop.connect(skidGain); skidGain.connect(bus);
  /* A small, slow breath on the band, at audio rate, so a held slip angle
     still moves instead of settling into a static tone. It costs nothing
     per frame because nothing schedules it. */
  const wobble = node('Oscillator');
  wobble.frequency.value = FEEL.SKID_WOBBLE_HZ;
  const wobbleDepth = gain(FEEL.SKID_WOBBLE_FREQ);
  wobble.connect(wobbleDepth); wobbleDepth.connect(skidBand.frequency);

  // --- The scrape. Two high Q bands, off any harmonic of each other. ---
  const scrapeSrc = loopNoise();
  const scrapeA = filter('bandpass', FEEL.SCRAPE_FREQ, FEEL.SCRAPE_Q);
  const scrapeB = filter('bandpass', FEEL.SCRAPE_FREQ * FEEL.SCRAPE_FREQ_RATIO, FEEL.SCRAPE_Q);
  const scrapeGain = gain(0);
  scrapeSrc.connect(scrapeA); scrapeA.connect(scrapeB);
  scrapeB.connect(scrapeGain); scrapeGain.connect(bus);

  // --- The crash. Idle until something hits it. ---
  const crashSrc = loopNoise();
  const crashLow = filter('lowpass', FEEL.CRASH_FREQ_FROM, 1.4);
  const crashGain = gain(0);
  crashSrc.connect(crashLow); crashLow.connect(crashGain); crashGain.connect(bus);

  // --- Music. Four mono voices, each one persistent. ---
  const musicGain = gain(0);
  musicGain.connect(bus);

  const bassOsc = node('Oscillator');
  bassOsc.type = 'square';
  const bassLow = filter('lowpass', 260, 0.8);
  const bassGain = gain(0);
  bassOsc.connect(bassLow); bassLow.connect(bassGain); bassGain.connect(musicGain);

  const arpOsc = node('Oscillator');
  const arpLow = filter('lowpass', FEEL.MUSIC_ARP_CUTOFF_LOW, 3.5);
  const arpGain = gain(0);
  arpOsc.connect(arpLow); arpLow.connect(arpGain); arpGain.connect(musicGain);

  const octOsc = node('Oscillator');
  octOsc.type = 'triangle';
  const octGain = gain(0);
  const octLevel = gain(0);        // the layer's own level, driven by heat
  octOsc.connect(octGain); octGain.connect(octLevel); octLevel.connect(musicGain);

  const hatSrc = loopNoise();
  const hatHigh = filter('highpass', 7000, 0.9);
  const hatGain = gain(0);
  const hatLevel = gain(0);
  hatSrc.connect(hatHigh); hatHigh.connect(hatGain);
  hatGain.connect(hatLevel); hatLevel.connect(musicGain);

  /* --- The sting. One voice for every earned moment in the game.
     It hangs off the BUS rather than off musicGain, because these are
     responses to what the player did and they have to be there for
     somebody who has never turned the music on. It is a mono voice like
     everything else here: started once, never rebuilt, and a sting is a
     handful of scheduled frequency changes on it. --- */
  const stingOsc = node('Oscillator');
  stingOsc.type = 'triangle';
  const stingGain = gain(0);
  stingOsc.connect(stingGain); stingGain.connect(bus);

  /* --- The chain blip. Its own voice rather than the sting's, because a
     chain link and a close call can land on the same frame and a shared
     voice would cut one of them off mid note. On the BUS, not on the
     music, because music is off by default and this is the reward for
     playing well. --- */
  const chainOsc = node('Oscillator');
  chainOsc.type = 'square';
  const chainLow = filter('lowpass', 2600, 0.9);
  const chainGain = gain(0);
  chainOsc.connect(chainLow); chainLow.connect(chainGain); chainGain.connect(bus);

  const t0 = ac.currentTime;
  skidSrc.start(t0); scrapeSrc.start(t0); crashSrc.start(t0); hatSrc.start(t0);
  wobble.start(t0); bassOsc.start(t0);
  arpOsc.start(t0); octOsc.start(t0); stingOsc.start(t0); chainOsc.start(t0);

  return {
    ac: ac, master: master, pauseFilter: pauseFilter,
    skidBand: skidBand, skidGain: skidGain,
    scrapeA: scrapeA, scrapeGain: scrapeGain,
    crashLow: crashLow, crashGain: crashGain,
    musicGain: musicGain,
    bassOsc: bassOsc, bassGain: bassGain,
    arpOsc: arpOsc, arpLow: arpLow, arpGain: arpGain,
    octOsc: octOsc, octGain: octGain, octLevel: octLevel,
    hatGain: hatGain, hatLevel: hatLevel,
    stingOsc: stingOsc, stingGain: stingGain,
    chainOsc: chainOsc, chainGain: chainGain,
    step: 0, nextNote: 0, heat: 0, crashUntil: 0
  };
}

/* Every live level goes through this rather than through a bare
   assignment: an AudioParam set outright jumps at the render quantum
   boundary and that is audible as a zip on anything moving at 60Hz. */
function ramp(param, value, tau) {
  param.setTargetAtTime(value, audio.ac.currentTime, tau);
}

/* The icons are the whole readout. There is no third state to show now
   that the two switches are separate, so each is simply on or off. */
function paintSound() {
  soundBtn.innerHTML = sfxOn ? ICON.speakerOn : ICON.speakerOff;
  soundBtn.classList.toggle('on', sfxOn);
  musicBtn.innerHTML = musicOn ? ICON.noteOn : ICON.noteOff;
  musicBtn.classList.toggle('on', musicOn);
}

/* fade is the time to reach level, which is longer for the first start
   than for a switch. Building the graph is deferred until a gesture has
   happened: called before then this only moves the setting and paints it,
   and firstGesture picks it up. */
function applyAudio(fade) {
  paintSound();
  storeSet('sfx', sfxOn ? '1' : '0');
  storeSet('music', musicOn ? '1' : '0');
  if (!anySound()) {
    if (audio) {
      ramp(audio.master.gain, 0, FEEL.AUDIO_FADE_TIME);
      // Suspending frees the audio thread entirely rather than leaving a
      // silent graph running, which matters on the Chromebooks in
      // section 6 far more than it does here.
      setTimeout(function () {
        if (audio && !anySound()) { try { audio.ac.suspend(); } catch (e) {} }
      }, 400);
    }
    return;
  }
  if (!audio) {
    if (!gestureUsed) return;      // no gesture yet, so nothing may sound
    audio = buildAudio();
  }
  if (!audio) return;
  resumeAudio();
  audio.step = 0;
  audio.nextNote = audio.ac.currentTime + 0.06;
  const t = TRACKS[track];
  audio.arpOsc.type = t.wave;
  audio.octOsc.type = t.wave === 'square' ? 'square' : 'triangle';
  ramp(audio.master.gain, FEEL.AUDIO_MASTER, fade || FEEL.AUDIO_START_TIME);
}

/* Called once, from the first gesture. Until this runs there is no
   AudioContext at all, which is both what the browser wants and what the
   room wants. */
function startAudio() {
  if (audio || !anySound()) return;
  applyAudio(FEEL.AUDIO_FIRST_FADE);
}

/* The other two pads never change except through their own handlers, so
   they are painted once here, where ICON exists. */
pauseBtn.innerHTML = ICON.pause;
tiltBtn.innerHTML = ICON.tilt;
flipBtn.innerHTML = ICON.flip;
syncFlipBtn();


/* ----------------------------------------------------------------
   Fullscreen. Two paths, because neither one covers every handset.

   The API path works on Android Chrome, on desktop and on iPadOS. On an
   iPhone it simply is not there, which the feature test below picks up,
   and the meta tags in the head cover that case through Add to Home
   Screen instead. The button is hidden wherever the API is genuinely
   unavailable, exactly as the tilt button is, because shipping a control
   that does nothing is worse than shipping no control.

   The request has to be made synchronously inside the tap, same
   discipline as the tilt permission: anything asynchronous before it and
   the browser refuses without saying so. */
var fullReady = false;
const fullBtn = document.getElementById('fullBtn');
const fullRoot = document.documentElement;
function standalone() {
  if (window.navigator && window.navigator.standalone === true) return true;
  try { return window.matchMedia('(display-mode: standalone)').matches; }
  catch (e) { return false; }
}
const canFullscreen = !standalone()
  && !!(fullRoot.requestFullscreen || fullRoot.webkitRequestFullscreen)
  && document.fullscreenEnabled !== false;

function isFullscreen() {
  return !!(document.fullscreenElement || document.webkitFullscreenElement);
}
function paintFull() {
  fullBtn.innerHTML = isFullscreen() ? ICON.shrink : ICON.expand;
  fullBtn.classList.toggle('on', isFullscreen());
}
function toggleFullscreen() {
  if (isFullscreen()) {
    if (document.exitFullscreen) { document.exitFullscreen().catch(function () {}); }
    else if (document.webkitExitFullscreen) { document.webkitExitFullscreen(); }
    return;
  }
  if (fullRoot.requestFullscreen) {
    const r = fullRoot.requestFullscreen();
    if (r && r.catch) r.catch(function () {});
  } else if (fullRoot.webkitRequestFullscreen) {
    fullRoot.webkitRequestFullscreen();
  }
}
fullBtn.addEventListener('pointerdown', function (e) { e.stopPropagation(); });
fullBtn.addEventListener('click', function (e) {
  e.stopPropagation();
  fullBtn.blur();
  firstGesture();
  toggleFullscreen();          // synchronous, inside the gesture
});
/* Entering or leaving changes the viewport, and on a phone it also
   changes the safe area insets, because the insets the browser reports
   depend on whether its own chrome is there. resize reads both. */
function onFullscreenChange() {
  paintFull();
  resize();
  // The viewport settles a frame or two after the event on some browsers.
  window.requestAnimationFrame(resize);
  setTimeout(resize, 250);
}
document.addEventListener('fullscreenchange', onFullscreenChange);
document.addEventListener('webkitfullscreenchange', onFullscreenChange);

/* Five buttons do not fit across a narrow phone held upright without
   dropping them under the size a thumb reliably hits, and the reason this
   exists at all is landscape, where there is room to spare. So on a
   narrow portrait screen it stands down. Re evaluated on every resize,
   so rotating the handset brings it back. */
function syncFullButton() {
  // Wherever fullscreen actually works, in both orientations. Feature
  // detection is the only reason to hide it.
  fullBtn.hidden = !canFullscreen;
}
paintFull();
fullReady = true;
syncFullButton();

const soundBtn = document.getElementById('soundBtn');
const musicBtn = document.getElementById('musicBtn');
function padSwitch(btn, set) {
  btn.addEventListener('pointerdown', function (e) { e.stopPropagation(); });
  btn.addEventListener('click', function (e) {
    e.stopPropagation();
    btn.blur();
    firstGesture();
    set();
    applyAudio();
  });
}
padSwitch(soundBtn, function () { sfxOn = !sfxOn; });
padSwitch(musicBtn, function () { musicOn = !musicOn; });
paintSound();

/* Resumed from every gesture path there is, not just from the dial. A
   context can be suspended again by the tab going away, by an incoming
   call, or by the browser deciding the page was idle, and a game whose
   sound never comes back reads as broken. */
function resumeAudio() {
  if (!audio) return;
  if (audio.ac.state === 'suspended') { try { audio.ac.resume(); } catch (e) {} }
}

function audioOn() { return audio !== null && sfxOn; }

/* One envelope on a voice that is already running. cancel then hold the
   current value first, or retriggering mid decay steps and clicks. */
function pluck(g, peak, decay, when) {
  const p = g.gain;
  p.cancelScheduledValues(when);
  p.setValueAtTime(p.value, when);
  p.linearRampToValueAtTime(peak, when + FEEL.MUSIC_ATTACK);
  p.exponentialRampToValueAtTime(0.0001, when + FEEL.MUSIC_ATTACK + decay);
}

/* The sequencer. Notes are scheduled a short way in front of the clock
   rather than on the frame they fall, so a long frame cannot make the
   music stumble. Nothing here allocates. */
function updateMusic() {
  const s = TRACKS[track];
  const a = audio;
  if (!musicOn) { ramp(a.musicGain.gain, 0, FEEL.AUDIO_FADE_TIME); return; }

  const duck = a.ac.currentTime < a.crashUntil ? FEEL.MUSIC_DUCK : 1;
  ramp(a.musicGain.gain, FEEL.MUSIC_GAIN * duck, FEEL.AUDIO_FADE_TIME);
  // The layers that arrive under pressure. Levels, not switches.
  ramp(a.octLevel.gain, FEEL.MUSIC_OCTAVE_GAIN * a.heat, FEEL.AUDIO_FADE_TIME);
  ramp(a.hatLevel.gain, FEEL.MUSIC_HAT_GAIN * (0.35 + 0.65 * a.heat), FEEL.AUDIO_FADE_TIME);
  ramp(a.arpLow.frequency,
       FEEL.MUSIC_ARP_CUTOFF_LOW
       + (FEEL.MUSIC_ARP_CUTOFF_HIGH - FEEL.MUSIC_ARP_CUTOFF_LOW) * a.heat,
       FEEL.AUDIO_FADE_TIME);

  const stepTime = 60 / (FEEL.MUSIC_BPM * s.tempo) / (FEEL.MUSIC_STEPS / 4);
  const until = a.ac.currentTime + FEEL.MUSIC_LOOKAHEAD;
  // A long stall must not leave the scheduler pouring out a backlog.
  if (a.nextNote < a.ac.currentTime) a.nextNote = a.ac.currentTime;
  while (a.nextNote < until) {
    const t = a.nextNote;
    const n = a.step;
    // Bass on every other sixteenth, which is the eighth note pulse.
    if ((n & 1) === 0) {
      const b = s.bass[(n >> 1) % s.bass.length];
      a.bassOsc.frequency.setValueAtTime(semis(s.root, b), t);
      pluck(a.bassGain, FEEL.MUSIC_BASS_GAIN, FEEL.MUSIC_BASS_DECAY, t);
    }
    // The arp runs the whole sixteenth grid. That is the drive.
    const note = s.arp[n % s.arp.length];
    a.arpOsc.frequency.setValueAtTime(semis(s.root * 4, note), t);
    pluck(a.arpGain, FEEL.MUSIC_ARP_GAIN, FEEL.MUSIC_NOTE_DECAY, t);
    a.octOsc.frequency.setValueAtTime(semis(s.root * 8, note), t);
    pluck(a.octGain, 1, FEEL.MUSIC_NOTE_DECAY, t);
    // Offbeat hats, so the grid has something on the back of it.
    if ((n & 1) === 1) pluck(a.hatGain, 1, FEEL.MUSIC_HAT_DECAY, t);
    a.step = (n + 1) % 64;
    a.nextNote += stepTime;
  }
}

/* Called once a frame from the main loop, whatever the state, so the
   pause sweep and the wind down still run when nothing else does. */
function updateAudio(dt) {
  if (!audio) return;
  const a = audio;
  if (a.ac.state === 'suspended') return;
  const fade = FEEL.AUDIO_FADE_TIME;

  ramp(a.pauseFilter.frequency,
       paused ? FEEL.AUDIO_PAUSE_CUTOFF : FEEL.AUDIO_OPEN_CUTOFF,
       FEEL.AUDIO_PAUSE_TIME);

  const driving = state === DRIVING && !paused;
  const slip = driving ? drift.slipNorm : 0;

  /* The heat the music reads. Slip and the spent budget both count, and
     it lags hard, so the arrangement swells rather than flickering.

     The multiplier is the third term, so the octave layer and the hats
     come up with the rest of the world rather than on their own schedule.
     It goes in by MAXIMUM rather than by sum, the same discipline the
     shake uses, so three loud things at once are as loud as the loudest
     and the arrangement cannot pile up. */
  const want = Math.max(slip, driving ? scrapeRisk : 0,
                        driving ? worldHeat * FEEL.HEAT_MUSIC : 0);
  a.heat += (want - a.heat) * (1 - Math.exp(-dt / FEEL.MUSIC_HEAT_TIME));

  // The skid. Level, band and Q, all off the one slip value.
  const bite = clamp((slip - FEEL.SKID_MIN_SLIP) / (1 - FEEL.SKID_MIN_SLIP), 0, 1);
  ramp(a.skidGain.gain, FEEL.SKID_GAIN_MAX * bite, fade);
  ramp(a.skidBand.frequency,
       FEEL.SKID_FREQ_LOW + (FEEL.SKID_FREQ_HIGH - FEEL.SKID_FREQ_LOW) * bite, fade);
  ramp(a.skidBand.Q, FEEL.SKID_Q_LOW + (FEEL.SKID_Q_HIGH - FEEL.SKID_Q_LOW) * bite, fade);

  // The scrape, which is a state and so is its sound.
  const rasp = driving && scraping ? 1 : 0;
  ramp(a.scrapeGain.gain,
       FEEL.SCRAPE_GAIN_MAX * rasp * (1 - FEEL.SCRAPE_RISK_LIFT * (1 - scrapeRisk)), fade);
  ramp(a.scrapeA.frequency, FEEL.SCRAPE_FREQ * (1 + 0.25 * scrapeRisk), fade);

  updateMusic();
}

/* The stings. Three moments, three shapes, one voice.

   Each is a short rising figure scheduled on the sting oscillator that is
   already running. Nothing is built here, nothing allocates, and the note
   tables are semitone offsets from the music's own root so a sting always
   belongs to the same key the arpeggio is in.

   They are all responses. There is no sting anywhere in this game that
   fires because time passed. */
const STING_BEST  = { notes: [12, 19, 24, 31], step: 0.075, gain: 0.16, decay: 0.30 };
const STING_GATE  = { notes: [12, 19, 24],     step: 0.070, gain: 0.13, decay: 0.24 };
const STING_CLOSE = { notes: [24, 31],         step: 0.055, gain: 0.09, decay: 0.16 };
const STING_CHAIN = { notes: [19, 24, 28],     step: 0.065, gain: 0.12, decay: 0.22 };
// Up off the lip, and back down onto the road. The jump rises, the
// landing falls, so the pair reads as one arc without a word of copy.
const STING_JUMP  = { notes: [7, 14, 21, 26],  step: 0.045, gain: 0.13, decay: 0.20 };
const STING_LAND  = { notes: [26, 19, 12],     step: 0.050, gain: 0.12, decay: 0.26 };

function audioSting(sting) {
  if (!audioOn()) return;
  const a = audio, root = TRACKS[track].root;
  const p = a.stingGain.gain;
  const t = a.ac.currentTime;
  p.cancelScheduledValues(t);
  p.setValueAtTime(p.value, t);
  for (let i = 0; i < sting.notes.length; i++) {
    const at = t + i * sting.step;
    a.stingOsc.frequency.setValueAtTime(semis(root * 8, sting.notes[i]), at);
    p.setValueAtTime(sting.gain, at);
    p.exponentialRampToValueAtTime(0.0001, at + sting.decay);
  }
}

/* The chain blip, and it is the continuous reward for drifting.

   One step up the ladder per link, resetting when the chain breaks, which
   is the oldest and most satisfying combo feedback there is and it costs
   no screen space at all. The ladder is a major pentatonic over two
   octaves, so it climbs without ever landing on a note that argues with
   the music's own key, and past the top it stays there rather than
   running off into a whistle. */
const CHAIN_LADDER = [0, 2, 4, 7, 9, 12, 14, 16, 19, 21, 24, 26, 28, 31, 33, 36];

function audioChain(link) {
  if (!audioOn()) return;
  const a = audio, t = a.ac.currentTime;
  const n = CHAIN_LADDER[Math.min(link - 1, CHAIN_LADDER.length - 1)];
  a.chainOsc.frequency.setValueAtTime(semis(TRACKS[track].root * 8, n), t);
  const p = a.chainGain.gain;
  p.cancelScheduledValues(t);
  p.setValueAtTime(FEEL.CHAIN_GAIN, t);
  p.exponentialRampToValueAtTime(0.0001, t + FEEL.CHAIN_DECAY);
}

/* The crash, and then a clean wind down. One envelope and one sweep on
   voices that already exist, so nothing is built at the worst possible
   moment for the frame budget. */
function audioCrash() {
  if (!audioOn()) return;
  const a = audio, t = a.ac.currentTime;
  a.crashUntil = t + FEEL.CRASH_TIME;
  const g = a.crashGain.gain;
  g.cancelScheduledValues(t);
  g.setValueAtTime(0.0001, t);
  g.linearRampToValueAtTime(FEEL.CRASH_GAIN, t + 0.01);
  g.exponentialRampToValueAtTime(0.0001, t + FEEL.CRASH_TIME);
  const f = a.crashLow.frequency;
  f.cancelScheduledValues(t);
  f.setValueAtTime(FEEL.CRASH_FREQ_FROM, t);
  f.exponentialRampToValueAtTime(FEEL.CRASH_FREQ_TO, t + FEEL.CRASH_TIME);
  // Nothing survives the car. The skid especially must not outlive it,
  // and neither does a sting that was mid figure when it happened.
  ramp(a.skidGain.gain, 0, 0.05);
  ramp(a.scrapeGain.gain, 0, 0.05);
  a.stingGain.gain.cancelScheduledValues(t);
  ramp(a.stingGain.gain, 0, 0.05);
  a.chainGain.gain.cancelScheduledValues(t);
  ramp(a.chainGain.gain, 0, 0.05);
}


/* ==================================================================
   MAIN LOOP
   ================================================================== */
/* THE ONLY ASSIGNMENT THAT STARTS IT, and it happens once, at load. There
   is deliberately no function anywhere that sets this to anything other
   than zero, so no run, restart or continue can bring the credit back.
   See the BOOT_FADE_IN block. */
/* The three phases added up, in the one place they are ever added up. */
function bootTotal() {
  return Math.max(0, FEEL.BOOT_FADE_IN) + Math.max(0, FEEL.BOOT_HOLD)
       + Math.max(0, FEEL.BOOT_FADE_OUT);
}
let bootFlash = bootTotal();

function skipBoot() { bootFlash = 0; endBootChrome(); }

/* The chrome comes back once, whichever way the credit ends. */
let bootChromeHidden = true;
function endBootChrome() {
  if (!bootChromeHidden) return;
  bootChromeHidden = false;
  try { document.documentElement.classList.remove('booting'); } catch (e) {}
  // Whichever way the splash ended, skipped or expired, it goes now.
  if (bootShown) { bootShown = false; bootEl.hidden = true; }
  /* The pad row was display:none for the whole of the boot flash, so the
     measurement resize took of it was zero. This is the moment it exists,
     so this is the moment to measure it again. */
  resize();
}

/* THE BOOT SPLASH, which is now the publisher lockup and not type.

   Everything about WHEN it happens is unchanged and deliberately so.
   bootFlash is set once where it is declared, is never assigned anything
   but zero anywhere else, and startRun, continueRun, switchMode and
   resetSpectacle do not mention it and must not. Section 5 says restart
   is instant on the same input, and that outranks any flourish: a
   splash between attempts is exactly the thing that breaks the one more
   go loop. This function only makes the overlay agree with the
   countdown; it cannot start one.

   The element is REMOVED, not faded to transparent, so there is nothing
   left over the game for a stray opacity to bring back. */
let bootShown = true;

/* IN, HOLD, OUT, read off the ONE countdown rather than off a second
   clock, so there is still exactly one number that can end the splash
   and it is still only ever set once and zeroed.

   THE TWO FADES ARE ON DIFFERENT ELEMENTS, and that is not an oddity, it
   is the whole reason the load is covered:

     IN is the LOCKUP arriving over a field that has been opaque since
     the first paint. Fading the field in as well would uncover the page
     while the script is still parsing.
     OUT is the WHOLE THING leaving, field included, because what is
     underneath at that point is the title screen and that is what the
     player should be fading through to.

   The fade in is measured from the start and the fade out from the end,
   so the hold is simply whatever is between them and needs no arithmetic
   of its own. Both guard against a zero length phase, because both are
   tunable and zero is a reasonable thing to want: a fade of nothing
   should be a hard cut, not a division by nothing. */
function bootMarkAlpha() {
  const gone = bootTotal() - bootFlash;           // seconds since it appeared
  if (!(FEEL.BOOT_FADE_IN > 0)) return 1;
  return clamp(gone / FEEL.BOOT_FADE_IN, 0, 1);
}

function bootFieldAlpha() {
  if (!(FEEL.BOOT_FADE_OUT > 0)) return 1;
  return clamp(bootFlash / FEEL.BOOT_FADE_OUT, 0, 1);
}

function syncBoot() {
  if (bootFlash <= 0) {
    if (bootShown) { bootShown = false; bootEl.hidden = true; }
    return;
  }
  if (bootMark) bootMark.style.opacity = bootMarkAlpha();
  bootEl.style.opacity = bootFieldAlpha();
}

let lastTime = 0;

function frame(now) {
  window.requestAnimationFrame(frame);

  const rawDt = lastTime ? (now - lastTime) / 1000 : 0;
  lastTime = now;
  const dt = Math.min(rawDt, FEEL.MAX_FRAME_DELTA);

  if (noteTimer > 0) {
    noteTimer -= dt;
    if (noteTimer <= 0) noteEl.hidden = true;
  }

  if (bootFlash > 0) { bootFlash -= dt; if (bootFlash <= 0) { bootFlash = 0; endBootChrome(); } }
  updateRepeat(dt);
  updateTiltHint(dt);
  updateFlipHold(dt);
  /* Before the pause return, because the gesture is not part of the game
     and must finish whether the game is running or not. */
  updateTiltCal(dt);
  // Before the early return, so the pause sweep and the crash wind down
  // both keep running while nothing else does.
  updateAudio(dt);
  if (paused) {
    // Nothing moves and nothing is read, but the frame still runs so the
    // cover is drawn and the buttons stay live.
    clearHeldInput();
    render();
    sampleFps(rawDt);
    return;
  }
  /* Hit stop. The world stands still for a few frames, which is what
     sells an impact as an impact, and the DEATH TIMER KEEPS RUNNING on
     real time so this cannot delay getting back in by a single
     millisecond. Input is handled in listeners, not here, so a tap during
     the freeze goes straight through. */
  if (hitStop > 0) {
    hitStop -= dt;
    deadFor += dt;
    render();
    sampleFps(rawDt);
    return;
  }
  updateTilt(dt);
  updateSteering(dt);
  update(dt);
  updateScore(dt);
  updateClock(dt);
  // After the score, because the best score break compares the number the
  // score has just settled on, and after update, because the close call
  // ledger is written by the collision pass.
  updateSpectacle(dt);
  // After the spectacle, so a ghost pass takes the drift lane only if
  // nothing louder has already claimed it this frame.
  ghostUpdate(dt);
  updateBar(dt);
  render();
  sampleFps(rawDt);
}

if (bootFlash > 0) { try { document.documentElement.classList.add('booting'); } catch (e) {} }
else bootChromeHidden = false;
recomputeCamera();
if (debugAllowed) { setDebug(true); tiltAssert(); }
// Before the first road is built, or the title screen is generated at
// deep game difficulty and the first thing anybody sees is a lie.
updateDifficulty();
resetRoad(nextSeed());
resize();
window.requestAnimationFrame(frame);
</script>
