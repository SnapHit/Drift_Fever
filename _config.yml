# WHAT GITHUB PAGES MAY PUBLISH.
#
# This repository is the source of record AND the served site, so most of
# what is in it must never reach a URL. Two things made that urgent:
#
#   _reference/snaphit-index.html is a complete copy of snap-hit.online.
#   Served here it would be the same page live on two hosts, which risks
#   being read as duplicated content and sets two of our own sites
#   competing for nothing.
#
#   _content/ is the full text of all seven pages in markdown. The same
#   words at a second URL help nobody.
#
# AND THE ROOT MARKDOWN WAS BEING PUBLISHED TOO, which was not obvious
# and is the reason this file lists more than the two folders that were
# asked about. Jekyll copies a markdown file with no front matter
# through verbatim rather than converting it, so BRIEF.md, the whole
# commercial argument including the keyword table and the revenue
# reasoning, was fetchable at /BRIEF.md exactly as written. So were the
# handoff, the visual investigation and the session prompt. Raw, not
# rendered, which makes it no less readable by anyone who guesses the
# name.
#
# brand/ went the same way: two build scripts, the SVG lockups and the
# raw path data, all published, none of it wanted at a URL. The shipped
# copies of that artwork are inlined in index.html already.
#
# TWO MECHANISMS, BECAUSE ONE IS A CONVENTION AND ONE IS A DECLARATION.
#
#   1. The leading underscore. Jekyll does not copy _-prefixed files or
#      directories into the built site unless they are a configured
#      collection, which is why the two folders were renamed rather than
#      only listed here.
#   2. This exclude list, which is what Pages actually reads, and which
#      says out loud what is not for publishing.
#
# Either alone would do it. Both together means a future session that
# renames a folder back does not silently republish it, and someone
# reading only this file can still see the whole answer.
#
# NOTE FOR ANYONE ADDING .nojekyll LATER: it turns Jekyll off entirely
# and with it BOTH of these mechanisms. The tree would then be served
# verbatim, underscores included, and everything below would be public
# again. If you need .nojekyll, move this material out of the repository
# instead.
#
# Jekyll's own default exclude list is REPLACED by this one rather than
# added to. That costs nothing here: there is no Gemfile and no
# node_modules.

exclude:
  # Source material. In the repository, never on the web.
  - _reference/
  - _content/
  - brand/
  - build-pages.js
  - publish-check.sh
  # The project's own documents. Jekyll would publish each as HTML.
  - BRIEF.md
  - CLAUDE.md
  - README.md
  - SESSION-1-PROMPT.md
  - VISUAL.md
  - drift-fever-retention-handoff.md

# Nothing here is a blog and nothing wants a layout. The seven pages and
# the game are complete HTML documents with no front matter, which Jekyll
# copies through untouched, and that is the whole of the build.
plugins: []
