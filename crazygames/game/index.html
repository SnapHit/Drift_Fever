<style>
  :root { color-scheme: dark; --cyan: #19d8ff; --edge: #f6e7a1; --brand-fill: #fbbf45; --brand-line: #ef5a17; --brand-shadow: #a8300a; --rival: #ff6a3c; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1a1d33; color: #eef1f7; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  body { touch-action: none; -webkit-user-select: none; user-select: none; overscroll-behavior: none; }
  #world { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #ui { position: fixed; inset: 0; pointer-events: none; }
  #ui > * { pointer-events: auto; }
  /* the spectacle round (?fx=0 turns it off and none of this applies) */
  #vignette { position: fixed; inset: 0; pointer-events: none; background: radial-gradient(ellipse 75% 70% at 50% 46%, rgba(0,0,0,0) 60%, rgba(4,6,16,0.34) 100%); }
  body.fx #live > #liveN { font-size: calc(clamp(22px, 4.5vw, 34px) * var(--k, 1)); }
  body.fx #live > #liveM { top: calc(-14px - 34px * var(--k, 1)); font-size: calc(clamp(16px, 3.4vw, 24px) * (0.6 + 0.4 * var(--k, 1))); }
  body.fx #live.h2 > #liveN { color: #6dffb8; }
  body.fx #live.h3 > #liveN { color: #ffe14d; text-shadow: 0 0 12px rgba(255,210,60,0.55), 0 2px 6px rgba(0,0,0,0.7); }
  body.fx #live.h4 > #liveN { color: #ff9a3c; text-shadow: 0 0 16px rgba(255,130,40,0.7), 0 2px 6px rgba(0,0,0,0.7); }
  body.fx #live.h5 > #liveN { color: #ff4f9a; text-shadow: 0 0 20px rgba(255,60,150,0.8), 0 2px 6px rgba(0,0,0,0.7); }
  body.fx #live.near > #liveN { color: #ff8a3c; }
  body.fx #live.pop > #liveN { animation: livePop 0.34s cubic-bezier(0.2, 1.8, 0.35, 1); }
  @keyframes livePop { 0% { transform: translate(-50%, -100%) scale(1.75); } 100% { transform: translate(-50%, -100%) scale(1); } }
  .fly, .shard { position: absolute; left: 0; top: 0; font-weight: 900; font-size: clamp(22px, 4.5vw, 34px); color: var(--edge); text-shadow: 0 0 14px rgba(255,220,120,0.6), 0 2px 6px rgba(0,0,0,0.7); white-space: nowrap; pointer-events: none; will-change: transform; }
  .fly.h3 { color: #ffe14d; } .fly.h4 { color: #ff9a3c; } .fly.h5 { color: #ff4f9a; }
  .shard { color: #ff5a5a; text-shadow: 0 2px 6px rgba(0,0,0,0.7); }
  .shard.l { clip-path: polygon(0 0, 55% 0, 42% 100%, 0 100%); } .shard.r { clip-path: polygon(55% 0, 100% 0, 100% 100%, 42% 100%); }
  body.fx #totalN.pop { animation: totalPop 0.38s cubic-bezier(0.2, 1.7, 0.35, 1); }
  @keyframes totalPop { 0% { transform: scale(1.35); color: var(--edge); } 100% { transform: scale(1); } }
  /* the results: lighter behind, so the finish and the fireworks show; the stars land one by one */
  body.fx #screens.on:has(.screen.results) { background: linear-gradient(180deg, rgba(14,16,30,0.2), rgba(14,16,30,0.7)); }
  body.fx .results .card { background: rgba(10,14,30,0.74); box-sizing: border-box; }   /* its border and padding inside its width: it overflowed a 390 px screen by 2 px a side */
  body.fx .results .card.split .col { display: contents; }
  body.fx .results .stars > span { display: inline-block; }
  body.fx .results .stars > span.on { animation: starLand 0.5s cubic-bezier(0.2, 1.6, 0.4, 1) both; }
  body.fx .results .stars > span.on:nth-child(1) { animation-delay: 0.35s; }
  body.fx .results .stars > span.on:nth-child(2) { animation-delay: 0.63s; }
  body.fx .results .stars > span.on:nth-child(3) { animation-delay: 0.91s; }
  @keyframes starLand { 0% { opacity: 0; transform: scale(2.8) rotate(-30deg); } 55% { opacity: 1; } 100% { opacity: 1; transform: none; } }
  @media (orientation: landscape) and (max-height: 500px) {
    body.fx .screen.results { max-width: 820px; justify-content: center; }
    body.fx .results .card.split { flex-direction: row; align-items: stretch; max-width: 780px; gap: 18px; margin-top: 0; padding: 12px 16px; }
    body.fx .results .card.split .col { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; flex: 1 1 0; min-width: 0; }
    body.fx .results .card.split .col.b { align-items: stretch; }
    body.fx .results .card.split .col.b .unlock, body.fx .results .card.split .col.b .chapnote { text-align: center; }
  }
  #fail { position: fixed; left: 16px; right: 16px; top: 40%; text-align: center; font-size: 16px; }

  /* the HUD */
  #hud { position: absolute; inset: 0; pointer-events: none; }
  #hud > * { pointer-events: none; }
  #total { position: absolute; top: max(10px, env(safe-area-inset-top)); left: 0; right: 0; text-align: center; font-weight: 800; letter-spacing: 0.02em; }
  #totalN { font-size: clamp(28px, 6vw, 44px); line-height: 1; display: block; text-shadow: 0 2px 8px rgba(0,0,0,0.6); }
  #totalL { font-size: 11px; text-transform: uppercase; letter-spacing: 0.2em; opacity: 0.6; }
  #live { position: absolute; left: 0; top: 0; display: none; transform: translate(-1000px, -1000px); will-change: transform; }
  #live.on { display: block; }
  #live > span { position: absolute; left: 0; top: -14px; transform: translate(-50%, -100%); font-weight: 900; font-size: clamp(22px, 4.5vw, 34px); color: var(--cyan); text-shadow: 0 2px 6px rgba(0,0,0,0.7); white-space: nowrap; }
  #live > #liveM { top: -48px; font-size: clamp(16px, 3.4vw, 24px); color: var(--edge); }
  #live.near > #liveN { color: #ff8a3c; }
  #live.bump > #liveM { animation: bump 0.18s ease-out; }
  @keyframes bump { from { transform: translate(-50%, -100%) scale(1.5); } to { transform: translate(-50%, -100%) scale(1); } }
  #callouts { position: absolute; left: 0; right: 0; top: 28%; text-align: center; pointer-events: none; }
  .callout { font-weight: 900; font-size: clamp(22px, 5vw, 40px); letter-spacing: 0.06em; color: #fff; text-shadow: 0 2px 10px rgba(0,0,0,0.7); animation: rise 1.5s ease-out forwards; }
  .callout.bank { color: var(--edge); }
  .callout.good { color: var(--cyan); }
  .callout.lost { color: #ff5a5a; }
  @keyframes rise { 0% { opacity: 0; transform: translateY(12px) scale(0.9); } 15% { opacity: 1; transform: none; } 70% { opacity: 1; } 100% { opacity: 0; transform: translateY(-24px); } }
  #readout { position: absolute; right: max(12px, env(safe-area-inset-right)); top: max(10px, env(safe-area-inset-top)); font-variant-numeric: tabular-nums; font-weight: 700; font-size: 14px; opacity: 0.85; text-shadow: 0 1px 4px rgba(0,0,0,0.7); }
  #readout .u { font-size: 10px; opacity: 0.6; margin: 0 8px 0 3px; text-transform: uppercase; }
  #toBeat { display: block; font-size: 12px; opacity: 0.7; font-weight: 700; letter-spacing: 0.05em; margin-top: 4px; }
  #runinfo { position: absolute; left: max(12px, env(safe-area-inset-left)); top: calc(max(10px, env(safe-area-inset-top)) + 52px); font-variant-numeric: tabular-nums; font-weight: 800; font-size: 15px; text-shadow: 0 1px 4px rgba(0,0,0,0.7); }
  #runinfo span { display: block; }
  #runinfo #clock { font-size: 13px; opacity: 0.75; font-weight: 700; }
  #fs { position: absolute; left: calc(max(12px, env(safe-area-inset-left)) + 52px); top: max(10px, env(safe-area-inset-top)); width: 44px; height: 44px; border-radius: 22px; border: 0; background: rgba(255,255,255,0.14); color: #fff; padding: 0; pointer-events: auto; display: flex; align-items: center; justify-content: center; }
  #fs[hidden], #snd[hidden] { display: none; }
  #snd { position: absolute; left: calc(max(12px, env(safe-area-inset-left)) + 104px); top: max(10px, env(safe-area-inset-top)); width: 44px; height: 44px; border-radius: 22px; border: 0; background: rgba(255,255,255,0.14); color: #fff; padding: 0; pointer-events: auto; display: flex; align-items: center; justify-content: center; }
  .opts { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .fsbtn { align-self: center; display: flex; align-items: center; gap: 8px; margin-top: 10px; padding: 10px 18px; min-height: 44px; border-radius: 22px; border: 2px solid rgba(255,255,255,0.22); background: rgba(10,14,30,0.55); color: #fff; font: inherit; font-weight: 800; font-size: 13px; letter-spacing: 0.08em; }
  #exit { position: absolute; left: max(12px, env(safe-area-inset-left)); top: max(10px, env(safe-area-inset-top)); width: 44px; height: 44px; border-radius: 22px; border: 0; background: rgba(255,255,255,0.14); color: #fff; font-size: 18px; line-height: 44px; padding: 0; pointer-events: auto; }
  /* the battle (briefs/RIVALS.md): his total under the player's, the closeness meter under the player's car, his tag, the arrow when he is out of view */
  #vs { position: absolute; top: calc(max(10px, env(safe-area-inset-top)) + 62px); left: 50%; transform: translateX(-50%); display: flex; gap: 7px; align-items: baseline; padding: 3px 12px; border-radius: 12px; background: rgba(10,14,30,0.6); font-weight: 800; white-space: nowrap; text-shadow: 0 1px 4px rgba(0,0,0,0.7); }
  #vs[hidden], #meter[hidden], #tag[hidden], #arrow[hidden], #prompt1[hidden] { display: none; }
  /* the stunt park (briefs/PLAYGROUND.md): the readout under the total, the list button under the restart, the one line of welcome */
  #park { position: absolute; top: calc(max(10px, env(safe-area-inset-top)) + 62px); left: 50%; transform: translateX(var(--ptx, -50%)); display: flex; gap: 9px; align-items: center; padding: 4px 14px; border-radius: 14px; background: rgba(10,14,30,0.66); border: 2px solid rgba(255,255,255,0.16); font-weight: 900; letter-spacing: 0.06em; white-space: nowrap; font-variant-numeric: tabular-nums; font-size: clamp(15px, 2.4vw, 20px); text-shadow: 0 1px 4px rgba(0,0,0,0.7); pointer-events: none; }
  #park[hidden], #parktip[hidden], #plist[hidden] { display: none; }
  #park #parkP { display: flex; gap: 4px; }
  #park #parkP i { width: 10px; height: 10px; transform: rotate(45deg); border: 2px solid rgba(255,255,255,0.45); box-sizing: border-box; }
  #park #parkP i.on { background: #fff; border-color: #fff; }
  #park #parkP i.paid { background: #ffd34d; border-color: #ffd34d; }
  #park em { font-style: normal; color: #ffd34d; }
  #park em:empty { display: none; }
  #park.won { border-color: #ffd34d; }
  #park.won.bronze { border-color: #e0915a; } #park.won.bronze em { color: #f0a36c; }
  #park.won.silver { border-color: #d5dbea; } #park.won.silver em { color: #e6ebf7; }
  #park.pop { animation: parkPop 0.45s ease-out; }
  @keyframes parkPop { 0% { transform: translateX(var(--ptx, -50%)) scale(1.14); } 100% { transform: translateX(var(--ptx, -50%)) scale(1); } }
  /* a phone on its side: the game's own chain number rides just under the total there, so the readout goes to the left under the buttons (where a run's lap and clock sit; the park has neither) */
  @media (orientation: landscape) and (max-height: 500px) { #park { left: max(12px, env(safe-area-inset-left)); --ptx: 0px; transform-origin: left center; } }
  @media (orientation: portrait) { #park { top: calc(max(10px, env(safe-area-inset-top)) + 98px); letter-spacing: 0.03em; gap: 7px; padding: 4px 11px; } }
  #parktip { position: absolute; left: 50%; top: calc(max(10px, env(safe-area-inset-top)) + 84px); transform: translateX(-50%); width: max-content; max-width: min(86vw, 520px); box-sizing: border-box; padding: 9px 16px; border-radius: 14px; background: rgba(10,14,30,0.8); border: 2px solid var(--cyan); font-weight: 800; font-size: clamp(14px, 2.2vw, 17px); text-align: center; pointer-events: none; }
  @media (orientation: portrait) { #parktip { top: calc(max(10px, env(safe-area-inset-top)) + 136px); } }
  #plist { position: absolute; right: max(12px, env(safe-area-inset-right)); top: calc(max(10px, env(safe-area-inset-top)) + 80px); min-width: 84px; height: 44px; padding: 0 14px; border-radius: 22px; border: 2px solid rgba(255,211,77,0.6); background: rgba(10,14,30,0.6); color: #fff; font-size: 15px; font-weight: 800; display: flex; align-items: center; justify-content: center; gap: 8px; pointer-events: auto; font-variant-numeric: tabular-nums; }
  #plist b { color: #ffd34d; }
  #vs .vsl { font-size: 10px; letter-spacing: 0.2em; opacity: 0.7; }
  #vsName { color: var(--rival); font-size: 13px; letter-spacing: 0.08em; }
  #vsN { font-size: clamp(18px, 4vw, 26px); font-variant-numeric: tabular-nums; }
  #vsLead { font-size: 10px; letter-spacing: 0.14em; opacity: 0.85; }
  #vs.ahead #vsLead { color: var(--cyan); } #vs.behind #vsLead { color: var(--rival); }
  #meter { position: absolute; left: 0; top: 0; display: flex; flex-direction: column; align-items: center; gap: 2px; will-change: transform; filter: drop-shadow(0 1px 3px rgba(0,0,0,0.85)); pointer-events: none; }
  #place { display: flex; align-items: baseline; gap: 6px; white-space: nowrap; font-weight: 900; }
  #placeN { font-size: 20px; letter-spacing: 0.06em; line-height: 1; }
  #gapT { font-size: 13px; font-weight: 800; font-variant-numeric: tabular-nums; }
  #place { flex-wrap: wrap; justify-content: center; } #lineT { flex-basis: 100%; text-align: center; font-size: 10px; letter-spacing: 0.12em; font-weight: 800; color: var(--cyan); opacity: 0.9; } #lineT:empty { display: none; }
  #place.first #placeN, #place.first #gapT { color: var(--cyan); } #place.second #placeN, #place.second #gapT { color: var(--rival); } #place.grid #placeN { color: #c8cbd6; font-size: 14px; letter-spacing: 0.16em; }
  #close { display: grid; grid-template-columns: repeat(5, 15px); gap: 3px; justify-content: center; }
  #close[hidden] { display: none; }
  #close i { display: block; height: 7px; border-radius: 4px; background: rgba(255,255,255,0.22); }
  #close i.lit { background: #5dff9a; box-shadow: 0 0 8px rgba(93,255,154,0.9); }
  #meterT { grid-column: 1 / -1; text-align: center; font-size: 13px; font-weight: 900; letter-spacing: 0.12em; white-space: nowrap; color: #5dff9a; }
  .leadpop { position: absolute; transform: translate(-50%, -50%); padding: 3px 10px; border-radius: 10px; font-weight: 900; font-size: 16px; letter-spacing: 0.06em; white-space: nowrap; pointer-events: none; text-shadow: 0 1px 4px rgba(0,0,0,0.7); animation: leadPop 1.3s ease-out forwards; }
  .leadpop.you { background: rgba(25,216,255,0.92); color: #04121c; text-shadow: none; } .leadpop.him { background: var(--rival); color: #fff; }
  .leadpop.line { font-size: 20px; }
  @keyframes leadPop { 0% { opacity: 0; transform: translate(-50%, -30%) scale(0.7); } 12% { opacity: 1; transform: translate(-50%, -50%) scale(1.15); } 25% { transform: translate(-50%, -60%) scale(1); } 100% { opacity: 0; transform: translate(-50%, -260%) scale(1); } }
  #tag { position: absolute; left: 0; top: 0; padding: 2px 9px; border-radius: 9px; background: var(--rival); color: #fff; font-weight: 900; font-size: 12px; letter-spacing: 0.12em; white-space: nowrap; will-change: transform; box-shadow: 0 2px 8px rgba(0,0,0,0.5); }
  #tagMult { margin-left: 6px; color: #fff3a0; }
  #arrow { position: absolute; left: 0; top: 0; display: flex; flex-direction: column; align-items: center; font-weight: 900; font-size: 12px; text-shadow: 0 1px 4px rgba(0,0,0,0.8); will-change: transform; }
  #arrow .ar { display: block; color: var(--rival); font-size: 24px; line-height: 1; }
  @media (orientation: landscape) and (max-height: 500px) { #hud.battle #count { font-size: clamp(64px, 17vh, 110px); top: 40%; } }   /* the count clear of his total on a short screen */
  #prompt1 { --tx: -50%; position: absolute; left: 50%; top: calc(max(10px, env(safe-area-inset-top)) + 104px); transform: translateX(-50%); padding: 8px 16px; border-radius: 14px; background: rgba(10,14,30,0.8); border: 2px solid #5dff9a; font-weight: 800; font-size: clamp(15px, 2.4vw, 20px); text-align: center; width: max-content; max-width: min(86vw, 520px); box-sizing: border-box; }
  /* the battle's heading wraps in a box clear of the count: beside it in landscape, over it in portrait */
  #missions.battle { white-space: normal; max-width: min(34vw, 440px); }
