# edit that one. This copy is kept for reference only and GitHub never
# reads it.
name: crazygames parity
on:
  push:
    branches: [main, 'crazygames-*']
    paths: ['crazygames/**', '.github/workflows/crazygames-parity.yml']
  pull_request:
    paths: ['crazygames/**', '.github/workflows/crazygames-parity.yml']
jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: crazygames
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crazygames/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run parity
      - run: npm run parity:check
      - run: npm run build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: parity-report
          path: crazygames/parity/out/report.json
