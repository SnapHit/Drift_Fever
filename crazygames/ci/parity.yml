# The parity test, live, on every push. It drives Drift_Fever's index.html
# and the vendored module in the same headless Chromium and fails the job
# if a single frame or a single road differs. The committed stamp is then
# checked against the files, which is what the deploy build checks too.
#
# NOT ENABLED WHERE IT SITS. GitHub reads workflows only from
# /.github/workflows at the repository root, which is outside crazygames/.
# To enable it, copy this file to /.github/workflows/crazygames-parity.yml
# in its own commit. fetch-depth 0 matters: the test reads the original out
# of the repository history at the pinned commit.
name: crazygames parity
on:
  push:
    branches: [main]
  pull_request:
jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: crazygames
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crazygames/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run parity
      - run: npm run parity:check
      - run: npm run build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: parity-report
          path: crazygames/parity/out/report.json
