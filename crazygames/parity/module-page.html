<!doctype html>
<meta charset="utf-8">
<title>Drift Fever simulation module, parity host</title>
<script type="module">
  /* The vendored module in the same browser as the original, so the two
     sides share one Math library and one JavaScript engine and the only
     thing the comparison can see is the extraction. */
  import { createSim } from '/sim/drift-fever-sim.js';
  let now = new Date(2000, 0, 1, 12);    // the sentinel day, see jobs.js
  let a = 1;
  function random() {
    a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }
  /* The store outlives the sim, the way localStorage outlives a page. */
  const store = new Map();
  const hookCalls = {};
  const EFFECTS = ['audioSting', 'audioCrash', 'audioLanding', 'audioChain', 'audioFinishHit', 'audioFanfareWave', 'tuneStart',
    'tuneWake', 'addShake', 'landImpact', 'updateSmoke', 'clearSmoke', 'updateDebris', 'finaleShells', 'rebuildDerivedColours',
    'buildShareCardSoon', 'calibrateTilt', 'endTiltCal', 'stopTiltHint', 'scoreHeatColour', 'applyBiome', 'explode', 'clearDebris', 'recomputeCamera'];
  let sim;
  function make() {
    const hooks = { now: () => now, random, storeGet: k => (store.has(k) ? store.get(k) : null), storeSet: (k, v) => { store.set(k, String(v)); } };
    for (const h of EFFECTS) hooks[h] = () => { hookCalls[h] = (hookCalls[h] || 0) + 1; };
    sim = createSim(hooks);
    window.__S = { get: n => sim.get(n), set: (n, v) => sim.set(n, v), fn: sim.fn, seedRandom: k => { a = k >>> 0; } };
    window.__names = sim.names;
    window.__commit = sim.commit;
  }
  make();
  window.__recreate = () => { make(); };
  window.__setDay = day => { now = new Date(Math.floor(day / 10000), Math.floor(day / 100) % 100 - 1, day % 100, 12, 0, 0, 0); };
  window.__hookCalls = hookCalls;
  window.__storeSize = () => store.size;
  window.__ready = true;
</script>
